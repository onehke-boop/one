</head>

function S(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const CH=[...new Set(D.map(c=>c.ch))];
let md="menu",sel=new Set(CH),cd=[],ix=0,fl=false,sc=0,aw=null,mt=new Set(),qs=20;
function F(){return D.filter(c=>sel.has(c.ch))}
function cc(){let o={};CH.forEach(c=>{o[c]=D.filter(x=>x.ch===c).length});return o}
function E(s){let d=document.createElement("div");d.textContent=s;return d.innerHTML}

function sf(){cd=S(F());ix=0;fl=false;md="flash";R()}
function sq(){let f=F(),n=Math.min(qs,f.length),p=S(f).slice(0,n);cd=p.map(c=>{let w=S(p.filter(x=>x.a!==c.a)).slice(0,3);return{...c,op:S([{t:c.a,ok:true},...w.map(x=>({t:x.a,ok:false}))])}});ix=0;sc=0;aw=null;md="quiz";R()}
function tc(c){if(sel.has(c))sel.delete(c);else sel.add(c);if(!sel.size)sel.add(c);R()}
function sa(){sel=new Set(CH);R()}
function nx(){fl=false;aw=null;if(ix<cd.length-1)ix++;else if(md==="quiz")md="result";else ix=0;R()}
function pv(){if(ix>0){fl=false;ix--}R()}
function fp(){fl=!fl;R()}
function ha(i){if(aw!==null)return;aw=i;if(cd[ix].op[i].ok)sc++;R()}
function mm(){let q=cd[ix].q;if(mt.has(q))mt.delete(q);else mt.add(q);R()}
function gm(){md="menu";R()}
function ss(n){qs=n;R()}

function R(){
let a=document.getElementById("app"),f=F(),o=cc(),pg=cd.length?((ix+1)/cd.length*100):0,im=cd[ix]&&mt.has(cd[ix].q);
let h='<div class="hd"><h1>初级社工 刷题机</h1><p>';
if(md==="menu")h+="题库 "+D.length+" 题 | 已选 "+f.length+" | 已掌握 "+mt.size;
else if(md==="flash")h+="翻卡 "+(ix+1)+"/"+cd.length;
else if(md==="quiz")h+="测验 "+(ix+1)+"/"+cd.length+" | 得分 "+sc;
else h+="测验完成";
h+='</p></div><div style="position:fixed;top:12px;right:12px;z-index:99"><span id="tb" class="nb" data-a="tg" style="font-size:18px;padding:6px 10px;border-radius:50%;background:var(--bd)">☀️</span></div>';
if(md==="flash"||md==="quiz")h+='<div class="bar"><i style="width:'+pg+'%"></i></div>';

if(md==="menu"){
h+='<div class="lbl">选择章节</div><div class="tags">';
h+='<span class="tag'+(sel.size===CH.length?" on":"")+'" data-a="sa">全选</span>';
CH.forEach((c,i)=>{h+='<span class="tag'+(sel.has(c)?" on":"")+'" data-a="tc" data-i="'+i+'">'+E(c).replace("·"," ")+" ("+o[c]+")</span>"});
h+='</div><div class="szl">测验题数：';
[10,20,30,50].forEach(n=>{h+='<span class="sz'+(qs===n?" on":"")+'" data-a="ss" data-n="'+n+'">'+n+"</span>"});
h+='</div><div class="row"><span class="b ba" data-a="sf">📇 翻卡复习</span><span class="b bb" data-a="sq">✍️ 随机测验</span></div>';
}

if(md==="flash"&&cd[ix]){
let c=cd[ix];
h+='<div class="cd'+(im?" m":"")+'" data-a="fp"><div class="ch">'+E(c.ch)+"</div>";
if(!fl)h+='<div class="ql">问题</div><div class="qt">'+E(c.q)+'</div><div class="ht">点击翻转</div>';
else h+='<div class="al">答案</div><div class="at">'+E(c.a)+"</div>";
h+='</div><div class="nv"><span class="nb" data-a="pv">← 上一题</span><span class="nm'+(im?" on":"")+'" data-a="mm">'+(im?"✓ 已掌握":"标记掌握")+'</span><span class="nb" data-a="nx">下一题 →</span><span class="ng" data-a="gm">返回</span></div>';
}

if(md==="quiz"&&cd[ix]){
let c=cd[ix];
h+='<div class="qq"><div class="qc">'+E(c.ch)+'</div><div class="qx">'+E(c.q)+"</div></div><div class='os'>";
c.op.forEach((p,i)=>{
let x="oo";if(aw!==null){if(p.ok)x+=" ok";else if(i===aw)x+=" no";else x+=" dm"}
let t=p.t.length>100?E(p.t.slice(0,100))+"…":E(p.t);
h+='<span class="'+x+'" data-a="ha" data-i="'+i+'"><em>'+String.fromCharCode(65+i)+".</em>"+t+"</span>"});
h+="</div>";
if(aw!==null)h+='<div class="ct"><span class="b bb" data-a="nx">'+(ix<cd.length-1?"下一题 →":"查看成绩")+"</span></div>";
}

if(md==="result"){
let p=Math.round(sc/cd.length*100),e=p>=80?"🎉":p>=60?"💪":"📖",m=p>=80?" 优秀！":p>=60?" 继续加油！":" 需要再复习";
h+='<div class="rs"><div class="ej">'+e+'</div><div class="sc">'+sc+"/"+cd.length+'</div><div class="pc">正确率 '+p+"%"+m+'</div><div class="row"><span class="b bb" data-a="sq">再来一轮</span><span class="b ba" data-a="sf">翻卡复习</span><span class="b bc" data-a="gm">返回</span></div></div>';
}
a.innerHTML=h;
}

document.getElementById("app").addEventListener("click",function(e){
let t=e.target;while(t&&t!==this){
let a=t.getAttribute("data-a");
if(a==="sa")sa();
else if(a==="tc")tc(CH[+t.getAttribute("data-i")]);
else if(a==="ss")ss(+t.getAttribute("data-n"));
else if(a==="sf")sf();
else if(a==="sq")sq();
else if(a==="fp")fp();
else if(a==="pv")pv();
else if(a==="nx")nx();
else if(a==="mm")mm();
else if(a==="gm")gm();
else if(a==="tg")tg();
else if(a==="ha")ha(+t.getAttribute("data-i"));
if(a){e.stopPropagation();return}
t=t.parentElement;
}
});

document.addEventListener("keydown",function(e){
if(md==="flash"){if(e.key===" "||e.key==="Enter"){e.preventDefault();fp()}if(e.key==="ArrowRight")nx();if(e.key==="ArrowLeft")pv()}
});

function tg(){let h=document.documentElement;let cur=h.getAttribute("data-theme");let nxt=cur==="dark"?"light":"dark";h.setAttribute("data-theme",nxt);let b=document.getElementById("tb");if(b)b.textContent=nxt==="light"?"🌙":"☀️"}
document.documentElement.setAttribute("data-theme","dark");
R();
</script>
