者适宜开展的工作有（ ）。", "ops": [{"l": "A", "t": "整理社区独居老人需求信息，设计并提供个性化服务", "ok": true}, {"l": "B", "t": "与独居老人亲属沟通，需求其说服老人参加社区活动", "ok": false}, {"l": "C", "t": "建议社区开展居室适老化改造，改善独居老人生活环境", "ok": true}, {"l": "D", "t": "倡导政府出台高龄独居老人帮扶政策，提升其生活质量", "ok": true}, {"l": "E", "t": "依据《老年人权益保障法》，鼓励子女经常探望独居老人", "ok": true}], "ex": "社会工作者要以服务对象为本，从其需求出发。A项提供个性化服务满足老人需求；C项建议 改善生活环境能解决老人生活困难；D项倡导政策提升生活质量，符合宏观层面帮助老人；E项鼓励子女探望 ，从家庭层面解决老人部分困难。B项让亲属说服老人参加活动，可能违背老人不愿求人的意愿。答案：ACDE"}, {"ch": "综合·Ch3", "yr": "2022", "tp": "多选", "q": "随着阿络文化的迅速发展，各类短视顿平台受到人们的喜爱，诗阿姨的娱乐方式也不再是看电视，而是刷 短视频。她还关注网络主播，购买主播椎荐的产品，改变自己的字衣播配风格，并上传展示自己日常生活的 短视畅。现在她觉得中老年人也和年轻人一样，可以打扮自己、展示自己。上述许阿姨的变化，体现了大众 传媒对人类行为的影响有（ ）。", "ops": [{"l": "A", "t": "强化人们固有观念和行为", "ok": false}, {"l": "B", "t": "改变人们原来的行为模式", "ok": true}, {"l": "C", "t": "促使人们改变原有的观念", "ok": true}, {"l": "D", "t": "提供信息引导人们的行为", "ok": true}, {"l": "E", "t": "形成社会规范并约束行为", "ok": false}], "ex": "许阿姨原本娱乐方式是看电视，现在变为刷短视频，这改变了行为模式，对应B；她原本可能 没有中老年人也能打扮展示自己的观念，现在有了，说明观念改变，对应C；网络主播推荐产品，她跟着购买 ，这是受信息引导行为，对应D。而A强化固有观念与许阿姨观念改变不符，E题干未体现形成社会规范约束行 为。答案：BCD"}, {"ch": "综合·Ch2", "yr": "2022", "tp": "多选", "q": "社会工作实习生小袁为脑瘫儿童冬冬提供一次服务后，就不想再继续，督导者老宣了解到小袁是认为服务 脑瘫儿童工作效果不明显才想放弃。为此，老宣引导小袁认识到，为建立积极有效的专业关系，社会工作者 应做到无条件关怀，之后小袁的工作态度有明显改善，下列做法中，体现了“无条件关怀”的有（ ）。", "ops": [{"l": "A", "t": "对东东保持尊重", "ok": true}, {"l": "B", "t": "评估冬冬的需求", "ok": false}, {"l": "C", "t": "对东东不进行评价", "ok": true}, {"l": "D", "t": "相信冬冬能够改变", "ok": true}, {"l": "E", "t": "分析冬冬的家庭", "ok": false}], "ex": "无条件关怀强调对服务对象保持尊重、不评价、相信其有改变的能力等情感与态度。选项A对 冬冬保持尊重，C不进行评价，D相信冬冬能够改变，都体现了无条件关怀；而B评估冬冬需求和E分析冬冬家 庭主要是工作步骤和内容方面，并非无条件关怀体现。 答案：ACD"}, {"ch": "综合·Ch5", "yr": "2022", "tp": "多选", "q": "“金彩生活”高龄老人支持小组即将进入尾声，组员纷纷表示不想结束小组，面对这一情景，下列社会工 作者的做法中，正确的有（ ）。", "ops": [{"l": "A", "t": "带领组员回顾小组契约，重申小组规则", "ok": false}, {"l": "B", "t": "邀请组员分享在小组中的收获，巩固组员的改变", "ok": true}, {"l": "C", "t": "营造开放气氛，协助组员探索内在恐惧和防御机制", "ok": false}, {"l": "D", "t": "向组员建议可自行组织今后的活动，保持彼此之间的联系", "ok": true}, {"l": "E", "t": "带领组员一同回顾小组历程，邀请组员分享未来生活规划", "ok": true}], "ex": "小组进入尾声，重点是巩固成果、处理离别情绪。B项邀请组员分享收获巩固改变，E项回顾 历程并分享未来规划，都有助于此；D项建议组员自行组织活动保持联系，也能一定程度缓解不想结束的情绪 。A项回顾小组契约规则在此时非重点；C项探索内在恐惧防御机制适合在小组中期，此时并非首要。答案 ：BDE"}, {"ch": "综合·Ch5", "yr": "2022", "tp": "多选", "q": "在“医路同行”肿瘤患者照顾者减压小组中，社会工作者小戚设计了\"压力面面观\"，邀请组员讲述压力来 源及减压方法，引发了组员的热烈讨论情境中，需要小戚运用限制技巧的有（ ）。", "ops": [{"l": "A", "t": "徐阿姨谈到异地就医中的问题，引发了组员对地区医疗差异的讨论", "ok": true}, {"l": "B", "t": "吴先生详细介绍了妻子辗转就医的经历，严重超出了规定的发言时间", "ok": true}, {"l": "C", "t": "陈奶奶讲述了其他年轻病友因患病无法工作并对家人产生的内疚感", "ok": false}, {"l": "D", "t": "一向沉默寡言的张叔叔首先发言，讲述了儿子病情变化带来的压力", "ok": false}, {"l": "E", "t": "奚叔叔讲述无法平衡工作和照顾家庭带来的压力，介绍了减压方法", "ok": false}], "ex": "限制技巧是指在小组讨论中，社会工作者要限制组员发言时间、内容偏离主题等情况。B选项 吴先生发言严重超出规定时间，需要社工限制其发言时长；A选项组员讨论偏离“压力来源及减压方法”主题 ，需要社工限制引导回归主题。答案为AB。"}, {"ch": "综合·Ch5", "yr": "2022", "tp": "多选", "q": "某社会工作服务机构为“新手爸妈”开设了亲密关系成长小组，旨在探索家庭成员角色转变及其相互影响 ，以促进夫妻关系。亲子关系和婆媳关系的和谐。在探讨育儿方法时，组员小钱认为年轻人工作比较忙，需 要依拿父母带孩子；组员小邹则认为老一辈的育儿观念与年轻人有差异，应该自己带孩子。双方发生了争论 。都希望社会工作者支持自己的观点。面对这一情形，社会工作者的正确做法有（ ）。", "ops": [{"l": "A", "t": "保持沉默，等待小钱和小邹自行停止争论", "ok": false}, {"l": "B", "t": "结合自己的育儿经验，肯定小钱的育儿方法", "ok": false}, {"l": "C", "t": "引导组员们在育儿方法上开展讨论，但并不评价小钱和小邹的观点", "ok": true}, {"l": "D", "t": "与组员共同分析两种做法的优缺点，引导他们选择适宜的育儿方法", "ok": true}, {"l": "E", "t": "分享以往参与小组的“新手爸妈”在类似问题上的处理经验供组员参考", "ok": false}], "ex": "本题考查小组工作方法的相关知识。正确答案为CD。C.引导组员们在育儿方法上开展讨论，但并不评价小钱和小邹的观点；D.与组员共同分析两种做法的优缺点，引导他们选择适宜的育儿方法"}, {"ch": "综合·Ch6", "yr": "2022", "tp": "多选", "q": "社区老年文艺队的队长常阿姨因为要去外地照顾孙女，由夏阿姨暂时担任队长，夏阿姨带队参加街道组织 的广场舞大赛，结果成功不如以往，为此她很内疚，找到社会工作者老张诉苦，并流露出不想当队长的想法 ，老张肯定了夏阿姨在关键时刻能够主动担当，并与她一起分析这次参赛失利的原因，建议她将部门工作分 配给队里的几位积极分子。上述老张的做法，运用的居民骨干培养技巧有（ ）。", "ops": [{"l": "A", "t": "结成联盟", "ok": false}, {"l": "B", "t": "鼓励参与", "ok": true}, {"l": "C", "t": "培训工作技巧", "ok": true}, {"l": "D", "t": "增强管理能力", "ok": true}, {"l": "E", "t": "建立民主领导风格", "ok": true}], "ex": "本题考查社区工作方法的相关知识。正确答案为BCDE。B.鼓励参与；C.培训工作技巧；D.增强管理能力；E.建立民主领导风格"}, {"ch": "综合·Ch6", "yr": "2022", "tp": "多选", "q": "某社会工作服务机构成立后花费了大量时间让所在社区的居民认识和熟悉机构，为今后服务项目的承接与 开展奠定基础。下列做法中。适合该机构进入社区的方式有（ ）。", "ops": [{"l": "A", "t": "参加居民代表大会并且参与讨论", "ok": true}, {"l": "B", "t": "经常与社区居民聊天“话家常”", "ok": true}, {"l": "C", "t": "邀请居民参与趣味活动认识社区", "ok": false}, {"l": "D", "t": "在社区已形成的传统活动中亮相", "ok": true}, {"l": "E", "t": "邀请居民参加机构开放日的活动", "ok": true}], "ex": "本题考查社区工作方法的相关知识。正确答案为ABDE。A.参加居民代表大会并且参与讨论；B.经常与社区居民聊天“话家常”；D.在社区已形成的传统活动中亮相；E.邀请居民参加机构开放日的活动"}, {"ch": "综合·Ch1", "yr": "2022", "tp": "多选", "q": "某老旧社区正在推进楼房加装电梯项目，社会工作服务机构与社区居委会一起初步报定了两套方案。社会 工作者小吴组织居民代表，运用“可行性方案模型”来筛选理想方案，其筛选标准有（ ）。", "ops": [{"l": "A", "t": "加装电梯方案是否具备公平性", "ok": true}, {"l": "B", "t": "加装电梯方案实施成功可能性", "ok": true}, {"l": "C", "t": "加装电梯方案是否能引起媒体的关注", "ok": false}, {"l": "D", "t": "加装电梯方案的资金投入与产出比值", "ok": true}, {"l": "E", "t": "加装电梯方案给居民带来的实际改变", "ok": true}], "ex": "可行性方案模型筛选标准主要包含效率（资金投入与产出比值，对应D项）、效果（给居民带 来实际改变，对应E项）、可行性（实施成功可能性，对应B项）、重要性、公平性（对应A项）等。C项“是 否能引起媒体关注”不属于可行性方案模型筛选标准。答案：ABDE"}, {"ch": "综合·Ch1", "yr": "2022", "tp": "多选", "q": "某社会工作服务机构新招募了一批律师作为志愿者参与妇女维权服务。社会工作者小李负责该机构的志愿 者管理工作，在志愿者迎新说明与训练环节，他需要完成的工作有（ ）。", "ops": [{"l": "A", "t": "培训志愿者的沟通技巧", "ok": true}, {"l": "B", "t": "协助志愿者认识服务意义", "ok": true}, {"l": "C", "t": "评估志愿者的参与动机", "ok": false}, {"l": "D", "t": "提升志愿者的服务信心", "ok": true}, {"l": "E", "t": "规划志愿者的服务内容", "ok": false}], "ex": "迎新说明与训练环节主要是让志愿者了解服务意义，提升服务相关技能与信心。A 培训沟通 技巧有助于服务开展；B 协助认识服务意义是重要内容；D 提升服务信心能让志愿者更好投入。C 评估参与 动机多在招募时进行；E 规划服务内容并非迎新说明与训练环节重点。答案：ABD 。"}, {"ch": "综合·Ch4", "yr": "2022", "tp": "多选", "q": "社会工作者小李计划采用个案研究方法对随迁老人的需求进行研究，通过深度访淡、观察、量表等方法收 集资料，分析某街道辖区随迁老人的需求，从而为这一群体的服务方案设计提出策略性建议。关于个案研究 特点的说法，正确的有（ ）。", "ops": [{"l": "A", "t": "该研究可以了解随迁老人身心发展等方面的状况", "ok": true}, {"l": "B", "t": "该研究有利于深入准确把握随迁老人的多元需要", "ok": true}, {"l": "C", "t": "该研究有助于提出有针对性的随迁老人服务方案", "ok": true}, {"l": "D", "t": "该研究的研究结论可推及其他街道所有随迁老人", "ok": false}, {"l": "E", "t": "该研究有助于发现影响随迁老人需求的普遍因素", "ok": false}], "ex": "个案研究是对单个对象（如家庭、团体、机构、社区等）的某项特定行为或问题进行深入和 全面的研究。它能深入了解研究对象的状况，把握其多元需要，也有助于针对研究对象提出有针对性的服务 方案。但个案研究结论一般不具有普遍推广性，难以推及其他街道所有随迁老人，也较难发现普遍因素。答 案：ABC"}, {"ch": "综合·Ch2", "yr": "2023", "tp": "单选", "q": "关于社会工作要素的说法，正确的是（ ）。", "ops": [{"l": "A", "t": "社会工作者秉持利他主义，从事的是志愿服务工作", "ok": false}, {"l": "B", "t": "社会工作基本对象包括因退休需要调整适应的老人", "ok": false}, {"l": "C", "t": "社会工作者与一般助人者都会运用专业的助人方法", "ok": false}, {"l": "D", "t": "助人活动是社会工作者与服务对象互动合作的过程", "ok": true}], "ex": "A选项，社会工作是职业活动，不是志愿服务；B选项，因退休需调整适应的老人一般不属于 基本对象；C选项，一般助人者不一定运用专业助人方法。D选项，助人活动确实是社会工作者与服务对象互 动合作过程，符合社会工作要素特点。答案：D"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "社会工作者小李正在设计关爱低收入家庭子女的项目。下列做法中，最能体现小李资源筹措者角色的是 （ ）。", "ops": [{"l": "A", "t": "邀请低收入家庭子女参加自我探索活动", "ok": false}, {"l": "B", "t": "协助低收入家庭子女成立英语学习小组", "ok": false}, {"l": "C", "t": "组织低收入家庭子女参加抗逆力成长小组", "ok": false}, {"l": "D", "t": "招募志愿者为低收入家庭的子女补习功课", "ok": true}], "ex": "资源筹措者角色是指社会工作者要联络政府部门、企事业单位、社会组织和广大社会成员 ，向他们筹集服务对象所需要的资源。选项D招募志愿者为低收入家庭子女补习功课，是在获取外部资源，体 现资源筹措者角色；A、B、C 主要是直接开展服务活动，未体现资源筹措。答案：D"}, {"ch": "综合·Ch1", "yr": "2023", "tp": "单选", "q": "某社会工作服务机构承接了困难居民救助项目，社会工作者小宁在民政部门指导下，与居委会合作，链接 慈善组织，共同为社会救助对象提供精准帮扶服务。小宁的上述工作最能体现的社会工作者的核心能力是 （ ）", "ops": [{"l": "A", "t": "促进和使能的能力", "ok": false}, {"l": "B", "t": "在组织中工作的能力", "ok": true}, {"l": "C", "t": "评估和计划的能力", "ok": false}, {"l": "D", "t": "提供服务和干预的能力", "ok": false}], "ex": "小宁与民政部门、居委会合作，还链接慈善组织共同开展工作，这主要体现了在组织中与多 方协作工作的能力。答案：B"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "社会工作者小赵筹备了“多彩生活，乐享晚年”主题小组活动，旨在促进老年人之间的沟通交流，营造和 谐友爱氛围，引导老年人关心公共事务，帮助老年“老有所乐”到“老有所为”。小赵设计的，上述小组服 务，属于社会工作服务中的（ ）。", "ops": [{"l": "A", "t": "老年社会工作", "ok": true}, {"l": "B", "t": "社区社会工作", "ok": false}, {"l": "C", "t": "家庭社会工作", "ok": false}, {"l": "D", "t": "社会救助社会工作", "ok": false}], "ex": "题干围绕老年人展开小组活动，促进老年人沟通交流等，核心服务对象是老年人。答案 ：A（老年社会工作是针对老年人开展的社会工作服务，符合题意。）"}, {"ch": "综合·Ch2", "yr": "2023", "tp": "单选", "q": "关于社会工作价值观的说法，正确的是（ ）。", "ops": [{"l": "A", "t": "社会工作价值观是社会工作专业区别于其他专业的重要标志", "ok": true}, {"l": "B", "t": "社会工作的专业价值目标可以分为过程性目标和终极性目标", "ok": false}, {"l": "C", "t": "社会工作价值观是社会工作者和服务对象需共同遵守的原则", "ok": false}, {"l": "D", "t": "社会工作的价值观在全世界不同国家呈现出比较大的差异性", "ok": false}], "ex": "社会工作价值观是社会工作的灵魂，是区别于其他专业的重要标志。B选项专业价值目标表述 不准确；C选项主要是社会工作者遵循的原则；D选项社会工作价值观在不同国家虽有差异但也有共性。答案 ：A"}, {"ch": "综合·Ch2", "yr": "2023", "tp": "单选", "q": "保健品代理商吴先生了解到养老院社会工作者小李经常组织老人活动，与院内老人关系很好，于是找到小 李，向他介绍保健品有助于老人提高免疫力、预防心脑血管疾病，请他帮忙向老人推荐保健品。吴先生承诺 ，如果小李推荐成功，他还可以资助养老院的一些活动。根据社会工作专业伦理原则，小李恰当的做法是 （ ）。", "ops": [{"l": "A", "t": "考虑到保健品有利养生，答应与吴先生合作", "ok": false}, {"l": "B", "t": "咨询养老院意见，再决定是否与吴先生合作", "ok": false}, {"l": "C", "t": "考虑服务对象利益优先，婉拒与吴先生合作", "ok": true}, {"l": "D", "t": "同意吴先生直接与老人沟通，推荐保健产品", "ok": false}], "ex": "社会工作专业伦理原则强调服务对象利益优先。吴先生让小李推荐保健品并承诺资助活动 ，这可能存在商业利益诱惑，小李若推荐可能影响老人利益。A选项只看到保健品表面好处而答应合作，未考 虑背后潜在问题；B选项咨询养老院意见，养老院未必能准确判断商业合作利弊；D选项同意吴先生直接与老 人沟通，老人易受推销影响。C选项考虑服务对象利益优先，婉拒合作是恰当做法。答案：C"}, {"ch": "综合·Ch2", "yr": "2023", "tp": "单选", "q": "伦理难题是社会工作者在实践中遇到的一种道德上难以取舍的困境。关于社会工作伦理难题的说法，正确 的是（ ）。", "ops": [{"l": "A", "t": "社会工作伦理难题是社会工作者专业能力不足导致的困境", "ok": false}, {"l": "B", "t": "社会工作伦理难题是服务对象期望目标过高而导致的困境", "ok": false}, {"l": "C", "t": "社会工作伦理难题本质上是个人利益与专业利益冲突的结果", "ok": false}, {"l": "D", "t": "社会工作伦理难题反映了服务对象自决与专业干预间的张力", "ok": true}], "ex": "社会工作伦理难题是在实践中，由于价值观念等碰撞产生的道德困境。A选项，不是专业能力 不足导致；B选项，并非服务对象期望高导致；C选项，不只是个人与专业利益冲突，涉及多方面价值冲突。 D选项，服务对象自决与专业干预的矛盾是伦理难题的一种体现，表述正确。答案：D"}, {"ch": "综合·Ch2", "yr": "2023", "tp": "单选", "q": "社会工作者老张在与服务对象小王会谈时得知他近期失业了，无力偿还房贷，生活压力很大。小王向老张 表示活着真没意思，透露出自杀的想法，还准备收集安眠药，并要求老张为其保密。此时，老张在服务中首 先应当遵循社会工作伦理原则中的（ ）。", "ops": [{"l": "A", "t": "保护生命原则", "ok": true}, {"l": "B", "t": "隐私保密原则", "ok": false}, {"l": "C", "t": "最小伤害原则", "ok": false}, {"l": "D", "t": "差别平等原则", "ok": false}], "ex": "服务对象有自杀想法，生命面临严重威胁，在社会工作伦理原则中，保护生命原则高于其他 原则。此时老张应优先遵循保护生命原则，避免小王做出伤害自己生命的行为。答案：A"}, {"ch": "综合·Ch3", "yr": "2023", "tp": "单选", "q": "孤独症儿童家长为应对孩子日常照顾压力，自发组建了家长互助群，以分享照顾经验，形成相互支持，根 据马斯洛的需要层次理论，上述情形中，主要体现的家长的需要是（ ）", "ops": [{"l": "A", "t": "生理需要", "ok": false}, {"l": "B", "t": "尊重需要", "ok": false}, {"l": "C", "t": "归属与爱的需要", "ok": true}, {"l": "D", "t": "安全需要", "ok": false}], "ex": "家长们组建互助群分享经验、相互支持，体现了他们渴望与他人建立联系，获得归属感和相 互关爱，这符合马斯洛需要层次理论中归属与爱的需要。答案：C"}, {"ch": "综合·Ch3", "yr": "2023", "tp": "单选", "q": "为了帮助小雯更快适应幼儿园生活，小雯妈妈扮演幼儿园老师，与小雯玩“快乐动儿园”的游戏；小雯爸 爸叮嘱女儿见到老师和同学要主动问好，告诉她过马路定要遵循交通信号灯的指引。小雯父母的上述行为 ，主要体现的家庭功能是（ ）", "ops": [{"l": "A", "t": "社会化", "ok": true}, {"l": "B", "t": "繁衍后代", "ok": false}, {"l": "C", "t": "情感支持", "ok": false}, {"l": "D", "t": "经济支持", "ok": false}], "ex": "小雯妈妈通过游戏帮助小雯适应幼儿园生活，爸爸教导小雯见到老师同学问好、遵守交通规 则，这些都是在引导小雯学习社会规范和行为准则，使其适应社会生活，体现的是家庭的社会化功能。答案 ：A。"}, {"ch": "综合·Ch3", "yr": "2023", "tp": "单选", "q": "服务对象老马近期体检时被查出患有重度脂肪肝，因此他下定决心开始健康饮食、规律运动，在社会工作 者的帮助下，他加入了社区马拉松团体。老马的上述情形，体现的人类行为特点是（ ）", "ops": [{"l": "A", "t": "适应性", "ok": false}, {"l": "B", "t": "发展性", "ok": false}, {"l": "C", "t": "多样性", "ok": false}, {"l": "D", "t": "可控性", "ok": true}], "ex": "老马查出重度脂肪肝后，下定决心改变行为，加入社区马拉松团体，对自身行为进行控制 ，体现了人类行为的可控性。答案：D"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "17岁的服务对象小张因聚众打架斗殴导致他人重伤，被移交给检察院进行观护帮教。在帮教中，社会工作 者老黎除了对小张进行日常行为矫正外，还发现他很讲义气，对朋友很真诚，而且他擅长制作手工包。老黎 在帮助小张认识到自己优势的同时还为他提供相关就业岗位信息。老黎的上述做法，符合心理社会治疗模式 假设中的（ ）。", "ops": [{"l": "A", "t": "个体具有独特的潜在能力", "ok": true}, {"l": "B", "t": "个体自我选择与环境无关", "ok": false}, {"l": "C", "t": "个体具有过分依赖的人格", "ok": false}, {"l": "D", "t": "个体行为与他面临的压力无关", "ok": false}], "ex": "老黎发现小张讲义气、擅长制作手工包，即看到小张有独特潜在能力，并基于此为其提供帮 助，这符合心理社会治疗模式中个体具有独特潜在能力的假设。答案：A"}, {"ch": "综合·Ch4", "yr": "2023", "tp": "单选", "q": "许女士的儿子患有先天性脑瘫，一直由孩子的奶奶帮忙照顾，最近她丈夫被查出患有癌症，需要做手术 ，全家因而陷入混乱和痛苦中。许女士不知道如何是好，便找社会工作者老吕帮忙，根据个案工作各阶段的 工作重点，此时老吕首先要做的是（ ）。", "ops": [{"l": "A", "t": "肯定许女士的求助并确认求助意向", "ok": true}, {"l": "B", "t": "与许女士商讨之后的个案服务计划", "ok": false}, {"l": "C", "t": "将许女士转介给医院的社会工作者", "ok": false}, {"l": "D", "t": "对许女士的家庭情况开展问题评估", "ok": false}], "ex": "许女士前来求助，此时处于接案阶段，接案首要任务是肯定求助并确认求助意向。答案：A 。"}, {"ch": "综合·Ch4", "yr": "2023", "tp": "单选", "q": "14岁的小包与姐姐、祖父母一起生活，关系融洽。小包的父亲常年在外地打工，每逢春节才能回家，加上 半年前姐姐突发疾病离世，小包心情沮丧，无心学习。小包的爷爷很担心孙子的未来，遂求助社会工作者小 邱。小邱在预估和问题分析的基础上，着手制订服务计划。小邱的下列做法中，正确的是（ ）。", "ops": [{"l": "A", "t": "鼓励小包参与服务计划的制订过程", "ok": true}, {"l": "B", "t": "小邱根据自己的技术特长制订计划", "ok": false}, {"l": "C", "t": "以小包爷爷的想法为重点制订计划", "ok": false}, {"l": "D", "t": "以尊重小包父亲建见为主制订计划", "ok": false}], "ex": "服务计划制订要尊重服务对象的意愿，让服务对象参与计划制订过程，这样更能调动其改变 的动力，增强对计划的认同感和执行的积极性。小包是服务对象，应鼓励他参与计划制订。答案：A"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "小婷是一名大二学生，平时喜欢独来独往。室友都觉得他难以接近，就不愿与她交流，甚至还出现了孤立 的情况，小婷心情郁闷，向社会工作者小王求助。小王从小婷的环境系统入手开展服务，邀请小婷的亲友参 与谈论，一起分析有些人喜欢独来独往的原因，并通过角色扮演，让室友体验被孤立的感觉。在连接社会资 源的过程中，小王所采用的主要方式是（ ）", "ops": [{"l": "A", "t": "服务的协调", "ok": false}, {"l": "B", "t": "需求的表达", "ok": true}, {"l": "C", "t": "利益的协调", "ok": false}, {"l": "D", "t": "权益的保护", "ok": false}], "ex": "本题考查小组工作方法的相关知识。正确答案为B。B.需求的表达"}, {"ch": "综合·Ch4", "yr": "2023", "tp": "单选", "q": "15岁的小张最近迷上了网络游戏，学习成绩一落千丈，面对繁重的学业，小张想要专心学习，又无法抵挡 网络游戏的诱惑，遂向学校社会工作者老项求助，服务中，老项运用了影响性技巧。老项的下列回应中，属 于该技巧的是（ ）", "ops": [{"l": "A", "t": "“学习成绩不理想确实容易让人有压力，心里着急又不知道怎么办.”", "ok": false}, {"l": "B", "t": "“网络游戏打得这么好，说明你很聪明！相信你的成绩可以赶上去！”", "ok": false}, {"l": "C", "t": "“你的意思是，上网打游戏是因为游戏可以给你带来成就感，是这样吗？”", "ok": false}, {"l": "D", "t": "“我也爱打游戏，但我打游戏时设置四十分钟的闹铃，铃一响我就停手。”", "ok": true}], "ex": "影响性技巧包括提供信息、自我披露、建议、忠告和对质等。A选项是同理心表达，属于支持 性技巧；B选项是鼓励，属于支持性技巧；C选项是澄清，属于引领性技巧；D选项老项向小张分享自己打游戏 控制时间的事，属于自我披露，是影响性技巧。答案：D"}, {"ch": "综合·Ch4", "yr": "2023", "tp": "单选", "q": "在一次个案工作面谈中，社会工作者与服务对象有如下对话： 服务对象：“最近我的状态不太好，快要到期末了，估计又有三门课要不及格了。我担心再这样下去，学校 会让我退学，我其实也很想好好学习。” 社会工作者：“我能理解，但您的想法与行动有一定的差距，您对此有什么打算吗？” 上述对话体现社会工作者运用的专业技巧是（ ）", "ops": [{"l": "A", "t": "对质", "ok": true}, {"l": "B", "t": "建议", "ok": false}, {"l": "C", "t": "忠告", "ok": false}, {"l": "D", "t": "对焦", "ok": false}], "ex": "对质是指社会工作者通过直接提问等方式让服务对象面对自己在行为、情感和认识等方面不 一致的地方。对话中社会工作者指出服务对象想法与行动有差距，这属于对质技巧。答案：A。"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "某医院妇产科开展了准妈妈小组活动，医务社会工作者小童通过交流分享、角色扮演等活动，让准妈妈们 了解到孕中、孕后可能产生的各种需求，并学习新的知识和解决问题的办法，从小组工作类型的角度看，该 小组属于（ ）", "ops": [{"l": "A", "t": "成长小组", "ok": false}, {"l": "B", "t": "教育小组", "ok": true}, {"l": "C", "t": "支持小组", "ok": false}, {"l": "D", "t": "治疗小组", "ok": false}], "ex": "题目中提到医务社会工作者通过活动让准妈妈们学习新的知识和解决问题办法，这符合教育 小组通过学习新知识、方法提升成员能力的特点。答案：B"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "社会工作者小程计划运用发展模式，为社区内亲子关系紧张的家庭开展小组活动，下列小组活动中，体现 出发展模式中“使能者”原则的是（ ）", "ops": [{"l": "A", "t": "“七嘴八舌话困境”：讨论家庭当前面临的亲子问题", "ok": false}, {"l": "B", "t": "“换个角度看家庭”：以角色扮演再现家庭沟通模式", "ok": false}, {"l": "C", "t": "“齐心协作立契约”：开放讨论小组应当遵循的约定", "ok": false}, {"l": "D", "t": "“立足当下寻资源”：发掘自身资源并寻找解决方案", "ok": true}], "ex": "发展模式中“使能者”原则强调帮助组员发掘自身潜能、提升能力以解决问题。选项D“立足 当下寻资源”，让组员发掘自身资源并寻找解决方案，是在挖掘组员能力，符合“使能者”原则。A只是讨论 问题，未涉及使能；B角色扮演再现沟通模式，没有突出使能；C讨论小组约定，与使能无关。答案：D"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "在某儿童家庭照顾者小组组员招募过程中，社会工作者小范正对组员候选人进行遴选和评估。通过梳理总 结，小范发现候选人希望通过小组活动学习儿童心理健康知识、儿童兴趣爱好培养的方法和儿童家庭照顾技 巧等内容。上述内容主要体现了小组工作组员遴选和评估的条件是（ ）", "ops": [{"l": "A", "t": "文化水平", "ok": false}, {"l": "B", "t": "共同的兴趣或愿望", "ok": true}, {"l": "C", "t": "家庭状况", "ok": false}, {"l": "D", "t": "对某些问题的认知", "ok": false}], "ex": "候选人都希望学习儿童心理健康知识、培养方法及照顾技巧等内容，这表明他们有着共同的 兴趣或愿望。答案选B。"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "社会工作者老肖走访时发现，社区内不同人群需求各异。老肖打算开展一系列小组服务，以满足不同人群 的需要。下列小组方案设计中，最恰当的是（ ）", "ops": [{"l": "A", "t": "每周六上午开展主题为“能工巧匠”的残障人士创业就业小组", "ok": true}, {"l": "B", "t": "为使小组讨论充分，将“童心守护”成长小组时长定为90分钟", "ok": false}, {"l": "C", "t": "为保证小组治疗效果，将青少年网络成瘾小组规模控制在15人", "ok": false}, {"l": "D", "t": "为了使服务惠及更多独居高龄老人，运用线上平台开展养生小组", "ok": false}], "ex": "A项针对残障人士开展创业就业小组，符合其需求且时间设定合理；B项成长小组90分钟时长 对儿童来说偏长，不恰当；C项青少年网络成瘾小组规模15人偏大，不利于治疗效果，一般治疗小组人数5 8人较合适；D项独居高龄老人可能存在线上平台使用困难，不适合用线上平台开展。答案：A"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "在某单亲妈妈支持小组的第一次活动中，由于大多数组员彼此不熟悉，缺乏必要的了解，组员们不能敞开 心扉。为了营造信任的小组气氛，社会工作者适宜的做法是（ ）", "ops": [{"l": "A", "t": "找出小组中每位组员的个性化特质", "ok": false}, {"l": "B", "t": "就某个议题让组员表达自己的想法", "ok": true}, {"l": "C", "t": "暂时回避组员之间可能存在的误解", "ok": false}, {"l": "D", "t": "引导组员尽可能的接纳自己的现状", "ok": false}], "ex": "在小组初期营造信任气氛，让组员表达自己想法能促进相互了解，打开心扉。A选项找个性化 特质并非营造信任气氛的直接有效方式；C选项回避误解不利于信任建立；D选项接纳自己现状与营造小组信 任气氛关联性不大。答案选B。"}, {"ch": "综合·Ch6", "yr": "2023", "tp": "单选", "q": "某社会工作服务机构督导者现场观察了社会工作者小俞开展的社区居民骨干小组活动，事后他向小俞指出 在活动中组员的一些表现需要高度关注。下列组员互动情景中，最容易引起角色竞争冲突的是（ ）", "ops": [{"l": "A", "t": "老李在小组中始终保持沉默", "ok": false}, {"l": "B", "t": "老张在小组中常常独占话题", "ok": false}, {"l": "C", "t": "老吴坚持自己的意见并强烈批评其他组员", "ok": true}, {"l": "D", "t": "老王为自己的想法未获得支持而感到遗憾", "ok": false}], "ex": "本题考查社区工作方法的相关知识。正确答案为C。C.老吴坚持自己的意见并强烈批评其他组员"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "某社区青年志愿者成长小组处于结束阶段。下列回应中，最能体现该阶段社会工作者任务的是（ ）", "ops": [{"l": "A", "t": "\"今天我们来角色扮演，分享一下大家当下的心理感受吧。”", "ok": false}, {"l": "B", "t": "“为了帮助我们今后更好地开展服务，请大家填写一份小组评估问卷。", "ok": false}, {"l": "C", "t": "“大家对志愿服务意义达成了共识，今天我们讨论如何更好地开展服务。", "ok": false}, {"l": "D", "t": "“大家在小组中很有收获，今天我们再谈谈如何在生活中保持小组经验。", "ok": true}], "ex": "在小组结束阶段，社会工作者的任务之一是协助组员保持已经改变了的行为，并在日常生活 中运用在小组中获得的成长经验。D选项强调谈谈如何在生活中保持小组经验，符合该阶段任务。答案：D"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "在一次家庭育儿经验的小组讨论中，小组成员有以下对话： 组员甲：“双十一，我囤了些果泥” 组员乙：“活动力度大吗？我买了2箱奶粉” 组员丙：“我也买了奶粉，比平时优惠了不少。” 随后，其他组员也纷纷推荐起自己购买的母婴产品，面对这种情况，社会工作者正确的做法是（ ）", "ops": [{"l": "A", "t": "及时小结", "ok": false}, {"l": "B", "t": "自我表露", "ok": false}, {"l": "C", "t": "及时限制", "ok": true}, {"l": "D", "t": "帮助梳理", "ok": false}], "ex": "小组讨论中组员纷纷推荐母婴产品，偏离了家庭育儿经验讨论主题，社会工作者应及时限制 ，让小组回到正轨。答案：C"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "在某减压小组讨论中，社会工作者与组员有以下对话: 组员：\"我觉得有些压力是自己造成的，比如说在工作时，如果每一项任务都完成得很顺利、很完美，就会自 然而然地要求自己完成下一项任务时也要同样完美。 事实上，很多事情并不会像自己想象的那样，因此也没必要设定那么高的期待。 社会工作者:“你觉得有时候对自己要求太高了，也会带来压力，因此要降低自我期待，是这样吗？” 上述对话中，社会工作者所用的技巧是（ ）", "ops": [{"l": "A", "t": "摘述", "ok": true}, {"l": "B", "t": "鼓励", "ok": false}, {"l": "C", "t": "引导", "ok": false}, {"l": "D", "t": "了解", "ok": false}], "ex": "社会工作者将组员表达的核心观点用简洁的语言重新表述，这符合摘述技巧的特点，摘述就 是把组员一段较为复杂的话进行归纳、概括和提炼。答案：A"}, {"ch": "综合·Ch6", "yr": "2023", "tp": "单选", "q": "某社会工作服务机构承接了“十五分钟生活服务圈”示范街区建设子项目。该机构根据项目办要求，计划 运用社会策划模式打造“公共服务空间”的人文关怀氛围。下列做法中，属于该模式实施策略中“分析环境 和形势”的内容是（ ）", "ops": [{"l": "A", "t": "审视既有解决问题的手段有无不足", "ok": false}, {"l": "B", "t": "列出所有能达到目标的可行性方案", "ok": false}, {"l": "C", "t": "了解对计划有影响力的人士和团体的需要", "ok": true}, {"l": "D", "t": "分析所属社会工作服务机构的优点和不足", "ok": false}], "ex": "分析环境和形势主要是了解环境和形势，包括对计划有影响力的人士和团体的需要等。A选项 审视既有手段不足属于评估自身的能力；B选项列可行性方案不属于分析环境和形势；D选项分析机构优缺点 也是评估自身能力。C选项符合分析环境和形势中对相关人士和团体需要的了解。答案：C"}, {"ch": "综合·Ch6", "yr": "2023", "tp": "单选", "q": "社区社会工作者小李在走访中了解到，王女士9岁的女儿小玲患有脑瘫，虽然做过康复训练，但进入普通 学校随班就读依然困难，王女士为此十分苦恼。于是小李联系到一家特殊教育学校，向该校负责人详细介绍 了小玲的康复情况，并提出一些让小玲尽快参与学习，融入班级的建议和想法。关于小李所采用的社区工作 模式和扮演的角色，正确的是（ ）", "ops": [{"l": "A", "t": "小李采用了社区照顾模式，扮演的是经纪人角色", "ok": true}, {"l": "B", "t": "小李采用了社会策划模式，扮演的是使能者角色", "ok": false}, {"l": "C", "t": "小李采用了社会策划模式，扮演的是中介者角色", "ok": false}, {"l": "D", "t": "小李采用了地区发展模式，扮演的是使能者角色", "ok": false}], "ex": "经纪人角色是指社会工作者为服务对象寻找有关服务，如为智障儿童寻找特殊学校，协助其 接受文化教育 。小李联系特殊教育学校并介绍情况等行为符合经纪人角色特点。社区照顾模式强调整合社区 资源为服务对象提供照顾，小李行为符合社区照顾模式下经纪人角色。 社会策划模式注重理性设计和专家决 策，本题未体现相关内容，B、C选项排除。 地区发展模式强调居民参与、自下而上解决问题，使能者是协助 居民表达需求等，本题重点是为小玲找学校，不是地区发展模式及使能者角色，D选项排除。答案：A"}, {"ch": "综合·Ch6", "yr": "2023", "tp": "单选", "q": "社区社会工作者小安引导社区居民参与社区环境治理，并培育社区社会组织，形成社区环境治理的可持续 性力量。小安在社区社会组织培育建设和发展的不同阶段扮演不同角色，其适宜的做法是（ ）", "ops": [{"l": "A", "t": "全程直接承担组织管理工作，让组织运行更高效", "ok": false}, {"l": "B", "t": "在组织成立之初，仅仅提供专业咨询和支持服务", "ok": false}, {"l": "C", "t": "在组织发展过程中，不断完善组织内部规章制度", "ok": true}, {"l": "D", "t": "在组织发展成熟后，注重发现和培育组织的领导者", "ok": false}], "ex": "A选项全程直接承担组织管理工作不利于社会组织自主性发展；B选项在组织成立之初仅提供 专业咨询支持不够，还需多方面引导协助；C选项在组织发展过程中完善内部规章制度有利于组织规范发展 ，做法适宜；D选项应在组织发展初期就注重发现培育领导者。答案：C"}, {"ch": "综合·Ch4", "yr": "2023", "tp": "单选", "q": "某社区养老院综合改建的申请已获批复同意。近日，院方着手制定改建方案。下列改建方案内容中，体现 表达性需要的是（ ）", "ops": [{"l": "A", "t": "应当按市相关文件中的床位比进行人员配置", "ok": false}, {"l": "B", "t": "建议参照邻市养老机构的标准配备康复器材", "ok": false}, {"l": "C", "t": "希望在现有基础上大幅缩短入院排队等候时间", "ok": true}, {"l": "D", "t": "认为综合改建工程完工后应保持长期领先优势", "ok": false}], "ex": "表达性需要是指个人把自身的感受通过行动表达出来。C选项“希望在现有基础上大幅缩短入 院排队等候时间”，是养老院相关人员将自身对于入院排队时间的感受表达出来，属于表达性需要。A是依据 文件进行配置，属于规范性需要；B参照邻市标准是比较性需要；D保持长期领先优势不属于这几种常见需要 类型。答案：C"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "单选", "q": "社区社会工作者针对近期大家关心的居民楼水管改造议题召开议事协商会，邀请街道办事处工作人员、物 业公司代表、施工方代表、业主委员会代表和居民代表参会。在会议进行中，社会工作者适宜的做法是（ ）.", "ops": [{"l": "A", "t": "严格限制会议发言人的数量", "ok": false}, {"l": "B", "t": "让参会者充分讨论后做出决定", "ok": true}, {"l": "C", "t": "听到参会者意见后立即表态", "ok": false}, {"l": "D", "t": "提前了解参会者对议程的意见", "ok": false}], "ex": "本题考查小组工作方法的相关知识。正确答案为B。B.让参会者充分讨论后做出决定"}, {"ch": "综合·Ch6", "yr": "2023", "tp": "单选", "q": "社区社会工作者老周正在制定“我爱我家”社区活动计划，以提升社区居民的社区认同感和社区参与度。 在计划制定过程中，老周首先应（ ）.", "ops": [{"l": "A", "t": "确定主要服务对象招募范围", "ok": true}, {"l": "B", "t": "考虑不同活动规模利弊", "ok": false}, {"l": "C", "t": "界定活动所想要达到的结果", "ok": false}, {"l": "D", "t": "制定整个活动的进度表", "ok": false}], "ex": "本题考查社区工作方法的相关知识。正确答案为A。A.确定主要服务对象招募范围"}, {"ch": "综合·Ch1", "yr": "2023", "tp": "单选", "q": "组织分析是社会工作行政不可忽略的基础工作。下列内容中，属于组织外部环境分析的是（ ）", "ops": [{"l": "A", "t": "审视组织的服务领域和方向", "ok": false}, {"l": "B", "t": "识别法人的权限和组织的规范性", "ok": false}, {"l": "C", "t": "识别评估组织发展与收入来源的关系", "ok": true}, {"l": "D", "t": "评估组织运行系统和技术资源的有效性", "ok": false}], "ex": "组织外部环境分析重点关注组织与外部因素的联系。C选项“识别评估组织发展与收入来源的 关系”，收入来源往往涉及组织外部的资助者、市场等外部因素，属于外部环境分析。 A选项审视组织服务 领域和方向主要是对组织自身定位的思考，属于内部分析。 B选项法人权限和组织规范性是关于组织内部治 理规则等，属于内部分析。 D选项评估组织运行系统和技术资源有效性也是针对组织内部系统和资源，属于 内部分析。答案：C"}, {"ch": "综合·Ch6", "yr": "2023", "tp": "单选", "q": "社会工作者老张对儿童友好社区建设项目开展评估，他访谈了社区内50户参与项目的家庭，了解到该项目 通过召开儿童议事会，动员儿童参加社区事务，组建儿童志愿服务队，提高了儿童对社区的认识，搭建了儿 童交流平台，提升了儿童社区参与意识。老张的评估属于方案评估中的（ ）", "ops": [{"l": "A", "t": "目标评估", "ok": false}, {"l": "B", "t": "效率评估", "ok": false}, {"l": "C", "t": "过程评估", "ok": false}, {"l": "D", "t": "效果评估", "ok": true}], "ex": "老张了解到项目带来如提高儿童对社区认识、提升参与意识等成果，这是对项目实施后产生 的实际效果进行考察。答案：D.效果评估"}, {"ch": "综合·Ch4", "yr": "2023", "tp": "单选", "q": "社会工作者小王是某机构的项目负责人，每周一上午他都安排工作例会，请同事们介绍上周的服务情况 ，并就某个特定人群的服务优化进行交流讨论，让大家发表意见和提出建议，根据社会服务机构的团队式结 构类型，小王所在的项目团队属于（ ）", "ops": [{"l": "A", "t": "多功能型团队", "ok": false}, {"l": "B", "t": "问题解决型团队", "ok": true}, {"l": "C", "t": "自我管理型团队", "ok": false}, {"l": "D", "t": "合作协商型团队", "ok": false}], "ex": "题目中小王每周一组织例会，重点是让同事们交流特定人群服务优化并提意见建议，主要围 绕解决特定服务问题，这符合问题解决型团队特点。多功能型团队由多种专业人员组成完成复杂任务；自我 管理型团队自主性更强；合作协商型团队一般强调多方合作协商，均不符合题意。答案：B"}, {"ch": "综合·Ch1", "yr": "2023", "tp": "单选", "q": "学校社会工作者小袁运用定量研究的方法，对青少年社会适应的影响因素进行研究。根据定量研究所遵循 的演绎法研究策略，小袁首先要做的是（ ）", "ops": [{"l": "A", "t": "提出研究问题", "ok": true}, {"l": "B", "t": "开展研究设计", "ok": false}, {"l": "C", "t": "编制调查问卷", "ok": false}, {"l": "D", "t": "进行资料分析", "ok": false}], "ex": "在定量研究的演绎法研究策略中，首先要提出研究问题，基于问题构建理论假设等后续步骤 。所以第一步是提出研究问题 。答案：A"}, {"ch": "综合·Ch3", "yr": "2023", "tp": "单选", "q": "社会工作者小李为了解社区居民对家庭服务的需求，设计了一份调查问卷。下列问题和答案的设计中，最 适宜的是（ ）.", "ops": [{"l": "A", "t": "您的婚姻状况？.（1）未婚（2）已婚（3）离婚", "ok": false}, {"l": "B", "t": "您家的家庭结构？(1)核心家庭(2)主干家庭(3)联合家庭(4)其他(请说明)______", "ok": true}, {"l": "C", "t": "您家的家务主要由谁承担？(1）母亲（2)父亲(3）妻子(4)丈夫", "ok": false}, {"l": "D", "t": "您对家务分工满意吗？(1）非常满意(2)比较满意（3）一般(4）比较不满意(5）非常不满意", "ok": false}], "ex": "选项A：在婚姻状况的选项设计中，缺少了“丧偶”这一重要情况。婚姻状况通常包括未婚、 已婚、离婚、丧偶四种常见状态，该选项的答案设计不完整，不能全面涵盖所有可能的婚姻状况，所以该选 项不适宜。 选项B：家庭结构一般分为核心家庭（由父母与未婚子女组成的家庭）、主干家庭（由祖父母、父母和子女组 成的家庭）、联合家庭（由父母和多对已婚子女组成的家庭）以及其他特殊家庭结构等。此选项不仅列出了 常见的家庭结构类型，还设置了“其他（请说明）”这一开放选项，能够全面收集社区居民的家庭结构信息 ，设计较为合理，所以该选项适宜。答案：B 选项C：在“您家的家务主要由谁承担”这个问题中，答案选项存在逻辑问题。“妻子”和“母亲”、“丈夫 ”和“父亲”的概念有交叉，在家庭中妻子可能是母亲，丈夫可能是父亲，这样的选项设置容易让被调查者 产生混淆，无法准确表达家务承担者，所以该选项不适宜。 选项D：对于“您对家务分工满意吗”这个问题，答案设计虽然涵盖了从非常满意到非常不满意的不同程度 ，但整体表述较为复杂，在实际调查中，被调查者可能需要花费较多时间来理解和选择。相比之下，更简洁 明了的答案设计（如用数字1 - 5分别代表不同满意度等级）会更便于被调查者快速作答，提高调查效率，所 以该选项不是最适宜的。答案：B"}, {"ch": "综合·Ch1", "yr": "2023", "tp": "单选", "q": "医务社会工作者小宋主要为骨肿瘤患儿及家属提供专业服务。为探索以家庭为中心的社会工作服务模式 ，小宋计划采用个案研究方法开展研究。小宋的下列做法中，正确的是（ ）。", "ops": [{"l": "A", "t": "把研究所提炼的专业服务模式推论至其他医院", "ok": false}, {"l": "B", "t": "重点研究社会工作者为骨肿瘤患儿服务的效果", "ok": false}, {"l": "C", "t": "将病房内所有的骨肿瘤患儿及家属都作为研究对象", "ok": false}, {"l": "D", "t": "将骨肿瘤患儿家庭参与服务的过程记录作为研究资料", "ok": true}], "ex": "个案研究是对单个对象（如家庭、团体、机构、社区等）的某项特定行为或问题进行深入研 究。A选项将模式推论至其他医院，不符合个案研究针对单个对象深入研究，不具普遍推广性的特点；B选项 重点研究服务效果并非个案研究重点，个案研究更关注对象的整体过程等；C选项病房内所有患儿及家属不是 单个对象；D选项将骨肿瘤患儿家庭参与服务过程记录作为研究资料，符合个案研究对单个家庭深入研究并以 其相关过程记录为资料的做法。答案：D"}, {"ch": "综合·Ch1", "yr": "2023", "tp": "多选", "q": "从一般意义来说，社会工作是具体解决社会问题的专业活动，具有维持社会秩序的功能，与行政管理相比 ，社会工作特点有（ ）", "ops": [{"l": "A", "t": "自上而下解决问题", "ok": false}, {"l": "B", "t": "重视权利运用", "ok": false}, {"l": "C", "t": "通过服务化解矛盾", "ok": true}, {"l": "D", "t": "开展人性化服务", "ok": true}, {"l": "E", "t": "促进人与环境相互适应", "ok": true}], "ex": "社会工作与行政管理不同，行政管理多是自上而下、靠权力解决问题。而社会工作强调通过 服务化解矛盾，注重人性化服务，还关注人与环境相互适应。答案：CDE"}, {"ch": "综合·Ch4", "yr": "2023", "tp": "多选", "q": "在专业实践中，社会工作者应遵循的价值观操作原则有（", "ops": [{"l": "A", "t": "尊重和接纳服务对象", "ok": true}, {"l": "B", "t": "真诚对待服务对象的问题", "ok": true}, {"l": "C", "t": "充分理解服务对象的个别差异", "ok": true}, {"l": "D", "t": "尊重服务对象个人的意见和决定", "ok": true}, {"l": "E", "t": "劝说服务对象接受有益建议", "ok": false}], "ex": "本题考查个案工作方法的相关知识。正确答案为ABCD。A.尊重和接纳服务对象；B.真诚对待服务对象的问题；C.充分理解服务对象的个别差异；D.尊重服务对象个人的意见和决定"}, {"ch": "综合·Ch4", "yr": "2023", "tp": "多选", "q": "社区矫正对象老张回到社区后，觉得邻居都瞧不起自己，情绪很低落。社会工作者小王为他推荐了几份工 作，都被老张以太累或时间不合适等理由婉拒。近日老张找到小王，明确表示自己不愿工作，让小王为其直 接申请最低生活保障。根据社会工作专业伦理，小王适宜的做法有（ ）", "ops": [{"l": "A", "t": "以服务对象为本，接受老张的请求", "ok": false}, {"l": "B", "t": "与老张进行深入交流，鼓励他自食其力", "ok": true}, {"l": "C", "t": "咨询专业督导者，商议解决问题的办法", "ok": false}, {"l": "D", "t": "主动倾听老张的苦恼，帮助他调整心态", "ok": true}, {"l": "E", "t": "向老张说明其不符合政策要求，终止服务", "ok": false}], "ex": "本题考查个案工作方法的相关知识。正确答案为BD。B.与老张进行深入交流，鼓励他自食其力；D.主动倾听老张的苦恼，帮助他调整心态"}, {"ch": "综合·Ch3", "yr": "2023", "tp": "多选", "q": "关于人类行为与社会环境基本关系的说法，正确的有（ ）", "ops": [{"l": "A", "t": "人类要适应社会环境", "ok": true}, {"l": "B", "t": "社会环境决定个人行为", "ok": false}, {"l": "C", "t": "人类行为与社会环境的关系具有平衡性", "ok": false}, {"l": "D", "t": "社会环境和生物遗传共同对人类行为产生影响", "ok": true}, {"l": "E", "t": "各年龄人群的行为受社会环境影响的程度相同", "ok": false}], "ex": "人类行为与社会环境相互影响，人类要适应社会环境 ，A正确；社会环境对人类行为有影响 ，但不是决定个人行为，B错误；人类行为与社会环境关系并非简单平衡，C错误；社会环境和生物遗传共同 影响人类行为，D正确；不同年龄人群受社会环境影响程度不同，E错误。答案：AD"}, {"ch": "综合·Ch4", "yr": "2023", "tp": "多选", "q": "随着互联网的普及和智能产品的发展，学龄儿童过度依赖电子产品的现象较为普遍，影响了儿童的身心健 康。针对这一问题，社会工作者宜开展的工作有（ ）", "ops": [{"l": "A", "t": "引导儿童积极参加户外活动", "ok": true}, {"l": "B", "t": "建议家长禁止儿童使用电子产品", "ok": false}, {"l": "C", "t": "组织社区内的家庭开展亲子阅读活动", "ok": true}, {"l": "D", "t": "建议政府禁止商家线上销售儿童电子产品", "ok": false}, {"l": "E", "t": "建议家长与儿童约定电子产品的使用时长", "ok": true}], "ex": "A 选项引导儿童参加户外活动，可减少对电子产品依赖，有益身心健康；C 选项组织亲子阅 读活动，能转移儿童对电子产品注意力；E 选项家长与儿童约定使用时长，可合理控制儿童使用电子产品。B 选项禁止儿童使用电子产品不现实，D 选项禁止商家线上销售儿童电子产品难以实现且不合理。答案：ACE"}, {"ch": "综合·Ch4", "yr": "2023", "tp": "多选", "q": "居委会工作人员向社会工作者小陆反映，居民马女士经常被丈夫殴打，想离婚但又担心无法应对未来生活 ，希望小陆能帮助她。小陆计划为马女士开展个案服务，关于她与马女士建立专业关系的表述，正确的有 （ ）", "ops": [{"l": "A", "t": "小陆鼓励马女士要对自己有信心", "ok": true}, {"l": "B", "t": "小陆特别专注地倾听马女士诉说困扰", "ok": true}, {"l": "C", "t": "小陆应该接纳马女士对丈夫的依赖心理", "ok": false}, {"l": "D", "t": "小陆与马女士建立信任关系有助于服务开展", "ok": true}, {"l": "E", "t": "小陆与马女士专业关系的建立完全取决于她的合作意愿", "ok": false}], "ex": "本题考查个案工作方法的相关知识。正确答案为ABD。A.小陆鼓励马女士要对自己有信心；B.小陆特别专注地倾听马女士诉说困扰；D.小陆与马女士建立信任关系有助于服务开展"}, {"ch": "综合·Ch4", "yr": "2023", "tp": "多选", "q": "服务对象小安是一名事实无人抚养儿童，目前寄养在亲戚家，由于之前在原生家庭遭受过家庭暴力造成心 理创伤，学校老师将小安转介给社会工作者老谭。老谭在评估中发现，最近小安又被医生诊断为儿童糖尿病 ，亲戚也不知道如何照顾他。老谭在服务中安排小安参加有针对性的游戏活动，缓解其因以往经历引发的问 题:为小安的亲戚讲解照顾注意事项，发放儿童糖尿病的知识手册，并联系社区医生，提供疾病管理指导，上 述服务中，社会工作者扮演的角色有（ ）", "ops": [{"l": "A", "t": "教育者", "ok": true}, {"l": "B", "t": "治疗者", "ok": true}, {"l": "C", "t": "倡导者", "ok": false}, {"l": "D", "t": "联系人", "ok": true}, {"l": "E", "t": "使能者", "ok": false}], "ex": "为小安亲戚讲解照顾注意事项、发放知识手册，体现老谭扮演教育者角色；安排小安参加针 对性游戏活动缓解心理问题，是在对小安进行治疗，扮演治疗者角色；联系社区医生，扮演联系人角色。答 案：ABD"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "多选", "q": "社会工作者小张为社区精神障碍康复者开展职业技能训练小组活动。下列内容中。适宜该小组的有（ ）", "ops": [{"l": "A", "t": "职业着装训练", "ok": true}, {"l": "B", "t": "简历制作学习", "ok": true}, {"l": "C", "t": "服药时间管理", "ok": false}, {"l": "D", "t": "面试技巧交流", "ok": true}, {"l": "E", "t": "运动康复训练", "ok": false}], "ex": "该小组聚焦职业技能训练，A选项职业着装训练有助于康复者以良好职业形象面对工作；B选 项简历制作学习是求职重要技能；D选项面试技巧交流对获得工作机会有帮助。C选项服药时间管理和E选项运 动康复训练与职业技能训练无关。答案：ABD"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "多选", "q": "社会工作者拟对“网事随风”青少年网瘾治疗小组进行评估，下列测量工具中，适用于该小组过程评估的 有（ ）", "ops": [{"l": "A", "t": "个人自我报告", "ok": true}, {"l": "B", "t": "我的断网日记", "ok": true}, {"l": "C", "t": "上网时长统计表", "ok": true}, {"l": "D", "t": "小组满意度问卷", "ok": false}, {"l": "E", "t": "网络成瘾自评量表", "ok": true}], "ex": "本题考查小组工作方法的相关知识。正确答案为ABCE。A.个人自我报告；B.我的断网日记；C.上网时长统计表；E.网络成瘾自评量表"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "多选", "q": "企业社会工作者小肖在小组服务中，热情地向组员们介绍自己并亲切地问候组员，在组员发言时非常注重 眼神交流，适时讲述自己对于组员分享感受的理解。小肖的上述做法运用的沟通技巧有（ ）", "ops": [{"l": "A", "t": "积极回应", "ok": true}, {"l": "B", "t": "自我表露", "ok": true}, {"l": "C", "t": "专注与倾听", "ok": true}, {"l": "D", "t": "对信息进行磋商", "ok": false}, {"l": "E", "t": "营造轻松安全的氛围", "ok": true}], "ex": "本题考查小组工作方法的相关知识。正确答案为ABCE。A.积极回应；B.自我表露；C.专注与倾听；E.营造轻松安全的氛围"}, {"ch": "综合·Ch6", "yr": "2023", "tp": "多选", "q": "社会工作者在运用社会策划模式开展工作过程中，首先要了解其所服务组织的使命和目标。关于“组织使 命和目标”的说法，正确的有（ ）", "ops": [{"l": "A", "t": "组织的目标是用来表示其存在的价值和提供服务的意义", "ok": false}, {"l": "B", "t": "组织的使命为组织成员指明工作方向和所要解决的问题", "ok": false}, {"l": "C", "t": "组织的使命可以鼓励组织成员产生认同并明确工作意义", "ok": true}, {"l": "D", "t": "组织的目标指出组织所要解决的问题和满足的社会需要", "ok": true}, {"l": "E", "t": "组织的目标代表了组织未来的蓝图并用来指导组织使命的构建", "ok": false}], "ex": "使命是组织存在的价值和提供服务的意义，能鼓励成员认同、明确意义，所以C正确；目标是 解决问题和满足社会需要，所以D正确。A选项说反，应为使命表示存在价值和服务意义；B选项应为目标指明 工作方向和解决问题；E选项说反，使命构建指导目标，而非目标指导使命构建。答案：CD"}, {"ch": "综合·Ch6", "yr": "2023", "tp": "多选", "q": "社会工作者小薇拟开展“社区一勺米”活动，组织居民为社区困难群众募集米面等生活物资，以培养居民 相互关怀和相互照顾的美德。为此，小薇需提前招募志愿者并筹措一定的活动资金，从管理社区资源的角度 出发，小薇进行资源开发时，适宜的做法有（ ）。", "ops": [{"l": "A", "t": "联络社区志愿服务团队，协助招募志愿者", "ok": true}, {"l": "B", "t": "在业主群发布消息，从居民中招募志愿者", "ok": true}, {"l": "C", "t": "联系物业管理公司，寻求人力和资金支持", "ok": true}, {"l": "D", "t": "拜访街道办事处，请求他们提供经费资助", "ok": true}, {"l": "E", "t": "向市民政局申请专项经费，购买生活物资", "ok": false}], "ex": "从管理社区资源角度，开发资源就是通过联络、沟通等方式获取人力（志愿者）和资金等资 源。A联络志愿服务团队协助招募志愿者，B在业主群招募志愿者，都属于招募人力；C联系物业寻求人力和资 金支持，D拜访街道办请求经费资助，都是获取资源的途径。而E向市民政局申请专项经费购买物资，重点在 申请经费用于购买物资，并非从管理社区资源角度开发资源（社区资源开发主要针对社区内及周边相关主体 获取资源）。答案：ABCD"}, {"ch": "综合·Ch4", "yr": "2023", "tp": "多选", "q": "在老旧小区改造过程中，加装电梯是社区居民关注的议题。为了全面准确把握社区居民对加装电梯的意见 ，社会工作者小王决定运用多种方法收集资料，进行社区分析，其适宜的做法有（ ）", "ops": [{"l": "A", "t": "收集业主微信群里业主对于加装电梯的看法", "ok": true}, {"l": "B", "t": "查阅讨论加装电梯议题的居民议事会的会议记录", "ok": true}, {"l": "C", "t": "召开居民座谈会，征询居民对加装电梯的意见和建议", "ok": true}, {"l": "D", "t": "设计居民加装电梯意愿问卷调查表，开展逐门逐户的调查", "ok": true}, {"l": "E", "t": "访问承接老旧小区电梯安装公司的负责人，了解其对加装电梯的意见", "ok": false}], "ex": "题目要求收集社区居民对加装电梯的意见，A从业主微信群获取居民看法，B查阅居民议事会 记录，C召开居民座谈会，D设计问卷逐户调查，均是针对居民收集意见的方法；E访问电梯安装公司负责人 ，主体并非社区居民。答案：ABCD"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "多选", "q": "针对社区部分老年人和儿童缺乏照顾的现象，某社会工作服务机构在广泛调研的基础上设计了多套依托 “五社联动”机制，助力“一小一老”的服务方案，邀请街道办事处、社区居委会、社区社会组织代表和服 务对象代表组成筹备小组，采用“可行性方案模型”来筛选理想方案。筹备组首先对比了在同等资金投入情 况下各个方案涉及的服务人数，其次分析了各方案对促进“五社联动”机制建设和服务“一小一老”的效果 ，接下来，筹备组还需要完成的分析工作有（ ）", "ops": [{"l": "A", "t": "分析该机构过去面向老年人和儿童的服务完成情况", "ok": true}, {"l": "B", "t": "分析比较哪个方案最能达成“一小一老”服务目标", "ok": false}, {"l": "C", "t": "分析基金会和企业对各个方案给予资金支持的意向", "ok": false}, {"l": "D", "t": "识别比较哪个方案更有利于服务对象公平享有服务", "ok": true}, {"l": "E", "t": "识别分析务个方案潜在风险及可能产生的负面影响", "ok": true}], "ex": "本题考查小组工作方法的相关知识。正确答案为ADE。A.分析该机构过去面向老年人和儿童的服务完成情况；D.识别比较哪个方案更有利于服务对象公平享有服务；E.识别分析务个方案潜在风险及可能产生的负面影响"}, {"ch": "综合·Ch5", "yr": "2023", "tp": "多选", "q": "小张致力于精神障碍人士社会工作服务研究，她依据残疾等级选取了20位研究对象，采用深度访谈、焦点 小组和非参与观察等方法，了解精神障碍人士及其家属接受服务的过程，分析家属服务参与对精神障碍人士 康复的作用，并提出精神障碍人士社会工作服务的优化方案。关于该研究的说法，正确的有（ ）", "ops": [{"l": "A", "t": "该研究是定性研究中的行动研究", "ok": false}, {"l": "B", "t": "该研究资料收集方法和资料多元", "ok": true}, {"l": "C", "t": "该研究适用于分析精神障碍形成的原因", "ok": true}, {"l": "D", "t": "该研究有助于建构精神康复的理论模式", "ok": true}, {"l": "E", "t": "该研究中精神障碍人士的家属也是研究者", "ok": false}], "ex": "本题考查小组工作方法的相关知识。正确答案为BCD。B.该研究资料收集方法和资料多元；C.该研究适用于分析精神障碍形成的原因；D.该研究有助于建构精神康复的理论模式"}, {"ch": "综合·Ch1", "yr": "2023", "tp": "多选", "q": "学生小勇在课后欺凌同学，学校社会工作者王老师发现后对此事进行处理。根据《未成年人保护法》，王 老师的下列做法中，正确的有（ ）", "ops": [{"l": "A", "t": "立即制止小勇的错误行为", "ok": true}, {"l": "B", "t": "对被欺凌的同学及时给予心理辅导", "ok": true}, {"l": "C", "t": "嘱咐被欺负的同学不要声张，以保护学校声誉", "ok": false}, {"l": "D", "t": "对小勇父母给予必要的家庭教育指导", "ok": true}, {"l": "E", "t": "主动联系小勇和被欺负同学的父母参与处理欺凌事件", "ok": true}], "ex": "《未成年人保护法》强调对欺凌行为要及时干预。A选项立即制止错误行为，是及时干预的第 一步；B选项对被欺凌同学心理辅导，有助于其恢复；D选项对小勇父母进行家庭教育指导，从源头改善；E选 项联系双方父母参与处理，家校合作解决问题。C选项嘱咐被欺负同学不声张以保护学校声誉，这不仅不利于 保护被欺凌同学权益，也违反相关法律对欺凌处理应积极公开公正的要求。答案：ABDE 22"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "单选", "q": "根据《中共中央国务院关于加强基层治理体系和治理能力现代化建设的意见》，要完善社会力量参与基层 治理激励政策，创新社区与（ ）的联动机制，支持建立乡镇(街道）购买社会工作服务机制和设立社区基金 会等协作载体，吸纳社会力量参加基层应急救援。", "ops": [{"l": "A", "t": "社会工作服务机构、社区社会工作者、社区居民、社会公益资源", "ok": false}, {"l": "B", "t": "社区社会组织、社区社会工作者、社区志愿者、社会公益资源", "ok": false}, {"l": "C", "t": "社会组织、社会工作者、社区志愿者、社会慈善资源", "ok": true}, {"l": "D", "t": "社会服务机构、社会工作者、社区居民、社区志愿服务资源", "ok": false}], "ex": "本题考查社会工作的内涵与基本知识。正确答案为C。C.社会组织、社会工作者、社区志愿者、社会慈善资源"}, {"ch": "综合·Ch2", "yr": "2024", "tp": "单选", "q": "社会工作者在社区开展了“智慧助老”服务，邀请辖区内高校的大学生志愿者为老年人培训如何充分使用 智能手机，讲解网约车、互联网医院和网上购物等APP操作方法。上述服务体现了社会工作在服务对象层面的 目标是（ ）", "ops": [{"l": "A", "t": "促进发展", "ok": true}, {"l": "B", "t": "促进社会公正", "ok": false}, {"l": "C", "t": "解救危难", "ok": false}, {"l": "D", "t": "促进社会团结", "ok": false}], "ex": "“智慧助老”服务通过培训老年人使用智能手机及相关 APP 操作方法，提升老年人能力，让 他们更好适应数字时代，符合促进发展的目标。B 促进社会公正是社会层面目标；C 解救危难强调摆脱生命 危机等极端困境，题干未体现；D 促进社会团结属于社会层面目标。答案：A 。"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "单选", "q": "关于社会工作维持社会秩序功能的说法，正确的是（ ）", "ops": [{"l": "A", "t": "社会工作倾向于通过权力来化解社会的矛盾", "ok": false}, {"l": "B", "t": "社会工作运用行政管理技术来解决社会冲突", "ok": false}, {"l": "C", "t": "社会工作通过专业的服务实现社会治理的效果", "ok": true}, {"l": "D", "t": "社会工作只运用自上而下的专业系统解决问题", "ok": false}], "ex": "A 错：依靠权力化解矛盾是行政手段，不是社工方式。 B 错：行政管理不属于社会工作专业方法。 C 对：社会工作通过专业服务、调适关系、化解矛盾，实现柔性治理、维持社会秩序。 D 错：社工是双向、自下而上 + 专业服务，并非只靠自上而下。答案：C"}, {"ch": "综合·Ch2", "yr": "2024", "tp": "单选", "q": "关于社会工作要素的说法，正确的是（ ）", "ops": [{"l": "A", "t": "社会工作者的能力和经验直接影响服务的成效", "ok": true}, {"l": "B", "t": "社会工作服务对象仅限于生活上陷入困境的人", "ok": false}, {"l": "C", "t": "社会工作价值观通常无法在服务实践当中形成", "ok": false}, {"l": "D", "t": "社会工作助人方法因人而异且不适宜共用共享", "ok": false}], "ex": "本题考查社会工作的核心要素，社会工作要素包含社会工作者、服务对象、价值观、助人方 法等核心内容，其中社会工作者是提供专业服务的主体，其专业能力、实务经验直接决定服务的开展方式与 实施成效，是影响服务成效的关键因素；B 错误，社会工作服务对象不仅包括生活陷入困境的人，还包括面 临各类社会问题、有专业服务需求的个人、家庭、群体和社区，范围并非仅限于生活困境人群；C 错误，社 会工作价值观既源于专业伦理规范，也能在具体的服务实践中不断深化、完善和形成，实践是价值观落地与 发展的重要载体；D 错误，社会工作助人方法是经过专业总结、提炼的系统方法，具有专业性和通用性，可 在专业领域内共用共享，同时能结合服务对象的个体差异灵活调整，并非因人而异且不适宜共用共享。"}, {"ch": "综合·Ch4", "yr": "2024", "tp": "单选", "q": "为协助残障人士走出家门、融入社会，社会工作者小何筹备了“有爱无碍助融共乐”的主题活动。下列服 务内容中，最能体现社会工作者支持者角色的是（ ）", "ops": [{"l": "A", "t": "人际关系协调", "ok": false}, {"l": "B", "t": "鼓励分享生命故事", "ok": true}, {"l": "C", "t": "负面情绪疏导", "ok": false}, {"l": "D", "t": "积极倡导无障碍出行", "ok": false}], "ex": "支持者角色强调鼓励服务对象自我决定、自我探索，增强其面对困难的信心和能力。B选项鼓 励分享生命故事，能给予残障人士情感支持，增强他们的自我认同和面对生活的信心，符合支持者角色。答 案：B"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "单选", "q": "社会工作者老王最初接触社区矫正对象小陈时，小陈总是闭口不言，抵触情绪很强。老王理解小陈的反应 ，在日常生活中不断给予他关怀，逐渐获得了他的信任。上述老王的做法，主要体现的社会工作者核心能力 是（ ）", "ops": [{"l": "A", "t": "沟通与建立关系", "ok": true}, {"l": "B", "t": "评估和计划", "ok": false}, {"l": "C", "t": "协调和配置资源", "ok": false}, {"l": "D", "t": "促进和使能", "ok": false}], "ex": "老王面对小陈的抵触，通过给予关怀获得信任，重点在于与小陈建立起良好的关系，这体现 的是沟通与建立关系的能力。答案：A"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "单选", "q": "社会工作者小尚在走访低保家庭时，患有抑郁症的服务对象老胡告诉小尚，最近自己的父亲因肾功能衰竭 需长期透析，所需自付部分的治疗费用还无着落，这让家里雪上加霜。小尚研究相关政策和申请流程，协助 老胡为父亲申请医疗救助。根据社会工作领域的划分，上述小尚的工作属于（ ）", "ops": [{"l": "A", "t": "精神健康社会工作", "ok": false}, {"l": "B", "t": "优抚安置社会工作", "ok": false}, {"l": "C", "t": "减灾社会工作", "ok": false}, {"l": "D", "t": "社会救助社会工作", "ok": true}], "ex": "小尚协助患有抑郁症且家庭经济困难的老胡为其父亲申请医疗救助，核心是围绕救助展开工 作，符合社会救助社会工作范畴。答案：D"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "单选", "q": "老李久病不愈，家人希望其继续住院治疗但老李表示很想回家，向医务社会工作者小王抱怨在医院不自由 ，不开心，并要求马上出院，此时，小王最适宜的做法是（ ）", "ops": [{"l": "A", "t": "由主治医生评估老李的身体康复情况后，做出决定", "ok": false}, {"l": "B", "t": "和老李分析不同选择的利弊，再由老李来做出决定", "ok": true}, {"l": "C", "t": "告知老李的家人，由他们权衡后代替老李做出决定", "ok": false}, {"l": "D", "t": "在充分考虑老李的意愿和处境的基础上，做出决定", "ok": false}], "ex": "服务对象自决是社会工作重要原则。老李有表达想法的能力，应尊重其自决权。社会工作者 要做的是协助老李分析不同选择利弊，让他自己做决定。答案：B"}, {"ch": "综合·Ch6", "yr": "2024", "tp": "单选", "q": "社区工作者小彭在探访中发现，80岁的独居老人刘奶奶走路时一瘸一拐。经再三询问，刘奶奶才说是夜里 上厕所时不小心摔了一跤，已经去医院看过了，没大问题，让小彭不用操心。刘奶奶叮小彭于万不要告诉在 外地工作的儿子，以免他担心。面对上述情况，小彭适宜的做法是（ ）", "ops": [{"l": "A", "t": "为了确保刘奶奶生命安全，将此事私下告刘奶奶儿子", "ok": false}, {"l": "B", "t": "将刘奶奶摔倒一事作为案例提醒社区其他老人注意安全", "ok": false}, {"l": "C", "t": "答应刘奶奶的请求，对这件事情保密且不再过问和介入", "ok": false}, {"l": "D", "t": "征求刘奶奶同意，邀请专业人土上门评估居家安全风险", "ok": true}], "ex": "A选项私下告知儿子违背刘奶奶意愿；B选项将刘奶奶个人隐私作为案例不合适；C选项完全不 管不顾不恰当。D选项征求刘奶奶同意后邀请专业人士评估居家安全风险，既尊重刘奶奶意愿，又能切实为其 解决潜在安全问题，做法适宜。答案：D"}, {"ch": "综合·Ch2", "yr": "2024", "tp": "单选", "q": "某社区居委会与社会工作服务机构合作摸排社区内特殊困难老年人群体的基本情况，总结社区常态化探访 工作经验，倡议构建多方主体参与的关爱服务机制，提升社会对这一群体的关注度，上述服务体现的社会工 作专业价值观主要是(（ ）", "ops": [{"l": "A", "t": "待人真诚守信", "ok": false}, {"l": "B", "t": "践行社会公正", "ok": true}, {"l": "C", "t": "强调服务对象个人的尊严和价值", "ok": false}, {"l": "D", "t": "注重服务中人与人之间关系的重要性", "ok": false}], "ex": "题目中通过多种举措关注特殊困难老年人群体，提升社会对他们的关注度，这体现了追求公 平公正，让这一群体能得到应有关注和资源，符合践行社会公正的价值观。答案：B"}, {"ch": "综合·Ch2", "yr": "2024", "tp": "单选", "q": "关于社会工作专业伦理的说法，正确的是（ ）", "ops": [{"l": "A", "t": "社会工作专业伦理是把价值观念转变为行动的行为守则", "ok": true}, {"l": "B", "t": "社会工作专业伦理是指导社会工作者开展专业实践的理念", "ok": false}, {"l": "C", "t": "社会工作专业伦理与专业价值观存在差异，二者对立统一", "ok": false}, {"l": "D", "t": "社会工作专业伦理关注好坏、善恶等议题的判断或选择", "ok": false}], "ex": "社会工作专业伦理是对社会工作价值观的具体化，是把价值观念转变为行动的行为守则，A 正确。B 选项，理念表述不准确，伦理是行为准则。C 选项，专业伦理与专业价值观并非对立统一，伦理是 价值观的具体体现。D 选项，关注好坏、善恶判断选择的更多是价值观，伦理侧重于具体行为规范。答案：A"}, {"ch": "综合·Ch2", "yr": "2024", "tp": "单选", "q": "社会工作者老马在某社会工作服务机构已工作10年，在工作中总是能耐心地解答新入职员工提出的相关问 题，并且十分尊重他们的想法，根据社会工作专业伦理的基本内容，老马的上述做法最能体现出的是（ ）", "ops": [{"l": "A", "t": "社会工作者对服务对象的伦理责任", "ok": false}, {"l": "B", "t": "社会工作者对同事的伦理责任", "ok": true}, {"l": "C", "t": "社会工作者对全社会的伦理责任", "ok": false}, {"l": "D", "t": "社会工作者对专业的伦理责任", "ok": false}], "ex": "老马解答新入职员工问题、尊重他们想法，新入职员工属于同事范畴，体现的是对同事的伦 理责任。答案：B"}, {"ch": "综合·Ch3", "yr": "2024", "tp": "单选", "q": "春节临近，某市社会救助管理站联合当地社会工作服务机构开展“寒冬送温暖”活动。在他们的倡导下 ，当地志愿者纷纷加入，为流浪乞讨人员送去生活物资，在帮助他们的同时，也营造了互助关爱的社会氛围 。（ ）", "ops": [{"l": "A", "t": "同辈群体能够改变人类行为", "ok": false}, {"l": "B", "t": "人类行为能够改变社会环境", "ok": true}, {"l": "C", "t": "大众传媒能够影响社会环境", "ok": false}, {"l": "D", "t": "心理因素能够改变人类行为", "ok": false}], "ex": "题干中社会救助管理站、社会工作服务机构倡导，志愿者响应，开展活动为流浪乞讨人员送 物资，营造了互助关爱的社会氛围，体现了人的行为对社会环境的改变。答案：B"}, {"ch": "综合·Ch3", "yr": "2024", "tp": "单选", "q": "28岁的小刘长期在外打工，为与家人团聚，决定返乡创业，根据马斯洛需要层次理论，小刘返乡主要满足 的是（ ）。", "ops": [{"l": "A", "t": "生理需要", "ok": false}, {"l": "B", "t": "尊重的需要", "ok": false}, {"l": "C", "t": "归属与爱的需要", "ok": true}, {"l": "D", "t": "安全需要", "ok": false}], "ex": "马斯洛需要层次理论中，归属与爱的需要指人要求与他人建立感情联系，如想与家人团聚等 。小刘返乡是为与家人团聚，这满足的就是归属与爱的需要。答案：C"}, {"ch": "综合·Ch3", "yr": "2024", "tp": "单选", "q": "小飞的父亲一直要求他学习成绩保持全班前三名，一旦成绩不好，……还说“玉不琢不成器，孩子不打不 成才”。小飞的家庭教养模式是（ ）", "ops": [{"l": "A", "t": "专制型", "ok": true}, {"l": "B", "t": "支配型", "ok": false}, {"l": "C", "t": "放任型", "ok": false}, {"l": "D", "t": "冲突型", "ok": false}], "ex": "专制型教养模式中，家长对孩子有较高期望与严格要求，常采取打骂等强硬手段，题干中小 飞父亲要求成绩前三，成绩不好就打骂并秉持“不打不成才”观念，符合专制型特点。答案：A"}, {"ch": "综合·Ch4", "yr": "2024", "tp": "单选", "q": "黄先生不知道如何与上高中的儿子相处，经常与他发生争吵，因而向社会工作者小赵求助：在某次面谈中 ，黄先生说：“我也试过跟儿子好好说话，但他对我总是不理不睬，多说几句他就想我。”下列小赵的回应 中，最符合同理技巧的是（ ）", "ops": [{"l": "A", "t": "“您跟儿子相处困难，现在好像也没什么好办法来解决这个问题”", "ok": false}, {"l": "B", "t": "“这个年纪的孩子与家长发生矛盾是很正常的，您要学会理解他”", "ok": false}, {"l": "C", "t": "“您想和儿子好好相处，但他好像还是老样子，确实有点让人无奈”", "ok": true}, {"l": "D", "t": "“您不要那么着急，等他再长大一点，和您的关系自然就会变好了”", "ok": false}], "ex": "同理技巧是社会工作者设身处地体会服务对象的内心感受，理解其想法和要求。 A选项只是 陈述问题，没有体现对黄先生感受的同理。 B选项是在教导黄先生，没有站在黄先生角度体会他的感受。 C选项既提及黄先生想和儿子好好相处的想法，又表达出面对儿子依旧老样子时他无奈的感受，符合同理技巧 。 D选项是在安慰，没有体现对黄先生当下感受的同理。答案：C"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "小梁失业后一直没有找到工作。为了挣钱养家，他借钱做生意，却遇到诈骗，不但没有挣到钱，反而欠了 很多债。小梁觉得无法面对家人，感到生活无望，对未来失去信心。根据危机介入理论，小梁正处于危机发 展的（ ）", "ops": [{"l": "A", "t": "开始阶段", "ok": false}, {"l": "B", "t": "恢复阶段", "ok": false}, {"l": "C", "t": "解组阶段", "ok": true}, {"l": "D", "t": "重组阶段", "ok": false}], "ex": "危机介入理论中，解组阶段服务对象处于极度的情绪困扰中，认知和问题解决能力下降，生 活平衡被打破。小梁因失业、生意诈骗欠债，觉得无法面对家人，对未来失去信心，生活平衡被打破且情绪 困扰、认知和解决问题能力受影响，符合解组阶段特点。答案：C"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "社会工作者小王与服务对象李女士建立专业关系后，运用心理社会治疗模式，从生理、心理和社会三个方 面分析李女士问题产生的影响因素，进而作出判断。上述小王的工作内容属于（ ）", "ops": [{"l": "A", "t": "分类诊断", "ok": true}, {"l": "B", "t": "心理动态诊断", "ok": false}, {"l": "C", "t": "缘由诊断", "ok": false}, {"l": "D", "t": "人格诊断", "ok": false}], "ex": "心理社会治疗模式的诊断包括心理动态诊断、缘由诊断和分类诊断。分类诊断是对服务对象 问题的生理、心理和社会三个方面的影响因素作出判断。题干中小王从生理、心理和社会三方面分析影响因 素，符合分类诊断。答案：A"}, {"ch": "综合·Ch4", "yr": "2024", "tp": "单选", "q": "小杨即将大学毕业，他觉得找工作很难，抱着试试看的态度向社会工作者小林求助，小林从小杨的讲述中 感受到他的无助，对小杨说：“你能主动来找我，说明你想解决问题，这样很好。”小林上述回应的主要目 的是（ ）。", "ops": [{"l": "A", "t": "了解小杨的求助愿望", "ok": false}, {"l": "B", "t": "确认小杨的受助身份", "ok": false}, {"l": "C", "t": "明确小杨的求助问题及其需求", "ok": false}, {"l": "D", "t": "鼓励小杨能够积极地面对困难", "ok": true}], "ex": "小林回应强调小杨主动求助想解决问题很好，重点在于通过这样的表述鼓励小杨积极面对找 工作难的困难。答案：D"}, {"ch": "综合·Ch4", "yr": "2024", "tp": "单选", "q": "服务对象吴先生对社会工作者小王说：“我妻子总说我不花时间陪伴她和儿子，我也知道应该多陪陪他们 ，但是我工作太忙了，真的是没有时间，我也觉得很不好。此时，考虑到吴先生已多次表达类似的想法，但 没有任何改变，小王打算运用对质的技巧，下列回应中，体现出技巧的是（ ）", "ops": [{"l": "A", "t": "您先前多次提到了，想多花点时间来陪伴家人，那您有做过什么努力吗？", "ok": false}, {"l": "B", "t": "您的意思是，您当前还不能平衡您工作和家庭之间的关系，是这样吗？", "ok": false}, {"l": "C", "t": "您说想花时间陪伴家人，实际还是把更多的时间放在工作上，您怎么看？", "ok": true}, {"l": "D", "t": "您有没有想过，如果您一直没时间陪伴家人，您与家人的关系会越来越差。", "ok": false}], "ex": "对质技巧是指社会工作者通过直接提问等方式让服务对象面对自己在行为、情感和认识等方 面不一致的地方。在本题中，吴先生一方面说想多陪家人，另一方面因工作忙没行动，存在言行不一致。选 项C直接指出其想陪家人却把更多时间放工作上这一矛盾，体现对质技巧。A选项只是问努力情况，未直接对 质矛盾；B选项是对吴先生话语的总结确认，非对质；D选项是在阐述没时间陪家人的后果，不是对质。答案 ：C"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "单选", "q": "初中生洋洋沉迷于网络游戏，学习成绩较差，性格孤僻，朋友不多，缺乏自信，学校社会工作者小陈为其 提供了个案服务。经过了半年的服务，洋洋的总体情况有所改善，小陈拟对服务效果进行评估，最适宜的做 法是（ ）。", "ops": [{"l": "A", "t": "邀请学校领导对个案服务完成情况进行评价", "ok": false}, {"l": "B", "t": "委托德育老师评估个案服务目标的达成情况", "ok": false}, {"l": "C", "t": "运用洋洋在服务不同节点填写的心理量表进行评价", "ok": true}, {"l": "D", "t": "要求洋洋填写服务满意度的调查问卷评估服务情况", "ok": false}], "ex": "个案服务效果评估应基于可量化、前后对比的客观数据，并注重服务对象的改变。 C 选项通过对比服务前后（或不同节点）的心理量表得分，可客观测量洋洋在情绪、行为、自信心等方面的 变化，科学评估服务效果。 其他选项的局限： A 学校领导评价 → 非直接参与服务，评价主观且不专业。 B 委托德育老师评估 → 老师可能了解部分表现，但无法全面评估个案服务目标的专业达成度。 D 满意度问卷 → 仅反映主观感受，不能客观衡量服务目标（如自信提升、行为改变）的达成情况。答案：C"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "快递员小石父母早亡，由爷爷抚养长大。最近，小石的爷爷因胃癌住院治疗。小石既要工作，又要照顾爷 爷，心理压力很大，出现了注意力不集中、失眠、暴饮暴食的状况，还反复胃痛，工作和生活均受到影响。 社工工作者老孙在走访新就业群体时，了解了小石的情况，决定采用心理社会治疗模式为其开展服务。下列 老孙的做法中，体现出该模式特点的是（ ）。", "ops": [{"l": "A", "t": "对小石所面临的危险快速做出判断", "ok": false}, {"l": "B", "t": "采用多层面介入方式帮助小石改变", "ok": true}, {"l": "C", "t": "运用放松技术有效调节小石的情绪", "ok": false}, {"l": "D", "t": "劝导小石尽快到医院进行身体检查", "ok": false}], "ex": "心理社会治疗模式特点包括注重从人际交往的场景中了解服务对象、运用综合的诊断方式确 定服务对象问题的原因、采用多层面的服务介入方式帮助服务对象。A选项快速判断危险是危机介入模式特点 ；C选项运用放松技术多属于行为治疗模式；D选项劝导就医不属于心理社会治疗模式特点。B选项采用多层面 介入方式符合心理社会治疗模式特点。答案：B"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "社会工作者为社区精神障碍康复者开设成长小组。下列做法中，最符合该小组目标的是（ ）", "ops": [{"l": "A", "t": "帮助组员学习精神障碍的相关知识，重建对精神障碍的认知，实现观念转变", "ok": false}, {"l": "B", "t": "帮助组员建立关系，通过参与康复议题的讨论，增加彼此的信任和相互支持", "ok": false}, {"l": "C", "t": "帮助组员认识精神障碍现状和成因，了解心理治疗方式及其可能产生的效果", "ok": false}, {"l": "D", "t": "帮助组员了解、认识和探索自己，运用自身资源，发挥潜能，促进正向改变", "ok": true}], "ex": "成长小组的核心目标是帮助组员了解、认识和探索自己，激发自身潜能实现正向改变。A和 C侧重于知识学习，B侧重于建立关系和讨论康复议题，D符合成长小组以个人成长为重点的特点。答案选D。"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "在某次“职击未来”青年职业生涯规划小组活动中，组员小戴和小周在分享求职经历时讨论激烈，争执不 下。小戴认为确定求职方向后就应坚持不懈，小周则认为多次求职未果后应果断调整方向，面对此情，社会 工作者老马及时介入，协助两人澄清各自的观点并解释二者之间的差异。上述老马的做法，体现出在该小组 阶段社会工作者的任务是（ ）", "ops": [{"l": "A", "t": "处理抗拒行为", "ok": false}, {"l": "B", "t": "协助组员重新构建小组", "ok": false}, {"l": "C", "t": "协调和处理冲突", "ok": true}, {"l": "D", "t": "形成相对稳定的小组关系结构", "ok": false}], "ex": "题干中组员小戴和小周激烈争执，社会工作者老马及时介入，协助澄清观点、解释差异，这 明显是在处理组员间的冲突。答案：C"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "企业社会工作者小孔计划为公司部分员工开设压力管理小组，由于是初次开展此类服务，督导者老沈建议 小孔做好组前计划评估，下列小孔的做法中，最适宜的是（ ）。", "ops": [{"l": "A", "t": "运用压力量表测量企业员工的压力状况，并用压力标签进行标注", "ok": false}, {"l": "B", "t": "与组员的同事进行访谈，间接，客观地了解每位组员的压力状况", "ok": false}, {"l": "C", "t": "在评估时既考虑组员以往的压力状况，又关注当下感知到的压力", "ok": false}, {"l": "D", "t": "检索企业员工压力状况与减压方法文献，了解同类小组开展经验", "ok": true}], "ex": "组前计划评估主要是为开展小组服务做准备，了解相关情况。检索企业员工压力状况与减压 方法文献，了解同类小组开展经验，能帮助小孔更好地规划本次压力管理小组，为服务开展提供参考。A选项 测量员工压力状况是小组开展中了解组员情况的做法；B选项与同事访谈了解组员压力状况并非组前计划评估 重点；C选项关注组员压力状况也是小组开展中对组员状态了解，并非针对计划评估。答案：D"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "社会工作者小钱为大学一年级学生开展主题为“有你有我”的新生活小组活动，旨在通过组员交流相似经 历，彼此分享信息，互相鼓励，尽快适应大学生活，根据小组工作的类型，该小组属于（ ）。", "ops": [{"l": "A", "t": "教育小组", "ok": false}, {"l": "B", "t": "支持小组", "ok": true}, {"l": "C", "t": "成长小组", "ok": false}, {"l": "D", "t": "治疗小组", "ok": false}], "ex": "本题考查小组工作方法的相关知识。正确答案为B。B.支持小组"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "社会工作者小乔拟针对大学生的就业困扰开展小组服务。在小组准备阶段，小乔根据收集的报名表，筛选 “不清楚自己的优势，无法辨别职业特质”的报名者参加小组。上述小乔的做法，体现的遴选和评估组员的 要件是（ ）", "ops": [{"l": "A", "t": "共同或相似的问题", "ok": true}, {"l": "B", "t": "共同的兴趣和愿望", "ok": false}, {"l": "C", "t": "对某些问题的认知", "ok": false}, {"l": "D", "t": "对参加小组的要求", "ok": false}], "ex": "小乔筛选的是“不清楚自己的优势，无法辨别职业特质”这类有共同就业困扰问题的报名者 ，这体现的是组员有共同或相似的问题。答案：A。"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "社会工作者小孙为即将参加高考的学生开设解压小组。在某次小绍活动中，小孙邀请组员绘制“我的表情 包”，鼓励组员自我探索，表达内心感受，宣泄压力。分享作品时，组员们畅所欲言，并积极主动讨论和总 结了压力管理方法。该小组所处的阶段是（ ）", "ops": [{"l": "A", "t": "开始阶段", "ok": false}, {"l": "B", "t": "转折阶段", "ok": false}, {"l": "C", "t": "结束阶段", "ok": false}, {"l": "D", "t": "成熟阶段", "ok": true}], "ex": "在成熟阶段，小组的凝聚力、互动性都很强，组员能够充分自我探索、表达，积极参与讨论 等。题中组员畅所欲言，积极主动讨论总结压力管理方法，符合成熟阶段特点。答案：D"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "在设计儿童教育小组活动时，为保证小组吸引力，确保活动开展的有效性，社会工作者小李在小组活动的 时间安排上，考虑了整个小组的持续时间，活动的频率。每次活动开始的时间。此外，小李还应该首先考虑 的是（ ）", "ops": [{"l": "A", "t": "每次活动时间的长短", "ok": true}, {"l": "B", "t": "每人发言时间的长短", "ok": false}, {"l": "C", "t": "交流分享时间的长短", "ok": false}, {"l": "D", "t": "互动环节时间的长短", "ok": false}], "ex": "儿童教育小组的设计中，在考虑小组整体时长、频率、开始时间后，首先需要确定每次活动 的具体时长，因为儿童的注意力持续时间有限，活动时长需符合其年龄特点，过长易疲劳，过短则效果不足 。确定每次活动时长后，才能进一步安排发言、分享、互动等环节的时间分配。 B、C、D 属于活动内容环节 的时间安排，应在确定每次活动总时长后再进行细分。答案：A"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "社会工作者在带领健康生活主题小组的讨论中运用了提问技巧下列提问中，属于深究回答型提问的是（ ）。", "ops": [{"l": "A", "t": "“早睡早起属于健康生活的一种具体表现，是不是？”", "ok": false}, {"l": "B", "t": "“除了早睡早起，大家对健康生活还有其他想法吗？”", "ok": false}, {"l": "C", "t": "“大家说说早睡早起的“早”，早到几点比较适合？”", "ok": true}, {"l": "D", "t": "“李大爷觉得早睡早起是健康生活，其他人怎么看？”", "ok": false}], "ex": "深究回答型提问是为了深入了解回答背后的原因、想法等，促使成员进一步阐述观点。C选项 “大家说说早睡早起的‘早’，早到几点比较适合？”引导成员深入探讨“早睡早起”中“早”的具体时间 ，属于深究回答型提问。答案选C。"}, {"ch": "综合·Ch6", "yr": "2024", "tp": "单选", "q": "社区工作者针对养宠物引发的邻里矛盾，组织居民开展了文明养宠“益起来”活动。下列活动目标中，属 于社区工作过程目标的是（ ）", "ops": [{"l": "A", "t": "解决宠物大小便导致的社区卫生问题", "ok": false}, {"l": "B", "t": "提升社区居民持证养犬的比例", "ok": false}, {"l": "C", "t": "培养社区居民文明养笼的习惯", "ok": true}, {"l": "D", "t": "减少宠物乱叫而引发的音扰民问题", "ok": false}], "ex": "过程目标强调在达成任务过程中，居民能力提升、观念转变、习惯养成等。选项A、B、D都侧 重于解决具体实际问题或改变具体行为数据，属于任务目标。而C选项培养居民文明养宠习惯，注重居民在活 动过程中自身的改变，属于过程目标。答案：C"}, {"ch": "综合·Ch6", "yr": "2024", "tp": "单选", "q": "社会工作者小沈运用社会策划模式开展社区微更新项目，对社区卫生死角进行清理，并将其改造成居民休 闲健身的场所。在该项目中，小沈要负责整个执行过程的管理、监督、反馈等各个环节，以确保达到服务目 标，上述工作中，小沈扮演的角色主要是（ ）。", "ops": [{"l": "A", "t": "技术专家", "ok": false}, {"l": "B", "t": "协调者", "ok": false}, {"l": "C", "t": "方案实施者", "ok": true}, {"l": "D", "t": "中介者", "ok": false}], "ex": "社会策划模式中，方案实施者负责执行整个计划过程，包括管理、监督、反馈等环节以达成 目标，题中小沈负责项目执行过程各环节，符合方案实施者角色。技术专家侧重于提供专业技术知识，协调 者主要协调各方关系，中介者是促成各方连接，均不符合题意。答案：C"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "社会工作者在流动儿童支持小组中设计了“看图说话”的环节，锻炼组员的想象力。组员小萌和小丽在描 述某图画时出现分歧，双方都认为自己的答案是对的。面对此情形，社会工作者最适宜的做法是（ ）。", "ops": [{"l": "A", "t": "支持小萌的观点，鼓励其在小组中继续发言", "ok": false}, {"l": "B", "t": "邀请另一位组员来描述，打破当前僵持局面", "ok": false}, {"l": "C", "t": "提供看图说话的标准答案并给两人的描述进行打分", "ok": false}, {"l": "D", "t": "重申小组契约，提示小萌和小丽尊重他人不同观点", "ok": true}], "ex": "小组活动中出现分歧时，社会工作者的首要目标是促进小组凝聚力、引导组员学会尊重差异 、发展沟通与包容能力，而非评判对错或支持某一方。 D 选项通过“重申小组契约”，引导组员遵守“尊重他人观点”的小组规范，既化解冲突，又强化小组规则 ，是最符合社会工作价值观和教育性目标的处理方式。 其他选项的不足： A 支持小萌的观点 → 可能激化矛盾，破坏小组平等氛围。 B 邀请另一位组员描述 → 暂时回避冲突，但未解决根本问题（如何面对分歧）。 C 提供标准答案并打分 → 违背“看图说话”锻炼想象力的初衷，且会打击组员积极性。答案：D"}, {"ch": "综合·Ch6", "yr": "2024", "tp": "单选", "q": "社会工作者在制定社区工作行动策略时，邀请社区居民代表参加策略规划小组，下列社会工作者的做法 ，正确的是（ ）。", "ops": [{"l": "A", "t": "让参与者在评估策略时尽可能地不要删除策略", "ok": false}, {"l": "B", "t": "在提出策略时，只挑选部分参与者发表的相关意见", "ok": false}, {"l": "C", "t": "让所有参与者通过头脑风暴方法提出各种策略", "ok": true}, {"l": "D", "t": "在筛选策略时，需要对策略进行更细致的方案设计", "ok": false}], "ex": "制定社区工作行动策略时，应充分调动居民代表参与，头脑风暴可让大家充分发表想法，利 于集思广益，C做法正确。A不应限制对策略的评估和删除；B挑选部分参与者意见不全面；D筛选策略阶段重 点是筛选而非细致方案设计。答案：C"}, {"ch": "综合·Ch3", "yr": "2024", "tp": "单选", "q": "社会工作者在观察社区环境和走访居民的过程中，发现社区服务场所的无障碍设施未达到政策规定的标准 。根据对社区需要类型的划分，上述情形反映的需要属于（ ）。", "ops": [{"l": "A", "t": "规范型需要", "ok": true}, {"l": "B", "t": "感觉型需要", "ok": false}, {"l": "C", "t": "表达型需要", "ok": false}, {"l": "D", "t": "比较型需要", "ok": false}], "ex": "规范型需要是由专家学者、专业人士、政府行政官员评估而决定的，题干中是按政策规定标 准来判断无障碍设施未达标，属于规范型需要。答案：A"}, {"ch": "综合·Ch6", "yr": "2024", "tp": "单选", "q": "社区工作者小刘召开座谈会。征询居民对社区环城改造的意见与建议，会议中，他发现老张一直滔滔不绝 ，而其他居民都沉默不语通（ ）在这种情形下，小刘应采取的主持会议技巧是（ ）。", "ops": [{"l": "A", "t": "鼓励老张继续发言", "ok": false}, {"l": "B", "t": "转移参会者关注点", "ok": false}, {"l": "C", "t": "向所有参会者提交", "ok": false}, {"l": "D", "t": "邀请其他居民发言", "ok": true}], "ex": "老张滔滔不绝，其他居民沉默，为了让座谈会能收集到更多居民意见，应调动其他居民参与 。A选项鼓励老张继续发言会让其他居民更难有机会表达；B选项转移参会者关注点不能直接解决收集其他居 民意见的问题；C选项“向所有参会者提交”表述不明，不知提交什么。D选项邀请其他居民发言可以打破僵 局，收集更多居民对社区环城改造的意见与建议。答案：D"}, {"ch": "综合·Ch6", "yr": "2024", "tp": "单选", "q": "社会工作者小黄准备在社区实施儿童友好社区建设项目，为保证项目的有效运作，在管理社区资源的过程 中，小黄首先应（ ）。", "ops": [{"l": "A", "t": "通过多元渠道招募志愿者和采用多种方式筹措资金", "ok": false}, {"l": "B", "t": "链接社区内不同个人、组织和机构拥有的各类资源", "ok": false}, {"l": "C", "t": "加强资源的统筹和协调，以发挥资源的整合性效果", "ok": false}, {"l": "D", "t": "准确了解现有社区资源，分析目前资源方面的欠缺", "ok": true}], "ex": "要保证项目有效运作，管理社区资源时，首先得清楚现有的资源状况以及欠缺什么，这样才 能针对性地开展后续资源管理工作，比如招募志愿者、筹措资金、链接资源、整合资源等。所以小黄首先应 准确了解现有社区资源，分析目前资源方面的欠缺。答案：D。"}, {"ch": "综合·Ch6", "yr": "2024", "tp": "单选", "q": "某地计划采取社区照顾模式对老年人和重度残疾人开展服务。下列法中，属于该模式实施策略中的“由社 区照顾”的内容是（ ）", "ops": [{"l": "A", "t": "将辖区闲置的办公用房改造为养老驿站", "ok": false}, {"l": "B", "t": "为家庭照顾者提供支拨性“喘息”服务", "ok": false}, {"l": "C", "t": "动员社区志愿者定期探访独居的老年人", "ok": true}, {"l": "D", "t": "将养老院的老年人送回到原居住地安置", "ok": false}], "ex": "“由社区照顾”强调由家庭、亲友、邻里、志愿者等提供照顾和支持。A选项是改造场地 ；B选项是对家庭照顾者的支持；D选项是养老院老人送回原居住地，都不属于“由社区照顾”中依靠社区力 量照顾。C选项动员社区志愿者定期探访独居老人，符合“由社区照顾”依靠社区志愿者力量照顾的内容。答 案：C"}, {"ch": "综合·Ch6", "yr": "2024", "tp": "单选", "q": "社会工作者准备运用地区发展模式解决社区问题，该模式的特点是（ ）", "ops": [{"l": "A", "t": "更重视实现任务目标", "ok": false}, {"l": "B", "t": "关注社区共同性问题", "ok": true}, {"l": "C", "t": "提倡建立相互关怀的社区", "ok": false}, {"l": "D", "t": "强调遵循理性原则", "ok": false}], "ex": "地区发展模式特点包括较多关注社区共同性问题、注重居民参与等。A选项，地区发展模式注 重过程目标，非更重视任务目标；C选项“提倡建立相互关怀的社区”是社区照顾模式特点；D选项“强调遵 循理性原则”是社会策划模式特点。答案选B，地区发展模式关注社区共同性问题。 答案：B"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "单选", "q": "某社会工作服务机构主要为精神障碍者提供社区康复服务；在服务策划中，依次开展了“服务对象需求评 估、社区康复目标制定、策划可行的康复支持方案、认识机构缺少精神健康专精服务的局限性、选择吸引服 务对象参与的可行性方法、设计详细的康复活动内容”等工作。该服务策划形式属于（ ）", "ops": [{"l": "A", "t": "战略性策划", "ok": false}, {"l": "B", "t": "创新型策划", "ok": false}, {"l": "C", "t": "方案发展策划", "ok": true}, {"l": "D", "t": "问题解决策划", "ok": false}], "ex": "方案发展策划是在目标已经确定的情况下，针对具体服务方案进行策划，题干中围绕为精神 障碍者提供社区康复服务这一既定目标，依次开展一系列关于康复支持方案等具体内容的策划，符合方案发 展策划的特点。战略性策划强调长远目标和机构整体方向；创新型策划突出创新元素；问题解决策划重点在 解决特定问题。本题主要是围绕既定服务目标发展具体方案。答案：C"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "单选", "q": "某社会工作服务机构每月组织一次项目讨论会，各项目主管须向机构负责人汇报项目进程，讨论项目实施 中的问题，并及时进行调整和修正。上述法属于社会工作服务机构运作中的（ ）。", "ops": [{"l": "A", "t": "授权", "ok": false}, {"l": "B", "t": "协调", "ok": false}, {"l": "C", "t": "分配", "ok": false}, {"l": "D", "t": "控制", "ok": true}], "ex": "题干中机构通过每月组织项目讨论会，让主管汇报进程、讨论问题并调整修正，这一系列行 为重点在于对项目进行把控，使其朝着预定目标发展，符合控制的概念。答案：D"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "单选", "q": "社会工作服务机构承接了一个易地搬迁安置社区的综合性发展项目。为此，该机构成立项目工作组，充分 授权其结合实际情况调整计划和分配任务。项目工作组定期分析项目面临的挑战，改进服务方法，圆满完成 了项目任务。该项目工作组的团队类型是（ ）。", "ops": [{"l": "A", "t": "多功能型", "ok": false}, {"l": "B", "t": "职能式", "ok": false}, {"l": "C", "t": "自我管理型", "ok": true}, {"l": "D", "t": "直线式", "ok": false}], "ex": "题干关键信息：机构成立项目工作组，充分授权其结合实际情况调整计划和分配任务。工作 组定期分析挑战，改进方法，自主完成项目。这符合自我管理型团队的特征：团队被授予较大自主权，在目 标框架内自我决策、自我调整，并负责全流程管理。A 多功能型 → 强调团队成员来自不同专业领域，题干 未体现。B 职能式、D. 直线式 → 属于传统科层结构，强调垂直指挥，与“充分授权、自主调整”不符。答 案：C"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "单选", "q": "关于社会服务机构筹资方法的说法，正确的是（ ）", "ops": [{"l": "A", "t": "为留守儿童图书馆申请项目补助属于特别事件筹资", "ok": false}, {"l": "B", "t": "志愿者向熟悉的企业负责人争取捐款属于私人恳请", "ok": true}, {"l": "C", "t": "项目申请书无需说明资助款项使用的社会交代方法", "ok": false}, {"l": "D", "t": "电话劝募的优势是时间要求相对宽松且筹资周期长", "ok": false}], "ex": "A选项，为留守儿童图书馆申请项目补助属于项目申请筹资，不是特别事件筹资，特别事件筹 资一般是利用重大灾害、纪念日等特殊事件进行筹资，A错误。 B选项，志愿者向熟悉的企业负责人争取捐款 ，通过面对面接触，私人之间沟通劝募，属于私人恳请，B正确。 C选项，项目申请书需要说明资助款项使用 的社会交代方法，以便资助方了解资金使用及效果，C错误。 D选项，电话劝募时间要求紧迫，筹资周期短 ，D错误。答案：B"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "单选", "q": "某社会工作服务机构联合一家公募基金会发起“天使行动”月捐计划，首批月捐人通过宣传倡导，带动自 己身边更多的人加入了月捐计划，新加入者的个人捐款动机最有可能是（ ）。", "ops": [{"l": "A", "t": "个人需要", "ok": false}, {"l": "B", "t": "外界影响", "ok": true}, {"l": "C", "t": "利他动机", "ok": false}, {"l": "D", "t": "自我利益", "ok": false}], "ex": "首批月捐人通过宣传倡导带动更多人加入，新加入者是受到外界（首批月捐人的宣传倡导 ）影响才加入，并非基于自身个人需要、利他动机或自我利益主动加入。答案：B"}, {"ch": "综合·Ch4", "yr": "2024", "tp": "单选", "q": "在某街道社工站的一次督导会议上，督导者老张就服务对象家庭需求评估议题，建议社会工作者小林将需 求评估问卷中的问题“您的家庭结构是什么？”更改为“除了您自己以外，您还有谁和您一起生活？”上述 老张的修改建议，主要体现的问卷设计原则是（ ）", "ops": [{"l": "A", "t": "问卷设计需要考虑被调查者的理解能力", "ok": true}, {"l": "B", "t": "问卷设计需要考虑测量结果的效度", "ok": false}, {"l": "C", "t": "问卷设计需要考虑需求评估的目的", "ok": false}, {"l": "D", "t": "问卷设计需要考虑资料处理方法的难易", "ok": false}], "ex": "原问题“您的家庭结构是什么”相对专业抽象，可能让服务对象难以理解准确作答；修改后 的问题更通俗易懂，主要是从被调查者理解能力角度考虑。答案：A"}, {"ch": "综合·Ch4", "yr": "2024", "tp": "单选", "q": "住在养老院的王奶奶对社会工作者小李说，最近夜里总有人敲她的门，有一次她起来开门还被绊了一下 ，小李查看了走廊监控录像，并未发现有人去敲她的门，小李结合王奶奶近期日常行为表现，初步判断王奶 奶可能患有轻度失智症，此时，小李最恰当的做法是（ ）", "ops": [{"l": "A", "t": "为院内老年人开展预防失智症知识普及讲座", "ok": false}, {"l": "B", "t": "组织王奶奶熟悉的院友们为王奶奶提供帮助", "ok": false}, {"l": "C", "t": "与王奶奶的家属沟通建议其将王奶奶暂时带离机构", "ok": false}, {"l": "D", "t": "协调跨专业团队为王奶奶进行评估并制定干预计划", "ok": true}], "ex": "小李初步判断王奶奶可能患轻度失智症，此时最恰当的做法应是专业评估并制定干预计划。 A选项开展讲座不能直接针对王奶奶问题；B选项院友提供帮助缺乏专业性；C选项直接让家属将王奶奶带离机 构不合理。答案选D，协调跨专业团队为王奶奶进行评估并制定干预计划，以便准确判断及科学干预。"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "单选", "q": "根据《民法典》，因胁迫结婚的，受胁迫的一方可以向人民法院要求撤销婚姻，被非法限制人身自由的当 事人请求撤销婚姻的，当自之日起（ ）一年内提出。", "ops": [{"l": "A", "t": "结婚登记", "ok": false}, {"l": "B", "t": "恢复人身自由", "ok": true}, {"l": "C", "t": "胁迫行为发生", "ok": false}, {"l": "D", "t": "知晓撤销事由", "ok": false}], "ex": "对于被非法限制人身自由的当事人请求撤销婚姻，应是在恢复人身自由后才能有效行使权利 ，所以时间起算点是恢复人身自由之日。答案：B 多项选择题"}, {"ch": "综合·Ch2", "yr": "2024", "tp": "多选", "q": "关于我国社会工作发展的基本原则的说法，正确的有（ ）", "ops": [{"l": "A", "t": "坚持中国共产党的领导，认真贯彻党和政府有关要求", "ok": true}, {"l": "B", "t": "坚持走国际化的发展道路，用国际经验模式解决本土问题", "ok": false}, {"l": "C", "t": "坚持社会主义核心价值观引领，提升社会工作的社会认同", "ok": true}, {"l": "D", "t": "坚持职业化发展路径，建立更加完善的社会工作职业体系", "ok": true}, {"l": "E", "t": "坚持以专业为中心的理念，把维护专业权威作为发展目标", "ok": false}], "ex": "我国社会工作发展基本原则强调要立足国情，不能单纯走国际化道路，B 错误；要以服务对 象为中心而非专业中心，E 错误。A 体现党领导的重要性；C 社会主义核心价值观引领可提升认同；D 职业 化发展路径对完善职业体系有积极意义。答案：ACD"}, {"ch": "综合·Ch2", "yr": "2024", "tp": "多选", "q": "关于社会工作价值观内容的说法，正确的有（ ）", "ops": [{"l": "A", "t": "社会工作者应长期遵守和践行社会工作的核心价值观", "ok": true}, {"l": "B", "t": "本土的专业价值观体系要吸收传统的文化与伦理要素", "ok": true}, {"l": "C", "t": "所谓“专业价值观”是来源于“社会价值”", "ok": false}, {"l": "D", "t": "专业价值本质上是受社会传统观念影响的", "ok": false}, {"l": "E", "t": "专业价值观是内化于社会工作者专业实践的精神标准", "ok": true}], "ex": "本题考查社会工作价值观与专业伦理。正确答案为ABE。A.社会工作者应长期遵守和践行社会工作的核心价值观；B.本土的专业价值观体系要吸收传统的文化与伦理要素；E.专业价值观是内化于社会工作者专业实践的精神标准"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "多选", "q": "小李因交通事故致残，日常生活离不开轮椅，整天待在家里不愿意出门。得知小李的情况后，社会工作者 主动上门探访，鼓励他走出家门到社区服务中心参加运动，还让手工编织小组组长张阿姨邀请小李加入，学 习相关技艺。一段时间后小李逐渐融入了社区生活。上述个案服务过程中，社会工作者扮演的角色有（ ）。", "ops": [{"l": "A", "t": "教育者", "ok": true}, {"l": "B", "t": "使能者", "ok": true}, {"l": "C", "t": "倡导者", "ok": false}, {"l": "D", "t": "治疗者", "ok": false}, {"l": "E", "t": "联系人", "ok": true}], "ex": "本题考查小组工作方法的相关知识。正确答案为ABE。A.教育者；B.使能者；E.联系人"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "多选", "q": "某肿瘤病友支持小组接近尾声，面对分离，组员表现各异，下列组员的表现中，呈现出离别情绪的有：", "ops": [{"l": "A", "t": "组员之间的联系加强，互动频率和强度相比之前有所提升", "ok": false}, {"l": "B", "t": "组员小刘采取逃避的态度，借故缺席了最后一次小组活动", "ok": true}, {"l": "C", "t": "组员小徐积极寻找社区内抗癌互助组织，希望出院后加入", "ok": false}, {"l": "D", "t": "组员小赵表示近期心情有点低落，希望再多举办几次小组活动", "ok": true}, {"l": "E", "t": "多数组员对小组产生了认同感，在分享环节都很愿意积极表达", "ok": false}], "ex": "离别情绪通常体现为因小组即将结束而产生不舍、逃避等相关表现。A项联系加强不一定是因 离别情绪；C项寻找新组织与本小组离别情绪关联不大；E项积极表达认同并非针对离别。B项小刘逃避缺席、 D项小赵因小组要结束心情低落希望多举办，都呈现出离别情绪。答案：BD"}, {"ch": "综合·Ch6", "yr": "2024", "tp": "多选", "q": "社区居民骨干小组就电动车上楼问题开展讨论式，大家你一言我一语，从电动车上楼说到文明养宠，场面 非常热烈，社会工作者小组打算运用引导技巧主持小组讨论，下列小胡的做法中，属于该技巧的是（ ）", "ops": [{"l": "A", "t": "如果组员出现观点冲突难以化解，则让组员通过投票来民主表达", "ok": true}, {"l": "B", "t": "按确定问题、分析问题、寻找和评价解决方法的过程展开讨论", "ok": true}, {"l": "C", "t": "通过点名的方式指定小组组员逐一发言，带动小组讨论的热烈氛围", "ok": false}, {"l": "D", "t": "围绕如何解决电动车上楼的议题，邀请组员用头脑风暴法提出建议", "ok": true}, {"l": "E", "t": "单刀直入地指出某位组员有带电动车上楼的问题，并分析主要原因", "ok": false}], "ex": "本题考查社区工作方法的相关知识。正确答案为ABD。A.如果组员出现观点冲突难以化解，则让组员通过投票来民主表达；B.按确定问题、分析问题、寻找和评价解决方法的过程展开讨论；D.围绕如何解决电动车上楼的议题，邀请组员用头脑风暴法提出建议"}, {"ch": "综合·Ch5", "yr": "2024", "tp": "多选", "q": "社会工作者小魏开设了“我专注，我成长”儿童注意力提升小组。小组中，每当有人发言时。小魏都会以 拍手的方式让其他组员保持安静。当某位组员说得太多时，小魏会适当打断，并让其他组员发表意见；当其 他人对某位组员的发言有疑问时，小魏会用通俗的语言进行解释。上述小魏的做法，体现出的促进组员沟通 的技巧有（ ）。", "ops": [{"l": "A", "t": "促进组员主动反馈", "ok": false}, {"l": "B", "t": "鼓励组员积极表达", "ok": true}, {"l": "C", "t": "提醒组员相互倾听", "ok": true}, {"l": "D", "t": "促进组员相互理解", "ok": true}, {"l": "E", "t": "引导组员模仿行为", "ok": false}], "ex": "小魏以拍手方式让其他组员保持安静，这是提醒组员相互倾听，对应C选项； 打断说得太多 的组员，让其他组员发表意见，这是鼓励组员积极表达，对应B选项； 用通俗语言解释疑问，帮助组员理解 ，体现促进组员相互理解，对应D选项。答案：BCD"}, {"ch": "综合·Ch6", "yr": "2024", "tp": "多选", "q": "社区工作者小云正在招募居民参与社区小花园建设。此时，小云适宜运用的接触拔巧有（", "ops": [{"l": "A", "t": "通过接触。让居民尽快地了解活动组织方的基本信息", "ok": true}, {"l": "B", "t": "清楚告知居民如何联系社区工作者以及如何参与花园建设", "ok": true}, {"l": "C", "t": "先和居民“唠家常”，多次接触后，再和居民谈花园建设", "ok": true}, {"l": "D", "t": "在与社区居民交流时，让居民尽快地了解谈话的目的", "ok": true}, {"l": "E", "t": "以居民关心的问题为切入点，问题解决后再进行广泛招募", "ok": false}], "ex": "本题考查社区工作方法的相关知识。正确答案为ABCD。A.通过接触。让居民尽快地了解活动组织方的基本信息；B.清楚告知居民如何联系社区工作者以及如何参与花园建设；C.先和居民“唠家常”，多次接触后，再和居民谈花园建设；D.在与社区居民交流时，让居民尽快地了解谈话的目的"}, {"ch": "综合·Ch6", "yr": "2024", "tp": "多选", "q": "社会工作者小王为某易地搬迁安置社区制作社区资源分析表，下列针对社区资源的分析中，属于物力资源 的有（ ）", "ops": [{"l": "A", "t": "社区党群服务中心不同楼层的功能区规划较为合理", "ok": true}, {"l": "B", "t": "社区有几位返乡大学生，曾经协助开展过社区活动", "ok": false}, {"l": "C", "t": "社区服务设施完备，无障碍坡道和扶手设置符合相关建设标准", "ok": true}, {"l": "D", "t": "社区内老年人和儿童较多，能够提供支持的中青年人相对较少", "ok": false}, {"l": "E", "t": "社区的活动经费有限，此前也没有向公益慈善组织申请过赞助", "ok": false}], "ex": "物力资源主要指社区中的各种物质设施。A选项党群服务中心不同楼层功能区规划属于物力资 源范畴；C选项社区服务设施及无障碍坡道等设置也属于物力资源。B选项返乡大学生属于人力资源；D选项中 关于不同年龄段人数情况属于社区人口结构方面，不属于物力资源；E选项活动经费属于财力资源。答案：AC"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "多选", "q": "某社会工作服务机构服务了多位家庭暴力受害者，协助他们摆脱了家庭暴力的阴影，成功开始了新的生活 。社会工作者老张对该项服务进行个案研究，下列做法中，正确的有（ ）。", "ops": [{"l": "A", "t": "运用访谈、查看服务记录等多种手段收集资料", "ok": true}, {"l": "B", "t": "全面了解服务过程以及服务对象的经历和感受", "ok": true}, {"l": "C", "t": "将研究的结果推论到其他的地区", "ok": false}, {"l": "D", "t": "建构反家暴的本土社会工作理论", "ok": true}, {"l": "E", "t": "发现影响服务有效性的主要因素", "ok": true}], "ex": "个案研究是对单个对象（如家庭、团体、机构、社区等）的某项特定行为或问题进行深入和 全面的研究。收集资料手段多样，A 正确；要全面了解服务过程和对象经历感受，B 正确；不能简单将结果 推论到其他地区，C 错误；通过对这一个案研究可尝试建构本土理论，D 正确；能发现影响服务有效性因素 ，E 正确。答案：ABDE"}, {"ch": "综合·Ch1", "yr": "2024", "tp": "多选", "q": "据《中共中央国务院关于加强基层治理体系和治理能力现代化建设的意见》，关于加强基层治理体系和治 理能力现代化建设指导思想的表述，正确的有（ ）", "ops": [{"l": "A", "t": "以增进人民群众的安全感为出发点和落脚点", "ok": false}, {"l": "B", "t": "以习近平新时代中国特色社会主义思想为指导", "ok": true}, {"l": "C", "t": "以加强基层党组织建设、增强基层党组织政治功能和组织力为关键", "ok": true}, {"l": "D", "t": "以加强基层政权建设和健全基层群众自治制度为重点", "ok": true}, {"l": "E", "t": "以改革创新和制度建设、能力建设为抓手", "ok": true}], "ex": "《中共中央国务院关于加强基层治理体系和治理能力现代化建设的意见》中，指导思想是以 习近平新时代中国特色社会主义思想为指导，以加强基层党组织建设、增强基层党组织政治功能和组织力为 关键，以加强基层政权建设和健全基层群众自治制度为重点，以改革创新和制度建设、能力建设为抓手 ，以 增进人民群众的获得感、幸福感、安全感为出发点和落脚点。A选项表述不准确。答案：BCDE 23"}, {"ch": "综合·Ch1", "yr": "2025", "tp": "单选", "q": "社会工作者老孔在社区举办“新手父母成长营”，帮助缺乏育儿经验的父母学习科学喂养知识，交流心得 ，舒缓压力，根据社会工作服务领域的划分，上述老孔的工作主要属于（ ）", "ops": [{"l": "A", "t": "社区社会工作", "ok": false}, {"l": "B", "t": "家庭社会工作", "ok": true}, {"l": "C", "t": "妇女社会工作", "ok": false}, {"l": "D", "t": "青少年社会工作", "ok": false}], "ex": "“新手父母成长营”聚焦于父母育儿相关，围绕家庭中的亲子关系、育儿知识传授等开展 ，核心是家庭层面的服务。答案：B。"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "单选", "q": "“促进发展”是社会工作服务对象层面的目标之一，下列服务中，最能体现“促进发展”的目标的是（ ）", "ops": [{"l": "A", "t": "友你友我：流动儿童的社交能力提升小组", "ok": true}, {"l": "B", "t": "有爱无碍：丧偶老人生活适应的个案辅导", "ok": false}, {"l": "C", "t": "护航计划：短视频成瘾，青少年的矫正服务", "ok": false}, {"l": "D", "t": "伴童成长：低保家庭儿童帮扶的个案咨询", "ok": false}], "ex": "“促进发展”强调挖掘服务对象的潜力，帮助其实现自身发展。A选项流动儿童社交能力提升 小组，旨在挖掘流动儿童潜力，帮助他们在社交方面发展；B选项针对丧偶老人是帮助其适应生活，重点在缓 解困境而非发展；C选项对短视频成瘾青少年矫正是解决问题，并非促进发展；D选项低保家庭儿童帮扶主要 是提供基本支持，发展性体现不突出。答案：A"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "单选", "q": "随着社会的发展，人们的需求产生新的变化，社会工作服务领域也在不断扩展，下列服务中，体现了这一 发展变化的是（ ）", "ops": [{"l": "A", "t": "为网约车驾驶员设置“暖心港湾”服务站点，以方便其中途休息", "ok": true}, {"l": "B", "t": "为残障人士家属开设“有你真好”互动小组以缓解其照护负担", "ok": false}, {"l": "C", "t": "为外来务工人员子女开展“相伴一夏”主题夏令营活动", "ok": false}, {"l": "D", "t": "为社区空巢老人提供“与你同行”志愿者结对帮扶服务", "ok": false}], "ex": "随着社会发展，新职业不断涌现，为网约车驾驶员设休息站点是针对新职业群体的服务，体 现了社会工作服务领域随人们需求变化而扩展，而B是针对残障人士家属、C针对外来务工人员子女、D针对空 巢老人，这些服务群体并非新出现。答案：A"}, {"ch": "综合·Ch1", "yr": "2025", "tp": "单选", "q": "社会工作者小李策划了一个“中途失聪者康复训练营”项目，招募了10名在青年阶段突然失去部分或全部 听力的人士参加，协助他们学习听力康复相关知识，学校助听器，人工耳蜗等辅助器具的使用方法，提供其 社交信心与技能。上述小李的服务，最能体现出的社会工作服务的功能是（ ）", "ops": [{"l": "A", "t": "促进社会和谐", "ok": false}, {"l": "B", "t": "恢复弱化能力", "ok": true}, {"l": "C", "t": "构建支持网络", "ok": false}, {"l": "D", "t": "维系社会联结", "ok": false}], "ex": "题干中社会工作者协助中途失聪者学习听力康复知识、辅助器具使用方法，提升社交信心与 技能，这些举措主要是帮助失聪者恢复因失聪而弱化的能力。答案选B。"}, {"ch": "综合·Ch4", "yr": "2025", "tp": "单选", "q": "服务对象：“孩子确诊孤独症后，我每天都为他的康复治疗奔波，担心他的未来，根本没时间照顾自己 ，我老公工作很忙，家里一切都靠我，我太累了，打不起精神，急了就会对孩子发脾气，我真的不知道该怎 么做才对。” 社会工作者：“您说了很多困扰，我能理解您的感受，如果今天只能先讨论其中一个，您希望我们从哪个开 始？” 上述社会工作者的回应，运用的技巧是（ ）", "ops": [{"l": "A", "t": "对质", "ok": false}, {"l": "B", "t": "建议", "ok": false}, {"l": "C", "t": "对焦", "ok": true}, {"l": "D", "t": "忠告", "ok": false}], "ex": "服务对象说了多个困扰，社会工作者引导其从其中一个开始讨论，聚焦于一个问题，这是对 焦技巧。对焦是指社会工作者将服务对象偏离的话题或者宽泛的讨论收窄，集中讨论的焦点。答案：C"}, {"ch": "综合·Ch6", "yr": "2025", "tp": "单选", "q": "社区工作者在制订社区工作计划的过程中，通过“头脑风暴”方法收集到多个行动策略，下一步需要对这 些策略进行评估。下列做法中，从可行性角度进行评估的是（ ）", "ops": [{"l": "A", "t": "考察各行动策略是否符合社区工作的目标", "ok": false}, {"l": "B", "t": "预测各行动策略实施的可能性及资源是否充足", "ok": true}, {"l": "C", "t": "调查社区居民对各个行动策略的接受程度", "ok": false}, {"l": "D", "t": "分析各行动策略是否吸收了居民们提出的意见", "ok": false}], "ex": "可行性评估主要关注策略能否实际开展，包括实施可能性和资源是否支撑。A选项关注是否符 合目标，属于目标相关性评估；C选项居民接受程度是可接受性评估；D选项分析是否吸收居民意见并非可行 性评估范畴。B选项预测实施可能性及资源是否充足，属于从可行性角度评估。答案：B"}, {"ch": "综合·Ch3", "yr": "2025", "tp": "单选", "q": "张大爷所在社区的志愿服务队，通过上门探访为社区特殊困难老人提供关心关爱 服务，深受老人们的好评，张大爷注意到，志愿者态度亲和，队员之间关系友善， 也想加入服务队，根据马斯洛的需要层次论，张大爷的需要属于（ ）。", "ops": [{"l": "A", "t": "归属与爱的需要", "ok": true}, {"l": "B", "t": "生理需要", "ok": false}, {"l": "C", "t": "安全需要", "ok": false}, {"l": "D", "t": "尊重的需要", "ok": false}], "ex": "张大爷看到志愿服务队队员之间关系友善，想加入其中，是渴望与他人建立情感联系，融入 群体，这符合归属与爱的需要，即一个人要求与其他人建立感情的联系或关系。答案：A"}, {"ch": "综合·Ch2", "yr": "2025", "tp": "单选", "q": "社会工作者小侯运用问卷调查方法开展社区慢性疾病管理的研究，下列内容中，属于问卷结构中指导语的 是（ ）。", "ops": [{"l": "A", "t": "请您在合适的答案号码上画圈或打勾", "ok": true}, {"l": "B", "t": "再次真诚地感谢您参与我们的研究", "ok": false}, {"l": "C", "t": "问卷大概需要10至15分钟来完成", "ok": false}, {"l": "D", "t": "我们承诺收集到的信息将被严格保密", "ok": false}], "ex": "指导语主要是用来指导被调查者填写问卷的说明，A选项“请您在合适的答案号码上画圈或打 勾”属于指导被调查者如何答题的指导语；B是结束语表达感谢；C说明问卷时长，并非指导填写；D强调保密 原则，也非指导填写。答案：A。"}, {"ch": "综合·Ch4", "yr": "2025", "tp": "单选", "q": "小学六年级学生小良在父母离异后，与父亲和祖父一起生活，父亲工作经常出差，对小良的教育方式简单 粗暴，小良具有多动倾向，经常扰乱课堂秩序，欺负同学，被同学戏称为“小霸王”，没人跟他玩，为此 ，班主任向社会工作者求助。在个案工作的预估和问题分析阶段，社会工作者从横向角度进行问题预估的是 （ ）。", "ops": [{"l": "A", "t": "小良自小没有形成良好的行为习惯", "ok": false}, {"l": "B", "t": "小良在学校里被同学疏远而缺少同伴支持", "ok": true}, {"l": "C", "t": "父母离婚后小良性格逐渐发生变化", "ok": false}, {"l": "D", "t": "小良因缺乏关爱导致行为问题越发严重", "ok": false}], "ex": "横向分析问题是关注服务对象问题形成的周围环境，涉及不同系统间的互动。选项B强调小良 在学校这一环境中被同学疏远，属于从横向角度分析其面临在学校与同学互动方面的问题。A选项侧重于小良 自身习惯，C选项聚焦父母离婚对小良性格的影响，D选项强调缺乏关爱与行为问题关系，都更倾向纵向角度 分析。答案：B"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "单选", "q": "社会工作者在助人过程中扮演多种角色，下列服务内容中，最能体现社会工作者 资源筹措者角色的是（ ）。", "ops": [{"l": "A", "t": "开展公益服务项目的预算管理及其成本控制", "ok": false}, {"l": "B", "t": "鼓励失智老人照护者建立自助互助支持小组", "ok": false}, {"l": "C", "t": "为家庭暴力受害者提供危机干预和安全庇护服务", "ok": false}, {"l": "D", "t": "为困境儿童及其家庭招募结对帮扶的邻里志愿者", "ok": true}], "ex": "资源筹措者角色是指社会工作者要联络政府部门、企事业单位、社会组织和广大社会成员 ，向他们筹集服务对象所需要的资源。D选项为困境儿童及其家庭招募结对帮扶的邻里志愿者，是在筹措人力 方面的资源。答案：D"}, {"ch": "综合·Ch1", "yr": "2025", "tp": "单选", "q": "社会工作者小张为精神障碍康复者提供社区康复服务，其项目团队中有医生、护士、职业康复师和社会工 作者等专业人士，根据社会服务机构的团队结构类型，该团队是（ ）", "ops": [{"l": "A", "t": "多功能型团队", "ok": true}, {"l": "B", "t": "单一功能型团队", "ok": false}, {"l": "C", "t": "问题解决型团队", "ok": false}, {"l": "D", "t": "自我管理型团队", "ok": false}], "ex": "题目中项目团队由医生、护士、职业康复师和社会工作者等不同专业人士组成，大家具有不 同专业技能，共同为精神障碍康复者提供社区康复服务，符合多功能型团队集合多种专业人员共同完成任务 的特点。答案：A"}, {"ch": "综合·Ch4", "yr": "2025", "tp": "单选", "q": "社会工作者老张对前来求助的患者家属说：“您能主动来找我，面对困难不逃避，积极寻找解决问题的办 法，真的不简单！”上述老张的回应，体现出该个案工作处于（ ）。", "ops": [{"l": "A", "t": "预估阶段", "ok": false}, {"l": "B", "t": "计划阶段", "ok": false}, {"l": "C", "t": "接案阶段", "ok": true}, {"l": "D", "t": "结案阶段", "ok": false}], "ex": "接案阶段，社会工作者要对服务对象的求助行为给予鼓励，增强其改变的信心。老张对家属 主动求助不逃避给予肯定，符合接案阶段特点。答案：C"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "单选", "q": "社会工作者小孟发现，农村留守儿童缺乏父母日常陪伴、监管和教育，面临一定 的意外伤害风险，尤其是暑假期间，因电器使用不当等导致的意外伤害事件时有发生。针对上述问题，小孟 最适宜的做法是（ ）。", "ops": [{"l": "A", "t": "联系留守儿童的父母为其开设正面管教小组", "ok": false}, {"l": "B", "t": "转介意外受伤留守儿童接受心理辅导和治疗", "ok": false}, {"l": "C", "t": "组织留守儿童参加安全防护主题夏令营", "ok": true}, {"l": "D", "t": "督促当地学员建立意外风险的评估体系", "ok": false}], "ex": "题目核心是农村留守儿童暑假面临意外伤害风险，需要预防此类风险。A选项针对父母，非直 接针对儿童意外伤害预防；B是事后处理，并非预防；D督促学校建立评估体系，对当下儿童面临的意外伤害 风险预防及时性和针对性不强。C组织留守儿童参加安全防护主题夏令营，能直接对留守儿童进行安全教育 ，预防意外伤害，最为适宜。答案：C"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "单选", "q": "装企业部分员工因产业转型需要转岗，为帮助他们顺利转岗，社会工作者小于准备开展小型服务、小于在 筛选参与者时，聚焦于那些需要转岗的员工。上述小于筛选小组组员的要件是（ ）", "ops": [{"l": "A", "t": "对某些问题的认识", "ok": false}, {"l": "B", "t": "共同或相似的问题", "ok": true}, {"l": "C", "t": "共同的兴趣和愿望", "ok": false}, {"l": "D", "t": "对参加小组的要求", "ok": false}], "ex": "选项A：对某些问题的认识强调的是组员对于特定问题在认知层面上的情况。而题干中主要聚 焦的是员工面临转岗这一实际状况，并非是对转岗相关问题的认识，所以该选项不符合题意。 选项B：题干中提到小于聚焦于那些需要转岗的员工，这表明这些员工都面临着产业转型需要转岗这一共同或 相似的问题。社会工作者开展小型服务，正是针对这些有共同问题的员工来帮助他们顺利转岗，所以该选项 符合题意。 选项C：共同的兴趣和愿望侧重于组员在兴趣爱好或者期望达成的目标方面的一致性。但题干中重点强调的是 员工因产业转型需要转岗这一现实问题，并非是共同的兴趣和愿望，所以该选项不符合题意。 选项D：对参加小组的要求通常是指参加小组需要满足的一些条件，比如年龄、性别、技能水平等方面的规定 。而题干中并没有提及与参加小组要求相关的内容，小于筛选组员主要是基于员工需要转岗这一情况，所以 该选项不符合题意。答案：B"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "单选", "q": "社会工作者为大学新生开设“开启新程”成长小组。在邀请组员讨论大学生活规划时，组员小赵和小丁发 生争执：小赵认为应当注重学业，增长知识。小丁则认为应当积极参与学生会和社团工作，锻炼实践能力。 面对此情景，社会工作者最适宜的做法是（ ）", "ops": [{"l": "A", "t": "打断小丁和小赵的争论，请组员小王分享大学生活规划", "ok": false}, {"l": "B", "t": "保持沉默，等待小丁和小赵自行停止争论", "ok": false}, {"l": "C", "t": "分享自己的经历，供小丁和小赵参考借鉴", "ok": false}, {"l": "D", "t": "引导小丁和小赵理解、接纳各自想法背后的价值观差异", "ok": true}], "ex": "小组中组员发生争执，社会工作者应秉持促进组员间相互理解、尊重差异、共同成长的原则 。选项A打断争论并转移话题，不利于解决当下冲突；选项B保持沉默可能使冲突升级，也未有效处理；选项 C分享自身经历并非直接处理组员间冲突的最佳方式。而选项D引导双方理解接纳对方想法背后价值观差异 ，有助于化解冲突，促进组员间良好互动和小组目标达成。答案：D"}, {"ch": "综合·Ch6", "yr": "2025", "tp": "单选", "q": "为加深对社区的了解，新入职的社区工作者小梅主动到社区广场，公园等公共场所，与跳广场舞、下棋、 健身和遛狗的居民话家常，小梅进入社区的方式是（ ）", "ops": [{"l": "A", "t": "主办社区活动", "ok": false}, {"l": "B", "t": "介入社区事务", "ok": false}, {"l": "C", "t": "积极参与社区节假日活动", "ok": false}, {"l": "D", "t": "经常出现在社区居民当中", "ok": true}], "ex": "小梅到公共场所与居民话家常，就是经常出现在居民当中来加深对社区了解。答案：D"}, {"ch": "综合·Ch4", "yr": "2025", "tp": "单选", "q": "社会工作者小王在某村实施儿童关爱服务项目时，了解到留守儿童小美平时缺少父母陪伴和管教、性格内 向、脾气暴躁，手腕上还有割伤，根据社会工作服务中伦理原则的决定顺序，小王应优先采取的行动是（ ）", "ops": [{"l": "A", "t": "联系学校老师加强小美的学业铺导", "ok": false}, {"l": "B", "t": "建议村委会建立留守儿童关爱中心", "ok": false}, {"l": "C", "t": "为小美向乡政府申请困境儿童补贴", "ok": false}, {"l": "D", "t": "评结小美自伤风险并采取干预措施", "ok": true}], "ex": "在社会工作伦理原则决定顺序中，保护生命原则高于其他原则。小美手腕有割伤，存在自伤 风险，保障其生命安全是首要任务。答案：D"}, {"ch": "综合·Ch6", "yr": "2025", "tp": "单选", "q": "社区工作者正在进行新入住居民的走访工作，以更好地了解居民的所思所想，帮助其尽快融入社区。在与 居民接触时，下列社区工作者的表述中，最符合”展开话题”技巧的是（ ）", "ops": [{"l": "A", "t": "“您最近睡眠怎么样？有遇到什么烦心事吗？", "ok": false}, {"l": "B", "t": "“您家里的花养得真好，您的秘诀是什么？\"", "ok": true}, {"l": "C", "t": "“您能不能跟我讲讲您人生中最自豪的事情？", "ok": false}, {"l": "D", "t": "“您家马上要吃饭了，您说说还有什么期待？”", "ok": false}], "ex": "展开话题技巧通常从轻松、日常且容易引起居民兴趣的点切入。B选项从居民家里养得好的花 说起，话题轻松自然，易拉近与居民距离展开交流。A选项问睡眠和烦心事相对沉重；C选项让讲人生最自豪 的事较正式且有难度；D选项在居民快吃饭时问期待较突兀。答案：B"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "单选", "q": "社会工作者小何正为乳腺癌患者开设支持小组，在组员分享环节，王阿姨滔滔不绝地讲述了自己确诊后的 心路历程，占用了大量时同，导致其他组员没机会发言，为此，小何说：“王阿姨的分享很有价值，我想大 家都有自己的故事，我们现在也听听其他人的经验吧!”上述小何的回应，运用的技巧是（ ）", "ops": [{"l": "A", "t": "中立", "ok": false}, {"l": "B", "t": "鼓励", "ok": false}, {"l": "C", "t": "澄清", "ok": false}, {"l": "D", "t": "限制", "ok": true}], "ex": "小何看到王阿姨发言占用大量时间，导致其他组员没机会发言，通过话语引导王阿姨停止发 言，让其他组员有机会分享，这是对王阿姨发言时间和内容的一种限制，目的是保证小组讨论能顺利进行 ，照顾到更多组员。答案：D.限制"}, {"ch": "综合·Ch6", "yr": "2025", "tp": "单选", "q": "某小区是无物业的老旧小区，楼道堆物问题一直是治理痛点，社区工作者老陈动员居民成立了一支志愿服 务队，组织开展“社区是我家，安全靠大家”系列宣传活动，协助居民及时清理楼道堆物，一段时间后，居 民邻里关系融洽，社区公共意识得到加强，堆物现象得到缓解。上述情形反映出社区对人类行为的影响是 （ ）", "ops": [{"l": "A", "t": "社区居民堆物的习惯是逐步养成的", "ok": false}, {"l": "B", "t": "社区居民间形成了复杂的社会交往关系", "ok": false}, {"l": "C", "t": "社区居民对社区的认同感促使他们清理楼道", "ok": true}, {"l": "D", "t": "社区自身的公共规范能够约束居民堆物行为", "ok": false}], "ex": "本题考查社区工作方法的相关知识。正确答案为C。C.社区居民对社区的认同感促使他们清理楼道"}, {"ch": "综合·Ch6", "yr": "2025", "tp": "单选", "q": "社会工作者老范正在与社区矫正对象小钱进行初次会谈，面对低头不语、不断搓手的小钱，老范主动伸出 手，并轻声说：“您好，我是社区工作者老范，可以跟您握个手吗？”小钱迟疑片刻，伸手握住老范的手。 老范继续说“您不用紧张，我不介意您过往经历，我们就轻松地聊聊天，好吗？”上述老范的言行，最能反 映出社会工作者服务专业价值观是（ ）", "ops": [{"l": "A", "t": "践行社会公正", "ok": false}, {"l": "B", "t": "强调服务对象个人的尊严和价值", "ok": true}, {"l": "C", "t": "相信人有独特性", "ok": false}, {"l": "D", "t": "注重能力培养和学习", "ok": false}], "ex": "老范主动伸手、让小钱别紧张且不介意其过往经历，体现对小钱尊严的维护以及对其价值的 认可。答案：B 。"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "单选", "q": "初中生小强因与父母吵架离家出走，社会工作者小马为其提供个案服务，在服务中，小马引导小强讲述与 父母冲突的起因以及对家庭的感受，并给予足够的空间和时间表达自己的委屈不满，依旧心理社会治疗模式 ，上述小马的做法，运用的治疗技巧是（ ）", "ops": [{"l": "A", "t": "支持", "ok": false}, {"l": "B", "t": "直接影响", "ok": false}, {"l": "C", "t": "探索-描述-宣泄", "ok": true}, {"l": "D", "t": "心理动力反思", "ok": false}], "ex": "探索 - 描述 - 宣泄技巧是指社会工作者通过让服务对象解释和描述自己困扰产生的原因和 发展过程，为服务对象提供必要的情绪宣泄机会，以减轻服务对象内心的冲突。题目中小马引导小强讲述冲 突起因、对家庭感受，给予空间时间表达委屈不满，符合这一技巧。答案：C。"}, {"ch": "综合·Ch6", "yr": "2025", "tp": "单选", "q": "社区工作者小付在社区组织了一批志愿者，定期前往养老院开展服务，下列志愿者参与社会服务的动机中 ，属于“以利他和社会为中心的动机”的是（ ）", "ops": [{"l": "A", "t": "希望帮助他人，希望世界更美好", "ok": true}, {"l": "B", "t": "现在帮助别人，将来“善有善报”", "ok": false}, {"l": "C", "t": "有机会体验新的生活方式", "ok": false}, {"l": "D", "t": "能表现和证明自己的成就", "ok": false}], "ex": "“以利他和社会为中心的动机”重点在于纯粹为他人、为社会着想。A选项希望帮助他人、希 望世界更美好，体现了这种利他和以社会为导向；B选项“善有善报”是为自己考虑，属于利己动机；C选项 体验新生活方式是从自身感受出发，非为他人和社会；D选项证明自己成就也是聚焦自身，不是以利他和社会 为中心。答案：A"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "单选", "q": "社会工作者小林运用小组发展模式，为即将升入高三的学生开设“点亮未来”减压小组，下列活动中，最 符合“积极参与”实施原则的是（ ）", "ops": [{"l": "A", "t": "在压力分享中，要求组员相互理解，形成平等的关系", "ok": false}, {"l": "B", "t": "通过高考“ABC”问答环节帮助组员更全面认识高考", "ok": false}, {"l": "C", "t": "通过训练提升组员自我放松和运用资源的能力", "ok": false}, {"l": "D", "t": "鼓励组员就压力应对议题主动表达自己的困惑", "ok": true}], "ex": "“积极参与”实施原则强调鼓励组员主动表达和参与。A选项重点在关系建立；B选项是知识 传授；C选项是能力训练；D选项鼓励组员主动表达困惑，符合“积极参与”原则，让组员主动投入到小组讨 论应对压力的过程中。答案：D"}, {"ch": "综合·Ch4", "yr": "2025", "tp": "单选", "q": "45岁的老蒋平时工作繁忙，对女儿关心不够，近期女儿成绩下滑，不想上学。为此他深感焦虑。脾气变得 暴躁，他不知道如何帮助女儿提升成绩，也不知道怎么与她沟通，老蒋向社会工作者老陶求助，下列老陶的 做法中，体现出教育者角色的是（ ）", "ops": [{"l": "A", "t": "运用放松练习的技巧帮助老蒋缓解焦虑情绪，使其保持良好的心态", "ok": false}, {"l": "B", "t": "挖掘老蒋自身辅导女儿学习的经验，充分有效的激发他的潜在能力", "ok": false}, {"l": "C", "t": "辅导老蒋学习观察女儿情绪变化的有效方法，改变固有的沟通模式", "ok": true}, {"l": "D", "t": "协助老蒋与拥有初中数学资源的机构建立关系，使其获得适当服务", "ok": false}], "ex": "教育者角色强调教导服务对象知识或技能。A项是缓解情绪，非教育；B项挖掘经验不属于教 导；D项协助建立关系也非教育。C项辅导老蒋学习观察女儿情绪及改变沟通模式，属于教导其知识技能，体 现教育者角色。答案：C"}, {"ch": "综合·Ch6", "yr": "2025", "tp": "单选", "q": "暑假期间，社区工作者小吴面向社区儿童招募“儿童观察员”，让儿童用自己的视角认识社区，参与社区 事务，形成社区归属感，协力小吴带领儿童开展的活动中，以分析社区人力资源为目的的是（ ）", "ops": [{"l": "A", "t": "提供儿童分组讨论“垃圾分类是依靠严格管理还是个人自爱”", "ok": false}, {"l": "B", "t": "带领儿童成立社区议事团，讨论团长候选人应该具备的能力", "ok": true}, {"l": "C", "t": "指导儿童书写“福”字，送给社区高龄独居老人和困难群众", "ok": false}, {"l": "D", "t": "指导儿童学习环境保护知识，直接承担垃圾分类等家务劳动", "ok": false}], "ex": "分析社区人力资源，关键在于关注与社区中人员相关的能力、角色等内容。 A选项讨论的是 垃圾分类的方式，与人力资源无关。 B选项带领儿童成立社区议事团并讨论团长候选人应具备的能力，涉及 到对社区中参与议事人员能力的探讨，属于对社区人力资源的分析。 C选项给老人送“福”字，重点在关爱 老人活动，不是分析人力资源。 D选项儿童学习环保知识做家务，主要是儿童自身环保行为培养，与社区人 力资源分析无关。答案：B"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "单选", "q": "社会工作者小钱在走访时发现，有的困难儿童面临生理、心理。社会等方面的问题，为此，小钱计划开设 “向阳而生”支持小组，小钱除了检索相关文献，查阅机构类似的服务记录，还通过家访和电话访问的形式 ，了解组员的参与意愿、动机及能力，小钱的做法属于小组评估工作方法中的（ ）", "ops": [{"l": "A", "t": "小组需求评估", "ok": true}, {"l": "B", "t": "小组计划评估", "ok": false}, {"l": "C", "t": "小组过程评估", "ok": false}, {"l": "D", "t": "小组效果评估", "ok": false}], "ex": "小钱通过多种方式了解困
