<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{background:var(--bg)!important;color:var(--tx);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px;-webkit-tap-highlight-color:transparent;transition:background .3s}

.hd h1{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:2px}

<script>
const EX=[{"ch": "综合·Ch4", "yr": "2021", "tp": "单选", "q": "发展社会工作越来越得到党和政府的重视。《中共中央关于制定国民经济和社会发展第十四个五年规划和 二零三五年远景目标的建议》指出，要畅通和规范社会工作者参与社会治理的途径。下列说法中，最能反映 “畅通途径”要求的是（ ）。", "ops": [{"l": "A", "t": "发展社会工作服务机构，加大政府购买服务力度", "ok": true}, {"l": "B", "t": "吸收社会工作者参与解决社会救助中的重要问题", "ok": false}, {"l": "C", "t": "组织政府工作人员，普遍参加社会工作专业培训", "ok": false}, {"l": "D", "t": "制定优惠政策吸引社会工作专业学生到基层工作", "ok": false}], "ex": "“畅通途径”重点在于为社会工作者参与社会治理创造条件、提供渠道。A选项发展服务机构 及加大购买服务力度，能让社会工作者有更多平台和资源参与社会治理，为畅通途径提供保障；B选项只是让 社工参与解决特定社会救助问题，相对局限，不是从整体畅通途径角度；C选项政府工作人员参加培训与畅通 社工参与途径无关；D选项吸引学生到基层工作，未直接体现畅通现有社工参与社会治理途径。答案：A"}, {"ch": "综合·Ch1", "yr": "2021", "tp": "单选", "q": "帮助有困难、有需要的人是社会工作最基本的职业特征，社会工作者秉持“助人自助”的理念开展工作。 关于社会工作“助人自助”的说法，正确的是（ ）。", "ops": [{"l": "A", "t": "“有困难，找社工”的说法较为充分地体现了助人自助的意涵", "ok": false}, {"l": "B", "t": "在助人自助中，第一个“助”与第二个“助”具有相同的含义", "ok": false}, {"l": "C", "t": "助人自助表示社会工作者对服务对象问题的解决负有首要责任", "ok": false}, {"l": "D", "t": "助人自助表示社会工作者对服务对象实现自助后可终止服务", "ok": true}], "ex": "“助人自助”强调不仅帮助服务对象解决困难，更重要的是提升其自我解决问题和发展的能 力。A选项“有困难，找社工”只体现了寻求帮助，未体现服务对象自助；B选项两个“助”含义不同，第一 个是社工帮助服务对象，第二个是服务对象自我帮助；C选项服务对象才对自身问题解决负首要责任；D选项 当服务对象能实现自助，意味着其具备解决问题能力，此时社工可终止服务，符合“助人自助”理念。 答案 ：D"}, {"ch": "综合·Ch1", "yr": "2021", "tp": "单选", "q": "医务社会工作者小张为脑卒中患者提供服务，下列做法中，最能体现社会工作“互动合作”特点的是（ ）。", "ops": [{"l": "A", "t": "与医院其他部门协作，联合为患者提供关怀支持", "ok": false}, {"l": "B", "t": "针对患者家属进行心理压力疏导，提升照护技能", "ok": false}, {"l": "C", "t": "链接资源帮助患者及其家庭申请医疗救助", "ok": false}, {"l": "D", "t": "与患者及其家属一起开展慢性病管理工作", "ok": true}], "ex": "“互动合作”强调社会工作者与服务对象共同行动。A项侧重与医院其他部门协作；B项主要 针对家属开展工作；C项重点在链接资源申请救助；只有D项是与患者及其家属一起开展工作，体现了互动合 作。答案：D"}, {"ch": "综合·Ch1", "yr": "2021", "tp": "单选", "q": "在新建社区中，社会工作者组织多种社区活动，建立社区互助平台，梳理并链接社区内外资源，上述社会 工作者的做法，主要体现的社会工作功能是（ ）。", "ops": [{"l": "A", "t": "建构社会资本", "ok": true}, {"l": "B", "t": "解决社会问题", "ok": false}, {"l": "C", "t": "推动社会进步", "ok": false}, {"l": "D", "t": "维持社会秩序", "ok": false}], "ex": "社会工作者组织社区活动、建立互助平台、链接资源等做法，有利于促进社区居民间的互动 与合作，构建起彼此关联与信任的关系网络，这与建构社会资本相契合，社会资本强调通过人际互动形成的 关系网络和信任等资源。答案：A"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "单选", "q": "大三学生小勤在一次重要考试中失误，未能如愿获得理想的结果。她不能原谅自己，无法走出考试失误的 阴影，对自己丧失了信心。社会工作者大林对小勤的情况进行全面客观评估后，鼓励小勤加入听障儿童志愿 服务队，经过几次开导，小勤加入了志愿服务队，并逐渐成为骨干。在为孩子们提供服务的同时，又重拾信 心。社会工作者大林在上述服务中扮演的直接服务角色是（ ）。", "ops": [{"l": "A", "t": "关系协调者", "ok": false}, {"l": "B", "t": "治疗者", "ok": true}, {"l": "C", "t": "资源筹集者", "ok": false}, {"l": "D", "t": "支持者", "ok": false}], "ex": "本题考查个案工作方法的相关知识。正确答案为B。B.治疗者"}, {"ch": "综合·Ch1", "yr": "2021", "tp": "单选", "q": "社会工作者小李的工作内容是为接受社区矫正的青少年提供心理疏导、职业技术培训、联系企业安排实习 岗位等服务。协助服务对象恢复社会功能，以达到预防再次犯罪，稳定社会秩序的目标。小李的服务领域主 要是（ ）。", "ops": [{"l": "A", "t": "司法社会工作", "ok": true}, {"l": "B", "t": "社会救助社会工作", "ok": false}, {"l": "C", "t": "学校社会工作", "ok": false}, {"l": "D", "t": "企业社会工作", "ok": false}], "ex": "题干中提到小李为接受社区矫正的青少年服务，而社区矫正属于司法领域的工作内容。所以 小李的服务领域是司法社会工作。答案：A"}, {"ch": "综合·Ch1", "yr": "2021", "tp": "单选", "q": "某地连续多日暴雨，致使河水上涨，房屋被淹。当地居民被迫紧急转移到地势较高的闲置库房。因所带生 活物品不足，居民产生焦虑。某社会工作服务机构及时介入，协助政府开展社会救助工作。此时社会工作者 首先要做的工作是（ ）。", "ops": [{"l": "A", "t": "向居民发放问卷了解其需求", "ok": false}, {"l": "B", "t": "向居民提供政策咨询服务", "ok": false}, {"l": "C", "t": "向居民发放食品衣物等物资", "ok": true}, {"l": "D", "t": "向居民提供社会融入服务", "ok": false}], "ex": "居民因生活物品不足产生焦虑，此时最迫切的是解决生活物资问题。选项C发放食品衣物等物 资能直接满足居民当下基本生活需求，是首要工作。而A了解需求、B政策咨询、D社会融入服务并非当下最急 需解决的。答案：C"}, {"ch": "综合·Ch2", "yr": "2021", "tp": "单选", "q": "社会工作者在服务过程中秉持“个别关怀，全面服务”的原则。这说明（ ）。", "ops": [{"l": "A", "t": "社会工作者认为每一位服务对象都是独特的", "ok": true}, {"l": "B", "t": "社会工作者相信每一位服务对象都可以改变", "ok": false}, {"l": "C", "t": "社会工作者尊重每一位服务对象的自我决定", "ok": false}, {"l": "D", "t": "社会工作者接纳每一位服务对象的负面情绪", "ok": false}], "ex": "“个别关怀”强调关注每个服务对象的独特之处，“全面服务”也是基于个体差异展开全面 帮助，体现对个体独特性的重视。A选项符合这一原则内涵。答案：A"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "单选", "q": "30岁的小周与父亲一起生活，母亲处于抑郁症缓解期，平日与人接触较少。因缺乏个人技能，缺少自信 ，小周不愿意找工作，父亲也认为他不能独立生活。根据社会工作价值观的实践原则，社会工作者适宜的做 法是（ ）。", "ops": [{"l": "A", "t": "尊重小周的意愿，认同他对生活方式的选择", "ok": false}, {"l": "B", "t": "保护小周的隐私，帮助他尽量不被外界打扰", "ok": false}, {"l": "C", "t": "尊重小周的决定，协助他寻找提升能力的资源", "ok": true}, {"l": "D", "t": "批评小周的想法，建议他多与父亲及朋友交流", "ok": false}], "ex": "社会工作价值观实践原则强调尊重服务对象自决，同时要帮助服务对象提升能力。小周不愿 找工作，工作者应尊重其决定，且协助他寻找提升能力资源，以更好适应生活。A选项只认同选择未助力提升 能力；B选项与题干核心问题关联不大；D选项批评不符合价值观。答案：C"}, {"ch": "综合·Ch2", "yr": "2021", "tp": "单选", "q": "社会工作是社会福利事业的重要组成部分，在工作中注重多个层面关系的建立和协同，通过人性化的、有 效的社会行政与管理，落实社会政策，改善民众的社会福祉。这反映出我国社会工作专业实践的价值观是 （ ）。", "ops": [{"l": "A", "t": "个人发展机遇与国家社会发展相结合", "ok": false}, {"l": "B", "t": "注重和谐有序，促进社会的共融发展", "ok": true}, {"l": "C", "t": "平等待人，注重民主参与", "ok": false}, {"l": "D", "t": "权力与责任并重", "ok": false}], "ex": "题干强调社会工作注重多个层面关系建立与协同，落实政策改善民众福祉，体现了注重和谐 有序，推动社会各方面共融发展。A选项题干未提及个人发展机遇与国家社会发展结合；C选项平等待人、民 主参与在题干中无体现；D选项权力与责任并重也未在题干呈现。答案：B"}, {"ch": "综合·Ch6", "yr": "2021", "tp": "单选", "q": "某街道困难群众救助中心的常规服务之一是定期电话访问服务对象。社会工作者小陈致电社会低保人员大 强，询问其近期生活状况，被他拒绝。大强表示不清楚街道有电话访问服务，也不愿接受陌生人的访问。根 据社会工作者对服务对象的伦理责任，此时小陈最恰当的做法是（ ）。", "ops": [{"l": "A", "t": "尊重大强的个人意愿，日后不再打电话向他询问生活状况", "ok": false}, {"l": "B", "t": "对服务内容的真实性做出说明，并承诺帮助大强解决困难", "ok": false}, {"l": "C", "t": "恳请当地社会工作者告知大强此项服务后，再次访问大强", "ok": false}, {"l": "D", "t": "向社会工作者反映大强拒访情况，请社区工作者代为访问", "ok": true}], "ex": "本题考查社区工作方法的相关知识。正确答案为D。D.向社会工作者反映大强拒访情况，请社区工作者代为访问"}, {"ch": "综合·Ch2", "yr": "2021", "tp": "单选", "q": "社会工作者在提供专业服务时，应不断规范自己的行为，践行价值体系和服务承诺，这体现了社会工作者 （ ）。", "ops": [{"l": "A", "t": "对服务对象的伦理责任", "ok": false}, {"l": "B", "t": "对专业的伦理责任", "ok": true}, {"l": "C", "t": "C，对服务机构的伦理责任", "ok": false}, {"l": "D", "t": "对社会的伦理责任", "ok": false}], "ex": "规范自身行为、践行价值体系和服务承诺，重点在于对社会工作这一专业，体现对专业的责 任，确保专业服务的规范性与专业性。答案：B"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "单选", "q": "社会工作者小李经多方链接资源，推动项目顺利完成，在同事中树立了自己的威信，也让机构负责人和项 目落地社区的领导更加信任他，根据马斯洛需求层次理论，上述情形满足了小李（ ）。", "ops": [{"l": "A", "t": "尊重的需要", "ok": false}, {"l": "B", "t": "归属与爱的需要", "ok": false}, {"l": "C", "t": "安全的需要", "ok": false}, {"l": "D", "t": "自我实现的需要", "ok": true}], "ex": "本题考查个案工作方法的相关知识。正确答案为D。D.自我实现的需要"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "单选", "q": "小伟父母彼此尊重，经常沟通孩子的教育问题，对于是否报兴趣班也会征求小伟的意见。他们鼓励小伟主 动找同学玩耍，也嘱咐小伟要按时回家。小伟父母的教养模式属于（ ）。", "ops": [{"l": "A", "t": "骄纵型", "ok": false}, {"l": "B", "t": "支配型", "ok": false}, {"l": "C", "t": "放任型", "ok": false}, {"l": "D", "t": "民主型", "ok": true}], "ex": "题干中父母彼此尊重、沟通教育问题还征求孩子意见，同时对孩子有鼓励也有适当嘱咐，既 尊重孩子又有适当引导和要求，符合民主型教养模式特点。答案：D"}, {"ch": "综合·Ch3", "yr": "2021", "tp": "单选", "q": "某社区内有一个青少年音乐社团，成员的服装、发型、饰品、言行均与其他同龄人明显不同，社区一些居 民见到他们感到很新奇。上述情况体现出同辈群体的特点是", "ops": [{"l": "A", "t": "支配性", "ok": false}, {"l": "B", "t": "独特性", "ok": true}, {"l": "C", "t": "开放性", "ok": false}, {"l": "D", "t": "平等性", "ok": false}], "ex": "题干中强调音乐社团成员在服装、发型等方面与其他同龄人明显不同，突出了他们独特的风 格，这体现的是同辈群体的独特性。答案：B。"}, {"ch": "综合·Ch3", "yr": "2021", "tp": "单选", "q": "小明学习成绩优异，在考试中经常获得第一名，但小明妈妈看邻居的孩子都报了培训班，于是也给小明报 了很多培训班，结果让自己和小明都很疲惫。从上述情况分析，影响小明妈妈决定的社会环境是（ ）。", "ops": [{"l": "A", "t": "社区", "ok": true}, {"l": "B", "t": "学校", "ok": false}, {"l": "C", "t": "工作单位", "ok": false}, {"l": "D", "t": "大众传媒", "ok": false}], "ex": "小明妈妈是看到邻居孩子报培训班，邻居属于社区范畴内的群体，其行为影响了小明妈妈的 决定。答案：A"}, {"ch": "综合·Ch3", "yr": "2021", "tp": "单选", "q": "青少年阶段是人生发展的重要阶段之一，下列特征中，属于青少年发展阶段的是（ ）。", "ops": [{"l": "A", "t": "开始发展符合实际的自我观念", "ok": false}, {"l": "B", "t": "人生观会更加稳定和成熟", "ok": false}, {"l": "C", "t": "能够熟练地处理各种社会关系", "ok": false}, {"l": "D", "t": "情绪发展比较丰富和强烈", "ok": true}], "ex": "青少年阶段生理、心理和社会性发展变化迅猛。情绪发展丰富强烈，有两极性特点。A选项开 始发展符合实际自我观念一般更早；B选项人生观更加稳定成熟多在青年后期及以后；C选项熟练处理各种社 会关系对青少年较难，多在成年阶段更突出。答案选D 。"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "单选", "q": "张奶奶两年前来省城帮儿子带小孩。最近张奶奶的儿子发现她精神状态变得不太好，经常抱怨待在这没意 思，因一点小事就大发脾气，为此，张奶奶的儿子向社会工作者小王求助。为了解决张奶奶的问题，从“人 在情境中”的观点看，小王最适宜的做法是（ ）。", "ops": [{"l": "A", "t": "与张奶奶一起回顾过往生活经历", "ok": false}, {"l": "B", "t": "帮助张奶奶适应大城市生活节奏", "ok": false}, {"l": "C", "t": "鼓励张奶奶参加社区娱乐活动", "ok": true}, {"l": "D", "t": "协助张奶奶学习新的生活技能", "ok": false}], "ex": "“人在情境中”强调把服务对象放在一定社会环境中去认识。张奶奶精神状态不好，抱怨没 意思、爱发脾气，主要是因为从老家到省城的环境变化不适应。解决问题需让她融入当前省城生活环境。选 项C鼓励张奶奶参加社区娱乐活动，可帮助她融入社区环境，缓解不良情绪。答案：C"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "单选", "q": "小徐今年35岁，有吸毒史。强制隔离戒毒后一直与父母生活在一起。目前小徐已戒断毒瘾5年多。期间多 次尝试寻找工作，但由于就业技能不足，均以失败告终。社会工作者小齐了解情况后，准备链接一些资源帮 助小徐就业。从链接正式资源的角度，小方适宜的做法是（ ）。", "ops": [{"l": "A", "t": "争取父母关心，给予鼓励支持", "ok": false}, {"l": "B", "t": "积极联系朋友，拓展同伴资源", "ok": false}, {"l": "C", "t": "寻找相关机构，提供指导服务", "ok": true}, {"l": "D", "t": "发动邻里捐款，提供经济援助", "ok": false}], "ex": "正式资源一般是指由政府机构、社会组织等正式组织提供的资源。A选项父母、B选项朋友、 D选项邻里都属于非正式资源，只有C选项相关机构属于正式资源。答案：C。"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "单选", "q": "大学生小宋因经常通宵玩游戏，屡屡旷课，考试不及格，班主任将其介绍给社会工作者小陈。在个案会谈 时，小宋反复强调自己深感后悔和自责，觉得对不起父母，可又管不住自己。小陈发现小宋时常言行不一 ，寻找借口。于是，他对小宋说:“你每次都说想改变，要好好学习，可是我没有看到你的实际行动，像这样 只有想法，一直找理由不行动，你的成绩会变好吗？”此时，小陈运用的会谈技巧是（ ）。", "ops": [{"l": "A", "t": "对焦", "ok": false}, {"l": "B", "t": "澄清", "ok": false}, {"l": "C", "t": "忠告", "ok": false}, {"l": "D", "t": "对质", "ok": true}], "ex": "对质是指社会工作者通过直接提问等方式让服务对象面对自己在行为、情感和认识等方面不 一致的地方。题干中小陈指出小宋言行不一，只有想法不行动，这是让小宋面对自身行为与言语的矛盾，属 于对质技巧。答案：D。"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "单选", "q": "小花是一位8岁的白血病患儿，入院后，她不适应医院的陌生环境，对于治疗有恐惧和抵触心理，变得沉 默寡言。为此，病房的护士将小花转介给医务社会工作者小乔，接案后，小乔采用游戏方式引导小花说出入 院后的感受，并运用儿童医疗恐惧表了解其害怕程度。上述服务过程中，小乔收集资料的方式是（ ）。", "ops": [{"l": "A", "t": "自我陈述和非结构式调查表", "ok": false}, {"l": "B", "t": "自我陈述和结构式调查表", "ok": true}, {"l": "C", "t": "对答方式和非结构式调查表", "ok": false}, {"l": "D", "t": "对答方式和结构式调查表", "ok": false}], "ex": "小乔采用游戏方式引导小花说出感受，这属于让小花自我陈述来收集资料；运用儿童医疗恐 惧表，该表是有固定结构的，属于结构式调查表。答案：B"}, {"ch": "综合·Ch5", "yr": "2021", "tp": "单选", "q": "某医院的社会工作者小王在调研乳腺癌患者需求时发现，很多患者存在焦虑情绪，并对自我产生怀疑，此 外还缺乏医疗常识，经常会胡思乱想。为此，小王决定开设乳腺癌病友小组，帮助组员了解自身问题及其背 后的社会原因，协助组员管理情绪和改变认知。该小组的类型是（ ）。", "ops": [{"l": "A", "t": "教育小组", "ok": false}, {"l": "B", "t": "成长小组", "ok": false}, {"l": "C", "t": "治疗小组", "ok": true}, {"l": "D", "t": "支持小组", "ok": false}], "ex": "题干中提到帮助组员了解自身问题及其背后社会原因，协助管理情绪和改变认知，重点在于 解决患者心理和认知层面的问题，这符合治疗小组通过专业治疗帮助成员改变行为、态度和认知等特点。教 育小组侧重知识传授，成长小组聚焦个人成长发展，支持小组主要是提供情感支持。答案：C.治疗小组"}, {"ch": "综合·Ch5", "yr": "2021", "tp": "单选", "q": "社会工作者小魏计划为社区中刚退休的居民开展一个主题为“金色年华”的小组，协助他们较好地度过退 休生活适应期，促进退休人员继续社会化，提升其社会功能，小魏最有可能运用的小组工作模式是（ ）。", "ops": [{"l": "A", "t": "治疗模式", "ok": false}, {"l": "B", "t": "社会目标模式", "ok": false}, {"l": "C", "t": "互动模式", "ok": false}, {"l": "D", "t": "发展模式", "ok": true}], "ex": "发展模式强调以人的发展为核心，关注人的社会功能提升，帮助组员通过互动、学习等方式 实现自我发展。本题中帮助退休居民度过适应期、促进继续社会化、提升社会功能，符合发展模式特点。社 会目标模式强调培养公民的社会责任感等；治疗模式针对有问题的个体；互动模式强调组员间互动和相互影 响，但重点不在人的发展提升上。答案：D"}, {"ch": "综合·Ch5", "yr": "2021", "tp": "单选", "q": "社会工作者小戴为酗酒成瘾者开设了一个戒除酒瘾的匿名小组。在制订小组计划时，小戴围绕戒除酒瘾的 总目标。确定了阶段性目标，下列目标设置中，属于阶段性目标的是（ ）。", "ops": [{"l": "A", "t": "降低组员的饮酒频率", "ok": true}, {"l": "B", "t": "协助组员面对人格缺陷", "ok": false}, {"l": "C", "t": "改善组员的人际沟通", "ok": false}, {"l": "D", "t": "协助组员参与志愿服务", "ok": false}], "ex": "阶段性目标应与戒除酒瘾这一总目标紧密相关，且对戒除酒瘾有直接推动作用。A选项降低组 员饮酒频率，直接针对酒瘾问题，是戒除酒瘾过程中的重要阶段成果；B选项面对人格缺陷、C选项改善人际 沟通、D选项参与志愿服务虽对组员有积极意义，但并非直接与戒除酒瘾相关的阶段性目标。答案：A"}, {"ch": "综合·Ch5", "yr": "2021", "tp": "单选", "q": "社会工作者小何为社区内的单亲妈妈开展了主题为“瑰丽人生”的小组。在第1节小组活动中，小何带领 组员共同制定了小组规范，下列内容中，属于文化规范的是（ ）", "ops": [{"l": "A", "t": "要求组员保证出勤率、不迟到、不早退", "ok": false}, {"l": "B", "t": "发表观点时，不议论与小组无关的内容", "ok": false}, {"l": "C", "t": "每次小组开始前，将手机调至震动或静音状态", "ok": false}, {"l": "D", "t": "相互尊重，对于组员的差异采取非评判的态度", "ok": true}], "ex": "文化规范强调的是小组营造的价值观、态度方面的规范。A选项是关于出勤的纪律规范；B选 项是针对讨论内容的纪律规范；C选项是手机使用的纪律规范；D选项相互尊重、非评判态度属于价值观层面 ，是文化规范。答案：D"}, {"ch": "综合·Ch5", "yr": "2021", "tp": "单选", "q": "社会工作者小吴面向失智老人照顾者开设了一个6节的小组，在第3节小组活动中，组员小华和小郑在分享 照顾失智老人经验时发生争执，双方都认为自己的照顾方法是最好的。针对小组这一阶段的特点，小吴恰当 的做法是（ ）", "ops": [{"l": "A", "t": "了解小华和小郑各自对失智老人照顾者小组的期望和目标", "ok": false}, {"l": "B", "t": "帮助小华和小郑把小组中学到的照顾技巧转变为实际行动", "ok": false}, {"l": "C", "t": "帮助小华和小郑理解照顾失智老人经验背后的价值观差异", "ok": true}, {"l": "D", "t": "帮助小华和小郑寻求重要他人支持以维持在小组中的改变", "ok": false}], "ex": "小组中期转折阶段组员之间会出现冲突。小华和小郑争执，此时社会工作者应协调冲突，帮 助他们理解经验背后价值观差异，促进相互理解。答案：C"}, {"ch": "综合·Ch5", "yr": "2021", "tp": "单选", "q": "社会工作者小石面向住院肠癌患者开展了病友支持小组。目前小组进入尾声，组员即将离开小组，个别组 员产生失落感，希望小组能够继续，下列小组活动中，适合在这一阶段开展的是（ ）", "ops": [{"l": "A", "t": "认识你：进行自我介绍", "ok": false}, {"l": "B", "t": "契约权：制定小组契约", "ok": false}, {"l": "C", "t": "空椅子：对话内心深处", "ok": false}, {"l": "D", "t": "向前看：模拟出院生活", "ok": true}], "ex": "小组进入尾声，要处理组员的离别情绪并做好组员回归社会的准备。A选项自我介绍适合小组 开始阶段；B选项制定小组契约也是在小组初期；C选项“空椅子”一般用于处理情绪等，但此时重点应是协 助组员面对离别和回归生活；D选项模拟出院生活，既帮助组员面对即将离开小组的现实，又为回归正常生活 做准备，符合这一阶段需求。答案：D"}, {"ch": "综合·Ch5", "yr": "2021", "tp": "单选", "q": "社会工作者小崔计划运用小组工作方法为大学新生提供一系列服务，下列针对大学新生开展的小组中，最 能体现成长小组特点的是（ ）", "ops": [{"l": "A", "t": "社交技能训练”小组", "ok": false}, {"l": "B", "t": "“心理知识科普”小组", "ok": false}, {"l": "C", "t": "“自我管理”小组", "ok": true}, {"l": "D", "t": "“守望相助”小组", "ok": false}], "ex": "成长小组的焦点在于个人的成长和正向改变。“自我管理”小组强调成员在自我提升、成长 方面的发展，相比其他选项更符合成长小组特点。答案选C。"}, {"ch": "综合·Ch5", "yr": "2021", "tp": "单选", "q": "在一个情感探索小组中，社会工作者小何发现组员小李每次都想发言。当轮到其发言时，他又常说：“我 再想想吧。”当这种情况第3次出现时，小何说：“您可以想到哪儿说到哪儿，如果后面又有新的想法，可以 下一次补充。”小何的回应，采用的技巧是（ ）。", "ops": [{"l": "A", "t": "中立", "ok": false}, {"l": "B", "t": "鼓励", "ok": true}, {"l": "C", "t": "引导", "ok": false}, {"l": "D", "t": "澄清", "ok": false}], "ex": "小何鼓励小李想到哪儿说到哪儿，即便之后有新想法下次还能补充，这是在鼓励小李表达。 答案：B"}, {"ch": "综合·Ch6", "yr": "2021", "tp": "单选", "q": "社会工作者小赵发现新建的社区老年活动中心日常管理漏洞较多，打算通过动员社区居民参与解决问题。 下列做法中，属于社会工作过程目标的是（ ）。", "ops": [{"l": "A", "t": "调整老年活动中心的开放时间", "ok": false}, {"l": "B", "t": "鼓励居民自主讨论中心管理规范", "ok": true}, {"l": "C", "t": "增加老年活动中心的安防设备", "ok": false}, {"l": "D", "t": "让社区居委会派人轮流值班管理", "ok": false}], "ex": "过程目标强调在达到任务目标的过程中，提升居民解决问题的能力、增强居民社区参与意识 等。 A选项调整开放时间、C选项增加安防设备、D选项让居委会派人值班管理，都侧重于直接解决具体事务 ，属于任务目标。 B选项鼓励居民自主讨论中心管理规范，重点在于让居民参与讨论，提升居民参与解决问 题的能力，属于过程目标。答案：B"}, {"ch": "综合·Ch6", "yr": "2021", "tp": "单选", "q": "社会工作者小王负责推进小区加装电梯工作。他发现开始的时候居民很积极，一提到自筹资金，有些住户 就不愿意了，甚至强烈反对。有些住户持观望的态度。根据地区发展模式，在这种情况下，小王最适宜采取 的实施策略是（ ）。", "ops": [{"l": "A", "t": "召开座谈会，让居民充分表达自己的想法", "ok": true}, {"l": "B", "t": "报告居委会，向政府申请加装电梯的补贴", "ok": false}, {"l": "C", "t": "与电梯公司协商，争取降低加装电梯费用", "ok": false}, {"l": "D", "t": "向同事求助，重新拟定小区加装电梯方案", "ok": false}], "ex": "地区发展模式强调居民的参与和自决。面对居民对自筹资金意见不一的情况，应创造机会让 居民充分交流想法，共同协商解决问题。A选项召开座谈会让居民充分表达想法符合该模式理念。其他选项 B找政府申请补贴、C与电梯公司协商降价、D重新拟定方案，都未突出居民的参与和自决。答案：A"}, {"ch": "综合·Ch6", "yr": "2021", "tp": "单选", "q": "某地农村青壮年劳动力大量外出打工，留守儿童现象比较普遍，某社会工作服务机构运用社会策划模式为 这一地区的留守儿童提供服务。下列做法中，最能体现社会策划模式特点的是（ ）", "ops": [{"l": "A", "t": "增进村民参与，自下而上地倡导重视儿童发展问题", "ok": false}, {"l": "B", "t": "开发村庄内部资源，以家庭互助方式照顾留守儿童", "ok": false}, {"l": "C", "t": "开展直接服务，为出现行为问题的留守儿童提供辅导", "ok": false}, {"l": "D", "t": "运用专业权威，根据理性原则设计留守儿童服务方案", "ok": true}], "ex": "社会策划模式特点是强调运用专业知识、科学决策，由专家、机构等自上而下设计方案。A选 项自下而上不符合；B选项家庭互助非社会策划模式典型做法；C选项直接服务不是其突出特点。D选项运用专 业权威按理性原则设计方案，符合社会策划模式特点。答案：D"}, {"ch": "综合·Ch6", "yr": "2021", "tp": "单选", "q": "社会工作者小顾运用社会策划模式在老旧小区开展适老化改造项目。她既要负责项目执行，也要监督项目 进度情况，井及时反馈给相关方。根据社会策划模式，小顾扮演的角色是（ ）", "ops": [{"l": "A", "t": "政策倡导者", "ok": false}, {"l": "B", "t": "中介者", "ok": false}, {"l": "C", "t": "方案实施者", "ok": true}, {"l": "D", "t": "使能者", "ok": false}], "ex": "题干中明确提到小顾既要负责项目执行，又要监督进度并反馈，这符合方案实施者的职责 ，方案实施者就是负责具体项目的推行、监督等工作。答案：C"}, {"ch": "综合·Ch6", "yr": "2021", "tp": "单选", "q": "社区社会工作者小李与某特殊教育学校合作开展活动，邀请在校学生参观社区，并安排社区青少年与其开 展互动游戏，分享交流各自的学习生活，上述小李的做法体现出社区照顾模式特点的是（ ）", "ops": [{"l": "A", "t": "协助服务对象融入社区", "ok": true}, {"l": "B", "t": "强化辖区单位的社会责任", "ok": false}, {"l": "C", "t": "解决实质性的社区问题", "ok": false}, {"l": "D", "t": "控制和指导社区未来发展", "ok": false}], "ex": "小李邀请特殊教育学校学生参观社区，与社区青少年互动交流，目的是让特殊教育学校学生 更好融入社区。答案：A"}, {"ch": "综合·Ch6", "yr": "2021", "tp": "单选", "q": "为了配合街道拆除违章建筑的工作，社会工作者老岳走访了社区的一些老住户和居民骨干，了解社区“违 建”是怎样形成的，以及后来的发展情况。老岳开展这项工作的主要目的是（是）", "ops": [{"l": "A", "t": "分析社区“违建”问题的来龙去脉", "ok": true}, {"l": "B", "t": "研判社区“违建”问题的严重程度", "ok": false}, {"l": "C", "t": "了解居民对社区“违建”问题的感受", "ok": false}, {"l": "D", "t": "发掘解决社区“违建”问题的关键人物", "ok": false}], "ex": "老岳走访了解违建怎样形成及发展情况，重点在于梳理违建问题的整个过程，也就是分析其 来龙去脉。B选项研判严重程度未体现；C选项了解居民感受并非主要目的；D选项发掘关键人物不是对违建形 成及发展情况了解的主要意图。答案：A"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "单选", "q": "社会工作者在培育社区社会组织时发现，某社区文化团队的负责人自我认同感强，严于律己，做事认真负 责。由于他在团队中处理问题比较较真，有时会与少数团队成员发生冲突，影响了团结。针对这一情况，社 会工作者最适宜的做法是（ ）。", "ops": [{"l": "A", "t": "告诉负责人可以通过投票来争取支持", "ok": false}, {"l": "B", "t": "引导负责人加强与团队成员讨论沟通", "ok": true}, {"l": "C", "t": "建议负责人充分授权给团队的成员", "ok": false}, {"l": "D", "t": "支持负责人管理团队的理念和做法", "ok": false}], "ex": "该负责人因处理问题较真与成员冲突影响团结，关键在于缺乏有效沟通。A选项投票争取支持 无法从根本解决冲突增进理解；C选项充分授权与解决当前冲突问题关联不大；D选项支持其管理理念做法不 能化解矛盾。B选项引导负责人加强与团队成员讨论沟通，能促进理解、化解冲突、增强团结，是最适宜做法 。答案：B"}, {"ch": "综合·Ch5", "yr": "2021", "tp": "单选", "q": "某社会工作服务机构开展听障人士就医支持服务项目时，服务策划过程是：认识听障人士就医现状→界定 听障人士就医需求→探索听障人士就医解决方法→认识就医解决方法可能存在的限制→选取应对办法→设计 完整计划→发起评估计划，该方案策划的类型是（ ）。", "ops": [{"l": "A", "t": "战略性策划", "ok": false}, {"l": "B", "t": "创新性策划", "ok": false}, {"l": "C", "t": "问题解决策划", "ok": true}, {"l": "D", "t": "方案发展策略", "ok": false}], "ex": "从题干可知，整个服务策划过程围绕听障人士就医这一问题展开，先认识现状、界定需求 ，接着探索解决方法、考虑限制，再选取办法设计计划等，符合问题解决策划先找出问题、分析需求，然后 寻找解决办法并设计方案的流程。答案：C"}, {"ch": "综合·Ch5", "yr": "2021", "tp": "单选", "q": "在很多情况下，社会工作者服务需要组织多功能型团队，关于多功能型团队的说法，正确的是（ ）", "ops": [{"l": "A", "t": "团队成员来自不同专业领域，共同完成某项任务", "ok": true}, {"l": "B", "t": "团队是自然形成的工作小组，被赋予较大自主权", "ok": false}, {"l": "C", "t": "团队成员间能快速建立信任关系，实现真诚合作", "ok": false}, {"l": "D", "t": "团队的成员具有临时性特点，任务完成后即解散", "ok": false}], "ex": "多功能型团队是由来自不同专业领域的成员组成，共同为完成特定任务而协同工作。B选项说 自然形成且自主权大，不符合多功能型团队需组织构建特点；C选项团队成员来自不同领域，建立信任关系并 非快速；D选项临时性、任务完成解散更符合项目团队特点，而非多功能型团队。答案：A"}, {"ch": "综合·Ch1", "yr": "2021", "tp": "单选", "q": "社会工作者小张负责某社会工作服务机构的志愿者管理，下列小张的工作，属于志愿者管理中“工作发展 与设计”的是（ ）", "ops": [{"l": "A", "t": "评估志愿者参与服务动机", "ok": false}, {"l": "B", "t": "撰写志愿服务工作说明书", "ok": true}, {"l": "C", "t": "开展迎新说明与志愿者训练", "ok": false}, {"l": "D", "t": "进行志愿者绩效评估和激励", "ok": false}], "ex": "工作发展与设计主要是对志愿服务工作进行科学合理规划与安排，撰写志愿服务工作说明书 属于此范畴。A选项评估志愿者参与服务动机属于志愿者招募与筛选环节；C选项开展迎新说明与志愿者训练 属于志愿者训练与督导；D选项进行志愿者绩效评估和激励属于志愿者激励与表彰。答案：B"}, {"ch": "综合·Ch1", "yr": "2021", "tp": "单选", "q": "由于政府购买社会组织服务资金减少，某社会工作服务机构陷入财政危机。机构理事会决定扩大个人捐赠 ，与具有公募资格的筹款平台合作，发起“让爱传递”劝募活动，招募“爱心大使”动员身边的亲朋好友发 起“一起捐”。从个人捐款动机分析，该劝募活动主要利用的是（ ）", "ops": [{"l": "A", "t": "市场营销", "ok": false}, {"l": "B", "t": "自我利益", "ok": false}, {"l": "C", "t": "外界影响", "ok": true}, {"l": "D", "t": "个人需要", "ok": false}], "ex": "招募“爱心大使”动员身边亲朋好友发起“一起捐”，这主要是借助身边人的影响来促使他 人捐款，属于外界影响因素。答案：C"}, {"ch": "综合·Ch1", "yr": "2021", "tp": "单选", "q": "某儿童社会工作服务机构的社会工作者小张与当地一家画廊负责人很熟，两人闲聊时谈到可以合作举办画 展，将画展的门票收入和画作拍卖筹集的资金捐赠给遭遇火灾的某自闭症儿童家庭，上述筹资方法属于（ ）。", "ops": [{"l": "A", "t": "项目申请", "ok": false}, {"l": "B", "t": "私人恳请", "ok": true}, {"l": "C", "t": "电话劝捐", "ok": false}, {"l": "D", "t": "特别事件筹资活动", "ok": false}], "ex": "本题考查社会工作的内涵与基本知识。正确答案为B。B.私人恳请"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "单选", "q": "社会工作教育性督导可以缓解被督导者的工作压力，下列督导者的做法中，体现社会工作督导教育性功能 的是（ ）。", "ops": [{"l": "A", "t": "协助被督导者识别和处理焦虑情绪", "ok": false}, {"l": "B", "t": "鼓励被督导者再尝试新的介入方法", "ok": true}, {"l": "C", "t": "引导被督导者看到自己的工作成效", "ok": false}, {"l": "D", "t": "帮助被督导者练习情绪管理的技巧", "ok": false}], "ex": "本题考查个案工作方法的相关知识。正确答案为B。B.鼓励被督导者再尝试新的介入方法"}, {"ch": "综合·Ch1", "yr": "2021", "tp": "单选", "q": "学校社会工作者小宋决定采用问卷调查的方式向高中学生了解校园欺凌状况，根据调查内容和对象的特点 。小宋最适宜采用的问卷调查方式及理由是（ ）。", "ops": [{"l": "A", "t": "采用自填问卷，保证问卷高回收率", "ok": false}, {"l": "B", "t": "采用访问问卷，确保问卷填写质量", "ok": false}, {"l": "C", "t": "采用自填问卷，适合了解敏感问题", "ok": true}, {"l": "D", "t": "采用访问问卷，符合学生文化水平", "ok": false}], "ex": "高中生有一定理解与书写能力，且校园欺凌涉及敏感问题，自填问卷可让学生更自在表达 ，保护隐私。访问问卷可能使学生因面对他人有所顾虑。答案：C"}, {"ch": "综合·Ch2", "yr": "2021", "tp": "多选", "q": "下列社会工作者的做法中，体现其对机构伦理责任的有（ ）。", "ops": [{"l": "A", "t": "为服务对象提供专业化服务", "ok": false}, {"l": "B", "t": "努力提升自己的专业服务能力", "ok": false}, {"l": "C", "t": "遵守机构的管理制度和规定", "ok": true}, {"l": "D", "t": "提供服务时应注意自己的形象", "ok": true}, {"l": "E", "t": "总结专业服务的经验模式", "ok": false}], "ex": "对机构伦理责任主要涉及与机构相关的行为。A是对服务对象的责任；B提升自身能力主要是 对专业的责任；C遵守机构管理制度是对机构伦理责任；D注意形象，若从维护机构形象角度可算对机构责任 ；E总结经验模式更多是对专业发展的贡献。答案：CD"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "多选", "q": "某小区推行居室适老化改造项目，住在小区的90岁的王爷爷以“习惯现在的家”为由拒绝改造，其家人从 安全角度出发，希望社会工作者老杨劝王爷爷接受。老杨与王爷爷沟通后，发现现在的居家环境在他的生命 历程中具有特殊意义。综合安全评估结果，老杨向王爷爷一家建议基本保留现有格局，只对存在安全隐患的 卫生间进行局部改造，上述情形中，老杨优先考虑的伦理原则有（ ）。", "ops": [{"l": "A", "t": "保护生命", "ok": true}, {"l": "B", "t": "差别平等", "ok": false}, {"l": "C", "t": "自由自主", "ok": false}, {"l": "D", "t": "最小伤害", "ok": true}, {"l": "E", "t": "隐私保密", "ok": false}], "ex": "本题考查个案工作方法的相关知识。正确答案为AD。A.保护生命；D.最小伤害"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "多选", "q": "中学生小刚放暑假后，天天沉迷于网络游戏，既不学习，也不外出锻炼身体。针对小刚的行为，社会工作 者适宜的做法有（ ）。", "ops": [{"l": "A", "t": "了解小刚的想法", "ok": true}, {"l": "B", "t": "建议小刚父母对孩子报培训班", "ok": false}, {"l": "C", "t": "建议小刚父母多陪伴孩子", "ok": false}, {"l": "D", "t": "和小刚一起制订改变计划", "ok": true}, {"l": "E", "t": "帮助小刚认识过度游戏的危害", "ok": true}], "ex": "对于小刚沉迷网游的行为，首先要了解他想法，才能更好介入（A 对）；和他一起制订改变 计划可引导其改变行为（D 对）；帮助他认识过度游戏危害能让他意识到问题（E 对）。建议父母给孩子报 培训班可能增加孩子压力，不是适宜做法；建议父母多陪伴，未直接针对小刚行为改变。答案：ADE"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "多选", "q": "小贾成绩优秀，目标是考上一流大学。但因高考失利，他与理想大学失之交臂。为此，小贾将自己长时间 关在房间内，拒绝与家人交流。社会工作者小柳结案后，打算运用危机介入策略提供服务。下列做法中，属 于危机介入基本服务内容的有（ ）。", "ops": [{"l": "A", "t": "处理小贾的失落情绪", "ok": true}, {"l": "B", "t": "指导小贾学习放松技巧", "ok": true}, {"l": "C", "t": "提升小贾应对挫折的能力", "ok": true}, {"l": "D", "t": "请曾高考失利现事业有成的表哥开导小贾", "ok": true}, {"l": "E", "t": "帮助小贾了解其成长过程中的重要影响时间", "ok": false}], "ex": "危机介入的基本服务内容包括减轻服务对象的不安、缓解情绪、提供支持、恢复自信及寻求 应对方法等。A处理失落情绪属于缓解情绪；B指导放松技巧可减轻不安；C提升应对挫折能力是寻求应对方法 ；D请表哥开导属于提供支持。E了解成长过程重要影响事件与危机介入当下重点不符。答案：ABCD"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "多选", "q": "小魏大学期间由于学习压力过大，患有轻度抑郁，经过治疗，抑郁症状得到较好的控制。大学毕业后，父 母担心小魏不能适应职场竞争而加重抑郁症状，未要求小魏去就业。于是，小魏一直宅在家中，很少和同学 来往，也没有认识新的朋友。根据青年阶段发展的主要特征和面临的主要问题，社会工作者适宜为小魏提供 的服务有（ ）。", "ops": [{"l": "A", "t": "鼓励小魏参加青年就业联盟，学习相关就业技巧", "ok": true}, {"l": "B", "t": "引导小魏参加社区的志愿活动，服务社区居民", "ok": true}, {"l": "C", "t": "协助小魏重返医院进行抑郁症的诊断评估治疗", "ok": false}, {"l": "D", "t": "鼓励小魏参加青年交友联谊活动，认识新朋友", "ok": true}, {"l": "E", "t": "协助小魏进行自我探索，认识自身拥有的资源", "ok": true}], "ex": "小魏的问题是因父母担心未就业且社交少。A选项可解决就业问题；B选项能增加社交，还可 积累社会经验；D选项有助于拓展社交圈；E选项协助自我探索，能帮助小魏认识自身优势，更好走向社会。 而题干表明小魏抑郁症状已较好控制，C选项重返医院诊断评估治疗不是当务之急。答案：ABDE"}, {"ch": "综合·Ch4", "yr": "2021", "tp": "多选", "q": "社会工作者老刘在个案服务的最后阶段，需要对服务效果进行评估。此时，老刘的评估内容有（", "ops": [{"l": "A", "t": "服务对象的改变状况", "ok": true}, {"l": "B", "t": "个案工作目标的实现程度", "ok": true}, {"l": "C", "t": "个案服务的资源投入", "ok": true}, {"l": "D", "t": "个案服务运用的策略", "ok": false}, {"l": "E", "t": "服务对象是否还存在其他问题", "ok": false}], "ex": "答案：ABC ）。"}, {"ch": "综合·Ch5", "yr": "2021", "tp": "多选", "q": "某社区流动儿童数量较多 受卡；E.小组结束后的访谈记录"}, {"ch": "综合·Ch1", "yr": "2021", "tp": "多选", "q": "社会工作者小朱在一家为老社会工作者服务机构负责志愿者管理工作，近期她将对新招募的志愿者开展参 加为老服务动机评估。下列表述中，属于“以利他和社会为中心”的动机有（ ）", "ops": [{"l": "A", "t": "希望能够帮助老年人提高生活质量", "ok": true}, {"l": "B", "t": "通过志愿服务表达对老年人的关爱", "ok": true}, {"l": "C", "t": "可以减少自身生活的孤独感和寂寞", "ok": false}, {"l": "D", "t": "通过志愿服务获得为老服务的经验", "ok": false}, {"l": "E", "t": "希望通过志愿服务尽一点社会责任", "ok": true}], "ex": "“以利他和社会为中心”的动机强调对他人、社会的益处。A选项希望帮助老年人提高生活质 量，B选项通过志愿服务表达对老年人关爱，E选项希望尽社会责任，都体现了对他人和社会的关注。C选项减 少自身孤独感和寂寞是从自身需求出发，D选项获得为老服务经验也是侧重于自身收获。答案：ABE"}, {"ch": "综合·Ch1", "yr": "2021", "tp": "多选", "q": "某社会工作服务机构根据社区老年人的需求，设计了一个以维护老年人财产权益为目标的服务方案，该服 务方案应包含的内容有（ ）。", "ops": [{"l": "A", "t": "方案执行情况的监测和评估方法", "ok": true}, {"l": "B", "t": "符合老年人特点的主体活动和宣传形式", "ok": true}, {"l": "C", "t": "方案实施中可能遇到的困难和应对措施", "ok": true}, {"l": "D", "t": "与目标对象数量相匹配的工作人员分工原则", "ok": false}, {"l": "E", "t": "机构员工学习《老年人权益保障法》的安排", "ok": true}], "ex": "本题考查社会工作的内涵与基本知识。正确答案为ABCE。A.方案执行情况的监测和评估方法；B.符合老年人特点的主体活动和宣传形式；C.方案实施中可能遇到的困难和应对措施；E.机构员工学习《老年人权益保障法》的安排"}, {"ch": "综合·Ch1", "yr": "2021", "tp": "多选", "q": "评估是测量社会工作服务成效的重要环节，社会工作服务机构通过服务对象满意度调查表来评估服务成效 ，关于服务对象满意度调查表的说法，正确的有（ ）", "ops": [{"l": "A", "t": "该调查表属于定量研究常用的资料收集方法", "ok": true}, {"l": "B", "t": "该调查表追求收集资料和评估结果的客观性", "ok": true}, {"l": "C", "t": "该调查表发放给服务对象可以获取评估结果", "ok": true}, {"l": "D", "t": "该调查表中的问题可以根据评估时的情况随时修订", "ok": false}, {"l": "E", "t": "该调查表便于社会工作者从服务对象视角分析资料", "ok": false}], "ex": "定量研究用数字来对现象进行说明，服务对象满意度调查表以数据形式呈现，属于定量研究 资料收集方法，A 正确；定量研究追求客观性，调查表作为定量研究方法也追求收集资料和评估结果客观性 ，B 正确；发放给服务对象收集反馈能获取评估结果，C 正确；调查表问题应事先设计好，不能随时修订，D 错误；定量研究资料分析主要是统计分析等客观方式，并非从服务对象视角分析，E 错误。答案：ABC"}, {"ch": "综合·Ch5", "yr": "2021", "tp": "多选", "q": "社会工作者小刘就高空抛物问题举行社区居民会议。开始大家都沉默不语。小刘就点名让平时较活跃的老 张先发言。老张讲了小区里一个高空抛物致人受伤的例子，引起共鸣。大家围绕这是违法行为还是违背公德 行为，展开激烈争论。小刘最后对大家的争论内容进行了梳理总结。在此次居民会议中，小刘运动的技巧有 （ ）。", "ops": [{"l": "A", "t": "关注", "ok": true}, {"l": "B", "t": "邀请发言", "ok": true}, {"l": "C", "t": "摘要", "ok": true}, {"l": "D", "t": "转述", "ok": false}, {"l": "E", "t": "聚焦", "ok": false}], "ex": "本题考查小组工作方法的相关知识。正确答案为ABC。A.关注；B.邀请发言；C.摘要"}, {"ch": "综合·Ch1", "yr": "2022", "tp": "单选", "q": "为落实党中央、国务院关于加强基层治理能力现代化建设的战略部署，民政部在全国推进乡镇（街道）社 会工作站建设。乡镇（街道）社会工作站的发展方向是（ ）。", "ops": [{"l": "A", "t": "专业化、职业化", "ok": false}, {"l": "B", "t": "多元化、本地化", "ok": false}, {"l": "C", "t": "本土化、职业化", "ok": false}, {"l": "D", "t": "专业化、高质量", "ok": true}], "ex": "本题考查社会工作的内涵与基本知识。正确答案为D。D.专业化、高质量"}, {"ch": "综合·Ch1", "yr": "2022", "tp": "单选", "q": "为贯彻《中共中央、国务院关于加强基层治理和体系和治理能力现代化建设的意见》，2022年3月17日31日，民政部开展了主题为“五社联动聚合力，社工服务暖基层”的宣传活动，旨在创新社区与社会组织、 社会工作者、社区志愿者、社会慈善资源的联动机制，根据上述内容，“五社联动：突出体现的社会工作者 特点是（ ）。", "ops": [{"l": "A", "t": "专业助人", "ok": false}, {"l": "B", "t": "注重实践", "ok": false}, {"l": "C", "t": "互动合作", "ok": false}, {"l": "D", "t": "多方协同", "ok": true}], "ex": "题干强调“五社联动”是创新社区与社会组织等多方的联动机制，突出的是多方共同协作。 选项中体现多方协作特点的是多方协同。答案：D"}, {"ch": "综合·Ch4", "yr": "2022", "tp": "单选", "q": "社会工作者小寿为某社区困难群体提供服务，下列小苏的做法中，能够体现建构社会资本功能的是（ ）。", "ops": [{"l": "A", "t": "为精神障碍人士举办公益画展，协助其参与社区生活", "ok": false}, {"l": "B", "t": "策划公益活动，呼吁社会各界人士关爱贫困家庭儿童", "ok": true}, {"l": "C", "t": "邀请辖区医院医护人员，为失智失能老人提供上门服务", "ok": false}, {"l": "D", "t": "建议政府相关部门，尽快解决社区高龄老人用餐难问题", "ok": false}], "ex": "建构社会资本功能强调通过促进个体之间的联系、增强社会网络来发挥作用。选项B策划公益 活动呼吁社会各界关爱贫困家庭儿童，是在调动社会不同主体间的联系，构建社会支持网络，即建构社会资 本。A主要是助力个体融入；C是引入专业资源；D是向政府提建议解决问题，都不属于建构社会资本。答案 ：B"}, {"ch": "综合·Ch1", "yr": "2022", "tp": "单选", "q": "下列人员中，属于社会工作基本服务对象的是（ ）。", "ops": [{"l": "A", "t": "参与新冠肺炎疫情防控的志愿者", "ok": false}, {"l": "B", "t": "协助子女抚育孙辈的随迁老人", "ok": false}, {"l": "C", "t": "因家庭贫困导致就医困难的儿童", "ok": true}, {"l": "D", "t": "社会工作服务机构新入职员工", "ok": false}], "ex": "社会工作基本服务对象是社会上最边缘、最困难，需要帮助最迫切的群体。A选项志愿者不是 接受服务的对象；B选项协助子女抚育孙辈的随迁老人并非处于最困难迫切需要帮助的境地；C选项因家庭贫 困就医困难的儿童，属于面临困境迫切需要帮助的群体，是基本服务对象；D选项新入职员工不属于社会工作 服务对象范畴。答案：C"}, {"ch": "综合·Ch2", "yr": "2022", "tp": "单选", "q": "社会工作者联结各种社会工作要素，综合利用各种能力，实施服务***，关于社会工作要素的说法，正确的 是（ ）。", "ops": [{"l": "A", "t": "社会工作者既是个体概念又是团队概念", "ok": true}, {"l": "B", "t": "社会工作价值观只能通过专业教育形成", "ok": false}, {"l": "C", "t": "任何家庭，群体和社区都必须纳入专业服务的范围", "ok": false}, {"l": "D", "t": "助人活动是社会工作者为服务对象提供单向服务", "ok": false}], "ex": "A选项，社会工作者既可以指单个的社会工作者，也可以指一个机构、一个团队，所以既是个 体概念又是团队概念，该说法正确；B项，社会工作价值观形成途径多样，不止专业教育；C项，并非所有家 庭、群体和社区都要纳入专业服务范围；D项，助人活动是双向互动过程，不是单向服务。答案：A"}, {"ch": "综合·Ch1", "yr": "2022", "tp": "单选", "q": "社会工作者小张协助当地农村开展巩固脱贫攻坚成果与乡村振兴相衔接工作时，发现原贫困村民有些是因 重大疾病而致贫，虽然医疗保险可以报销住院费用，但是康复期的大部分用药仍需要自费，村民负担较重 ，为此，小张撰写了调研报告，提交给政府相关部门，希望将重大疾病康复期的关键必须药品纳入医疗保险 报销范围。上述小张的工作，体现的社会工作角色是（ ）。", "ops": [{"l": "A", "t": "政策影响者", "ok": true}, {"l": "B", "t": "资源筹措者", "ok": false}, {"l": "C", "t": "行政管理者", "ok": false}, {"l": "D", "t": "关系协调者", "ok": false}], "ex": "小张撰写调研报告提交给政府部门，希望影响医保政策，将重大疾病康复期关键药品纳入报 销范围，这符合政策影响者通过提议影响政策的角色特点。答案：A"}, {"ch": "综合·Ch1", "yr": "2022", "tp": "单选", "q": "根据新冠肺炎疫情防控相关要求，社区居民进入小区大门时需要出示健康码，社会工作者小李发现一些老 年人不会用智能手机查询健康码，进入不方便，为了解决老年人的困难，小李在社区中举办“数字防疫，一 学就灵”的活动，教老年人学习用手机查询健康码等信息，上述小李所开展的工作领域是（ ）。", "ops": [{"l": "A", "t": "服务社会工作", "ok": false}, {"l": "B", "t": "救助社会工作", "ok": false}, {"l": "C", "t": "老年社会工作", "ok": true}, {"l": "D", "t": "矫正社会工作", "ok": false}], "ex": "小李针对老年人不会用智能手机查健康码这一问题开展活动，主要服务对象是老年人，所以 工作领域是老年社会工作。答案：C"}, {"ch": "综合·Ch2", "yr": "2022", "tp": "单选", "q": "关于社会工作价值观与专业伦理的说法，正确的是（ ）。", "ops": [{"l": "A", "t": "社会工作者与服务对象之间的反移情必然会发生", "ok": false}, {"l": "B", "t": "社会工作者在服务的同时必须具备自我照顾能力", "ok": true}, {"l": "C", "t": "社会工作者在服务中任何情况都要对服务对象信息保密", "ok": false}, {"l": "D", "t": ".社会工作者在服务时，要将部门的评估标准置于首位", "ok": false}], "ex": "A选项“必然会发生”表述绝对；C选项存在服务对象信息保密的例外情况，并非任何情况都 要保密；D选项应将服务对象利益置于首位，而非部门评估标准。B选项，社会工作者在服务他人的同时需具 备自我照顾能力，以更好地提供服务，说法正确。答案：B"}, {"ch": "综合·Ch2", "yr": "2022", "tp": "单选", "q": "助理社会工作师、社会工作师和高级社会工作师应当接受社会工作继续教育和培训，并将学到的社会工作 理论和方法运用于实践，这主要体现的是社会工作者（ ）。", "ops": [{"l": "A", "t": "对机构的伦理责任", "ok": false}, {"l": "B", "t": "对同事的伦理责任", "ok": false}, {"l": "C", "t": "对社会的伦理责任", "ok": false}, {"l": "D", "t": "对专业的伦理责任", "ok": true}], "ex": "接受继续教育和培训并将所学运用于实践，这是为了提升专业水平、促进专业发展，体现的 是对专业的责任。答案：D"}, {"ch": "综合·Ch2", "yr": "2022", "tp": "单选", "q": "社会工作者小李在为65岁的低保对象老林提供服务的过程中，得知老林最近在照顾瘫痪在床的哥哥。虽然 他经济上有压力、照顾起来力不从心，但也不忍心将哥哥送到养老院，更不愿意麻烦别人，从未对别人说起 过自己的困难，根据社会工作伦理决定的核心价值观，小李最适宜的做法是（ ）。", "ops": [{"l": "A", "t": "尊重老林的决定，协助其学习照顾失能老人的技巧", "ok": true}, {"l": "B", "t": "相信老林是可以改变的，积极引导其改变传统观念", "ok": false}, {"l": "C", "t": "保护老林的隐私，不向他人透露其照顾哥哥的困难", "ok": false}, {"l": "D", "t": "征得老林的同意，通过机构内筹款缓解其经济压力", "ok": false}], "ex": "社会工作伦理决定要尊重服务对象自决，同时也要考虑如何切实帮助服务对象解决困难。A选 项既尊重老林不送哥哥去养老院且不愿麻烦别人的决定，又协助他学习照顾技巧来应对困难，较为合适。B项 引导改变传统观念并非当下之急；C项仅保护隐私未解决实际困难；D项未充分尊重老林不愿麻烦别人的意愿 。答案：A"}, {"ch": "综合·Ch2", "yr": "2022", "tp": "单选", "q": "丧偶多年的尹奶奶一直独自居住，半年前入住养老机构，认识了同样单身的陈爷爷，两人一见如故，交往 半年后决定结婚，但遭到尹奶奶儿女的反对。尹奶奶为此情绪消沉，陈爷爷很是着急，便向社会工作者小王 求助。小王为尹奶奶制订了个案服务方案，又向尹奶奶的儿女了解反对的原因，通过沟通取得他们对尹奶奶 的理解。以社会工作专业伦理角度出发，小王在服务中遵循的是（ ）。", "ops": [{"l": "A", "t": "保护生命原则", "ok": false}, {"l": "B", "t": "差别平等原则", "ok": false}, {"l": "C", "t": "最小伤害原则", "ok": false}, {"l": "D", "t": "生命质量原则", "ok": true}], "ex": "社会工作者小王通过沟通让尹奶奶儿女理解尹奶奶，支持其结婚，这有助于提升尹奶奶的生 活质量和情感满足，符合生命质量原则。生命质量原则强调提升服务对象的福祉与生活品质。答案：D"}, {"ch": "综合·Ch2", "yr": "2022", "tp": "单选", "q": "新冠肺炎疫情防控期间，正在住院的赵爷爷对医院按要求制定的家属探视制度非常不满，便找到医务社会 工作者小颖，说自己要向相关部门投诉，小颖了解情况后，根据社会工作专业伦理守则，适当的做法是（ ）。", "ops": [{"l": "A", "t": "支持赵爷爷的做法，向医院提出制度修订意见", "ok": false}, {"l": "B", "t": "理解赵爷爷心情，向赵爷爷说明制度制定原因", "ok": true}, {"l": "C", "t": "保持中立的态度，让赵爷爷自我决定是否投诉", "ok": false}, {"l": "D", "t": "尊重赵爷爷的决定，劝说赵爷爷尽快办理出院", "ok": false}], "ex": "首先，要理解赵爷爷不满是因为不了解制度，社会工作者需秉持专业伦理，既要尊重服务对 象感受，又要从大局出发。A选项直接支持投诉不合适；C选项保持中立不积极解决问题；D选项劝说出院与解 决探视制度不满问题无关。B选项理解赵爷爷心情并说明制度制定原因，既安抚情绪又解释清楚，较为恰当。 答案：B"}, {"ch": "综合·Ch3", "yr": "2022", "tp": "单选", "q": "马斯洛需要层次论中维持人类自身生存的最基本需要是（ ）。", "ops": [{"l": "A", "t": "生理的需要", "ok": true}, {"l": "B", "t": "安全的需要", "ok": false}, {"l": "C", "t": "归属的需要", "ok": false}, {"l": "D", "t": "尊重的需要", "ok": false}], "ex": "生理需要是人类维持自身生存的最基本要求，比如对食物、水、空气等的需求。安全需要是 保障自身安全等；归属需要是情感等方面的归属；尊重需要涉及自尊和受到他人尊重。所以最基本的维持生 存需要是生理需要。答案：A"}, {"ch": "综合·Ch3", "yr": "2022", "tp": "单选", "q": "张叔叔非常喜欢旅游，在旅游中认识了来自各行各业、具有相同爱好的朋友，他们经常分享彼此的旅游经 验，并接班到各地旅游，这体现了同辈群体的（ ）。", "ops": [{"l": "A", "t": "平等性", "ok": false}, {"l": "B", "t": "开放性", "ok": false}, {"l": "C", "t": "认同性", "ok": true}, {"l": "D", "t": "独特性", "ok": false}], "ex": "本题考查人类行为与社会环境的相关理论。正确答案为C。C.认同性"}, {"ch": "综合·Ch3", "yr": "2022", "tp": "单选", "q": "关于人类行为与社会环境基本关系的说法，正确的是（ ）。", "ops": [{"l": "A", "t": "个人行为对社会环境有决定性的影响", "ok": false}, {"l": "B", "t": "社会环境决定着人类行为的行为规范", "ok": false}, {"l": "C", "t": "人类行为与社会环境相互影响的力度是不平衡的", "ok": true}, {"l": "D", "t": "各年龄阶段的人受到社会环境的影响是一样的", "ok": false}], "ex": "A 选项个人行为对社会环境有影响，但不是决定性的，过于夸大；B 选项社会环境对人类行 为有影响，但不能绝对说决定行为规范；D 选项不同年龄阶段受社会环境影响程度和方式不同。C 选项人类 行为与社会环境相互影响，但社会环境对人类行为影响更大，二者力度不平衡，该说法正确。答案：C"}, {"ch": "综合·Ch4", "yr": "2022", "tp": "单选", "q": "文静瘦小的四年级男生小书，因性格和身高的关系，常被同学嘲笑和孤立，有的同学还给他起难听的绰号 ，小书为此感到非常苦恼，根据上述状况，社会工作者针对小书个人最适宜的服务是（ ）。", "ops": [{"l": "A", "t": "联络学校成立校园欺凌预防部门", "ok": false}, {"l": "B", "t": "协助小书增强他应对欺凌的能力", "ok": true}, {"l": "C", "t": "纠正小书同学的语言暴力等行为", "ok": false}, {"l": "D", "t": "建议小书父母关注小书情绪变化", "ok": false}], "ex": "题目强调针对小书个人的适宜服务。A是针对学校层面；C是针对小书同学；D是建议小书父母 做的事。只有B是直接帮助小书个人增强应对欺凌能力。答案：B"}, {"ch": "综合·Ch1", "yr": "2022", "tp": "单选", "q": "初三学生小林的父母离异后，各自又很快组建了新的家庭，小林无法接受父母离婚的现实，感到自己被抛 弃，十分绝望，无心学习，并在社交平台上多次表现厌世的想法，学校社会工作者小夏发现后，决定采用危 机介入模式帮助小林，小夏首先要做的是（ ）。", "ops": [{"l": "A", "t": "与小林父母探讨原因", "ok": false}, {"l": "B", "t": "纠正小林的错误认知", "ok": false}, {"l": "C", "t": "安抚小林绝望的心情", "ok": false}, {"l": "D", "t": "及时进行危险性评估", "ok": true}], "ex": "危机介入模式首先要做的是及时评估服务对象的危险性，因为小林已在社交平台多次表现厌 世想法，有潜在生命危险，需第一时间评估。答案：D。"}, {"ch": "综合·Ch4", "yr": "2022", "tp": "单选", "q": "王女士找社会工作者小赵反应，她读初二的儿子沉迷手机游戏，不爱与人交流，希望小赵帮助他，经过预 估与问题分析，小赵认为应将此案转介到其它机构，根据上述内容，小赵下一步最适宜的做法是（ ）。", "ops": [{"l": "A", "t": "直接告知王女士本机构不处理青少年网瘾问题", "ok": false}, {"l": "B", "t": "告知王女士能处理青少年网瘾问题的机构信息", "ok": true}, {"l": "C", "t": "邀请王女士到机构与其进行详细的预估会谈", "ok": false}, {"l": "D", "t": "与机构督导商量确定是否拓展相关戒瘾服务", "ok": false}], "ex": "因为小赵认为此案应转介到其他机构，那么下一步最适宜做法就是告知王女士能处理该问题 的机构信息，方便王女士能及时获得帮助。答案：B"}, {"ch": "综合·Ch1", "yr": "2022", "tp": "单选", "q": "小宁是一名留守儿童，功课没人辅导，学习成绩不佳，社会工作者小王了解到小宁的情况后，找来大学生 志愿者辅导她学习，根据上述内容，小王在服务中的角色是（ ）。", "ops": [{"l": "A", "t": "教育者", "ok": false}, {"l": "B", "t": "治疗者", "ok": false}, {"l": "C", "t": "倡导者", "ok": false}, {"l": "D", "t": "联系人", "ok": true}], "ex": "小王找来大学生志愿者为小宁辅导功课，主要是起到了连接大学生志愿者和小宁的作用，即 联系人角色。答案：D"}, {"ch": "综合·Ch4", "yr": "2022", "tp": "单选", "q": "小杰最近考试连续失利，成绩明显下滑，受到任课老师和班主任的批评。父母也指责他贪玩不好好学习。 面对即将到来的中考。小杰十分焦虑。经朋友介绍，他找到社会工作者小蔡，希望得到帮助。从建立专业关 系的角度看，小蔡最适宜的做法是（ ）。", "ops": [{"l": "A", "t": "协助小杰分析问题的关键在于他自己", "ok": false}, {"l": "B", "t": "倾听小杰充分表达自己的烦恼和担忧", "ok": true}, {"l": "C", "t": "帮助小杰练习放松技巧应对焦虑情绪", "ok": false}, {"l": "D", "t": "引导小杰父母叙述他们的感受和想法", "ok": false}], "ex": "建立专业关系首先要让服务对象感受到被理解和接纳，倾听小杰充分表达烦恼和担忧，能让 他感受到被尊重，利于建立专业关系。A项直接分析问题关键在他自身，可能让小杰有被指责感；C项帮助练 习放松技巧是后续介入措施；D项题干强调是小杰寻求帮助，重点应在小杰，而非引导其父母叙述感受。答案 ：B"}, {"ch": "综合·Ch4", "yr": "2022", "tp": "单选", "q": "王女士因遭受丈夫家暴，向社会工作者小华求助，在个案服务的第七次会议中，汪女士和小华对话如下： 汪女士：“谢谢你的帮助，我才可以面对被家暴这件事。” 小华：“是你自己有勇气面对的。” 汪女士：“我也不知道哪里来的勇气。” 小华：“你能选择主动求助，就说明一直都很有勇气，只是你自己没发现而已。” 根据上述对话，小华采用的会谈技巧是（ ）。", "ops": [{"l": "A", "t": "专注", "ok": false}, {"l": "B", "t": "倾听", "ok": false}, {"l": "C", "t": "同理", "ok": false}, {"l": "D", "t": "鼓励", "ok": true}], "ex": "小华通过强调汪女士主动求助体现其一直有勇气，这是对汪女士积极方面的肯定，属于鼓励 技巧。答案：D"}, {"ch": "综合·Ch4", "yr": "2022", "tp": "单选", "q": "郭女士被诊断为尿毒症后心理压力很大，茶饭不思，经常失眠。她的家人向医务社会工作者小周求助。小 周结案后，对郭女士的问题进行充分预估并开展了八次面谈，目前进入到结案阶段，需要对服务成效进行评 估。结合郭女士的改善状况，小周最适宜采取的评估方式是（ ）。", "ops": [{"l": "A", "t": "请郭女士填写个案服务的满意度问卷", "ok": true}, {"l": "B", "t": "请机构督导对服务完成进度进行评估", "ok": false}, {"l": "C", "t": "请机构主管评估服务资源的投入情况", "ok": false}, {"l": "D", "t": "请郭女士再次填答量表测评心理状态", "ok": false}], "ex": "本题考查个案工作方法的相关知识。正确答案为A。A.请郭女士填写个案服务的满意度问卷"}, {"ch": "综合·Ch5", "yr": "2022", "tp": "单选", "q": "针对大四学生的就业压力问题，社会工作者老许开展了主题为“扬帆起航”的小组服务。在小组中。老许 带领组员开展了一系列减压活动，运用示范、催化等技巧促使组员分享减压活动的感受，并针对组员在就业 过程中遇到的问题提供咨询。上述小组活动主要体现了互动模式实施原则中的（ ）。", "ops": [{"l": "A", "t": "开放性互动原则", "ok": true}, {"l": "B", "t": "使能者原则", "ok": false}, {"l": "C", "t": "封闭性互动原则", "ok": false}, {"l": "D", "t": "积极参与原则", "ok": false}], "ex": "互动模式实施原则有开放性互动、平等性互动、“面对面”互动。题干中老许带领组员开展 活动，促进组员分享感受，还针对组员就业问题提供咨询，组员与组员、组员与工作者之间充分互动交流 ，体现开放性互动原则。使能者原则不属于互动模式实施原则；封闭性互动原则不存在；积极参与原则强调 组员主动投入，相比之下，开放性互动原则更能全面概括题干活动体现的原则。答案：A"}, {"ch": "综合·Ch5", "yr": "2022", "tp": "单选", "q": "在青少年艺术治疗小组中，社会工作者小徐和组员一起用手工材料制作了名为“我的力量来源”的作品 ，但在分享环节，组员因为不知道如何进行分享而陷入沉默，下列小徐的回应中，能够体现出示范引导技巧 的是（ ）。", "ops": [{"l": "A", "t": "“在分享环节，请大家先将自己的作品放在桌子上，然后用3分钟介绍一下作品”", "ok": false}, {"l": "B", "t": "“我看到小汪制作了一本书，你能跟大家说说为什么会觉得书能给你带来力量吗？”", "ok": false}, {"l": "C", "t": "“我做的是一颗发芽的种子，它冲破束缚，茁壮成长，给逆境中的我带来向上的力量”", "ok": true}, {"l": "D", "t": "“我发现大家都心灵手巧，做出了能够给自己力量的作品，哪位组员愿意分享一下”", "ok": false}], "ex": "示范引导技巧是社会工作者通过自身的示范行为，为组员提供行为榜样。C选项中，社会工作 者小徐先分享自己作品及作品所代表的力量，为组员示范了如何分享，属于示范引导技巧。答案：C"}, {"ch": "综合·Ch5", "yr": "2022", "tp": "单选", "q": "社会工作者小乔在某中学为老师开设性别平等教育小组。小香在一次小组活动结束后撰写小组记录，回顾 和梳理组员的表现：组员沉默、观望者较多，有的组员经常询问在小组中应该做什么；组员之间比较客气礼 貌，相互之间讨论较少，此时，该小组最有可能处于（ ）。", "ops": [{"l": "A", "t": "开始阶段", "ok": true}, {"l": "B", "t": "转析阶段", "ok": false}, {"l": "C", "t": "成熟阶段", "ok": false}, {"l": "D", "t": "结束阶段", "ok": false}], "ex": "在小组开始阶段，组员往往不熟悉，会比较沉默、观望，对小组规范和自己要做什么不明确 ，相互交流也少，符合题干描述。而转折阶段组员冲突增多；成熟阶段组员关系紧密、互动良好；结束阶段 主要是处理离别情绪等。所以此小组处于开始阶段。答案：A。"}, {"ch": "综合·Ch5", "yr": "2022", "tp": "单选", "q": "在“为爱出发”亲子小组中，社会工作者小曹邀请组员分享亲子互动故事以识别并探讨家庭沟通模式。当 小曹邀请小姜发言时，小姜还没开口，她妈就抢先说：“她一直就是这个样子，不爱搭理人，问她也没用。 ”小姜对此欲言又止。面对这一情境，小曹最适当的回应是（ ）。", "ops": [{"l": "A", "t": "“刚刚小姜妈妈说了小姜的情况，其他家庭是怎么看的？有没有遇到过类似的情况呢？”", "ok": false}, {"l": "B", "t": "“小姜妈妈，您可以详细说说女儿的情况吗？她平时在学校和家里也是这样不爱说话吗？”", "ok": false}, {"l": "C", "t": "“小姜妈妈，您这样的做法是不恰当的，就是因为您这样的说话方式才让孩子不敢说话的。”", "ok": false}, {"l": "D", "t": "“小姜妈妈，我看到小姜这一次好像想要说说自己的观点，让我们听听她怎么说，好吗？”", "ok": true}], "ex": "社工应鼓励小姜表达自己观点，避免家长代替发言，营造让小组成员充分表达的氛围。A选项 转移话题，未解决小姜发言问题；B选项继续让妈妈说，不利于小姜表达；C选项直接指责妈妈，易引发冲突 。D选项引导妈妈让小姜表达，较为合适。答案：D"}, {"ch": "综合·Ch5", "yr": "2022", "tp": "单选", "q": "社会工作者小霍为脑卒中患者开展了主题为“鼓舞未来”的病友小组活动，通过引导组员学习手指操、非 洲鼓等，促进组员的康复。下列场景中。最有可能出现在小组转折阶段的是（ ）。", "ops": [{"l": "A", "t": "组员们初次接触非洲鼓，对其充满好奇，但因不知如何演奏，不愿尝试", "ok": false}, {"l": "B", "t": "组员老张和老任都认为自己演奏水平更高，彼此埋怨对方演奏出现错误", "ok": true}, {"l": "C", "t": "小霍播放组员的演奏视频，带领他们回顾在“鼓舞未来”小组中的变化", "ok": false}, {"l": "D", "t": "小霍预告“鼓舞未来”非洲鼓文艺汇演时间，邀请组员携家属一同参与", "ok": false}], "ex": "小组转折阶段组员之间会出现竞争、冲突等。A选项主要体现对新事物的陌生与犹豫，未涉及 冲突；C选项回顾变化多在后期成熟阶段；D选项预告活动多在结束阶段。B选项组员因认为自己演奏水平高而 彼此埋怨，属于组员间的冲突，符合转折阶段特点。答案：B"}, {"ch": "综合·Ch5", "yr": "2022", "tp": "单选", "q": "在小组活动的“生命回顾”分享环节中，社会工作者小徐和组员一起听高奶奶分享自己过去的经历，高奶 奶的普通话不太标准，担心别人听不懂，越来越着急，针对这一情况，小徐最恰当的回应是（ ）。", "ops": [{"l": "A", "t": "“您说的故事，以前我从来都没有听说过啊”", "ok": false}, {"l": "B", "t": "“我没有听懂您说的话，您再重新说一遍好吗”", "ok": false}, {"l": "C", "t": "“高奶奶您别着急，慢慢说，我们大家都在听”", "ok": true}, {"l": "D", "t": "“高奶奶您先休息一下，再想想，先请张爷爷说”", "ok": false}], "ex": "高奶奶因普通话不标准担心别人听不懂而着急，此时社会工作者应安抚高奶奶情绪，鼓励她 继续表达。A选项未针对高奶奶着急情况回应；B选项直接说没听懂，可能让高奶奶更着急；D选项打断高奶奶 ，让别人先说不合适。C选项安抚高奶奶别着急，慢慢说，体现关注与鼓励。答案：C"}, {"ch": "综合·Ch5", "yr": "2022", "tp": "单选", "q": "新入职的社会工作者小范与机构督导员讨论面向不同服务对象的小组活动方案，下列小组活动设计中，最 适宜的是（ ）。", "ops": [{"l": "A", "t": "为幼儿园小朋友开设儿童社交小组，将每节时长定为10-20分钟", "ok": true}, {"l": "B", "t": "为处于婚姻危机中的夫妻开设辅导小组，将小组的规模定为30人", "ok": false}, {"l": "C", "t": "为青少年开设的户外拓展训练营，以完成每项拓展活动为最终目标", "ok": false}, {"l": "D", "t": "为小学生开设的性教育小组，将一年级与六年级的学生安排在一起", "ok": false}], "ex": "B选项小组规模30人对于婚姻危机夫妻辅导小组过大，不利于深入交流；C选项户外拓展训练 营不应只以完成活动为最终目标，更应注重青少年成长收获；D选项一年级与六年级小学生认知差异大，不宜 放一起开展性教育小组。A选项幼儿园小朋友注意力集中时间短，每节10 - 20分钟的儿童社交小组设计合理 。答案：A"}, {"ch": "综合·Ch5", "yr": "2022", "tp": "单选", "q": "在小组活动开展过程中，社会工作者老汤发现组员莉莉最近经常迟到，分享也不如以前积极，有时还会故 意转移话题，影响活动进程，为了改变这种情况，老汤最适宜的做法是（ ）。", "ops": [{"l": "A", "t": "放任莉莉，把关注重点转移至其他的组员", "ok": false}, {"l": "B", "t": "运用游戏活跃气氛，以鼓励莉莉回归小组", "ok": true}, {"l": "C", "t": "制定新计划，让莉莉和其他组员协作完成", "ok": false}, {"l": "D", "t": "调整活动时间和地点，方便莉莉参与活动", "ok": false}], "ex": "本题考查小组工作方法的相关知识。正确答案为B。B.运用游戏活跃气氛，以鼓励莉莉回归小组"}, {"ch": "综合·Ch5", "yr": "2022", "tp": "单选", "q": "社会工作者小韩近期开设了“网”外更精彩中学生网络成瘾治疗小组，他运用了多种小组评估方法，下列 资料中，适用于小组过程评估的是（ ）。", "ops": [{"l": "A", "t": "组员上网时长变化记录表", "ok": true}, {"l": "B", "t": "组员行为改变的自我评估报告", "ok": false}, {"l": "C", "t": "组员和小组的目标实现表", "ok": false}, {"l": "D", "t": "小组结束后跟进访谈记录资料", "ok": false}], "ex": "小组过程评估关注的是小组开展过程中的情况。A选项组员上网时长变化记录表，能实时反映 小组过程中组员上网行为的动态变化，适用于过程评估；B组员行为改变的自我评估报告多在后期对整体改变 情况的总结；C组员和小组的目标实现表一般在小组结束看最终成果；D小组结束后跟进访谈记录资料是结束 后的追踪。所以选A。答案：A"}, {"ch": "综合·Ch6", "yr": "2022", "tp": "单选", "q": "下列社会工作者的做法中，最能充分体现地区发展模式特点的是（ ）。", "ops": [{"l": "A", "t": "注重社区任务目标的实现", "ok": false}, {"l": "B", "t": "推动社区自上而下的改变", "ok": false}, {"l": "C", "t": "建立社区非正式支持网络", "ok": false}, {"l": "D", "t": "提升社区居民自组织能力", "ok": true}], "ex": "地区发展模式强调居民参与、自下而上的动员、注重过程目标，提升居民自组织能力符合该 模式特点。A选项注重任务目标不是地区发展模式突出特点；B选项自上而下不符合其自下而上理念；C选项建 立非正式支持网络并非地区发展模式核心特点。 答案：D"}, {"ch": "综合·Ch6", "yr": "2022", "tp": "单选", "q": "某农村社区的青壮年大量外出务工，村里留守老人较多，老人们虽然平时生活能够自理，但普遍担心生病 后在外工作的子女无法及时赶回，没有人照顾自己，社会工作者老周拟采用社区照顾模式，打消老人们的顾 虑，下列老周的做法中，最能体现“由社区照顾”实施策略的是（ ）。", "ops": [{"l": "A", "t": "协助部分老人入住养老机构", "ok": false}, {"l": "B", "t": "筹措资金建设社区老年照顾中心", "ok": false}, {"l": "C", "t": "组织留守老人建立互助小组", "ok": true}, {"l": "D", "t": "动员外出务工的青壮年返乡工作", "ok": false}], "ex": "“由社区照顾”强调社区内资源的利用，让有需要的人在社区中得到照顾。互助小组是依靠 社区内老人自身力量相互照顾，符合“由社区照顾”。A选项入住养老机构属于“在社区照顾”；B选项建设 社区老年照顾中心是提供社区设施，也偏向“在社区照顾”；D选项动员青壮年返乡不属“由社区照顾”策略 。答案：C"}, {"ch": "综合·Ch6", "yr": "2022", "tp": "单选", "q": "社会工作者进入社区之初，应了解社区的基础情况，下列做法中，有助于社会工作者了解社区文化特色的 是（ ）。", "ops": [{"l": "A", "t": "观察社区活动，发现热心社区实务的居民", "ok": false}, {"l": "B", "t": "开展入户调查，掌握社区的人户分离情况", "ok": false}, {"l": "C", "t": "访问社区老人，了解社区的历史与习俗", "ok": true}, {"l": "D", "t": "走访社区组织，分析社区的资源与需求", "ok": false}], "ex": "了解社区文化特色，需要从社区历史、习俗等文化层面入手。A选项观察社区活动找热心居民 ，重点在居民个体，非文化特色；B选项入户调查人户分离情况属于人口信息，与文化特色无关；C选项访问 老人了解社区历史与习俗，直接针对社区文化特色；D选项走访社区组织分析资源与需求，侧重资源需求，并 非文化特色。答案选C。"}, {"ch": "综合·Ch6", "yr": "2022", "tp": "单选", "q": "某社会工作服务机构应接到邀请开展困境儿童服务项目，社会工作者小李及其项目团队在设计好服务方案 后，走访了辖区学校，社会卫生服务中心，未成年人保护工作站等多个组织，了解他们为困境儿童提供服务 的现状，从管理社区资源角度来看，小李及其项目团队所开展的工作属于（ ）。", "ops": [{"l": "A", "t": "资源分析", "ok": true}, {"l": "B", "t": "资源开发", "ok": false}, {"l": "C", "t": "
