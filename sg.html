 {"l": "B", "t": "开放性", "ok": false}, {"l": "C", "t": "平等性", "ok": false}, {"l": "D", "t": "独特性", "ok": false}], "ex": "小琪和小伙伴们结伴上学、做作业、玩游戏且很快乐，体现出他们彼此相互认同，在群体中 找到归属感，这突出了同辈群体认同性的特点。答案：A"}, {"ch": "综合·Ch2", "yr": "2025", "tp": "单选", "q": "社会工作者小黄准备开展青年辅导服务，小黄的叔叔得知后，让自己未就业的儿子去报名参加，并拜托小 黄为自己的儿子介绍一份工作，上述情况中，小黄面临的伦理议题是（ ）", "ops": [{"l": "A", "t": "服务对象自决", "ok": false}, {"l": "B", "t": "矫情同意", "ok": false}, {"l": "C", "t": "双重关系", "ok": true}, {"l": "D", "t": "多元文化", "ok": false}], "ex": "小黄既是社会工作者与服务对象（叔叔儿子）有专业服务关系，同时又因叔叔这层亲属关系 产生了私人关系，这属于典型的双重关系伦理困境。答案：C"}, {"ch": "综合·Ch4", "yr": "2025", "tp": "单选", "q": "某乡镇社会工作服务站通过多样化服务，留守儿童建立社会支持网络。下列社会工作者的服务中，属于社 区照顾模式中“非正式照顾”的是（ ）", "ops": [{"l": "A", "t": "链接乡镇政府资源，为留守儿童及其家长争取政策支持", "ok": false}, {"l": "B", "t": "适时转介，协助有需要的儿童和家长接受专业机构服务", "ok": false}, {"l": "C", "t": "招募和培训邻里志愿者，定期入户探访留守儿童及家长", "ok": true}, {"l": "D", "t": "探访留守儿童所在学校，向班主任了解其学业表现情况", "ok": false}], "ex": "社区照顾模式中非正式照顾指由家庭、亲友、邻里、志愿者等提供的照顾。C选项招募邻里志 愿者入户探访属于非正式照顾。A是链接政府资源，属正式支持；B转介专业机构服务也是正式支持；D向班主 任了解学业情况不属于照顾行为。答案：C"}, {"ch": "综合·Ch6", "yr": "2025", "tp": "单选", "q": "社区工作者小李发现，社区内存在宠物随地大小便、遛狗不牵绳等问题，并引起了部分居民的不满。为此 ，小李主持了一场“文明养宠”议事协商会。下列小李的发言中、运用社区工作会议主持“转述”技巧的是 （ ）", "ops": [{"l": "A", "t": "“李女士刚才发言表示宠物能给人带来乐趣，但宠物主人应当负起看管的责任。”", "ok": true}, {"l": "B", "t": "“最近小区里养宠物的家庭越来越多，给社区环境带来一些问题，大家怎么看？\"", "ok": false}, {"l": "C", "t": "“大家就解决通狗不牵绳问题提了很多好办法，现在我们来讨论如何落地实施。", "ok": false}, {"l": "D", "t": "“王先生介绍了其他社区的经验做法，提我们可以从宠物友好环境建设入手。\"", "ok": false}], "ex": "“转述”技巧是把他人发言的内容重新表述，起到总结、强调作用。选项A中，小李将李女士 发言内容“宠物能给人带来乐趣，但宠物主人应当负起看管的责任”进行了转述；选项B是引出问题，非转述 ；选项C是推动会议进程，非转述；选项D虽然提到王先生介绍经验，但没有像A那样清晰完整地转述王先生的 发言核心内容。答案：A"}, {"ch": "综合·Ch1", "yr": "2025", "tp": "单选", "q": "某地发生水灾后，一家社会工作服务机构与具有公募资格的筹款平台合作，通过线上捐赠和线下义卖等形 式发起“让爱传递”公益募娟活动，上述筹资方式属于（ ）", "ops": [{"l": "A", "t": "私人恳请", "ok": false}, {"l": "B", "t": "电话劝募", "ok": false}, {"l": "C", "t": "项目申请", "ok": false}, {"l": "D", "t": "特别事件筹资活动", "ok": true}], "ex": "题干中因发生水灾这一特别事件，机构通过线上线下形式开展公益募捐活动，属于特别事件 筹资活动。特别事件是社会服务机构通过对特殊事件的处理，引起社会大众对机构和相关事件的关注，进而 筹集资金。答案：D"}, {"ch": "综合·Ch2", "yr": "2025", "tp": "多选", "q": "某社区居民多次向物业服务公司反映，邻居晚上练琴声音很大，影响休息，两家为此经常争吵，物业服务 公司在劝导无果的情况下向社会工作者小冯求助，小冯在服务中保持中立客观立场，安抚双方情绪，尽力劝 导双方站在对方角度思考问题，同时走访周边邻里了解情况。通过小冯的多次调解，双方相互谅解，商定了 合理的解决方案，上述小冯的工作，体现出的社会工作服务伦理责任有（ ）。", "ops": [{"l": "A", "t": "社会工作者对同事的伦理责任", "ok": false}, {"l": "B", "t": "社会工作者对服务对象的伦理责任", "ok": true}, {"l": "C", "t": "社会工作者作为专业人员的伦理责任", "ok": true}, {"l": "D", "t": "社会工作者对机构的伦理责任", "ok": false}, {"l": "E", "t": "社会工作者对社会工作专业的伦理责任", "ok": false}], "ex": "小冯在调解邻里纠纷中，安抚双方情绪、劝导换位思考等工作，是直接服务于服务对象，体 现对服务对象的伦理责任；其保持中立客观立场、运用专业方法调解，体现作为专业人员的伦理责任。答案 ：BC"}, {"ch": "综合·Ch4", "yr": "2025", "tp": "多选", "q": "社会工作者老李策划实施了一个农村留守群体关爱服务项目，下列老李的服务中能够体现阿尔德弗尔 ERG理论关系需要的是（ ）", "ops": [{"l": "A", "t": "开展留守儿童“拥抱你我他”伙伴共成长活动", "ok": true}, {"l": "B", "t": "鼓励留守妇女组织成立“编织手工坊”互助社", "ok": true}, {"l": "C", "t": "链接慈善资源为困境留守老人发放米面油物资", "ok": false}, {"l": "D", "t": "组织农村留守群体参加节日互助关怀活动", "ok": true}, {"l": "E", "t": "动员留守老人参加自我健康管理能力提升讲座", "ok": false}], "ex": "ERG理论中关系需要强调与他人建立和维持良好人际关系。A选项开展伙伴共成长活动，促进 留守儿童间关系；B选项留守妇女成立互助社，增进彼此联系；D选项组织节日互助关怀活动，提升农村留守 群体关系，都体现关系需要。C选项发放物资主要满足生存需要，E选项提升讲座侧重个人成长需要。答案 ：ABD"}, {"ch": "综合·Ch1", "yr": "2025", "tp": "多选", "q": "社会工作者小王分析了所在社会工作服务机构与社区其他组织的互动关系类型，以便确定今后与其他组织 沟通的形式和策略，下列组织中与小王所在机构之间形成授权关系的有（ ）", "ops": [{"l": "A", "t": "购买该机构工作专业服务项目的政府部门", "ok": true}, {"l": "B", "t": "经常与该机构合作举办活动的物业服务公司", "ok": false}, {"l": "C", "t": "与该机构共享活动场地的社区日间照料中心", "ok": false}, {"l": "D", "t": "定期参加该活动机构活动的高校大学生志愿者服务队", "ok": false}, {"l": "E", "t": "委托该机构运营社会工作服务部的街道办事处", "ok": true}], "ex": "授权关系是指一方赋予另一方一定权力或职责。政府部门购买服务、街道办事处委托运营 ，这两种情况下政府部门和街道办事处处于主导、授权地位。而合作举办活动的物业、共享场地的照料中心 、参加活动的志愿者服务队与该机构并非授权关系。答案：AE"}, {"ch": "综合·Ch1", "yr": "2025", "tp": "多选", "q": "社会工作者小任根据外来务工人员的需求，多方筹集资源，帮助他们及其家庭应对困境，还组织开展外来 务工人员与当地居民的联谊活动，协助他们建立和谐友善关系，上述小任的做法，体现出的直接服务角色有 （ ）。", "ops": [{"l": "A", "t": "服务提供者", "ok": true}, {"l": "B", "t": "支持者", "ok": false}, {"l": "C", "t": "关系协调者", "ok": true}, {"l": "D", "t": "治疗者", "ok": false}, {"l": "E", "t": "倡导者", "ok": false}], "ex": "小任多方筹集资源帮助外来务工人员及其家庭应对困境，这体现了服务提供者角色；组织联 谊活动协助建立和谐友善关系，体现了关系协调者角色。答案：AC"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "多选", "q": "“勇往职前”戒毒康复者职业规划小组已进入尾声，为协助组员保持小组经验，更好地应对离开小组的生 活，社会工作者设计了多个环节下列活动中适宜在该阶段开展的有（ ）。", "ops": [{"l": "A", "t": "模拟经营：体验超市生活", "ok": true}, {"l": "B", "t": "新的认知：重拾自我潜能", "ok": false}, {"l": "C", "t": "资源地图：获取周边支持", "ok": true}, {"l": "D", "t": "重构小组：担负小组责任", "ok": false}, {"l": "E", "t": "小组聚会：重逢在下季度", "ok": true}], "ex": "本题考查小组工作方法的相关知识。正确答案为ACE。A.模拟经营：体验超市生活；C.资源地图：获取周边支持；E.小组聚会：重逢在下季度"}, {"ch": "综合·Ch1", "yr": "2025", "tp": "多选", "q": "社会工作者小周向督导者蔡老师表示最近压力大，自己负责的留守儿童项目推进不顺利，以下选项中体现 了支持者督导内容的有（ ）", "ops": [{"l": "A", "t": "查阅小周项目服务记录", "ok": false}, {"l": "B", "t": "教导小周相关服务技巧", "ok": false}, {"l": "C", "t": "帮助小周缓解焦虑情绪", "ok": true}, {"l": "D", "t": "提升小周工作安全感", "ok": true}, {"l": "E", "t": "引导小周发现工作成效", "ok": true}], "ex": "支持者督导强调给予被督导者心理和情感支持等。A选项查阅服务记录更倾向于行政性督导 ；B选项教导服务技巧属于教育性督导。C帮助缓解焦虑情绪、D提升工作安全感、E引导发现工作成效，都从 心理支持、增强信心等方面给予小周支持，属于支持者督导内容。答案：CDE"}, {"ch": "综合·Ch3", "yr": "2025", "tp": "多选", "q": "关于大众传媒对人类行为的影响的说法正确的有（ ）。", "ops": [{"l": "A", "t": "大众传媒可以为受众提供支持，从而增强其固有观念和行为", "ok": true}, {"l": "B", "t": "可以使受众改变原有的立场", "ok": true}, {"l": "C", "t": "可以通过重复传播争议内容直接改变受众行为", "ok": false}, {"l": "D", "t": "可以提供信息引导人们的行为", "ok": true}, {"l": "E", "t": "可以为多数受众提供行为规范", "ok": true}], "ex": "大众传媒对人类行为的影响主要包括：通过信息传递，为受众提供支持增强固有观念和行为 （A 项）；能够改变受众原有的立场（B 项）；提供信息引导人们行为（D 项）；还能为受众提供行为规范 （E 项）。而大众传媒一般不会通过重复传播争议内容直接改变受众行为，C 项说法不准确。答案：ABDE"}, {"ch": "综合·Ch4", "yr": "2025", "tp": "多选", "q": "社会工作者老田为青春期小宁提供个案服务，老田分享了自己高中时与父母相处的经历，向小宁介绍了社 交技巧以及在遇到情绪问题时的解决方法，让他结合自己的情况加以运用。上述老田做法运用的影响技巧有 （ ）", "ops": [{"l": "A", "t": "建议", "ok": true}, {"l": "B", "t": "对质", "ok": false}, {"l": "C", "t": "自我披露", "ok": true}, {"l": "D", "t": "澄清", "ok": false}, {"l": "E", "t": "提供信息", "ok": true}], "ex": "老田分享自己高中时与父母相处经历，属于自我披露；介绍社交技巧及情绪问题解决方法 ，属于提供信息；让小宁结合自身情况运用，属于建议。对质是指出矛盾，澄清是对模糊内容清晰化，题中 未体现。答案：ACE。"}, {"ch": "综合·Ch6", "yr": "2025", "tp": "多选", "q": "在“信任你我\"居民骨干议事能力提升小组的第一次活动中，社会工作者小吴带领小组时与发起者保持平 视，还注意与其他组员进行目光交流，当不明白组员表达的意思时，小吴耐心沟通，直到完全理解，上述小 吴的做法，运用的小组工作技巧有（ ）", "ops": [{"l": "A", "t": "及时进行小结", "ok": false}, {"l": "B", "t": "专注与倾听", "ok": true}, {"l": "C", "t": "适当帮助梳理", "ok": false}, {"l": "D", "t": "对信息进行磋商", "ok": true}, {"l": "E", "t": "适当自我表露", "ok": false}], "ex": "小吴与发起者保持平视、与组员目光交流，耐心沟通直到理解组员意思，体现了专注倾听组 员表达。不明白意思时耐心沟通直至理解，这是对信息进行磋商，确认信息准确含义。答案：BD"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "多选", "q": "在“抗压有方”高血压患者支持小组中，社会工作者老马设计了“我的健康我做主\"环节，邀请组员就血 压自我管理进行讨论。组员老田对此深有感触，不停地讲述自己的患病经历，其他组员纷纷响应；组员老张 分享高血压用药经验时，因与组员老李的观点不同而发生争执。面对上述情况，老马综合运用多种技巧进行 回应。下列做法中，体现出引导技巧的有（ ）", "ops": [{"l": "A", "t": "通过角色扮演方式帮助老李和老张彼此相互理解", "ok": false}, {"l": "B", "t": "小组讨论时，规定每位组员的发言时间为1分钟", "ok": true}, {"l": "C", "t": "鼓励组员运用头脑风暴法讨论血压自我管理方法", "ok": true}, {"l": "D", "t": "为使讨论更加充分，请未发言的组员依次来表达", "ok": true}, {"l": "E", "t": "提示组员将讨论重点回归到血压自我管理的方法", "ok": true}], "ex": "题干中，小组成员在讨论时出现两种情况：老田一直讲自己的患病经历，其他组员跟着回应 ，导致偏离主题。老张与老李因用药经验观点不同而发生争执。社会工作者要运用 引导技巧 来应对这种情 况。 “引导”在小组工作中一般包括：保持讨论方向不偏离主题。调节小组互动，让成员更有序参与。鼓励平等 发言与集思广益。处理冲突方法，不是解决冲突，而是引导到建设性讨论。 看选项： A 通过角色扮演方式帮助老李和老张彼此相互理解→ 角色扮演是深入地处理冲突，是直接介入冲突解决，偏 向于 干预/调解技巧，不完全是“引导”，但可以结合引导思路。不过这一项更接近调解不是本次强调的 “引导”核心。 B 小组讨论时，规定每位组员的发言时间为1分钟→ 这种结构性控制时间是为了保证秩序、让更多人发言 ，是典型的引导技巧。 C 鼓励组员运用头脑风暴法讨论血压自我管理方法→ 头脑风暴是激发组员参与、围绕主题产生想法，属于引 导讨论方向的技巧。 D 为使讨论更加充分，请未发言的组员依次来表达→ 这也是引导，让参与更均衡，把握讨论节奏。 E 提示组员将讨论重点回归到血压自我管理的方法→ 直接引导回到主题，这是典型的引导技巧。 但 A 项是角色扮演，侧重换位思考，不适合快速解决争执、回到主题的表层引导，它更偏向深度处理冲突。 题干问“综合运用多种技巧进行回应”，其中“引导”技巧主要指控制方向、秩序、焦点，而不是深度冲突 解决。答案：BCDE"}, {"ch": "综合·Ch4", "yr": "2025", "tp": "多选", "q": "为了照顾刚出生的孩子，小李辞职在家做全职妈妈，家里的日常开销由丈夫一个人负担。小李的丈夫每天 工作时间长，无瑕顾及妻儿，夫妻间因缺少沟通经常互相猜疑。小李担心这样会影响夫妻关系，向社会工作 者小宋求助。小宋鼓励小李讲诉自己的烦恼，询问她对夫妻关系的认识，用封闭式的问题了解小李的家庭收 入和社保情况，并让小李填写心理健康量表。上述服务中，小宋收集资料的方式有（ ）", "ops": [{"l": "A", "t": "参与式观察法", "ok": false}, {"l": "B", "t": "自我陈述", "ok": true}, {"l": "C", "t": "对答方式", "ok": true}, {"l": "D", "t": "结构式调查表", "ok": true}, {"l": "E", "t": "非结构式调查表", "ok": false}], "ex": "小宋鼓励小李讲述烦恼，这是让小李自我陈述；用封闭式问题了解情况属于对答方式；让小 李填写心理健康量表是结构式调查表。答案：BCD"}, {"ch": "综合·Ch5", "yr": "2025", "tp": "多选", "q": "小丁毕业2月车祸，左腿残疾无法正常工作，不愿交流，丧失信心，社工老杨运用心理社会治疗模式为小 丁提供个案服务，对小丁的分析中，符合心理社会治疗模式基本假设的有（ ）", "ops": [{"l": "A", "t": "小丁在与周围人的交往过程中形成对自己的基本认识", "ok": true}, {"l": "B", "t": "生理、心理、社会三方面的相互作用影响小丁的成长", "ok": true}, {"l": "C", "t": "小丁车祸后缺少社会支持网格是他问题形成原因之一", "ok": true}, {"l": "D", "t": "虽因行动不便常被困扰，依然有能力面对挑战", "ok": true}, {"l": "E", "t": "改变不了丧失信心的关键是帮助他输入生活和工作新希望", "ok": false}], "ex": "心理社会治疗模式基本假设强调人生活在特定社会环境中，生理、心理和社会三个层面因素 相互作用影响人的成长和问题形成，同时人有潜能。A项体现人在与周围人交往形成自我认识，符合假设 ；B项表明生理、心理、社会相互作用影响成长，符合；C项指出缺少社会支持是问题原因，符合社会环境影 响人的假设；D项体现人有面对挑战能力即潜能，符合。E项输入新希望并非心理社会治疗模式基本假设内容 。答案：ABCD"}, {"ch": "综合·Ch6", "yr": "2025", "tp": "多选", "q": "社区工作者牢记在充分了解社区需求和掌握社区资源状况的基础上，计划成立志愿者服务队，协助工作站 社区环境治理和安全排查工作，老季在建立志愿者服务队的过程中，适宜开展的工作有（ ）", "ops": [{"l": "A", "t": "召集几位关心社区事务的居民定期开会讨论相关问题，逐步增加人数", "ok": true}, {"l": "B", "t": "研究志愿服务目标人群，设计服务方案，开展志愿服务成效评估工作", "ok": false}, {"l": "C", "t": "推选大家能够接受，且自己也愿意投入时间和精力的成员担任负责人", "ok": true}, {"l": "D", "t": "探讨扩大组织影响力的策略，运用社会营销的方式宜传志愿服务精神", "ok": false}, {"l": "E", "t": "思考筹措志愿服务队的活动经费，了解社区各类服务经费的申请程序", "ok": true}], "ex": "成立志愿者服务队，A选项通过召集关心社区事务居民逐步扩大队伍可行；C选项推选合适负 责人利于团队管理；E选项思考经费筹措及了解申请程序，保障服务队活动开展。B中志愿服务成效评估是后 续工作，此时成立阶段不太适宜；D扩大影响力宣传是成立后工作，当下重点是组建队伍。答案：ACE"}, {"ch": "综合·Ch2", "yr": "2025", "tp": "多选", "q": "坚守社会工作服务专业伦理守则对指导社会工作实践具有重大作用，下列说法中，属于社会工作服务专业 伦理守则作用的有（ ）", "ops": [{"l": "A", "t": "维护社会正义", "ok": true}, {"l": "B", "t": "改善服务机构的效益", "ok": false}, {"l": "C", "t": "保护服务对象的权益", "ok": true}, {"l": "D", "t": "帮助社会工作者解决伦理难题", "ok": true}, {"l": "E", "t": "促进社会服务机构的能力建设", "ok": false}], "ex": "社会工作专业伦理守则的核心作用包括： A 维护社会正义 伦理守则要求社工致力于消除歧视、促进社会公平，是核心价值观的体现。 C 保护服务对象的权益 伦理守则的首要目标是确保服务对象的尊严、权利和福祉得到保障。 D 帮助社会工作者解决伦理难题 为社工在面临伦理困境时提供价值指引和决策框架。 B 改善服务机构的效益 属于机构管理或运营目标，非伦理守则的直接作用。 E 促进社会服务机构的能力建设 属于组织发展范畴，与伦理守则的规范性、价值性功能无直接关联。答案 ：ACD 23"}, {"ch": "实务·Ch1", "yr": "2021", "tp": "单选", "q": "社会工作者大张注意到，每次说到爸爸妈妈离婚这件事时，小刚都会发火或者沉默。大张求教心理学专家 魏 推进夏令营活动，A制订工作方 案是筹备阶段；C评估活动成效是结束阶段；D表彰优秀志愿者一般也是在活动结束后。答案选B。"}, {"ch": "实务·Ch4", "yr": "2021", "tp": "单选", "q": "为落实应对人口老龄化国家战略，某社会工作服务机构整合资源，为社区老年人提供多项服务以提高社区 老年人的健康意识和行动能力。其中，社会工作者运用资源共享方式开展的服务是（ ）。", "ops": [{"l": "A", "t": "请社区卫生服务中心的工作人员为社区的老年人进行体检", "ok": false}, {"l": "B", "t": "请社区干部与社会工作者一起入户了解老年人的健康需求", "ok": false}, {"l": "C", "t": "利用自有教师资源和相邻社区的场地合作举办老年健康讲座", "ok": true}, {"l": "D", "t": "利用自己机构的场地资源为目标人群开办老年健康教育小组", "ok": false}], "ex": "资源共享强调不同主体之间资源的共同利用。A选项是社区卫生服务中心单方面提供服务 ；B选项社区干部与社工入户了解需求并非资源共享开展服务；C选项利用自有教师资源和相邻社区场地，体 现了双方资源共享合作开展讲座；D选项只是利用自身机构场地，未涉及与其他主体共享资源。答案：C"}, {"ch": "实务·Ch4", "yr": "2021", "tp": "单选", "q": "医务社会工作者小许在探访一名肺癌晚期住院患者时发现，面对日渐恶化的病情。该患者及其子女处于极 度悲伤和绝望中，其子女因联系社区照护机构屡屡受挫而身心疲惫。小许综合评估了该患者家庭的状况，用 冥想与正念治疗对该患者及其子女进行干预以缓解他们的身心压力。小许的干预过程属于舒缓疗护中的（ ）。", "ops": [{"l": "A", "t": "情绪心理辅导", "ok": true}, {"l": "B", "t": "临终关怀", "ok": false}, {"l": "C", "t": "照护支持服务", "ok": false}, {"l": "D", "t": "哀伤辅导", "ok": false}], "ex": "用冥想与正念治疗缓解患者及其子女身心压力，主要针对的是情绪和心理方面的问题。答案 ：A"}, {"ch": "实务·Ch4", "yr": "2021", "tp": "单选", "q": "钱老在某医院老年科长期住院治疗。新冠肺炎疫情防控期间，为避免院内交叉感染，医院限制了住院患者 家属探望人数和时间。这些措施使钱老产生了不安的感觉，他对外来人员异常敏感。生怕他们带来病毒，为 此，钱老常无端指责医护人员、向同病室病友发脾气、摔东西。老年科将钱老转介给医院社会工作部，医务 社会工作者拟运用个案管理方法进行干预，最适宜的干预措施是（ ）。", "ops": [{"l": "A", "t": "语言治疗", "ok": false}, {"l": "B", "t": "行为治疗", "ok": false}, {"l": "C", "t": "依从性管理", "ok": false}, {"l": "D", "t": "压力管理", "ok": true}], "ex": "钱老因医院防控措施产生不安，进而出现无端指责、发脾气等行为，这是面对压力的不良应 对表现。个案管理方法干预，重点应是帮助钱老应对压力。答案：D.压力管理"}, {"ch": "实务·Ch1", "yr": "2021", "tp": "单选", "q": "社会工作者小刘在某工业园区开展企业社会工作服务时了解到，有的工厂没有向员工提供足够的安全防护 用品；有的员工受伤后才意识到工作岗位存在安全隐患；有的员工心存侥幸，对职业安全缺乏足够重视。针 对上述情况，小刘计划开办职业安全与健康教育小组，帮助员工学习相关知识，提升自我保护意识和能力 ，小刘开展该小组工作的正确流程是（ ）。", "ops": [{"l": "A", "t": "需求评估—招募组员—确定目标—制订小组计划书", "ok": false}, {"l": "B", "t": "招募组员—需求评估—确定目标—制订小组计划书", "ok": false}, {"l": "C", "t": "需求评估—确定目标—招募组员—制订小组计划书", "ok": true}, {"l": "D", "t": "制订小组计划书—确定目标—招募组员—需求评估", "ok": false}], "ex": "开展小组工作，首先要对服务对象的需求进行评估，了解真实情况，才能确定合理目标，之 后根据目标招募合适组员，最后制订详细的小组计划书。所以正确流程是需求评估—确定目标—招募组员 —制订小组计划书。答案：C"}, {"ch": "实务·Ch1", "yr": "2021", "tp": "单选", "q": "某快递公司员工小刘在送快递路途中，送货车侧翻导致右腿粉碎性骨折，手术半年后仍不能正常上班，需 要继续治疗，正常生活受到影响，小刘要求企业追加医疗费用遭到拒绝，遂向社会工作者小张求助。针对小 刘的上述情况，小张在为小刘制订服务计划时，需设定的工作目标是（ ）。", "ops": [{"l": "A", "t": "协调劳资双方的冲突", "ok": true}, {"l": "B", "t": "增强小刘的身体素质", "ok": false}, {"l": "C", "t": "平衡小刘工作和生活", "ok": false}, {"l": "D", "t": "为小刘购买康复辅具", "ok": false}], "ex": "小刘因工伤与企业就追加医疗费用产生冲突，社会工作者此时主要目标应是解决这一矛盾冲 突，协调劳资双方关系。答案：A 多项选择题"}, {"ch": "实务·Ch4", "yr": "2021", "tp": "多选", "q": "新冠肺炎疫情给社会生活带来巨大冲击，个人、家庭和社区呈现出新的多样性需求，特别是脆弱群体需要 更多的资源支持。社会工作者小卫联系了公益基金会，与街道办事处共同为社区低收入家庭和独居老人提供 了防疫和日常生活用品。小卫所做的社会工作介入包括了（ ）。", "ops": [{"l": "A", "t": "能力的提升", "ok": false}, {"l": "B", "t": "系统的改变", "ok": false}, {"l": "C", "t": "资源的运用", "ok": true}, {"l": "D", "t": "部门的合作", "ok": true}, {"l": "E", "t": "环境的改善", "ok": false}], "ex": "小卫联系公益基金会，体现了资源的运用（C选项）；与街道办事处共同开展工作，体现了部 门的合作（D选项）。答案：CD"}, {"ch": "实务·Ch1", "yr": "2021", "tp": "多选", "q": "针对新冠肺炎疫情居家防控期间多发的亲子关系紧张问题，某社会工作服务机构通过组建社区家长微信群 ，开办“家长加油站”线上小组。经过六周线上服务，基本实现了帮助家长减压和改善亲子关系的服务目标 ，进入结案阶段。此时，小组成员菲菲妈妈在小组微信群中说自己和孩子的关系又回到了参加小组前的状态 ，不知该如何处理；还说此时结束小组，社会工作者太不负责任了。菲菲妈妈的这些表现属于结案期服务对 象负面反应中的（ ）。", "ops": [{"l": "A", "t": "愤怒", "ok": false}, {"l": "B", "t": "倒退", "ok": true}, {"l": "C", "t": "否认", "ok": false}, {"l": "D", "t": "依赖", "ok": false}, {"l": "E", "t": "抱怨", "ok": true}], "ex": "菲菲妈妈说关系回到参加小组前状态，这体现了“倒退”，即回复到以前不好的状态；说社 会工作者不负责任，这属于“抱怨”，对社会工作者的服务表示不满。答案：BE"}, {"ch": "实务·Ch2", "yr": "2021", "tp": "多选", "q": "新修订的《中华人民共和国未成年人保护法》颁布实施后，各地积极行动。陆续建立了未成年人保护服务 体系。某地未成年人保护中心计划采用“风险预防、发现报告、康复回归”的服务流程开展儿童保护服务。 根据该服务流程，儿童社会工作者需要开展的工作内容包括（ ）。", "ops": [{"l": "A", "t": "根据儿童的受侵害程度和父母的监护能力完成监护处置", "ok": true}, {"l": "B", "t": "争取政策支持，建立跨部门的未成年人保护协调工作机制", "ok": false}, {"l": "C", "t": "为进入国家替代照顾服务体系中的受侵害儿童寻找寄养服务", "ok": true}, {"l": "D", "t": "依托公益慈善服务机构对辖区内有儿童侵害风险的家庭进行评估", "ok": true}, {"l": "E", "t": "对照政策界定的服务对象，定期发放儿童津贴，提供基础福利服务", "ok": true}], "ex": "本题考查儿童社会工作实务。正确答案为ACDE。A.根据儿童的受侵害程度和父母的监护能力完成监护处置；C.为进入国家替代 yr": "2021", "tp": "多选", "q": "老张离异多年，女儿正上高中，半年前，老张因工伤落下残疾，再没找到工作。社会工作者小王到老张家 了解情况，通过与老张交谈及多次走访老张的邻居，了解其就业困难情况及原因，希望通过精准评估，为老 张制订就业救助方案。小王为获得评估老张情况的相关资料，采用的方法有（ ）。", "ops": [{"l": "A", "t": "直接询问", "ok": true}, {"l": "B", "t": "家庭探访", "ok": true}, {"l": "C", "t": "间接了解", "ok": true}, {"l": "D", "t": "使用量表", "ok": false}, {"l": "E", "t": "查找二手资料", "ok": false}], "ex": "“与老张交谈”属于直接询问；“走访老张邻居”属于间接了解；“到老张家”属于家庭探 访。未提及使用量表和查找二手资料。答案：ABC"}, {"ch": "实务·Ch1", "yr": "2021", "tp": "多选", "q": "某地突降大雨造成山体滑坡，一酒店受滑坡影响发生坍塌，经合力搜救，仍有17人遇难。遇难者家属难以 接受亲人离世的残酷事实，陷入极度悲伤中。某社会工作服务机构参与到应急援助中，对遇难者家属进行危 机干预，进行危机干预前需进行评估，评估的重点应包括（ ）。", "ops": [{"l": "A", "t": "危机的重要性", "ok": true}, {"l": "B", "t": "服务对象的情绪状态", "ok": true}, {"l": "C", "t": "服务对象的满意度", "ok": false}, {"l": "D", "t": "服务对象的支持系统", "ok": true}, {"l": "E", "t": "选择与应急的机制", "ok": true}], "ex": "危机干预评估重点关注危机的严重程度（重要性），服务对象情绪状态，其拥有的支持系统 以及可选择应对危机的机制。而服务对象满意度此时并非危机干预前评估重点。答案：ABDE"}, {"ch": "实务·Ch12", "yr": "2021", "tp": "多选", "q": "某高校社会工作专业师生到彝族村落参与乡村振兴工作，为获得该村“集体性”问题的认识，掌握村落情 况，他们到乡政府借阅了《彝族村落历史地理和自然资源》；查看了该村近年经济发展状况的数据资料；深 入村民家中访问，与村民开座谈会，掌握了大量一手资料，为开展服务提供了依据。社会工作专业师生对该 村社区问题进行分析的方法包括（ ）。", "ops": [{"l": "A", "t": "查阅统计资料", "ok": true}, {"l": "B", "t": "查阅研究报告", "ok": true}, {"l": "C", "t": "查阅媒体报道", "ok": false}, {"l": "D", "t": "访问社区居民", "ok": true}, {"l": "E", "t": "进行民意调查", "ok": false}], "ex": "到乡政府借阅《彝族村落历史地理和自然资源》属于查阅研究报告 ；查看该村近年经济发展 状况数据资料属于查阅统计资料；深入村民家中访问、与村民开座谈会属于访问社区居民。题干未提及查阅 媒体报道和进行民意调查。答案：ABD"}, {"ch": "实务·Ch12", "yr": "2021", "tp": "多选", "q": "四和里是老旧小区，社会工作者为开展社区服务到该社区进行需求评估。居民们说，这里胡同狭窄，私家 车越来越多，通行越来越不安全；社区工作者发现，早晨胡同早点摊前排起的长龙常常堵塞交通；街道办事 处的调查报告也认为该社区环境和设施需要规划重整。根据布雷德绍的需求分类，上述需求反映了居民的类 型包括（ ）。", "ops": [{"l": "A", "t": "感觉性需求", "ok": true}, {"l": "B", "t": "表达性需求", "ok": true}, {"l": "C", "t": "规范性需求", "ok": true}, {"l": "D", "t": "比较性需求", "ok": false}, {"l": "E", "t": "物质性需求", "ok": false}], "ex": "居民说胡同狭窄，私家车多通行不安全，这是居民自身主观感受到的，属于感觉性需求。 社 区工作者看到早点摊堵塞交通，居民通过排队买早点这种行为表现出对早点的需求，同时早点摊堵塞交通也 反映居民对畅通交通的需求，这属于表达性需求。 街道办事处调查报告认为社 l": "D", "t": "获得良好的家庭生活", "ok": true}], "ex": "发展性需要是指儿童成长过程中，为了身心发展需要获得的条件。A选项经济帮助、B选项基 本生活照料属于生存需要；C选项与同伴交流沟通虽然重要，但相比之下，对于丁丁因家庭变故导致家庭生活 缺失，获得良好家庭生活对其身心发展更关键，属于发展性需要。答案：D"}, {"ch": "实务·Ch2", "yr": "2022", "tp": "单选", "q": "社会工作者小王发现社区内有一些准妈妈被即将面临的新生儿养育问题所困扰，为帮助她们学习育儿知识 和技巧，小王组织了“新手妈妈训练营”，根据儿童社会工作服务的分类，上述服务属于（ ）。", "ops": [{"l": "A", "t": "支持性儿童福利服务", "ok": true}, {"l": "B", "t": "补充性儿童福利服务", "ok": false}, {"l": "C", "t": "替代性儿童福利服务", "ok": false}, {"l": "D", "t": "儿童保护服务", "ok": false}], "ex": "支持性儿童福利服务主要是为儿童及其家庭提供的支持，包括亲职辅导等，帮助父母提升育 儿能力。题中社会工作者小王组织“新手妈妈训练营”帮助准妈妈学习育儿知识技巧，属于亲职辅导，属于 支持性儿童福利服务。答案：A"}, {"ch": "实务·Ch2", "yr": "2022", "tp": "单选", "q": "某村社会工作者小张对本村留守儿童摸排后发现，留守儿童课后娱乐方式单一，沉迷手机游戏的情况很普 遍，为改善这一现状，小张在本村儿童之家举办“凤凰花助飞成长营”，为留守儿童提供适宜的文学读物 ，定期开设科学探索课堂，激发他们的求知欲和探索精神，小张上述服务满足了留守儿童的（ ）需要。", "ops": [{"l": "A", "t": "生存", "ok": false}, {"l": "B", "t": "受保护", "ok": false}, {"l": "C", "t": "发展", "ok": true}, {"l": "D", "t": "社会化", "ok": false}], "ex": "小张通过举办活动提供文学读物、开设探索课堂，激发求知欲和探索精神，这是在助力留守 儿童个人能力提升和全面发展。生存主要侧重基本生活保障；受保护强调免受伤害；社会化侧重于学习社会 规范和角色等融入社会。这里主要体现发展需要。答案：C"}, {"ch": "实务·Ch2", "yr": "2022", "tp": "单选", "q": "按照儿童收养服务的相关程序，社会工作者小陆为失依儿童乐乐提供收养服务，协助收养家庭在当地民政 部门完成了登记，乐乐正式进入收养家庭生活，下一步小陆应提供的服务内容是（ ）。", "ops": [{"l": "A", "t": "评估结案", "ok": false}, {"l": "B", "t": "跟踪回访", "ok": true}, {"l": "C", "t": "家庭培训", "ok": false}, {"l": "D", "t": "信息发布", "ok": false}], "ex": "儿童被收养进入家庭后，接下来社会工作者通常要做的是跟踪回访，了解儿童在收养家庭的 适应情况等后续事宜。A选项评估结案一般是一系列服务结束时才做；C选项家庭培训通常在收养过程中前期 开展；D选项信息发布也是前期为给儿童寻找收养家庭时的操作。答案：B"}, {"ch": "实务·Ch2", "yr": "2022", "tp": "单选", "q": "某社区内一些年轻父母与孩子存在亲子沟通问题。父母觉得孩子们的要求太多，太折腾，孩子们觉得父母 不理解他们。针对这一状况，某社会工作服务机构利用双休日开设了亲子平行小组，帮助家庭增强亲子间的 有效沟通和互动，上述儿童社会工作服务内容属于家庭支持服务中的（ ）。", "ops": [{"l": "A", "t": "家庭辅导", "ok": false}, {"l": "B", "t": "婚姻辅导", "ok": false}, {"l": "C", "t": "儿童辅导", "ok": false}, {"l": "D", "t": "亲职辅导", "ok": true}], "ex": "本题考查儿童社会工作实务。正确答案为D。D.亲职辅导"}, {"ch": "实务·Ch4", "yr": "2022", "tp": "单选", "q": "“十四五”国家老龄事业和养老服务体系规划》提出，积极开展家庭病床、上门巡诊等居家医疗服务，不 断增加老年健康服务资源供给，不断扩大人才队伍。上述规划将更好地满足老年人（ ）的需要。", "ops": [{"l": "A", "t": "健康维护", "ok": true}, {"l": "B", "t": "居家安全", "ok": false}, {"l": "C", "t": "社会参与", "ok": false}, {"l": "D", "t": "就业休闲", "ok": false}], "ex": "规划中提到开展居家医疗服务、增加老年健康服务资源供给等，这些举措核心围绕老年人健 康方面。B选项居家安全强调居住环境安全，未体现；C选项社会参与指参与社会活动，不符题意；D选项就业 休闲与规划内容无关。所以主要满足的是老年人健康维护的需要。答案：A"}, {"ch": "实务·Ch4", "yr": "2022", "tp": "单选", "q": "56岁的李大爷由保姆照顾其日常生活起居，社会工作者小杨到李大爷家探访发现，李大爷的卧室凌乱，桌 上放着几个用过的碗碟，还有半碗吃剩的稀饭，能闻到房间里有异味，室温很低，但李大爷衣着单薄，衣服 上有不少食物的残渣。根据“恶意对待老人问题的综合描述”，小杨发现李大爷的问题属于（ ）", "ops": [{"l": "A", "t": "疏于照顾", "ok": true}, {"l": "B", "t": "身体虐待", "ok": false}, {"l": "C", "t": "经济虐待", "ok": false}, {"l": "D", "t": "心理虐待", "ok": false}], "ex": "从题中描述可知，李大爷居住环境差，饮食起居没得到妥善照顾，衣着单薄，这体现出保姆 对李大爷在生活照料方面的疏忽，符合疏于照顾的特征。答案：A。"}, {"ch": "实务·Ch2", "yr": "2022", "tp": "单选", "q": "丁大爷的独子在交通事故中丧生，儿媳受重伤，老伴得知噩耗后突发心脏病入院，丁大爷一个人既要跑医 院，又要带孙子，分身乏术，心力交瘁，社会工作者小齐了解情况后，协助丁大爷联络家政服务，与医院沟 通安排护工等，小齐的上述做法，是为丁大爷家庭提供 （ ）", "ops": [{"l": "A", "t": "救助性服务", "ok": false}, {"l": "B", "t": "支持性服务", "ok": true}, {"l": "C", "t": "权益保障服务", "ok": false}, {"l": "D", "t": "丧亲辅导服务", "ok": false}], "ex": "小齐协助丁大爷联络家政服务、安排护工等，是在为这个处于困境的家庭提供实际的支持与 帮助，以缓解家庭照顾压力，属于支持性服务。答案：B"}, {"ch": "实务·Ch12", "yr": "2022", "tp": "单选", "q": "针对社区内老年人因中风导致的居家照顾需求大的情况，某社会工作服务机构拟开展老年人社区照顾服务 。该机构社会工作者多方了解需求，制订相应的服务方案。在下列需求评估中，属于宏观层面评估的是（ ）。", "ops": [{"l": "A", "t": "社区老年人口中风的比例", "ok": true}, {"l": "B", "t": "老年人照护者的不同需求", "ok": false}, {"l": "C", "t": "服务方案评估的总体要求", "ok": false}, {"l": "D", "t": "老年人居家照顾个体需求", "ok": false}], "ex": "宏观层面评估关注社区整体相关状况。A选项社区老年人口中风的比例，涉及整个社区老年人 群体的中风情况，属于宏观层面；B选项老年人照护者需求针对的是照护者群体，并非社区整体；C选项服务 方案评估总体要求不属于需求评估范畴；D选项老年人居家照顾个体需求是微观层面。答案：A"}, {"ch": "实务·Ch2", "yr": "2022", "tp": "单选", "q": "安女士与丈夫结婚一年，家里大小事情都由丈夫决定，自己的意见很少被听取。夫妻俩矛盾不断，关系紧 张，安女士感到很困扰，向社会工作者小肖求助。针对上述情况，小肖提供服务时应遵循的性别视角家庭工 作原则是（ ）。", "ops": [{"l": "A", "t": "注意保持工作与家庭生活平衡", "ok": false}, {"l": "B", "t": "调整家庭权力关系以避免家庭冲突", "ok": true}, {"l": "C", "t": "尊重和接纳家庭形式的多样性", "ok": false}, {"l": "D", "t": "强调父亲职责与母亲职责同样重要", e}, {"l": "B", "t": "设计班会的活动策划书", "ok": true}, {"l": "C", "t": "熟练掌握班会的活动环节", "ok": false}, {"l": "D", "t": "开展班会的满意度评估", "ok": false}], "ex": "主题班会工作流程，确定主题后，接下来应设计活动策划书，它是后续准备物资、熟悉环节 等的基础。答案：B"}, {"ch": "实务·Ch12", "yr": "2023", "tp": "单选", "q": "社会工作者小李在街道、社区和驻地单位的支持下，搭建了社区协商议事平台，培育社区社会组织，鼓励 居民积极参与文明社区建设志愿服务活动，引导居民形成“社区是我家，建设靠大家”的思想意识。小李以 上举措的目的是（ ）", "ops": [{"l": "A", "t": "协助制订实施社区发展规划", "ok": false}, {"l": "B", "t": "培育社区归属感和认同感", "ok": true}, {"l": "C", "t": "带领居民参与社区发展规划", "ok": false}, {"l": "D", "t": "协调和化解社区矛盾纠纷", "ok": false}], "ex": "小李搭建协商平台、培育社会组织、鼓励居民参与志愿服务，引导居民形成“社区是我家 ，建设靠大家”意识，这些举措都是围绕增强居民对社区的情感联系，培育居民对社区的归属感和认同感。 答案：B"}, {"ch": "实务·Ch4", "yr": "2023", "tp": "单选", "q": "社会工作者小杨根据当地居家养老政策的相关要求，策划“老年餐桌”项目，为社区内老年人提供送餐和 精神慰藉服务。在服务项目策划中期，小杨应做的工作是（ ）", "ops": [{"l": "A", "t": "设计项目成效评估的方法", "ok": false}, {"l": "B", "t": "分析社区内的老年人口规模", "ok": false}, {"l": "C", "t": "了解已有类似服务的情况", "ok": false}, {"l": "D", "t": "评估项目执行者的素质能力", "ok": true}], "ex": "答案：D社区服务(活动)策划是一个理性的过程，分为三个时期：①在策划之初，对社区问题 和需求进行了科学地评估，并广泛地征求了社区居民或服务对象的意见；②在策划中期，充分考虑资源状况 ，估计工作人员素质和能力，订立服务(活动)目标，规划服务内容、服务流程和人员分工；③在策划后期 ，要确定服务(活动)的成效评估方法。因此，在服务项目策划中期，社会工作者应做的工作是评估项目执行 者的素质能力。"}, {"ch": "实务·Ch12", "yr": "2023", "tp": "单选", "q": "在乡村振兴的背景下，某社会工作服务机构组织高校专业师生宣讲环保知识，发挥“新乡贤”社区骨干的 带头作用，利用“绿色志愿者”人力资源，有组织、有计划地开展“保护环境，从我做起”的服务项目。该 机构的做法属于社区资源链接方式中的（ ）。", "ops": [{"l": "A", "t": "资源配置", "ok": true}, {"l": "B", "t": "资源共享", "ok": false}, {"l": "C", "t": "资源整合", "ok": false}, {"l": "D", "t": "资源互补", "ok": false}], "ex": "本题考查社会工作实务通用过程。正确答案为A。A.资源配置"}, {"ch": "实务·Ch4", "yr": "2023", "tp": "单选", "q": "医务社会工作者小康随医生查房时发现，周奶奶不吃不喝，一直哭泣。小康在访谈中了解到，周奶奶早年 丧偶，与独子大庆共同生活。大庆至今未婚，近期被诊断为胰腺癌晚期。周奶奶伤心地对小康说:“这么多年 我们娘俩相依为命，他要不在了，我可怎么办啊!”此时，小康最需要为周奶奶提供的服务是（ ）。", "ops": [{"l": "A", "t": "社会福利咨询", "ok": false}, {"l": "B", "t": "丧葬事宜安排", "ok": false}, {"l": "C", "t": "预期哀伤辅导", "ok": true}, {"l": "D", "t": "医患沟通协调", "ok": false}], "ex": "周奶奶因独子被诊断为胰腺癌晚期，担心儿子离世后的生活，处于面对即将失去亲人的哀伤 状态。此时最需要的是针对即将到来的丧失进行预期哀伤辅导。A选项社会福利咨询不是当下最急需；B选项 丧葬事宜安排为时尚早；D选项医患沟通协调并非此刻周奶奶最迫切需求。答案：C"}, {"ch": "实务·Ch1", "yr": "2023", "tp": "单选", "q": "大李被诊断为终末期肾病，持续接受血液透析治疗。近期大李认为护士特别关注自己，喜欢自己，常给护 士发信息，护士未予理睬，大李很失落，不吃不喝。医务社会工作者了解这一情况后，全面评估大李的需求 ，下列做法中，属于收集大李社会层面信息的是（ ）。", "ops": [{"l": "A", "t": "查阅病历了解大李的血压变化情况", "ok": false}, {"l": "B", "t": "使用他评量表评估大李的焦虑程度", "ok": false}, {"l": "C", "t": "了解大李的用药、饮食与睡眠情况", "ok": false}, {"l": "D", "t": "了解医护人员与大李间的互动方式", "ok": true}], "ex": "社会层面信息主要关注个体与周围社会环境的互动关系。A选项病历中血压变化、C选项用药 饮食睡眠情况都属于生理层面；B选项评估焦虑程度属于心理层面；D选项了解医护人员与大李间的互动方式 ，体现的是大李在医院这一社会环境中与他人的互动，属于社会层面信息。答案：D"}, {"ch": "实务·Ch1", "yr": "2023", "tp": "单选", "q": "医务社会工作者小齐接到急诊科转介电话得知，独居的张奶奶日前因腹痛被邻居送入院，目前生命体征平 稳，可办理出院。小齐拟为张奶奶提供出院安置服务，下列做法最恰当的是（ ）。", "ops": [{"l": "A", "t": "了解张奶奶的疾病与就诊史，评估其生理机能", "ok": false}, {"l": "B", "t": "对张奶奶进行情绪量表测评，评估其心理机能", "ok": false}, {"l": "C", "t": "了解张奶奶对自身疾病的认识，评估其医疗理解情况", "ok": false}, {"l": "D", "t": "走访张奶奶所在的社区居委会，评估其社会支持情况", "ok": true}], "ex": "题目强调是为张奶奶提供出院安置服务，出院安置重点在于考虑其回归社区后的生活保障 ，社会支持情况对其出院后的生活至关重要，相比其他选项更符合出院安置服务内容。答案：D"}, {"ch": "实务·Ch12", "yr": "2023", "tp": "单选", "q": "社会工作者小王走访租住在本社区的“外卖骑手”家庭时发现，庄先生常带孩子送外卖，在最近一次送单 时由于行驶速度过快，撞上了路边的汽车，自己和孩子都受伤了，还要赔偿车主一大笔维修费，庄先生很郁 闷，小王疏解了庄先生的情绪，又为庄先生的孩子联系了就近的幼儿园。小王采用的社会工作方法是（ ）", "ops": [{"l": "A", "t": "个案工作", "ok": true}, {"l": "B", "t": "小组工作", "ok": false}, {"l": "C", "t": "社区工作", "ok": false}, {"l": "D", "t": "督导工作", "ok": false}], "ex": "题干中社会工作者小王针对庄先生这一个别家庭的具体问题，如情绪问题、孩子入园问题等 开展服务，这符合个案工作针对个人或家庭提供服务的特点。答案：A"}, {"ch": "实务·Ch1", "yr": "2023", "tp": "单选", "q": "企业社会工作者小林在调研中发现，企业的新老员工之间存在关系疏离问题。小林在分析了关系疏离的成 因后，拟在员工中开展“我们在一起”支持小组，在确定了小组目标后，小林接下来应该做的是（ ）。", "ops": [{"l": "A", "t": "细化服务目标", "ok": false}, {"l": "B", "t": "制定小组计划书", "ok": true}, {"l": "C", "t": "完成需求评估", "ok": false}, {"l": "D", "t": "多渠道招募组员", "ok": false}], "ex": "小组工作阶段流程：需求评估 → 分析问题 → 确定小组目标 → 制定小组计划书 → 招募 组员 → 小组初期 / 中期 / 后期。题干：已分析成因、确定小组目标，下一步：制定小组计划书。 C 需求评估：早已完成 A 细化目标：包含在确定目标环节 D 招募组员：在计划书之后。答案：B 多项选择题"}, {"ch": "实务·Ch4", "yr": "2023", "tp": "多选", "q": "为帮助军休老人适应地方生活，提高生活质量，社会工作者拟 的是（ ）", "ops": [{"l": "A", "t": "选择测量慢病管理行为的指标", "ok": true}, {"l": "B", "t": "改变老年人的慢病管理行为", "ok": false}, {"l": "C", "t": "比较老年人慢病管理行为变化", "ok": false}, {"l": "D", "t": "测量老年人对小组的满意度", "ok": false}], "ex": "基线测量是在介入开始前对服务对象的状况进行测量，建立一个基线作为对介入行动效果进 行衡量的标准基线。建立基线首先要确定需要测量的目标行为或状态的指标，A选项选择测量慢病管理行为的 指标属于建立基线的操作。B是介入阶段要做的；C是介入后对比分析；D测量对小组满意度与测量慢病管理服 务成效的基线无关。答案：A"}, {"ch": "实务·Ch2", "yr": "2024", "tp": "单选", "q": "由于多种因素影响，每个儿童的生长发育都与众不同，具有独特性。这体现出儿童生长发育的（ ）", "ops": [{"l": "A", "t": "互补性", "ok": false}, {"l": "B", "t": "不均衡性", "ok": false}, {"l": "C", "t": "阶段性", "ok": false}, {"l": "D", "t": "个体差异性", "ok": true}], "ex": "题干强调每个儿童生长发育与众不同、有独特性，重点在于个体之间的不同，这符合个体差 异性的特点。互补性强调身体机能间相互补偿；不均衡性指不同系统发育速度不同；阶段性指不同年龄阶段 有不同特点，均与题干不符。答案：D"}, {"ch": "实务·Ch4", "yr": "2024", "tp": "单选", "q": "社会工作者小王对独居残疾老人张奶奶进行评估，发现她有日常生活照料、居家康复、精神慰藉等多重需 要，拟采用个案管理方法提供服务。小王正确的做法是（ ）", "ops": [{"l": "A", "t": "自己为张妈奶提供所有服务", "ok": false}, {"l": "B", "t": "为张奶奶提供整合性服务", "ok": true}, {"l": "C", "t": "将张奶奶转介给养老机构", "ok": false}, {"l": "D", "t": "鼓励张奶奶做力所能及的事", "ok": false}], "ex": "个案管理强调为服务对象提供全面、整合的服务，协调多种资源满足其多重需求。A选项社会 工作者无法提供所有服务；C选项转介给养老机构不能体现个案管理整合服务的特点；D选项鼓励做力所能及 之事未突出对多重需要的整合服务。B选项为张奶奶提供整合性服务符合个案管理方法。答案：B"}, {"ch": "实务·Ch2", "yr": "2024", "tp": "单选", "q": "某未成年人保护中心的社会工作者小李接到儿童主任的报告：辖区内的7岁困境儿童小花身上有被打的痕迹 ，容易受惊吓，情绪不稳定，声称遭受过继父的殴打。在保证小花安全的情况下，小李首先应采取的措施是 （ ）", "ops": [{"l": "A", "t": "评估小花的父母的家庭监护能力", "ok": false}, {"l": "B", "t": "联系专业机构评估小花受伤状况", "ok": false}, {"l": "C", "t": "将小花安置在未成年人保护中心", "ok": false}, {"l": "D", "t": "安抚小花的情绪并进行心理辅导", "ok": true}], "ex": "本题考查儿童社会工作实务。正确答案为D。D.安抚小花的情绪并进行心理辅导"}, {"ch": "实务·Ch12", "yr": "2024", "tp": "单选", "q": "某社区舞蹈队每天定时在社区广场组织活动。近期，社区居委会接到多起相关投诉，抱怨舞蹈队活动声音 过大，影响家人休息。为此，社会工作者小董协调辖区某单位将其多功能厅在晚间向社区居民开放，并为舞 蹈队安排训练空间。小董还组织社区居民骨干轮流值班，协助该单位管理多功能厅，投诉问题得到了顺利解 决，屠民们都很满意。小董的上述做法属于（ ）。", "ops": [{"l": "A", "t": "资源置换", "ok": false}, {"l": "B", "t": "资源整合", "ok": true}, {"l": "C", "t": "资源共享", "ok": false}, {"l": "D", "t": "资源分配", "ok": false}], "ex": "本题考查社会工作实务通用过程。正确答案为B。B.资源整合"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "单选", "q": "社会工作者大江在与社区桥正对象小夏的侧行会谈中得知，小夏过去的“兄弟”来找他、拉他参与对一个 团伙的报复行动。尽管小夏不想再次违法，但他迫于压力木得已管应了“兄弟”的要求，在为小夏提供服务 时，大江恰当的做法是", "ops": [{"l": "A", "t": "要求小夏反思自己的错误行为", "ok": false}, {"l": "B", "t": "妥善处理保密与社会安全的关系", "ok": true}, {"l": "C", "t": "鼓励小夏自行决定是否参与行动", "ok": false}, {"l": "D", "t": "建议小夏改变犹豫不决的个性", "ok": false}], "ex": "小夏面临参与报复行动这种可能危害社会安全的情况，社会工作者要遵循伦理原则，在保密 和维护社会安全间平衡。A项要求反思此时不恰当；C项鼓励自行决定可能使小夏走向违法；D项改变个性不是 当下关键。答案：B"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "单选", "q": "社区内很多父母向社会工作者老杨抱怨孩子写作业非常磨蹭，课堂学习也跟不上老师的节奏。为了帮助这 些家庭，老杨根据行为学习理论为他们提供家庭行为学习服务。在开展此服务时，老杨恰当的做法是（ ）", "ops": [{"l": "A", "t": "指导父母合理奖惩孩子的行为", "ok": true}, {"l": "B", "t": "帮助父母培养孩子的独立意识", "ok": false}, {"l": "C", "t": "引导父母接纳孩子的问题行为", "ok": false}, {"l": "D", "t": "协助扩展父司的社会支持网络", "ok": false}], "ex": "行为学习理论强调通过改变行为来解决问题，合理奖惩孩子行为属于基于行为学习理论的干 预方式。B选项培养独立意识、C选项接纳问题行为、D选项扩展社会支持网络，都不属于行为学习理论下针对 孩子磨蹭、学习跟不上节奏这类具体行为问题的典型做法。答案：A"}, {"ch": "实务·Ch12", "yr": "2024", "tp": "单选", "q": "有的社区戒毒康复人员会因“吸毒者“身份而消极悲观，对获取社会资源存在“别人不会给我”“自己人 微言轻，难以争取到”等想法，不愿对外求助。社会工作者在为此类服务对象提供个案服务时，恰当的做法 是（ ）", "ops": [{"l": "A", "t": "引导服务对象主动寻求服务资源", "ok": true}, {"l": "B", "t": "替服务对象申请生活和医疗保障", "ok": false}, {"l": "C", "t": "联系社区主任为服务对象开网店", "ok": false}, {"l": "D", "t": "对服务对象的想法给子严肃批评", "ok": false}], "ex": "服务对象因自身想法不愿对外求助，社工应解决这一问题，引导其主动寻求资源，A选项符合 ；B选项替服务对象申请，不能从根本解决其不愿求助问题；C选项联系社区主任开网店做法不恰当，且没解 决不愿求助问题；D选项严肃批评不利于建立良好专业关系。答案：A"}, {"ch": "实务·Ch4", "yr": "2024", "tp": "单选", "q": "为鼓励随迁老人走出家门，互相认识，互帮互助，社会工作者小蔡在社区开办了“落叶归根”随迁老人支 持小组。根据老年小组工作应注意的事项，小察的下列做法中，正确的是（ ）。", "ops": [{"l": "A", "t": "鼓励组员对外分享组内活动和信息", "ok": false}, {"l": "B", "t": "优先考虑对小组而非个人所负的责任", "ok": false}, {"l": "C", "t": "开展充分凸是老年人活力的竞技活动", "ok": false}, {"l": "D", "t": "允许组员以任何理由选择退出小组", "ok": true}], "ex": "老年小组工作中，要尊重组员的自决权，允许组员以任何理由选择退出小组，这体现了对老 年人权利的尊重，符合工作原则。 A选项鼓励组员对外分享组内活动和信息可能会侵犯组员隐私，不合适。 B选项在老年小组工作中应平衡小组和个人责任，优先考虑小组责任可能忽视老年人个体需求。 C选项老年人 身体状况可能不适合开展充分凸显活力的竞技活动，易造成身体伤害。答案：D"}, {"ch": "实务·Ch2", "yr": "2024", "tp": "单选", "q": "6岁的乐乐患脑膜炎，入院治疗时十分抗拒腰穿检查，哭不止，不肯配合。为降低乐乐对腰穿检查的恐惧 感，根据儿童的心理发展特点，医务社会工作者恰当的做法是（ ）。", "ops": [{"l": "A", "t": "请大夫为乐乐讲解腰穿检查必要性", "ok": false}, {"l": "B", "t": "运用游戏与乐乐模拟腰穿操作过程", "ok": true}, {"l": "C", "t": "邀请做过腰穿检查的病友分享经历", "ok": false}, {"l": "D", "t": "动员乐乐父母劝说其配合腰穿检查", "ok": false}], "ex": "6岁儿童以直观形象思维为主，游戏模拟的方式符合其心理发展特点，能让他们更直观地了解 腰穿过程，降低恐惧感。A选项，6岁孩子理解能力有限，听大夫讲解必要性效果不佳；C选项，病友分享经历 对6岁孩子作用不大；D选项，父母劝说可能加重孩子抵触情绪。答案：B"}, {"ch": "实务·Ch12", "yr": "2024", "tp": "单选", "q": "社会工作者小王在社区居委会支持下，组建了居民议事会，促进居民参与。但是有的居民觉得自己没有经 验，不知怎么参与，缺乏议事讨论的技巧，难以形成共识。从上述情况看，影响居民社区参与的因素是（ ）", "ops": [{"l": "A", "t": "参与会比较有限", "ok": false}, {"l": "B", "t": "参与意愿普遍不高", "ok": false}, {"l": "C", "t": "参与能力相对较低", "ok": true}, {"l": "D", "t": "参与价值理解不够", "ok": false}], "ex": "题中提到居民觉得自己没经验、不知怎么参与、缺乏议事技巧，这些都指向居民参与社区事 务时能力方面存在不足。答案：C"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "单选", "q": "社会工作者小刘在社区走访时遇到周大爷的儿子，他向小刘抱怨：自母亲去世后，周大爷越来越糊涂了 ，做饭有时忘记关煤气，出门经常忘记带钥匙，甚至疑邻居偷东西。他希望小刘帮忙看看周大爷是什么问题 、针对这种情况，小刘对周大爷进行基础性评售、在评估过程中，小刘应注意的事项是（ ）。", "ops": [{"l": "A", "t": "重点评估周大爷的经济和情绪状况", "ok": false}, {"l": "B", "t": "将周大爷所述信息全部告知他儿子", "ok": false}, {"l": "C", "t": "须在社区居委会对周大爷进行评信", "ok": false}, {"l": "D", "t": "关注周大爷和儿子对待评估的态度", "ok": true}], "ex": "对老年人进行评估，要关注服务对象及其家属对评估的态度，这会影响评估的开展和效果。 A选项重点评估经济和情绪状况不准确，题干中主要问题并非在此；B选项全部告知儿子不妥，要遵循保密等 原则；C选项不一定须在社区居委会评估，太绝对。所以选D。答案：D"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "单选", "q": "社会工作者小郑在社区走访时了解到，轻度肢体残疾人小梅有去面包店就业的强烈意愿，但又缺乏相应技 能。小郑遂联系烘焙师教授小梅糕点制作技巧。小郑的上述做法属于残疾人职业康复中的（ ）。", "ops": [{"l": "A", "t": "职业咨询", "ok": false}, {"l": "B", "t": "就业指导", "ok": false}, {"l": "C", "t": "职业评估", "ok": false}, {"l": "D", "t": "职业培训", "ok": true}], "ex": "小郑联系烘焙师教授小梅糕点制作技巧，这明显是在为小梅进行职业技能方面的培训。答案 ：D"}, {"ch": "实务·Ch12", "yr": "2024", "tp": "单选", "q": "社会工作者组织社区志愿者开展助残活动时发现，有些志愿者只要看到行动不便的残疾人，不经询问就出 手帮忙。志愿者的上述表现反映出的观念误区是（ ）", "ops": [{"l": "A", "t": "把残疾人简单看作社会的“受害者”", "ok": false}, {"l": "B", "t": "残疾人的困难都是由于残疾引起的", "ok": false}, {"l": "C", "t": "助残工作主要注重经济和物质层面的供养", "ok": false}, {"l": "D", "t": "把残疾人看作“理所当然”需要帮助的人", "ok": true}], "ex": "有些志愿者不经询问就出手帮忙，体现出他们潜意识里将残疾人视为必然需要帮助、且不需 要考虑其自身意愿就可直接给予帮助的对象，这是一种观念误区。答案：D"}, {"ch": "实务·Ch4", "yr": "2024", "tp": "单选", "q": "某单位研发部邀请退休的石教授加入新产品开发攻关小组。石教授在关键环节提出了很多建议，令年轻人 佩服不已。石教授谦虚地说：“不过是有些经验罢了，”石教授的说法表明老年人的智力优势在于（ ）", "ops": [{"l": "A", "t": "液态智力", "ok": false}, {"l": "B", "t": "固态智力", "ok": false}, {"l": "C", "t": "溶解智力", "ok": false}, {"l": "D", "t": "结晶智力", "ok": true}], "ex": "结晶智力是人们知识和经验的结晶产物，是通过语言、文字的提炼和积累而成的智力。石教 授凭借经验提出建议，体现的是其多年积累的结晶智力。液态智力是与神经系统的生理机能有关，随年龄增 长会下降，石教授并非靠这种智力。而溶解智力并非心理学中关于智力的常见分类。答案：D"}, {"ch": "实务·Ch2", "yr": "2024", "tp": "单选", "q": "为了帮助社区内的年轻家长改善亲子关系，社会工作者小王决定开办亲职辅导小组。督导者发现小王拟招 募的组员均为年轻妈妈，为了提高小王的社会性别敏感，督导者应提醒小王（ ）", "ops": [{"l": "A", "t": "指导组员学习亲子沟通的技巧", "ok": false}, {"l": "B", "t": "选编适合年轻妈妈的养育知识", "ok": false}, {"l": "C", "t": "重视父亲在亲子关系中的责任", "ok": true}, {"l": "D", "t": "关注祖辈在亲子关系中的作用", "ok": false}], "ex": "题干强调提高小王的社会性别敏感，目前组员均为年轻妈妈，容易忽视男性角色。在亲子关 系中，父亲角色很重要，重视父亲责任能体现社会性别敏感。答案选C 。"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "单选", "q": "赵伯伯最近散步时突然晕倒，被小区保安及时发现并送医。医生嘱赵伯信以后出门一定要有人陪伴，但赵 伯伯不听医生和家人劝阻、仍然独自到处走动，导致家庭关系紧张。赵伯伯的家人向社会工作者小李求助。 会谈时，小李的下列提问中，符合家庭处境化原则的是（ ）", "ops": [{"l": "A", "t": "“赵伯伯为什么喜欢外出？”", "ok": false}, {"l": "B", "t": "“赵伯伯喜欢什么时候外出？”", "ok": false}, {"l": "C", "t": "“你们希望赵伯伯什么时候外出？”", "ok": false}, {"l": "D", "t": "“你们什么时候有空陪赵伯伯外出？”", "ok": true}], "ex": "把家庭成员的问题放在日常家庭生活情境、互动关系、现实处境中看待，结合家庭实际条件 、生活安排理解矛盾，而非只聚焦个人行为。 A和B：只关注赵伯伯个人外出行为，脱离家庭处境； C：只问家人主观期望，未结合现实条件； D：询问"}, {"ch": "实务·Ch2", "yr": "2024", "tp": "单选", "q": "为推进儿童友好社区建设，某社区成立“儿童观察团”，搭建儿童发声平台，鼓励儿童以“小主人”身份 对社区公共空间的设计方案投票。上述做法，属于儿童友好社区建设倡导内容中的（ ）。", "ops": [{"l": "A", "t": "创新儿童参与机制", "ok": true}, {"l": "B", "t": "完善社区基本建设", "ok": false}, {"l": "C", "t": "建设儿童游戏场所", "ok": false}, {"l": "D", "t": "健全社区服务体系", "ok": false}], "ex": "社区成立“儿童观察团”，鼓励儿童以“小主人”身份对设计方案投票，这是为儿童创造新 的参与社区事务的方式，属于创新儿童参与机制。答案：A"}, {"ch": "实务·Ch12", "yr": "2024", "tp": "单选", "q": "某镇社工站社会工作者与乡村建设志愿者在分析所辖村庄天然优势的基础上，联络村委会、企业和社会组 织共同引入新型产业，助力乡村振兴。上述工作中，社会工作者的角色是", "ops": [{"l": "A", "t": "资源协调者", "ok": true}, {"l": "B", "t": "社区规划师", "ok": false}, {"l": "C", "t": "项目推介人", "ok": false}, {"l": "D", "t": "政策宣传员", "ok": false}], "ex": "社会工作者联络村委会、企业和社会组织等多方力量共同引入新型产业，这是在协调各方资 源，以达成助力乡村振兴的目的。答案：A.资源协调者"}, {"ch": "实务·Ch12", "yr": "2024", "tp": "单选", "q": "企业社会工作者小郭拟运用社区工作方法，在某工业园区开展服务。小郭首先走访园区各企业，与职工和 企业管理者建立专业关系，并通过问卷和焦点小组评估了各方需求，接下来，小郭应开展的工作是（ ）。", "ops": [{"l": "A", "t": "发布需求报告扩大社会影响", "ok": false}, {"l": "B", "t": "组织方便参与的文化娱乐活动", "ok": false}, {"l": "C", "t": "绘制园区资源图分析相关资源", "ok": true}, {"l": "D", "t": "按照项目预算合理使用资金", "ok": false}], "ex": "运用社区工作方法开展服务，在走访建立关系、评估需求后，绘制园区资源图分析相关资源 ，以便更好地利用资源满足需求，为后续服务开展做准备，这符合社区工作流程。A发布需求报告非此阶段重 点；B组织活动过早，还未分析资源；D使用资金也应在明确资源和计划后。答案：C"}, {"ch": "实务·Ch4", "yr": "2024", "tp": "单选", "q": "社会工作者小杨负责社区残疾老年人的“乐龄陪伴”项目，旨在强化残疾老年人社会支持网络，提高他们 的生活质量。小杨开展的下列活动中，属于强化社会支持网络的是（ ）。", "ops": [{"l": "A", "t": "鼓励残疾老年人参与社区议事协商会", "ok": false}, {"l": "B", "t": "联系为老服务志愿者定期探望老年人", "ok": true}, {"l": "C", "t": "协调慈善物资提供残疾老年人临时救济", "ok": false}, {"l": "D", "t": "为残疾老年人家庭进行居家适老化改造", "ok": false}], "ex": "社会支持网络强调通过各种关系和资源给予个体支持。A项主要涉及参与社区事务；C项是临 时物资救济；D项是对家庭环境改造。B项联系志愿者定期探望，属于引入外部关系给予残疾老年人支持，强 化了其社会支持网络。答案：B"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "单选", "q": "在为青年女工开展职业生涯规划辅导时，企业社会工作者大姚首先通过问卷和访谈，协助女工评估职业发 展需求，进而鼓励她们展望职业理想，明确职业发展路径。大姚在该服务中运用的是（ ）", "ops": [{"l": "A", "t": "个人中心取向规划技巧", "ok": true}, {"l": "B", "t": "心理动力取向规划技巧", "ok": false}, {"l": "C", "t": "认知行为取向规划技巧", "ok": false}, {"l": "D", "t": "特质因素取向规划技巧", "ok": false}], "ex": "答案：A个人中心取向规划技巧是指以服务对象为中心，注重个人潜能的开发，针对每个人特 有的需求，给予接纳和尊重。大姚通过问卷和访谈评估职业发展需求，鼓励展望职业理想，明确职业发展路 径，运用的是个人中心取向规划技巧。"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "单选", "q": "社会工作者小张在社区入户探访时了解到，低保对象陈女士离异，二级残疾，与父母同住，曾患抑郁症。 为了更好地为陈女士提供服务，小张首先要对其问题和需求进行评估。小张的下列做法中，正确的是（ ）", "ops": [{"l": "A", "t": "根据抗抑郁药物的服用肠率，判断陈女士的抑郁程度", "ok": false}, {"l": "B", "t": "了解陈女士目前的生活状态，无需了解她的以往经历", "ok": false}, {"l": "C", "t": "根据以往工作经验，认定陈女士离婚原因是父母过度于预", "ok": false}, {"l": "D", "t": "通过家庭探访，观察陈女士的生活场景及与父母互动情况", "ok": true}], "ex": "评估需要全面、客观、基于实际观察和了解。A 仅依据药物服用频率判断抑郁程度较片面；B 不了解以往经历不利于全面评估；C 仅凭经验认定离婚原因不客观。D 通过家庭探访观察生活场景及与父母 互动情况，能更全面真实地评估陈女士问题和需求。答案：D"}, {"ch": "实务·Ch12", "yr": "2024", "tp": "单选", "q": "为避免社区老年居民上当受骗，社会工作者小黄邀请银行职员作为志愿者，为老年人开展金融防诈骗讲座 和理财知识培训，小黄使用的上述社区资源属于（ ）", "ops": [{"l": "A", "t": "物力资源", "ok": false}, {"l": "B", "t": "财力资源", "ok": false}, {"l": "C", "t": "组织资源", "ok": false}, {"l": "D", "t": "人力资源", "ok": true}], "ex": "银行职员作为志愿者参与活动，这里利用的是人的力量，属于人力资源。答案：D"}, {"ch": "实务·Ch12", "yr": "2024", "tp": "单选", "q": "社区戒毒康复对象小孙新结识了女孩小丽，准备确定恋爱关系，但对于是否主动告知自己的吸毒经历，他 犹豫不决，遂到社区向社会工作者小吴求助。遵循服务对象自决原则，小吴的下列做法中，正确的是（ ）", "ops": [{"l": "A", "t": "让小孙直接告知小丽并承担可能的后果", "ok": false}, {"l": "B", "t": "让小孙认真思考自行决定是否告知小丽", "ok": false}, {"l": "C", "t": "建议小孙让自己的朋友委婉地告知小丽", "ok": false}, {"l": "D", "t": "与小孙讨论多种可能性并让他自行决定", "ok": true}], "ex": "服务对象自决原则强调社会工作者要尊重服务对象的自我决定权利。A选项直接让小孙告知并 承担后果，没有引导和探讨多种情况；B选项只是让小孙自己思考，缺乏专业引导；C选项建议小孙让朋友告 知，这不是小孙自决，而是替小孙做了方式选择。D选项与小孙讨论多种可能性，既给予了专业支持，又让小 孙自行决定，符合服务对象自决原则。答案：D"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "单选", "q": "因车祸截肢，小冰无法接受残疾的事实、情绪低落，拒绝出门。小冰母亲到社区向社会工作者小王求助。 小王在对小冰开展需求评估时，应注意的是（ ）", "ops": [{"l": "A", "t": "把小冰的残疾等级评估放在首位", "ok": false}, {"l": "B", "t": "引导小冰母亲去理解小冰的行为", "ok": false}, {"l": "C", "t": "接纳小冰的各种负性的心理感知", "ok": true}, {"l": "D", "t": "鼓励小冰积极应对自己的绝望感", "ok": false}], "ex": "在需求评估时，社会工作者首先要接纳服务对象的各种感受，包括负性心理感知，这样才能 建立信任关系，更好地了解其需求。A选项残疾等级评估并非需求评估首要内容；B选项引导母亲理解小冰行 为不属于需求评估注意事项；D选项鼓励小冰应对绝望感在需求评估阶段不是重点，需求评估重点是了解情况 。答案：C"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "单选", "q": "社会作者小李使用认知行为疗法，为轻度抑郁症患者王女士提供个案辅导，为强化王女士在日常生活中主 动识别自身的思维特点与行为反应的能力，形成恰当的认知方式，小李给王女士布置了相应的家庭作业。下 列关于家庭作业的内容中，恰当的是（ ）", "ops": [{"l": "A", "t": "与王女士共同设定促使其行为改变的目标", "ok": false}, {"l": "B", "t": "与王女士共同探讨帮助其达到目标的技能", "ok": false}, {"l": "C", "t": "帮助王女士学习评估和监督自身行为", "ok": false}, {"l": "D", "t": "请王女士记录日常生活中的情绪感受", "ok": true}], "ex": "题目重点是强化王女士主动识别自身思维特点与行为反应能力，形成恰当认知方式。A选项设 定行为改变目标、B选项探讨达到目标技能，重点在目标及达成技能，并非强化识别自身特点及反应；C选项 学习评估和监督自身行为，更侧重于对行为的评估监督，未突出识别思维和行为特点；D选项请王女士记录日 常生活中的情绪感受，可让她在记录中主动识别自身思维与行为反应带来的情绪，从而强化能力，符合题意 。答案：D"}, {"ch": "实务·Ch2", "yr": "2024", "tp": "单选", "q": "8岁的亮亮因父母服刑与奶奶一起生活，由于没有户口，亮亮无法申领事实无人抚养儿童生活补贴、祖孙 二人生活艰难，社会工作者小方协助办理了亮亮的户籍登记手续，领取了生活补贴。小方的上述服务满足了 亮亮的（ ）。", "ops": [{"l": "A", "t": "受保护需要", "ok": false}, {"l": "B", "t": "生存需要", "ok": true}, {"l": "C", "t": "发展需要", "ok": false}, {"l": "D", "t": "社会化需要", "ok": false}], "ex": "亮亮和奶奶生活艰难，办理户籍登记领取生活补贴，这解决的是基本生存层面的问题，保障 了亮亮的基本生活。答案：B"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "单选", "q": "某医院急诊室服务社会工作者小艾在为一位脑卒中患者提供服务前，拟为患者进行社会心理评估。在评估 过程中，小艾恰当的做法是（ ）", "ops": [{"l": "A", "t": "了解患者的疾病史、就医史，家庭史或生活史，掌握患者的状态", "ok": true}, {"l": "B", "t": "迅速与患者建立关系，辨识其当下的主要问题", "ok": false}, {"l": "C", "t": "依据个案管理原则，在住院期间安排适当服务", "ok": false}, {"l": "D", "t": "给患者及其家属提供相关手续办理的程序、医疗救助政策的咨询", "ok": false}], "ex": "社会心理评估主要是全面了解服务对象的社会心理状况，A选项通过了解疾病史、就医史、家 庭史和生活史等能全面掌握患者社会心理状态，符合社会心理评估做法。B选项迅速辨识当下主要问题，对于 社会心理评估来说过于片面；C选项是服务安排，并非评估；D选项是提供手续和政策咨询，不属于社会心理 评估范畴。答案：A"}, {"ch": "实务·Ch12", "yr": "2024", "tp": "单选", "q": "社会工作者老赵联合物业公司组织社区居民开展“爬楼行动”，进入各个楼栋为楼道杂物“寻主”。通过 文明劝导，动员居民自行清理楼道垃圾。老赵的上述做法体现了社区社会工作中的（ ）。", "ops": [{"l": "A", "t": "推动居民社区参与", "ok": true}, {"l": "B", "t": "建立社区支持网络", "ok": false}, {"l": "C", "t": "提升居民的认同感", "ok": false}, {"l": "D", "t": "链接社区内外资源", "ok": false}], "ex": "老赵组织居民开展“爬楼行动”，动员居民自行清理楼道垃圾，这一过程让居民参与到社区 公共事务中，重点在于推动居民参与社区活动，改善社区环境。答案：A。"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "单选", "q": "刘女士长期遭受家暴，丈夫一喝醉就打她。邻居向社会工作者小于反映了这一情况后，小于与刘女士进行 了会谈，发现她已有“受虐妇女综合征”的表现。刘女士的下列表述中，符合“受虐妇女综合征”的是（ ）", "ops": [{"l": "A", "t": "他主要是因为喝醉酒才打我", "ok": true}, {"l": "B", "t": "我必须尽快结束这样的日子", "ok": false}, {"l": "C", "t": "我一定要让他为此付出代价", "ok": false}, {"l": "D", "t": "不管怎么说他都不应该打我", "ok": false}], "ex": "“受虐妇女综合征”的核心特征之一是为施暴者的行为寻找合理化的解释，将暴力归因于外 部因素（如酒精、压力、情绪失控等），而不是认为施暴者本身应对暴力负全责。这种认知模式使受害者长 期忍受暴力，难以脱离。 选项分析：A：将暴力归因于“喝醉酒”，是典型的为施暴者找借口，符合“受虐妇女综合征”特征。 B：表达想结束这种日子，说明有离开意愿，不符合综合征中的“被动忍受”特点。 C：有报复心理，表现出反抗倾向，不符合综合征中常见的自责或妥协认知。 D：认为对方不应该打人，这是正确归责，与受虐妇女综合征中常见的“自我归因或外因归责”不符。答案 ：A"}, {"ch": "实务·Ch12", "yr": "2024", "tp": "单选", "q": "丧偶失独老人王奶奶最近考虑入住养老机构，但她担心入住机构后无法再继续带领自己负责的志愿服务队 为社区居民服务。王奶奶的担心表明，她的需要是（ ）", "ops": [{"l": "A", "t": "社会参与", "ok": true}, {"l": "B", "t": "生活照料", "ok": false}, {"l": "C", "t": "健康维护", "ok": false}, {"l": "D", "t": "就业休闲", "ok": false}], "ex": "王奶奶担心入住养老机构后不能带领志愿服务队为社区居民服务，这体现她希望能持续参与 社会活动，与他人互动并为社区做贡献，核心是社会参与方面的需求。答案：A 。 多项选择题"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "多选", "q": "小秦觉得上大学没意思，想退学创业，但母亲不答应，认为他不务正业，认真读书才是正道，因此母子关 系紧张。社会工作者了解情况后，对小秦的问题进行预估以识别问题情境中的相关因素。下列识别小秦问题 主观因素说法中，适宜的有（ ）", "ops": [{"l": "A", "t": "了解小秦家庭的背景资料", "ok": false}, {"l": "B", "t": "了解小秦创业的具体行动", "ok": false}, {"l": "C", "t": "了解小秦选择创业的动机", "ok": true}, {"l": "D", "t": "分析小秦母于冲突的深层原因", "ok": false}, {"l": "E", "t": "让小秦描述创业成功对他的意义", "ok": true}], "ex": "主观因素是服务对象对问题的个人看法、感受和动机等。选项C“了解小秦选择创业的动机 ”，动机属于主观层面，体现小秦对创业的想法；选项E“让小秦描述创业成功对他的意义”，这反映小秦个 人对创业成功的主观认知。而A家庭背景资料、B创业具体行动、D母子冲突深层原因，这些多属于客观事实或 关系层面，并非小秦对问题的主观看法感受。答案：CE"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "多选", "q": "王先生夫妇来社会工作服务机构求助。王先生刚坐下就数落在孩子教育中的种种不是，责备妻子没有尽到 母亲的责任。王太太也不示弱，不停地讲述丈夫的各种问题。面对这种情况，社会工作者决定使用聚焦技巧 推动会谈、到提问合适的有（ ）", "ops": [{"l": "A", "t": "“你们有考虑过对方的感受吗？”", "ok": false}, {"l": "B", "t": "“你们是否能把需要解决的问题排序？”", "ok": true}, {"l": "C", "t": "“你们能否举例说明对方的问题？。", "ok": false}, {"l": "D", "t": "“你们难道从未发现对方的优点吗？“", "ok": true}], "ex": "聚焦技巧是指社会工作者帮助受助家庭成员收窄注意的焦点，将受助家庭成员的注意力集中 在需要解决的问题上，以便对问题作出深入的探索，保证服务介入活动的效率。如社会工作者可以提问受助 家庭成员，让他们对需要解决的问题进行排序，从而帮助受助家庭成员聚焦需要解决的问题。答案：BD"}, {"ch": "实务·Ch2", "yr": "2024", "tp": "多选", "q": "7岁的阳阳，母亲服刑，父亲失联，且无其他亲属愿意照顾他，被安置在儿童福利院进行临时养育。近日 ，阳阳母亲服刑结束，希望接回阳阳。为判断阳阳母亲的监护能力，社会工作者需要评估的内容有（ ）", "ops": [{"l": "A", "t": "阳阳母亲的基本生活照顾能力", "ok": true}, {"l": "B", "t": "阳阳母亲的情感传递能力", "ok": true}, {"l": "C", "t": "阳阳母亲所在社区的资源状况", "ok": false}, {"l": "D", "t": "母亲给予阳阳安全保障的能力", "ok": true}, {"l": "E", "t": "阳阳母亲维系稳定亲子关系的能力", "ok": true}], "ex": "判断阳阳母亲监护能力，主要看其对阳阳照顾、情感、安全及亲子关系维系等方面能力。社 区资源状况并非母亲自身监护能力范畴。答案：ABDE"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "多选", "q": "学校社会工作者小李践行“校家社”联动理念，开展学校社会工作，从初级介入的角度预防校园欺凌。根 据初级介入的要求，小李适宜的做法有（ ）", "ops": [{"l": "A", "t": "通过戏剧表演、演讲竞赛等活动营悠友善校园", "ok": true}, {"l": "B", "t": "用小组方法为有欺凌经历的学生提供心理支持", "ok": false}, {"l": "C", "t": "通过社区宣传、社区教育等方式营巡友善社区", "ok": true}, {"l": "D", "t": "运用个案工作的方法引导老师形成正确的认知", "ok": false}, {"l": "E", "t": "通过语言表达及行为训练改善学生的家庭关系", "ok": true}], "ex": "初级介入是面向全员，营造友善环境来预防问题。A选项通过活动营造友善校园，C选项通过 社区宣传营造友善社区，E选项通过训练改善学生家庭关系，都是面向整体营造环境预防欺凌。B是针对有欺 凌经历学生，属于对特定对象介入；D针对老师，不是初级面向全员营造环境预防的范畴。答案：ACE"}, {"ch": "实务·Ch2", "yr": "2024", "tp": "多选", "q": "某社区准备为流动儿童策划暑期社会实践活动。社会工作者综合考虑社区和流动儿童的实际情况，正在征 求各位家长的意见，以形成“快乐暑期，拥抱社区”活动方案。下列关于活动方案策创前分析工作的内容中 ，恰当的有（ ）", "ops": [{"l": "A", "t": "确定可以来参加暑期活动的社区流动儿童的人教", "ok": true}, {"l": "B", "t": "评估所在社区及其工作人员所面临的挑战和机会", "ok": false}, {"l": "C", "t": "梳理影响流动儿童参与暑期社区活动的各种问题", "ok": true}, {"l": "D", "t": "梳理流动儿童暑期社区活动方秦的程序推进步骤", "ok": true}, {"l": "E", "t": "确定社区居住的流动儿童的表达性和规范性需求", "ok": false}], "ex": "本题考查儿童社会工作实务。正确答案为ACD。A.确定可以来参加暑期活动的社区流动儿童的人教；C.梳理影响流动儿童参与暑期社区活动的各种问题；D.梳理流动儿童暑期社区活动方秦的程序推进步骤"}, {"ch": "实务·Ch4", "yr": "2024", "tp": "多选", "q": "李大妈一直由退休的女儿照顾，前不久女儿因病去世，李大妈觉得活着没意思，产生了自杀想法，并准备 了安眠药社会工作者小马在家庭探访时发现了这一情况，还进行自杀干预。小马的下列做法中，正确的有 （ ）", "ops": [{"l": "A", "t": "将李大妈转介至养老院安置", "ok": false}, {"l": "B", "t": "对李大妈自杀的想法提出批评", "ok": false}, {"l": "C", "t": "拿走安眠药并且消除相关风险", "ok": true}, {"l": "D", "t": "联络志愿者轮流陪伴李大妈", "ok": true}, {"l": "E", "t": "让李大妈承诺下次探访前不要自杀", "ok": true}], "ex": "A选项转介至养老院安置不是当务之急，无法立刻解决自杀风险；B选项批评李大妈想法不合 适，不利于建立信任关系和解决问题；C选项拿走安眠药消除风险可直接降低自杀可能性，正确；D选项联络 志愿者轮流陪伴能给予关怀和监督，降低自杀风险，正确；E选项让李大妈承诺下次探访前不自杀，一定程度 上约束其行为，正确。答案：CDE"}, {"ch": "实务·Ch1", "yr": "2024", "tp": "多选", "q": "光荣院的社会工作者小张发现，90岁的郭老最近精神不济，常常无精打采，总说自己快不行了，还说十分 后悔年轻时因为工作忙碌没能好好照顾子女。针对这种情况，小张采取的介入策略应包括（ ）", "ops": [{"l": "A", "t": "倾听郭老的想法和感受，建立食好信任关系", "ok": true}, {"l": "B", "t": "引导郭老珍惜当不生活，不要总是担心未来", "ok": true}, {"l": "C", "t": "避免谈论死亡话题，给予郭老安慰鼓励", "ok": false}, {"l": "D", "t": "引导郭老寻求与自己和解、与他人和解", "ok": true}, {"l": "E", "t": "与郭老回忆美好生活，制作人生回顾手册", "ok": true}], "ex": "郭老精神不济、消极，还后悔过往。A选项倾听其想法感受建立信任关系有助于开展后续工作 ；B引导珍惜当下能改善消极状态；D引导与自己和他人和解，能解决其后悔的困扰；E通过回忆美好生活，制 作回顾手册可改善精神状态。C项避免谈论死亡话题不合理，应正确面对老人对死亡的表达。 答案：ABDE"}, {"ch": "实务·Ch2", "yr": "2024", "tp": "多选", "q": "根据我国儿童救助和保护的有关规定，下列关于儿童安置服务的说法中，正确的有（", "ops": [{"l": "A", "t": "类家庭养育模式中儿童的监护权由类家庭承", "ok": false}, {"l": "B", "t": "院舍养育在替代养育模式中更适宜儿童的成长", "ok": false}, {"l": "C", "t": "家庭寄养的跟踪服务到儿童离开寄养家庭为止", "ok": true}, {"l": "D", "t": "儿童福利院或社会福利院可提供儿童收养服务", "ok": true}, {"l": "E", "t": "临时寄养可为被收养儿童提供过渡性养育服务", "ok": true}], "ex": "本题考查儿童社会工作实务。正确答案为CDE。C.家庭寄养的跟踪服务到儿童离开寄养家庭为止；D.儿童福利院或社会福利院可提供儿童收养服务；E.临时寄养可为被收养儿童提供过渡性养育服务"}, {"ch": "实务·Ch2", "yr": "2024", "tp": "多选", "q": "15岁的小明因涉嫌犯罪日前处于取保候审阶段。当地法院委托社会工作者撰写小明的审前调查报告。此报 告应包括的内容有（ ）", "ops": [{"l": "A", "t": "小明监护人的基本情况", "ok": true}, {"l": "B", "t": "小明的犯罪事实记录", "ok": true}, {"l": "C", "t": "小明所处的社会环境", "ok": true}, {"l": "D", "t": "小明的收入状况", "ok": false}, {"l": "E", "t": "小明的社交账号", "ok": false}], "ex": "审前调查报告通常要涵盖与犯罪嫌疑人相关的个人、家庭及社会环境等对量刑有影响的因素 。A选项监护人情况可反映家庭监护环境；B犯罪事实记录是法院已掌握的关键内容，需体现在报告中辅助量 刑判断；C所处社会环境能帮助了解犯罪背景和影响因素。而D小明14、15岁一般无收入状况，且对量刑影响 不大；E社交账号与案件及量刑关联性不强。答案选ABC。"}, {"ch": "实务·Ch4", "yr": "2024", "tp": "多选", "q": "某社会工作服务机构在社区开展“一老一小”系列服务活动。调研发现，社区中有的老年人精通泥塑手芝 ，但没有机会展示，感到手艺没用了。青少年并不关注这些传统艺术，也缺乏了解途径。基于此，该机构设 计了“泥塑传承，留住时光”特色服务项目，该机构的下列做法中，属于直接介入的有（ ）", "ops": [{"l": "A", "t": "招募青少手志愿者为精通泥塑手艺的老年人做口述史", "ok": true}, {"l": "B", "t": "与社区居委会商讨建设泥型展示区，提供邻里互动平台", "ok": false}, {"l": "C", "t": "孵化泥塑手艺传承组织，提升老年人参与感和价值感", "ok": true}, {"l": "D", "t": "与相关慈善组织合作，开度泥塑工艺品慈善拍卖活动", "ok": false}, {"l": "E", "t": "邀请泥塑手艺人为青少年开办讲座并指导泥塑制作体验", "ok": true}], "ex": "直接介入是指社会工作者直接与服务对象互动，提供具体服务或干预，以改变其认知、行为 、关系或环境。 A 招募青少年志愿者为精通泥塑手艺的老年人做口述史 直接促进老年人与青少年的互动，提升老年人价值 感。 C 孵化泥塑手艺传承组织，提升老年人参与感和价值感 直接组织老年人形成支持性团体，增强其社会参与 。 E 邀请泥塑手艺人为青少年开办讲座并指导泥塑制作体验 直接向青少年传授技艺，促进文化传承。 B 与社区居委会商讨建设泥塑展示区 → 属于间接介入（通过改变环境、政策来影响服务对象）。 D 与慈善组织合作开展慈善拍卖活动 → 属于间接介入（资源链接与倡导）。答案：ACE"}, {"ch": "实务·Ch12", "yr": "2024", "tp": "多选", "q": "社区居民杨大爷怀疑对门李大爷针对自家搞破坏，于是在正对着李大爷家的位置安装了摄像头，以获取 “证据”。李大爷认为自己的隐私受到侵犯，拨打了市民热线，要求社区拆掉杨大爷安装的监控，社会工作 者小何接到信息反馈后，立即联络律师、心理咨询师和人民调解员上门调解，化解了两家的矛盾。从社区矛 盾纠纷调解服务的角度看，小何的上述做法旨在（ ）", "ops": [{"l": "A", "t": "发挥矛盾预防和矛盾初期的干预优势", "ok": true}, {"l": "B", "t": "强化社区自我调节和问题解决的能力", "ok": true}, {"l": "C", "t": "促进社会、家庭以及个人的自我发展", "ok": false}, {"l": "D", "t": "链接社会资源，发挥各方协作解决问题的作用", "ok": true}, {"l": "E", "t": "推动社区自组织发挥社区矛盾纠纷调解的功能", "ok": false}], "ex": "社区矛盾纠纷调解服务的主要目标包括： A 发挥矛盾预防和矛盾初期的干预优势 社工在冲突刚发生、尚未激化时介入，防止事态扩大。 B 强化社区自我调节和问题解决的能力 通过调解促进居民理性沟通，提升社区自主化解矛盾的能力。 D 链接社会资源，发挥各方协作解决问题的作用 联络律师、心理咨询师、人民调解员等专业力量协同调解 ，体现资源整合与跨专业协作。 C 促进社会、家庭以及个人的自我发展 属于更宏观的发展性目标，非调解服务的直接目的。 E 推动社区自组织发挥社区矛盾纠纷调解的功能 题干未体现培育或发动社区自组织（如居民调解队），调 解由社工主导引入外部资源。答案：ABD"}, {"ch": "实务·Ch4", "yr": "2024", "tp": "多选", "q": "老张入住的养老院远离市区，因交通不便亲属来探望次数不多。入住一段时间后，老张觉得两人共住一间 房，自己的隐私得不到保护，养老院严格的作息时间也与自己随心所欲的性情格格不入。因此，老张感到很 孤独，社会疏离感也越来越强。养老院的社会工作者小惠计划为老张开展服务，改善老张的社会隔离状况。 小惠拟采取的下列做法中，正确的有（ ）", "ops": [{"l": "A", "t": "联系老张的亲属增加探望次数", "ok": true}, {"l": "B", "t": "联络社会组织来养老院开展联欢活动", "ok": true}, {"l": "C", "t": "帮助老张学习养老院管理制度", "ok": false}, {"l": "D", "t": "在养老院开展尊重隐私专题教育活动", "ok": true}, {"l": "E", "t": "征询老年人意见并调整现有作息安排", "ok": true}], "ex": "老张的主要问题包括： 亲属探望少 → 社会支持不足 隐私得不到保护 → 共住房间、缺乏隐私尊重 严格作息与个人习惯冲突 → 缺乏自主性 社会疏离感强 → 需要社交互动 正确做法： A 联系老张的亲属增加探望次数 → 可增强其社会支持系统。 B 联络社会组织来养老院开展联欢活动 → 增加社交参与，缓解疏离感。 D 在养老院开展尊重隐私专题教育活动 → 提升院内对隐私保护的意识，改善老张的隐私困境。 E 征询老年人意见并调整现有作息安排 → 增强老年人自主性，适应个性化需求。 C 帮助老张学习养老院管理制度 → 是让老张“适应”现状，未解决其根本需求（隐私、自主性），且可能 加重压抑感，不符合社会工作“以人为本、尊重自主”的原则，故不选。答案：ABDE 23"}, {"ch": "实务·Ch12", "yr": "2025", "tp": "单选", "q": "受社区党组织委托，某社区工作服务机构组织社区退休党员为儿童教授书法，既丰富了党员的课余生活也 让儿童有了优质的书法课，把居民所需和党员所长紧密结合，这种资源链接方式是（ ）。", "ops": [{"l": "A", "t": "资源整合", "ok": true}, {"l": "B", "t": "资源共享", "ok": false}, {"l": "C", "t": "资源开发", "ok": false}, {"l": "D", "t": "资源置换", "ok": false}], "ex": "周奶奶刚入住养老院初期，首要的是让她熟悉新环境和可利用资源，A选项符合这一阶段需求 ；B选项重新安置是入住一段时间发现不适应后的事；C选项评估一般在入住前；D选项消除不踏实感不是初期 最关键服务内容。答案：A"}, {"ch": "实务·Ch4", "yr": "2025", "tp": "单选", "q": "社工老吴调查发现有些老年人对自己养老安排不清晰，对身边养老资源缺乏了解，为此老吴拟开设夕阳红 老年人知识小组，为组员提供养老信息交流机会，上述工作策略是（ ）。 的线索中，属于间接线索的是 （ ）", "ops": [{"l": "A", "t": "高大爷近期将名下的房产过户给独生女", "ok": false}, {"l": "B", "t": "高大爷最近突然频繁外出会见亲朋好友", "ok": false}, {"l": "C", "t": "高大爷觉得自己活着就是给家人添麻烦", "ok": false}, {"l": "D", "t": "高大爷跟独生女交代他的身后事要从简", "ok": true}], "ex": "自杀风险线索分为： 直接线索：明确表达自杀意愿（如“不想活了”）。 间接线索：暗示死亡安排、告别行为、异常馈赠、交代后事等，但不直接提及自杀。 行为线索：突然的行为变化（如安排财产、见亲友）。 选项分析： A 房产过户 → 行为线索（财产处置）。 B 频繁会见亲友 → 行为线索（告别行为）。 C “活着是给家人添麻烦” → 直接线索（表达无价值感）。 D 交代身后事要从简 → 间接线索（暗示死亡安排）。答案：D"}, {"ch": "实务·Ch12", "yr": "2025", "tp": "单选", "q": "社区工作者小周发现，有的社区矫正对象觉得自己被社会抛弃了，对身边的人和事缺乏关心，也不愿出门 。小周拟采用社会目标模式为他们提供服务，下列小组活动中适宜的是（ ）。", "ops": [{"l": "A", "t": "提供认知行为辅导", "ok": false}, {"l": "B", "t": "开展职业技能培训", "ok": false}, {"l": "C", "t": "举办同伴指导活动", "ok": false}, {"l": "D", "t": "组织社区公益服务", "ok": true}], "ex": "社会目标模式强调通过小组活动培养组员的社会责任感、社会意识，提升他们的社会参与能 力等，以改变社会环境。组织社区公益服务，能让社区矫正对象走出家门，参与社会事务，增强其社会责任 感与融入感，符合社会目标模式理念。A选项认知行为辅导侧重于个人认知与行为改变；B选项职业技能培训 主要针对就业技能提升；C选项同伴指导活动更多聚焦组员间相互支持，均不如D项契合社会目标模式。答案 ：D"}, {"ch": "实务·Ch1", "yr": "2025", "tp": "单选", "q": "社会工作者小王评估发现，低保对象林女士一家有生活照料、就业支持、学业辅导等需求，小王认为，社 区助老志愿队可以帮助林女士的母亲买菜;自己所在机构可以安排志愿者为林女士的女儿辅导功课;居委会可 以协助林女士向街道申请就业机会。上述小王的判断，属于社会工作服务评估步骤中的（ ）。", "ops": [{"l": "A", "t": "计划后续可开展的服务", "ok": false}, {"l": "B", "t": "评估机构和社区的资源", "ok": true}, {"l": "C", "t": "评估服务对象获得服务的资格", "ok": false}, {"l": "D", "t": "了解服务对象具体的服务需求", "ok": false}], "ex": "小王分析出社区助老志愿队、自己所在机构、居委会等不同主体能为林女士一家提供的资源 ，这是在评估机构和社区的资源。答案：B"}, {"ch": "实务·Ch12", "yr": "2025", "tp": "单选", "q": "为推动禁毒领域社会化服务的数字化转型，某社会工作服务机构协助禁毒部门开发了“禁毒向阳花小程序 ，以鼓励戒毒人员和社区居民积极参与戒毒工作.下列小程序的功能中，运用了社区综合治理方法改善戒毒康 复人员外部社会环境的是（ ）。", "ops": [{"l": "A", "t": "社区戒毒协议履行中的请销假", "ok": false}, {"l": "B", "t": "一键拔通全天候戒毒咨询热线", "ok": false}, {"l": "C", "t": "一键举报社区内涉毒违法犯罪", "ok": true}, {"l": "D", "t": "丙型肝炎测检服务申请与登记", "ok": false}], "ex": "社区综合治理强调发动社区力量共同应对问题。C选项“一键举报社区内涉毒违法犯罪”能动 员社区居民参与禁毒工作，改善戒毒康复人员外部社会环境，减少涉毒不良因素。A主要针对戒毒协议履行管 理；B侧重于个体咨询；D是关于丙肝检测服务，与改善外部社会环境关系不大。答案：C"}, {"ch": "实务·Ch4", "yr": "2025", "tp": "单选", "q": "选项A：农民工是企业职工中相对特殊的群体，企业社会工作中对特殊群体关怀服务 充分发挥出留守儿童的积极性与能动性", "ok": true}, {"l": "C", "t": "重视专家的专业意见，在需求评估后与专家共同确定服务目标", "ok": false}, {"l": "D", "t": "使用标准化服务方案，将心理辅导作为服务方案中的首要内容", "ok": false}], "ex": "社会工作服务介入行动要遵循以人为本、服务对象自决等原则。A选项未尊重服务对象自决 ；C选项重视专家意见但未突出服务对象主体地位；D选项标准化方案未考虑个体差异。B选项瞄准目标，发挥 留守儿童积极性与能动性，符合原则。答案：B"}, {"ch": "实务·Ch1", "yr": "2025", "tp": "单选", "q": "亮亮妈妈向社会工作者小苏抱怨:“亮亮在班里从来不主动上台表现，成绩不好也不着急，我尝试了很多 方法改变他，但一直没效果。”小苏拟运用“再标签”技巧帮助亮亮妈妈调整想法，下列提问中恰当的是 （ ）。", "ops": [{"l": "A", "t": "“亮亮一直不主动表现让您很着急，对吗”“", "ok": false}, {"l": "B", "t": "“换个角度来看，亮亮这样是不是也有好处呢”", "ok": true}, {"l": "C", "t": "“在亮亮的所有特质中，您最满意的是哪个呢？”", "ok": false}, {"l": "D", "t": "“在亮亮的所欲问题中，您觉得那个最重要呢”", "ok": false}], "ex": "“再标签”技巧是帮助服务对象从新的角度看待问题，B选项引导亮亮妈妈换个角度看亮亮的 情况，符合“再标签”技巧。A只是确认妈妈的情绪，C问最满意特质、D问最重要问题，均未体现“再标签 ”。答案：B"}, {"ch": "实务·Ch1", "yr": "2025", "tp": "单选", "q": "视力障碍者小花即将从职业学校毕业，因担心找不到工作而焦虑不安，社会工作者老马了解情况后，拟为 其开展职业康复服务。在为小花做了职业咨询后，接下来老马应该做的工作是（ ）。", "ops": [{"l": "A", "t": "根据小花工作意愿为其提供相应岗位技能培训", "ok": false}, {"l": "B", "t": "对小花进行身心状况和职业适应性等相关评估", "ok": true}, {"l": "C", "t": "对小花提供劳动市场和就业方向的信息和建议", "ok": false}, {"l": "D", "t": "与小花一起讨论就业后可能面对的困惑和迷茫", "ok": false}], "ex": "职业康复流程一般是先进行职业咨询，之后要对服务对象进行身心状况和职业适应性等相关 评估，以便后续开展针对性的培训和就业推荐等。A选项岗位技能培训应在评估之后；C选项提供劳动市场等 信息在职业咨询环节可能已涉及；D选项讨论就业后困惑也是在就业前准备及就业环节之后。所以接下来应做 的是B。答案：B"}, {"ch": "实务·Ch2", "yr": "2025", "tp": "单选", "q": "某社会工作服务机构接受司法机构委托开展未成年人司法社会工作服务，在安置帮教阶段，该机构宜开展 的服务是（ ）。", "ops": [{"l": "A", "t": "开展合适成年人服务", "ok": false}, {"l": "B", "t": "开展服务对象社会调查", "ok": false}, {"l": "C", "t": "协助服务对象融入社会", "ok": true}, {"l": "D", "t": "提供未成年证人服务", "ok": false}], "ex": "安置帮教阶段重点是帮助服务对象回归社会、融入社会 。A选项合适成年人服务多在案件办 理阶段；B选项社会调查一般在判决前；D选项未成年证人服务也多在案件相关前期环节。只有C选项协助服务 对象融入社会符合安置帮教阶段工作。答案：C"}, {"ch": "实务·Ch1", "yr": "2025", "tp": "单选", "q": "小明的父母希望他到工厂上班，但他不肯去，认为上下班打卡不自由坚持自己找工作，为此，母子二人冲 突不断，关系紧张，小明遂向社会工作者老马求助。在预估阶段，下列老马的做法中，属于识别小明问题的 客观因素的是（ ）。", "ops": [{"l": "A", "t": "了解小明自己对工作的看法", "ok": false}, {"l": "B", "t": "倾听小明自己找工作的经历", "ok": true}, {"l": "C", "t": "同理小明对母亲的要求感受", "ok": false}, {"l": "D", "t": "邀请小明讲述对自由的理解", "ok": false}], "ex": "客观因素是指那些具体的、实际发生的事情。小明自己找工作的经历是实际发生的事情，属 于客观因素。而A选项小明对工作的看法、C选项小明对母亲要求的感受、D选项小明对自由的理解都属于主观 层面的内容。答案：B"}, {"ch": "实务·Ch2", "yr": "2025", "tp": "单选", "q": "大军因交通意外致残后经济压力徒增，日常生活需要别人照顾，居住环境也多有不便。他感到十分沮丧 ，社会工作者了解情况后，拟采用个案管理模式为大军提供支持性服务，下列做法中正确的是（ ）。", "ops": [{"l": "A", "t": "重点评估大军的多重要求", "ok": false}, {"l": "B", "t": "逐个解决大军的诸多困难", "ok": false}, {"l": "C", "t": "重点评估大军的多重因素", "ok": true}, {"l": "D", "t": "纠正大军负性的心理感知", "ok": false}], "ex": "个案管理的实施原则强调服务对象参与、服务评估、服务协调等。这里面对大军的情况，首 先要全面评估大军面临的多重因素，包括致残后的经济、生活照顾、居住环境及心理等多方面因素，才能更 好提供服务，C选项符合。A选项重点评估要求不准确，应评估多方面因素；B选项逐个解决不是个案管理特点 ，强调整合资源综合解决；D选项纠正心理感知只是其中一部分，不如C全面。答案：C"}, {"ch": "实务·Ch12", "yr": "2025", "tp": "单选", "q": "某社区近来发生了儿童在小区游乐园玩耍受伤的情况，社区工作者小赵立即着手处理此事，根据儿童社会 工作服务的平等参与原则，小赵适宜的做法是（ ）。", "ops": [{"l": "A", "t": "督促物业承担安全责任", "ok": false}, {"l": "B", "t": "邀请受伤儿童对此发表意见", "ok": true}, {"l": "C", "t": "组织医护人员宣讲急救知识", "ok": false}, {"l": "D", "t": "联合社区志愿者巡查游乐园", "ok": false}], "ex": "平等参与原则强调儿童有权利参与与自身利益相关的事务决策等。A选项是让物业担责，未体 现儿童参与；C选项组织医护人员宣讲急救知识，没有儿童参与环节；D选项联合志愿者巡查游乐园，也没有 涉及儿童参与。只有B选项邀请受伤儿童发表意见，体现了儿童平等参与。答案：B"}, {"ch": "实务·Ch1", "yr": "2025", "tp": "单选", "q": "某校社会工作者小张运用“小背摔”活动评估初一新生的人际信任度，他将学生分成3人一组，邀请其中 2位扮演“道具”。接下来小张应该（ ）。", "ops": [{"l": "A", "t": "轻轻推到不敢倒下的体验者", "ok": false}, {"l": "B", "t": "观察那些体验者迟疑或拒绝倒下", "ok": true}, {"l": "C", "t": "极力鼓励倒下的体验者", "ok": false}, {"l": "D", "t": "邀请主动倒下的体验者分享感受", "ok": false}], "ex": "“小背摔”活动评估人际信任度，重点是观察学生表现来评估信任情况。A选项直接推人不符 合活动正常流程，C选项鼓励倒下不是主要评估行为，D选项分享感受是活动后续环节。B选项观察迟疑或拒绝 倒下的情况有助于评估人际信任度。答案：B"}, {"ch": "实务·Ch1", "yr": "2025", "tp": "单选", "q": "随着年龄的增长，快递员老郭感到越来越力不从心，难以适应行业对体力的高要求，但他又缺乏其他工作 技能，因而对未来十分担心，遂向社会工作者老李求助，在接案会谈阶段，老李恰当的做法是（ ）。", "ops": [{"l": "A", "t": "使用倾听的会谈技巧，引导老郭表达真实感受", "ok": true}, {"l": "B", "t": "提前查阅相关报告，以在会议中主导问题界定", "ok": false}, {"l": "C", "t": "联系老郭所在公司，让其安排会谈时间及地点", "ok": false}, {"l": "D", "t": "根据自己工作时间，请老郭准时到办公室会谈", "ok": false}], "ex": "接案会谈阶段，社会工作者要营造良好氛围，运用倾听等技巧与服务对象建立信任关系，引 导其表达真实感受。B选项主导问题界
