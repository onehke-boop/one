法恰当的是（ ）。", "ops": [{"l": "A", "t": "举办社区残健融合趣味运动会", "ok": true}, {"l": "B", "t": "组织开展预防残疾的活动", "ok": false}, {"l": "C", "t": "邀请专业康复师对社区进行残疾咨询", "ok": true}, {"l": "D", "t": "安排残疾人入驻社区康复服务机构", "ok": false}, {"l": "E", "t": "社区志愿者入户走访残疾人家庭", "ok": true}], "ex": "残疾人社区康复的主要内容强调利用社区资源，开展综合性、社会化的康复服务，包括： 医疗康复、教育康复、职业康复、社会康复 促进残疾人社会参与、社区融合 提供社区支持性服务 A 举办社区残健融合趣味运动会 促进社会参与与社区融合，属于社会康复。 C 邀请专业康复师对社区进行残疾咨询 提供社区化康复指导与服务，属于医疗/社会康复支持。 E 社区志愿者入户走访残疾人家庭 提供社区支持性服务，了解需求、链接资源。 B 组织开展预防残疾的活动 属于残疾预防范畴，非社区康复的核心内容。 D 安排残疾人入驻社区康复服务机构 属于“机构康复”，非“社区康复”的核心理念（社区康复强调在社 区环境中提供服务）。答案：ACE"}, {"ch": "实务·Ch1", "yr": "2025", "tp": "多选", "q": "某社区的居民老赵常常将家中闲置物品堆放在楼道，邻居多次劝说无果，反映到居委会，社会工作者通过 走访完成预估，并撰写了预估摘要，下列预估摘要内容中，属于对老赵家庭系统预估的有（ ）。", "ops": [{"l": "A", "t": "老赵性格倔强且刚愎自用", "ok": false}, {"l": "B", "t": "老赵家中的物品摆放凌乱", "ok": false}, {"l": "C", "t": "老赵与邻居间的交往不多", "ok": false}, {"l": "D", "t": "家中事务由老赵一个人做主", "ok": true}, {"l": "E", "t": "儿子不敢对老赵提反对意见", "ok": true}], "ex": "家庭系统预估主要关注家庭内部结构、权力关系等方面。A选项是老赵个人性格，不属于家庭 系统；B选项家中物品摆放属于家庭环境，但非家庭系统核心要素；C选项老赵与邻居交往，不属于家庭系统 范畴；D选项家中事务由老赵一人做主，体现家庭权力结构，属于家庭系统预估；E选项儿子不敢提反对意见 ，反映家庭权力关系，属于家庭系统预估。答案：DE 23"}];
const FL=[{"ch": "综合·Ch1", "q": "社会工作的含义？", "a": "在社会福利制度框架下，根据专业价值观念、运用专业方法帮助有困难的人或群体走出困境、获得发展的职业性服务活动。"}, {"ch": "综合·Ch1", "q": "我国对社会工作的三种理解？", "a": "①普通社会工作：本职之外不计报酬的公益性活动②行政性社会工作：在政府部门和群众团体中从事职工福利、社会救助等③专业社会工作：由受过专业训练的人开展的助人活动"}, {"ch": "综合·Ch1", "q": "社会工作的六大特点？", "a": "①专业助人活动②注重专业价值③强调专业方法④注重实践⑤互动合作⑥多方协同"}, {"ch": "综合·Ch1", "q": "社会工作对服务对象的四个目标？", "a": "①解救危难②缓解困难③激发潜能④促进发展"}, {"ch": "综合·Ch1", "q": "社会工作在社会层面的核心目标？", "a": "解决社会问题、促进社会公正。公正包括机会公正、过程公正和结果公正。"}, {"ch": "综合·Ch1", "q": "社会工作在文化层面的目标？", "a": "①弘扬人道主义：倡导互助、助人精神②促进社会团结：相互亲和、包容、合作共事、共同发展"}, {"ch": "综合·Ch1", "q": "功能类型中正功能和负功能？", "a": "正功能：正面的、积极的、支持性的作用；负功能：负面的、消极的作用。"}, {"ch": "综合·Ch1", "q": "社会工作对服务对象的四个功能？", "a": "①促进正常生活②恢复弱化的功能③促进人的发展④促进人与社会环境的相互适应"}, {"ch": "综合·Ch1", "q": "社会工作对社会的四个功能？", "a": "①维持社会秩序②建构社会资本③促进社会和谐④推动社会进步"}, {"ch": "综合·Ch1", "q": "我国社会工作发展的四项基本原则？", "a": "①坚持中国共产党的领导②坚持社会主义核心价值观引领③坚持以人民为中心④坚持职业化、专业化、本土化"}, {"ch": "综合·Ch1", "q": "社会工作者的直接服务角色（5种）？", "a": "①服务提供者②治疗者③支持者④关系协调者⑤倡导者（政策倡导+社会倡导）"}, {"ch": "综合·Ch1", "q": "社会工作者的间接服务角色（3种）？", "a": "①行政管理者②资源筹措者（资源链接者）③政策影响者"}, {"ch": "综合·Ch1", "q": "社会工作的基本对象？", "a": "①孤儿、无依无靠的老人和残疾人②精神病患者③因失业而沦为生存困难者"}, {"ch": "综合·Ch1", "q": "社会工作价值观的核心？", "a": "利他主义——帮助他人、服务他人、促进社会福利和社会公正。价值观是社会工作的灵魂。"}, {"ch": "综合·Ch1", "q": "社会工作者的核心能力（5项）？", "a": "①沟通与建立关系②促进和使能③评估和计划④提供服务和干预⑤在组织中工作"}, {"ch": "综合·Ch1", "q": "社会工作领域的扩展趋势？", "a": "①从低收入群体到有需要人群②从关注问题到关注和谐发展③新领域：就业促进、减灾、精神卫生④新发展：参与社会治理、助力共同富裕、乡镇社工站建设"}, {"ch": "综合·Ch1", "q": "社会工作对象如何扩大？", "a": "从最困难的人→所有需要帮助的人→从个体和家庭到社区→从困难民众到一般公众"}, {"ch": "综合·Ch1", "q": "专业助人方法的地位？", "a": "专业助人方法是现代社会工作的核心组成部分，是社会工作者的基本功，是社工区别于一般助人者的明显之处。"}, {"ch": "综合·Ch1", "q": "助人活动的含义？", "a": "助人活动是社会工作最核心的部分，反映了价值观和工作方法，是双方围绕解决困难和问题而展开的持续互动。"}, {"ch": "综合·Ch2", "q": "社会工作价值观体系的三重意义？", "a": "①确定专业使命和核心关怀②为专业人员职责提供指引、保护服务对象利益③对专业共同体的社会责任进行明确规定"}, {"ch": "综合·Ch2", "q": "国际社会工作界认同的6项专业价值观？", "a": "①服务大众②践行社会公正③强调个人尊严和价值④注重人与人关系⑤待人真诚守信⑥注重能力培养和再学习"}, {"ch": "综合·Ch2", "q": "操作原则中的基本信念包括？", "a": "尊重、独特性、相信人能改变、接纳、非评判、个别化、保密、当事人自决"}, {"ch": "综合·Ch2", "q": "接纳与认同的区别？", "a": "接纳不等于认同。接纳是对服务对象价值观与个人背景特征的一种包容，是建立专业助人关系的重要前提。"}, {"ch": "综合·Ch2", "q": "非评判原则？", "a": "对服务对象的性格、性取向、生活方式、宗教、政治倾向等不作倾向性的批评和判断，尊重其在观念和生活方式上的选择。"}, {"ch": "综合·Ch2", "q": "个别化原则？", "a": "尊重服务对象的个体差异，不应使用统一的服务方法回应独特需要；尊重个性化需求，充分挖掘个人潜能。"}, {"ch": "综合·Ch2", "q": "保密原则分为哪两种情形？", "a": "一般情形：严格保密。紧急情形（如有自杀或伤害他人的危险）：可以适当打破保密原则。"}, {"ch": "综合·Ch2", "q": "当事人自决原则？", "a": "服务对象主导作用。社工应尊重服务对象自己做出决定的权利。"}, {"ch": "综合·Ch2", "q": "对服务对象的看法（四方面）？", "a": "①每个人都值得尊重②每个人都是独特的③个人经验是生命历程的一部分④采取包容的态度"}, {"ch": "综合·Ch2", "q": "对服务机构的看法（四方面）？", "a": "①应维护机构的政策与立场②有责任维护机构形象并促进发展③有责任就问题提出意见④应推动机构与政府及其他机构的合作"}, {"ch": "综合·Ch2", "q": "对公共福利发展的看法（四方面）？", "a": "①应促进公共福利的发展②应推进公平和有效分配③有责任防止滥用公共福利④应积极参与政策咨询与讨论"}, {"ch": "综合·Ch2", "q": "我国社会工作实践的价值观（7条）？", "a": "①以人民为中心②接纳和尊重③个别化和非评判④注重和谐有序⑤平等待人、注重民主参与⑥权利与责任并重⑦个人发展与国家发展相结合"}, {"ch": "综合·Ch2", "q": "专业伦理的六大责任对象？", "a": "①对服务对象②对同事③对服务机构④作为专业人员⑤对社会工作专业⑥对全社会"}, {"ch": "综合·Ch2", "q": "伦理守则的五个作用？", "a": "①保护服务对象权益②帮助社工解决伦理难题③促进专业健康发展④促进服务机构能力建设⑤维护社会正义"}, {"ch": "综合·Ch2", "q": "对专业实践的看法（五方面）？", "a": "①应推动社会工作专业实践不断发展②每个社工有责任不断完善专业实践③专业实践发展有利于维护服务对象权益④应开展与其他领域专业工作者的合作⑤继续教育是促进专业实践发展的重要途径"}, {"ch": "综合·Ch3", "q": "马斯洛需要层次论（5层）？", "a": "①生理需要②安全需要③归属与爱的需要④尊重的需要（内部+外部）⑤自我实现的需要"}, {"ch": "综合·Ch3", "q": "阿尔德弗尔ERG理论？", "a": "①生存需要（衣食住行等）②关系需要（发展人际关系）③成长需要（自我发展和完善）"}, {"ch": "综合·Ch3", "q": "莱恩·多亚尔和伊恩·高夫的需要理论？", "a": "基本需要：身体健康和自主两个方面。中介需要：11种，包括食物、住房、工作环境、保健、童年安全、初级关系、环境安全、经济安全、教育、生育控制等。"}, {"ch": "综合·Ch3", "q": "人类需要的三种分类方式？", "a": "①按起源：生理性和社会性②按内容：物质和精神③按迫切程度：生存性和发展性"}, {"ch": "综合·Ch3", "q": "本能行为和习得行为？", "a": "本能行为：来自遗传，不需要学习就可以出现的定型行为模式。习得行为：在后天与环境互动中逐渐学习而形成的行为。"}, {"ch": "综合·Ch3", "q": "亲社会行为和反社会行为？", "a": "按行为对社会的作用是积极还是消极划分。亲社会=积极，反社会=消极。"}, {"ch": "综合·Ch3", "q": "正常行为和偏差行为？", "a": "按行为是否符合正常模式和社会规范划分。"}, {"ch": "综合·Ch3", "q": "人类行为的五个特点？", "a": "①适应性②多样性③发展性④可控性⑤整合性"}, {"ch": "综合·Ch3", "q": "社会环境的五个特点？", "a": "①多样性②复杂性③层次性④稳定性⑤变动性"}, {"ch": "综合·Ch3", "q": "社会环境的主要构成要素（7个）？", "a": "家庭、朋辈群体、学校、工作单位、社区、文化、大众传媒"}, {"ch": "综合·Ch3", "q": "家庭的五种类型？", "a": "①核心家庭②主干家庭③联合家庭④单亲家庭⑤丁克家庭"}, {"ch": "综合·Ch3", "q": "家庭教养模式（6种）？", "a": "①娇纵型②支配型③专制型④放任型⑤冲突型⑥民主型"}, {"ch": "综合·Ch3", "q": "民主型教养模式的特点？", "a": "互相尊重、平等交流，对子女既有约束又有鼓励。孩子自尊、自信、自律，有创造性和社交能力。"}, {"ch": "综合·Ch3", "q": "专制型教养模式的特点？", "a": "家长缺少爱心耐心，管理方式粗暴，孩子不被尊重，产生不信任感、自卑、暴躁、懦弱等。"}, {"ch": "综合·Ch3", "q": "冲突型教养模式的特点？", "a": "家庭成员关系紧张、气氛失调、价值导向不一致，孩子易缺乏安全感、意志薄弱、残忍冷酷等。"}, {"ch": "综合·Ch3", "q": "放任型教养模式的特点？", "a": "家长缺少爱心耐心也缺乏责任感，对孩子放任自流，孩子缺乏自信、不负责任等。"}, {"ch": "综合·Ch3", "q": "同辈群体的四个特点？", "a": "①平等性②开放性③认同性④独特性"}, {"ch": "综合·Ch3", "q": "同辈群体对个体的影响？", "a": "①对认知、行为、情绪、精神和支持系统有直接影响②同辈群体有自己的价值标准（可积极可消极）③在不同社会系统中扮演不同角色"}, {"ch": "综合·Ch3", "q": "社区的两种分类？", "a": "①地域性社区和功能性社区②农村社区和城市社区③传统社区和现代社区"}, {"ch": "综合·Ch3", "q": "社区对成员的四个影响？", "a": "①成员有共同特征②存在复杂社会交往关系③社区本身是社会组织有约束作用④成员对社区有认同感和归属感"}, {"ch": "综合·Ch3", "q": "文化对人类行为的影响？", "a": "通过确立行为标准，达到规范、控制人的行为的目的。"}, {"ch": "综合·Ch3", "q": "大众传媒对人的行为的五个影响？", "a": "①支持和增强固有观念②直接改变行为③改变原有立场④提供信息引导行为⑤提供行为规范"}, {"ch": "综合·Ch3", "q": "人类行为与社会环境的五个基本关系？", "a": "①人们要适应社会环境②社会环境影响个人行为③社会环境和生物遗传共同影响行为④人类能够改变社会环境⑤关系的非平衡性"}, {"ch": "综合·Ch3", "q": "婴幼儿社会化的三个阶段？", "a": "出生至6个月：单纯社会化反应阶段；7个月到2岁：社会性感情联结建立阶段；2-3岁：伙伴关系发展阶段"}, {"ch": "综合·Ch3", "q": "学龄前儿童自我意识由哪三因素构成？", "a": "①自我评价②自我体验③自我控制"}, {"ch": "综合·Ch3", "q": "学龄阶段儿童意外伤害预防工作？", "a": "①针对儿童和环境开展工作②对儿童和家长进行安全教育③对学校开展工作④对社区开展工作"}, {"ch": "综合·Ch3", "q": "青少年阶段主要问题？", "a": "①网络成瘾②青少年犯罪③青少年性行为"}, {"ch": "综合·Ch3", "q": "青年期（22岁左右）特征？", "a": "人的生理发展的「黄金时期」。生理完全成熟，心理机能相对稳定。能力发展包括一般能力和特殊能力。"}, {"ch": "综合·Ch3", "q": "中年早衰综合征原因？", "a": "①工作压力大②家庭负担重③不良的生活习惯"}, {"ch": "综合·Ch3", "q": "更年期综合征干预的三个层面？", "a": "生理层面：普及更年期健康知识；心理层面：疏导紧张焦虑等消极情绪；社会层面：整合社会力量帮助解决难题"}, {"ch": "综合·Ch3", "q": "家庭暴力的特点和原因？", "a": "特点：行为隐蔽性、时间循环性、手段多样性。原因：①传统文化歧视②女性经济地位低③认识不够④法律法规不健全"}, {"ch": "综合·Ch3", "q": "老年阶段的发展特征？", "a": "生理：较大退化；心理：既成熟稳定也表现出衰退性；社会：角色变化导致地位下降"}, {"ch": "综合·Ch3", "q": "老年人失智的特征？", "a": "渐进性认知功能退化，典型起始症状为短期记忆力差。主要以预防为主。"}, {"ch": "综合·Ch3", "q": "老年人被歧视和被虐待的原因？", "a": "①社会变迁使老年人丧失原有优势②以权力、能力等片面指标评价老年群体③忽视老年人曾经的贡献"}, {"ch": "综合·Ch3", "q": "皮亚杰认知发展四阶段？", "a": "①感知运动期(0-2岁)②前运算期(2-7岁)③具体运算期(7-12岁)④形式运算期(12岁以上)"}, {"ch": "综合·Ch3", "q": "埃里克森学龄期(6-12岁)核心任务？", "a": "勤奋感vs自卑感。儿童需要在学校中获得成就感和胜任感。"}, {"ch": "综合·Ch3", "q": "埃里克森青少年期(12-20岁)核心任务？", "a": "自我同一性vs角色混乱。需要建立自我认同感，明确「我是谁」。"}, {"ch": "综合·Ch3", "q": "埃里克森成年早期(20-40岁)核心任务？", "a": "亲密感vs孤独感。需要建立亲密的人际关系，特别是亲密的伴侣关系。"}, {"ch": "综合·Ch4", "q": "心理社会治疗模式的核心？", "a": "心理因素和社会因素之间的关联。包括内部心理、外部环境以及两者之间的相互影响。"}, {"ch": "综合·Ch4", "q": "心理社会治疗模式四个理论假设？", "a": "①对人的成长发展的假设②对服务对象问题的假设（三原因：不良现实、不成熟自我超我、过分严厉防卫机制）③对人际沟通的假设④对人的价值的假设"}, {"ch": "综合·Ch4", "q": "直接治疗技巧的两大类？", "a": "①非反思性直接治疗技巧：支持、直接影响、探索-描述-宣泄②反思性直接治疗技巧：现实情况反思（客观）、心理动力反思（主观）、人格发展反思（过往）"}, {"ch": "综合·Ch4", "q": "心理社会治疗模式的特点？", "a": "研究阶段→诊断阶段→治疗阶段。诊断包括心理动态诊断、缘由诊断、分类诊断。"}, {"ch": "综合·Ch4", "q": "危机介入模式中事件成为危机的3个条件？", "a": "①阻碍重要目标的实现②使基本需要无法满足③超出现有能力，导致心理失衡"}, {"ch": "综合·Ch4", "q": "危机介入模式的六项原则？", "a": "①及时处理②限定目标③输入希望④提供支持⑤恢复自尊⑥培养自主能力"}, {"ch": "综合·Ch4", "q": "危机介入模式四个特点？", "a": "①迅速了解主要问题②快速作出危险性判断③有效稳定情绪④积极协助解决当前问题"}, {"ch": "综合·Ch4", "q": "行为治疗模式三种学习理论？", "a": "①经典条件作用理论②操作性条件作用理论③社会学习理论（观察和模仿）"}, {"ch": "综合·Ch4", "q": "行为治疗模式五种治疗技术？", "a": "①放松练习②系统脱敏③满灌疗法④厌恶疗法⑤模仿"}, {"ch": "综合·Ch4", "q": "行为治疗模式三个特点？", "a": "①注重行为评估②关注行为修正（核心）③侧重修正行为效果的评估"}, {"ch": "综合·Ch4", "q": "人本治疗模式的核心假设？", "a": "以人本主义心理学为基础。人的本质是好的，具有发挥自身潜在能力、追求不断发展的基本趋向。"}, {"ch": "综合·Ch4", "q": "人本治疗模式中功能齐全的人的五特征？", "a": "①能准确领悟周围事物②能充分把握每一时刻③能依据真实愿望选择生活方式④面临选择时体会到心理自由⑤积极生活在变化环境中"}, {"ch": "综合·Ch4", "q": "人本治疗模式三个特点？", "a": "①注重社工自身品格和态度②强调个案辅导关系（真诚、同感、无条件积极关怀）③关注辅导过程"}, {"ch": "综合·Ch4", "q": "理性情绪治疗模式ABC理论？", "a": "A=引发事件，B=信念/认知，C=结果/情绪反应。核心：不合理信念(B)才是导致情绪困扰(C)的根源。"}, {"ch": "综合·Ch4", "q": "个案工作五种会谈类型？", "a": "①建立关系的会谈②收集资料的会谈③诊断性会谈④治疗性会谈⑤一般性咨询会谈"}, {"ch": "综合·Ch4", "q": "支持性技巧？", "a": "①专注②倾听③同理心④鼓励"}, {"ch": "综合·Ch4", "q": "引导性技巧？", "a": "①澄清（重新整理模糊经验）②对焦（集中于某焦点）③摘要（概括归纳要点）"}, {"ch": "综合·Ch4", "q": "影响性技巧？", "a": "①提供信息②自我披露③建议④忠告⑤对质"}, {"ch": "综合·Ch4", "q": "转介服务的两种情形？", "a": "①问题不属于本机构服务范围②服务对象生活在本机构服务区域之外"}, {"ch": "综合·Ch4", "q": "服务协议五个基本内容？", "a": "①服务目标②内容和方法③双方权利和义务④地点、时间、期限和次数⑤双方签字"}, {"ch": "综合·Ch4", "q": "链接社会资源的六种方式？", "a": "①资源的提供②资源的发现③资源的培育④需求的表达⑤利益的协调⑥权益的保护"}, {"ch": "综合·Ch4", "q": "个案结案的五种情形？", "a": "①工作目标已实现②问题未解决但有独立面对能力③关系不和谐④出现新问题需转介⑤不可预测因素"}, {"ch": "综合·Ch4", "q": "服务对象有关资料收集的两类？", "a": "①个人资料：生理、心理、社会方面②环境资料：家庭、朋辈、社区、学校、单位等"}, {"ch": "综合·Ch4", "q": "服务对象问题的预估（横向+纵向）？", "a": "横向分析：问题形成的影响因素（生理、心理、社会层面）。纵向分析：问题发展变化的过程。"}, {"ch": "综合·Ch4", "q": "制订服务计划需做到哪5点？", "a": "①准确分析需要和问题②明确目标、阶段和方法③熟悉机构提供的具体服务④清晰认识社工的能力⑤了解服务对象拥有的资源"}, {"ch": "综合·Ch4", "q": "专业角色的扮演？", "a": "①使能者②联系人③教育者④倡导者⑤治疗者"}, {"ch": "综合·Ch4", "q": "成效评估的三个维度？", "a": "①服务对象的改变状况②工作目标的实现程度③服务介入工作资源的投入"}, {"ch": "综合·Ch4", "q": "个案记录的五个作用？", "a": "①跟进服务②社工评估③转介依据④机构评估依据⑤未来研究参考"}, {"ch": "综合·Ch4", "q": "观察的运用分为哪两种？", "a": "参与观察：社工直接参与观察对象的活动。非参与观察：社工不直接参与。"}, {"ch": "综合·Ch4", "q": "调查表的运用分为哪两种？", "a": "结构式调查表：有固定问题和答案选项。非结构式调查表：只有固定问题，没有答案选项。"}, {"ch": "综合·Ch4", "q": "服务的推进应该怎么做？", "a": "从能做的开始；从愿意合作的着手；采取综合的服务策略。"}, {"ch": "综合·Ch4", "q": "间接治疗技巧？", "a": "通过改善周围环境或辅导第三方来间接影响服务对象，可用到支持、直接影响、探索-描述-宣泄等技巧。"}, {"ch": "综合·Ch5", "q": "小组工作的概念（四要素）？", "a": "①是一种专业方法②以社工带领和引导为过程③组员面对面互动、互相影响④达到改善社会功能的目标"}, {"ch": "综合·Ch5", "q": "小组工作五种类型？", "a": "①教育小组②成长小组③支持小组④治疗小组⑤自助小组"}, {"ch": "综合·Ch5", "q": "小组工作四个特点？", "a": "①组员问题的共同性或相似性②强调民主参与③运用治疗性因素④注重团体的动力"}, {"ch": "综合·Ch5", "q": "小组工作四个功能？", "a": "①塑造平等意识和归属感②提供自我改变和被肯定的社会场景③创造互帮互助、共同成长的学习机会④打造增能的社会支持网络"}, {"ch": "综合·Ch5", "q": "教育小组的特点？", "a": "应用于社区、学校、医院等。宗旨：帮助组员学习新知识、新方法，促使成员适应社会的知识和技能。"}, {"ch": "综合·Ch5", "q": "成长小组的焦点？", "a": "焦点在于个人的成长和正向改变。促进成员自我认知、开拓新视野。重视自助和互助。"}, {"ch": "综合·Ch5", "q": "支持小组最重要的特征？", "a": "关系建构、相互交流和相互支持。充分发挥组员自主性，鼓励分享经验。"}, {"ch": "综合·Ch5", "q": "治疗小组中社工的角色？", "a": "形成后一般处于边缘化位置，扮演推动者和协调者。组员来自不适应社会环境或社会关系断裂破损的人群。"}, {"ch": "综合·Ch5", "q": "互动模式的含义？", "a": "基于人与环境和人与人之间的关系建立的小组模式。焦点在于互动关系及其效果。原则：开放性、平等性、面对面的互动。"}, {"ch": "综合·Ch5", "q": "发展模式的理论基础？", "a": "源于发展心理学、社会发展理论。强调以人的发展为核心，关注社会功能的提升。假设：人有潜力做到自我意识和自我实现。"}, {"ch": "综合·Ch5", "q": "小组准备阶段主要工作？", "a": "①组员招募及遴选②确定目标③制订计划④申报协调资源⑤确定规模与时间⑥选择场地及设施"}, {"ch": "综合·Ch5", "q": "小组规模要求？", "a": "5人适合讨论，8人最容易完成任务。治疗小组5-7人，儿童小组6-8人。辅导性/教育性30-50人。工作小组5-9人。超过25人紧密性明显降低。"}, {"ch": "综合·Ch5", "q": "小组规范的三种类型？", "a": "①秩序性规范（界定互动准则）②角色规范（界定具体角色和行为）③文化规范（澄清信念和基本价值）"}, {"ch": "综合·Ch5", "q": "开始阶段组员的一般特点？", "a": "①矛盾心：对活动既投入又逃避②小心谨慎与相互试探③沉默与被动④对社工的依赖性"}, {"ch": "综合·Ch5", "q": "转折阶段组员的特点？", "a": "①对小组有较强认同感②互动中的抗拒与防卫心理③角色竞争中的冲突"}, {"ch": "综合·Ch5", "q": "转折阶段处理冲突的方法？", "a": "①帮助澄清冲突本质②增进对自我的理解③重新调整规范和契约④协助面对和解决冲突⑤运用焦点回归法（将问题抛回给组员）"}, {"ch": "综合·Ch5", "q": "成熟阶段组员的特点？", "a": "①凝聚力大大增强②关系更亲密，出现次小组③充满信心和希望④关系结构趋于稳定"}, {"ch": "综合·Ch5", "q": "成熟阶段社工的角色变化？", "a": "逐渐退移到边缘位置：信息、资源的提供者和链接者；能力的促进者；引导和支持者"}, {"ch": "综合·Ch5", "q": "成熟阶段社工的四项任务？", "a": "①维持良好互动②协助获得新认知③协助把认知转变为行动④协助解决有关问题"}, {"ch": "综合·Ch5", "q": "结束阶段组员的特点？", "a": "①浓重的离别情绪，采取逃避态度②小组关系结构的弱化"}, {"ch": "综合·Ch5", "q": "结束阶段社工的角色？", "a": "回到中心位置：①引导者（引导情绪表达和学习处理离别）②领导者（规划结束活动）③评估者（评估成效和改变）"}, {"ch": "综合·Ch5", "q": "保持小组经验的方法（5种）？", "a": "①模拟练习②树立信心③寻求支持④鼓励独立⑤跟进服务"}, {"ch": "综合·Ch5", "q": "主持小组讨论的十种技巧？", "a": "①开场②了解③提问④鼓励⑤限制⑥沉默⑦中立⑧摘述⑨引导⑩讨论结束"}, {"ch": "综合·Ch5", "q": "小组评估的两大类型？", "a": "①作为研究方法的小组评估（过程评估+结果评估）②作为工作方法的小组评估（组前计划评估、需求评估、过程评估、效果评估）"}, {"ch": "综合·Ch5", "q": "影响小组大小的六因素？", "a": "①小组目标②小组类型③探讨问题的性质④组员的成熟度⑤工作者的经验⑥是否有协同领导者"}, {"ch": "综合·Ch5", "q": "与组员沟通的7个技巧？", "a": "①营造轻松安全氛围②专注与倾听③积极回应④适当自我表露⑤对信息进行磋商⑥适当帮助梳理⑦及时进行小结"}, {"ch": "综合·Ch5", "q": "促进组员间沟通的5个技巧？", "a": "①提醒相互倾听②鼓励相互表达③帮助相互理解④促进相互回馈⑤示范引导"}, {"ch": "综合·Ch5", "q": "小组计划书的11个主要环节？", "a": "①理念②目标③组员④小组特征⑤明确目的⑥程序计划和日程⑦招募计划⑧需要的资源⑨预料中的问题⑩预算⑪评估方法"}, {"ch": "综合·Ch6", "q": "社区的含义和五大功能？", "a": "居住于某一地理区域，具有共同关系、社会互动及共同服务体系的一个人群。功能：①经济②社会化③社会参与④社会控制⑤互助"}, {"ch": "综合·Ch6", "q": "社区工作的含义？", "a": "以社区为对象的社会工作介入手法。组织成员参与集体行动，合力解决社区问题，改善居民生活。"}, {"ch": "综合·Ch6", "q": "社区工作四个特点？", "a": "①分析问题更为结构取向②介入层面更为宏观③具有一定政治性④富有批判和反思精神"}, {"ch": "综合·Ch6", "q": "任务目标和过程目标的区别？", "a": "任务目标：解决特定社会问题，完成具体工作和服务。过程目标：促进社区居民的一般能力。"}, {"ch": "综合·Ch6", "q": "社区工作四个具体目标？", "a": "①推动居民参与②提高社会意识③善用资源满足需求④培养互相关怀和照顾的美德"}, {"ch": "综合·Ch6", "q": "地区发展模式的含义和特点？", "a": "强调成员参与和合作。特点：①关注共同性问题②通过建立社区自主能力③过程目标超过任务目标④特别重视居民参与"}, {"ch": "综合·Ch6", "q": "地区发展模式中社工的四种角色？", "a": "①使能者②教育者③中介者④协调者"}, {"ch": "综合·Ch6", "q": "社会策划模式的含义和特点？", "a": "依靠专家意见和知识，通过理性、客观和系统化的分析进行计划。特点：①注重任务目标②强调理性原则③自上而下的改变④控制和指导社区未来"}, {"ch": "综合·Ch6", "q": "社会策划模式的十个实施策略？", "a": "①了解组织使命②分析环境③自我评估④界定问题⑤确定需要⑥确定目标⑦寻找和比较方案⑧测试方案⑨执行方案⑩评估结果"}, {"ch": "综合·Ch6", "q": "社区照顾模式的含义和特点？", "a": "动员社区资源，运用非正式支援网络，让需要照顾的人士在家里或社区中得到照顾。特点：①协助融入社区②强调社区责任③非正式照顾是重要因素④提倡建立相互关怀的社区"}, {"ch": "综合·Ch6", "q": "社区照顾模式中社工的五种角色？", "a": "①治疗者②辅导者和教育者③经纪人④倡议者⑤顾问"}, {"ch": "综合·Ch6", "q": "社区需要分析的四种类型？", "a": "①规范型②感觉型③表达型④比较型"}, {"ch": "综合·Ch6", "q": "与居民接触过程的四步骤？", "a": "①介绍自己②展开话题③维持对话④结束对话"}, {"ch": "综合·Ch6", "q": "会议技巧中主持会议的五项技巧？", "a": "①提问和邀请发言（开放性问题）②进一步说明和转述③聚焦④摘要、综合和总结⑤关注、赞赏和鼓励"}, {"ch": "综合·Ch6", "q": "居民骨干培养的四项技巧？", "a": "①鼓励参与②建立民主领导风格③培训工作技巧④增强管理能力"}, {"ch": "实务·Ch1", "q": "通用过程六步骤？", "a": "接案→预估→计划→介入→评估→结案"}, {"ch": "实务·Ch1", "q": "接案阶段的主要工作？", "a": "了解求助原因和求助过程、初步评估问题、决定是否接案、订立初步协议"}, {"ch": "实务·Ch1", "q": "服务对象来源类型？", "a": "①主动求助②他人介绍/机构转介③工作者外展（主动发现）"}, {"ch": "实务·Ch1", "q": "服务对象的类型？", "a": "自愿型和非自愿型。现有（已使用或正在接受）和潜在（未使用但可能需要）。"}, {"ch": "实务·Ch1", "q": "会谈目的和场所安排？", "a": "目的：了解服务对象最关心的事项。场所：①征询意见②配合时间③一般在办公室④舒适、安静、私密、安全"}, {"ch": "实务·Ch1", "q": "会谈的五项主要任务？", "a": "①界定问题②澄清角色期望和义务③激励进入角色④促进态度和行为改变⑤达成初步协议"}, {"ch": "实务·Ch1", "q": "初步协议的内容？", "a": "可书面可口头：①机构和社工可提供的服务②对问题的初步界定③相互角色期望及暂定工作时间长度"}, {"ch": "实务·Ch1", "q": "收集资料的内容和范围？", "a": "①个人资料②身体情况③特点与能力④所处的社会环境"}, {"ch": "实务·Ch1", "q": "收集资料的五种方法？", "a": "①询问②咨询③观察④利用已有资料⑤问卷调查"}, {"ch": "实务·Ch1", "q": "接案会谈的技巧？", "a": "①主动介绍自己②通过「治疗性沟通」了解需要和问题③倾听"}, {"ch": "实务·Ch1", "q": "接案应注意的四事项？", "a": "①是否需要紧急介入②是否有能力处理③问题优先次序（先易后难）④是否符合机构工作范围"}, {"ch": "实务·Ch1", "q": "预估的定义和目的？", "a": "定义：收集资料、分析资料、认定问题，为制定介入计划打基础。目的：制订出正确的计划。"}, {"ch": "实务·Ch1", "q": "预估的五项任务？", "a": "①识别客观因素②识别主观因素③识别成因及延续因素④识别积极因素⑤决定服务方式和内容"}, {"ch": "实务·Ch1", "q": "预估摘要的三个系统？", "a": "①自身系统②家庭系统③社会系统的预估"}, {"ch": "实务·Ch1", "q": "探究不能解决问题的四个原因？", "a": "①对问题的看法②对处理方法的看法③与资源网络的联系④政府的政策"}, {"ch": "实务·Ch1", "q": "分析资料和作出预估的步骤？", "a": "①对问题与需要作出解释②列出目标及先后次③决定介入策略（原则：多层次介入）④撰写预估摘要"}, {"ch": "实务·Ch1", "q": "服务计划的构成要素？", "a": "①目的及目标②关注的问题与对象③介入（方法+行动）"}, {"ch": "实务·Ch1", "q": "目的和目标的区别？", "a": "目的：总体方向。目标：具体工作指标，可分长期和短期，分阶段完成。"}, {"ch": "实务·Ch1", "q": "制订计划的四项原则？", "a": "①有服务对象参与②尊重意愿③详细具体④与总目的相符合"}, {"ch": "实务·Ch1", "q": "目标设定的七步骤？", "a": "①确定需要和问题②解释设定目标的目的③共同选择适当目标④目标陈述明白易懂⑤可测量、可操作、现实⑥讨论可行性和利弊⑦确定目标及先后次序"}, {"ch": "实务·Ch1", "q": "介入的三种分类？", "a": "①直接介入②间接介入（改变环境的工作）③综合介入"}, {"ch": "实务·Ch1", "q": "介入的六项原则？", "a": "①以人为本、自决②个别化③考虑发展阶段④相互依赖⑤瞄准目标⑥考虑经济效益"}, {"ch": "实务·Ch1", "q": "介入行动的四个方面？", "a": "①危机干预②资源整合③经济援助④安置服务"}, {"ch": "实务·Ch1", "q": "评估的两种类型？", "a": "①过程评估：介入初期和中期②结果评估：最终阶段，含目标结果和理想结果"}, {"ch": "实务·Ch1", "q": "评估的方法？", "a": "①基线测量评估②满意度测量和差别影响评分③任务完成情况测量（0-4五等级）④目标实现程度的测量"}, {"ch": "实务·Ch1", "q": "基线测量评估的操作程序？", "a": "①确定介入目标②选择测量工具③对目标行为进行测量和记录（基线期）④进行介入期测量⑤分析和比较"}, {"ch": "实务·Ch1", "q": "评估应注意的四事项？", "a": "①注重自我评估与反思②调动服务对象积极性③方法与价值观吻合④切合实际需要"}, {"ch": "实务·Ch1", "q": "结案阶段的四项主要任务？", "a": "①总结工作②巩固已有改变③解除专业关系④撰写结案记录"}, {"ch": "实务·Ch1", "q": "结案的四种类型？", "a": "①目标实现②服务对象不愿继续③客观原因不能实现目标④身份变化"}, {"ch": "实务·Ch1", "q": "结案负面反应（7种）？", "a": "①否认②倒退③依赖④抱怨⑤愤怒⑥讨价还价⑦忧郁"}, {"ch": "实务·Ch1", "q": "结案反应处理方法（5步）？", "a": "①回顾过程确认时机②提前通知③逐渐减少接触④估计破坏因素⑤安排正式结案活动"}, {"ch": "实务·Ch1", "q": "跟进服务四种方法？", "a": "①电话跟进②个别会面③集体会面④跟进社会支持网络"}, {"ch": "实务·Ch1", "q": "知情同意的主要内容？", "a": "解释机构提供的服务、专业责任和伦理守则，以保证可信性和个人资料的保密。"}, {"ch": "实务·Ch1", "q": "决定工作进程的三种可能？", "a": "①终结服务②转介其他服务③进入下一个助人阶段"}, {"ch": "实务·Ch1", "q": "澄清角色期望的三步？", "a": "①双方对对方的角色期望②对比差异和距离③协商并达成一致"}, {"ch": "实务·Ch1", "q": "巩固已有改变的方法？", "a": "①回顾工作过程②强化已有改变③给予积极支持"}, {"ch": "实务·Ch1", "q": "满意度测量和差别影响评分的区别？", "a": "满意度测量：口头或书面表达对介入效果的看法。差别影响评分：先自我陈述变化，再区分哪些是介入本身带来的，哪些是其他因素。"}, {"ch": "实务·Ch2", "q": "儿童的社会属性（基础性）三方面？", "a": "①童年是人生的基础②儿童是家庭的基础③儿童是社会发展进步的基础"}, {"ch": "实务·Ch2", "q": "儿童成长发展的六大特性？", "a": "①快速性②阶段性③顺序性④不均衡性⑤个体差异性⑥分化与互补性"}, {"ch": "实务·Ch2", "q": "儿童发展阶段划分？", "a": "婴儿(0-1)、幼儿(2-3)、学前(4-5)、学龄(6-12)、青少年(13-18)"}, {"ch": "实务·Ch2", "q": "儿童四类需要？", "a": "①生存的需要②发展的需要③受保护需要④社会化需要"}, {"ch": "实务·Ch2", "q": "家庭监护问题三类？", "a": "①监护不足②监护不当③监护缺失"}, {"ch": "实务·Ch2", "q": "儿童社会工作的三种服务类型？", "a": "①支持性（全体儿童）②补充性（亲职能力不足）③替代性（亲职严重不当或缺失）"}, {"ch": "实务·Ch2", "q": "儿童保护预防和应对的区别？", "a": "预防：针对育儿过程中不良理念和行为提供支持性和补充性服务。应对：针对监护严重不当和缺失的替代性服务。"}, {"ch": "实务·Ch2", "q": "儿童社工实务的六项原则？", "a": "①优先②利益最大③最小伤害④平等参与⑤生态系统⑥依法保护"}, {"ch": "实务·Ch2", "q": "以家庭为中心方法的五要素？", "a": "①以家庭为单位②聚焦家庭功能③家庭全程参与④建立良好关系⑤链接资源网络"}, {"ch": "实务·Ch2", "q": "以家庭为中心方法的六项实务原则？", "a": "①儿童安全和健康第一②必须了解儿童需要和家庭情况③不应因语言宗教等区别对待④尽可能保持儿童在家庭中生活⑤家庭寄养应尽量短暂⑥应在最短时间与父母团聚"}, {"ch": "实务·Ch2", "q": "儿童社会工作的价值理念？", "a": "儿童权利的保护和实现。理论知识体系三部分：发展理论、专业实务理论、国家法规政策。"}, {"ch": "实务·Ch2", "q": "儿童社工的三大特点？", "a": "①价值理念是儿童权利的保护和实现②聚焦亲职能力建设③兼顾专业理想和本土化"}, {"ch": "实务·Ch2", "q": "补充性儿童福利服务的内容？", "a": "对象：亲职能力不足的儿童。内容：经济补助、托育服务、健康育儿资讯和技能培训。"}, {"ch": "实务·Ch2", "q": "替代性儿童福利服务的内容？", "a": "对象：亲职严重不当和缺失的儿童。内容：安置服务（家庭收养、家庭寄养和机构养育）。"}, {"ch": "实务·Ch2", "q": "家庭寄养的分类？", "a": "临时寄养和永久寄养。一般寄养结案时间为儿童年满18周岁之时。"}, {"ch": "实务·Ch2", "q": "儿童积极人格培养的阶段？", "a": "婴儿期：信任人格；幼儿期：自主人格；学前阶段：勤奋人格"}, {"ch": "实务·Ch2", "q": "儿童面临的三大类问题？", "a": "①生存问题（新生儿健康、营养）②发展问题（身处困境、辍学）③保护问题（免遭忽视、虐待、暴力）"}, {"ch": "实务·Ch4", "q": "老年人的界定和划分？", "a": "60周岁以上。60-69低龄、70-79中龄、80以上高龄。"}, {"ch": "实务·Ch4", "q": "老年人三个特点？", "a": "①生理老化②心理老化③社会角色变化"}, {"ch": "实务·Ch4", "q": "老年人八大需要？", "a": "①经济保障②健康维护③社会参与④就业休闲⑤婚姻家庭⑥居家安全⑦善终安排⑧一条龙照顾"}, {"ch": "实务·Ch4", "q": "老年社工应注意的两个事项？", "a": "①价值观问题②移情与工作倦怠问题"}, {"ch": "实务·Ch4", "q": "虐待老人和疏于照顾的区别？", "a": "虐待：恶意对待，在身体、情感或心理及经济方面采取非人道做法。疏于照顾：主动或被动地让老人得不到所需照顾。"}, {"ch": "实务·Ch4", "q": "处理认知与情绪问题涉及哪些疾病？", "a": "①抑郁症（影响情绪情感）②痴呆症（影响认知和智力）③谵妄（类似痴呆但可逆转）④焦虑症（过度忧虑）"}, {"ch": "实务·Ch4", "q": "自杀评估的三种线索？", "a": "①直接线索：明确说出自杀意愿②间接线索：言语上有倾向③行为线索：行为上流露"}, {"ch": "实务·Ch4", "q": "自杀干预措施（3步）？", "a": "①担当先行预防者角色②动员外部环境资源③积极制订行动方案"}, {"ch": "实务·Ch4", "q": "需求评估的四个目的？", "a": "①识别优势和不足②识别维护现有功能的方法③识别恢复丧失功能的措施④识别替代丧失功能的支持"}, {"ch": "实务·Ch4", "q": "评估需要覆盖的5个方面？", "a": "身体健康、心理和情绪、社会功能、日常活动能力、经济状况和环境安全"}, {"ch": "实务·Ch4", "q": "老年个案工作五大注意事项？", "a": "①营造适宜沟通环境②多方求证问题③重视文化传统和尊重④给老人自决权⑤要有耐心"}, {"ch": "实务·Ch4", "q": "老年小组工作的特点？", "a": "①空间和辅助器具特别考虑②带领者扮演更积极角色③节奏慢，要欣赏点滴进步。不宜：身体状况不好、器质性疾病、严重行为问题、紧急危机"}, {"ch": "实务·Ch4", "q": "老年小组工作注意事项（4项）？", "a": "①尊重自决权②平衡对小组和个人的责任③尊重保密权④干预小组动力，保护成员免受伤害"}, {"ch": "实务·Ch4", "q": "老年社区工作方案的工作原则？", "a": "采用优势视角；充权；统筹规划；资源链接与整合"}, {"ch": "实务·Ch4", "q": "社区照顾服务三种类型？", "a": "①居家服务②社区服务中心服务③社区老人照顾机构服务"}, {"ch": "实务·Ch4", "q": "社区工作方案的重点人群？", "a": "①独居老人②高龄老人③伤残老人④困难老人"}, {"ch": "实务·Ch4", "q": "养老机构中老年人生活特点（9条）？", "a": "①交往固定化②自主空间减少③隐私受限④与外部接触受限⑤依赖工作人员⑥可能掩饰真实想法⑦可能退出场合⑧可能挑衅⑨可能失去返回社区的信心"}, {"ch": "实务·Ch4", "q": "社工在养老机构照顾中的角色？", "a": "①申请和作决定阶段：帮助了解机构、化解负面情绪、初步评估②入住适应阶段：帮助适应新环境③稳定生活阶段：提供持续服务"}, {"ch": "实务·Ch12", "q": "社区社工的三个目标？", "a": "①促进居民参与、解决问题②改善社区关系、提升意识③挖掘资源、满足需求"}, {"ch": "实务·Ch12", "q": "基层治理体系的近期和长远目标？", "a": "近期(5年)：建立党组织统一领导的基层治理体系。长远(再10年)：基本实现基层治理体系治理能力现代化。"}, {"ch": "实务·Ch12", "q": "乡镇社工站建设的七项工作？", "a": "①加紧制定政策②把握推进步骤③强化资源整合④聚焦重点人群⑤加大人才培养⑥规范机构建设⑦强化督导支持"}, {"ch": "实务·Ch12", "q": "城市社区统筹照顾的服务类型？", "a": "社区社会救助人员服务、老年人服务、儿童服务、妇女服务、残疾人服务、家庭暴力救助、居民健康、特殊困难居民"}, {"ch": "实务·Ch12", "q": "扩大社区参与的五个途径？", "a": "①参与需求调查②促进议事协商③提高参与水平④培育社会组织和骨干⑤组织志愿服务项目"}, {"ch": "实务·Ch12", "q": "促进社区融合的五方面？", "a": "①社会组织共建②居民自助与互助③外来人口融入④异地安置社区居民服务⑤矛盾纠纷调解"}, {"ch": "实务·Ch12", "q": "社区矫正方面的六项工作？", "a": "①疏导服刑人员心理②修复家庭和社区关系③促进就业④帮助接受教育⑤配合司法行政机关进行社区影响调查⑥帮扶生活困难的服刑人员"}, {"ch": "实务·Ch12", "q": "社区戒毒与康复服务的四项内容？", "a": "①组织开展毒品预防教育②提供心理辅导、行为矫正、社会支持③链接就业资源④帮助生活困难的戒毒康复人员"}, {"ch": "实务·Ch12", "q": "农村社区社工的主要内容？", "a": "①参与乡村振兴②服务农村特殊群体（留守儿童、老人、妇女）③介入灾害应急服务"}, {"ch": "实务·Ch12", "q": "参与乡村振兴工作的五方面？", "a": "①链接资源发展产业②提升村民社区意识③开展乡村文体服务④培育乡村自组织⑤评估需求倡导政策"}, {"ch": "实务·Ch12", "q": "布雷德绍四种需求类型？", "a": "①感觉性：居民感受并表述的②表达性：通过行动表达的③规范性：专家评估决定的④比较性：与其他社区比较的"}, {"ch": "实务·Ch12", "q": "方案策划的六个步骤？", "a": "①确认需求②了解居民特征③订立目标④评估自身能力⑤制定进度表⑥程序编排"}, {"ch": "实务·Ch12", "q": "方案执行的三阶段？", "a": "①筹备阶段（人财物配置、宣传推广）②服务活动阶段（预算、进度、品质、士气）③结束阶段（报销、归档、表彰、评估）"}, {"ch": "实务·Ch12", "q": "方案评估方法？", "a": "定量评估法（数字表现）和定性评估法（文字表达）。评估内容包括成效评估和过程评估。"}, {"ch": "实务·Ch12", "q": "灾害社会工作服务六方面？", "a": "①灾后心理社会援助②儿童抗逆成长关爱③老年群体社会照顾④因灾致残社区康复⑤临时安置点和新建社区服务⑥协助防灾减灾宣传教育"}, {"ch": "实务·Ch12", "q": "留守老人关爱服务三方面(2023)？", "a": "①提供专业服务②提供志愿服务③孵化培育为老服务专业机构"}, {"ch": "实务·Ch12", "q": "留守儿童社会服务四项？", "a": "①留守儿童成长服务②家庭服务③青少年犯罪预防与偏差矫治④社区托管服务"}, {"ch": "实务·Ch12", "q": "留守妇女社会服务四方面？", "a": "①卫生保健②心理健康③技能训练和创业支持④文化娱乐活动"}, {"ch": "实务·Ch12", "q": "社区基本情况分析的内容？", "a": "①名称和发展历史②地理位置、经济状况③人口结构④社区组织或单位资源⑤服务人力资源状况"}, {"ch": "实务·Ch12", "q": "推动社区发展(2023调整)的两项？", "a": "①协助制订实施社区发展规划②培育社区归属感与认同感"}, {"ch": "综合·Ch1", "q": "社会工作中'支持者'角色的含义？", "a": "鼓励服务对象自强自立、克服困难、自我决策，即「助人自助」。"}, {"ch": "综合·Ch1", "q": "社会工作中'治疗者'角色的含义？", "a": "帮助服务对象发现自己行为的问题、重塑其行为，对他们的行为进行矫正。"}, {"ch": "综合·Ch1", "q": "社会工作中'关系协调者'角色的含义？", "a": "帮助服务对象学习处理社会关系的技巧，协助他们处理好与他人及环境的和谐关系，并建立起协调关系。"}, {"ch": "综合·Ch1", "q": "社会工作中'资源筹措者'（资源链接者）角色的含义？", "a": "社工筹集服务对象所需要的资源。筹措资源之后，将它们传递到服务对象手中，以解决问题。"}, {"ch": "综合·Ch1", "q": "社会工作中'行政管理者'角色的含义？", "a": "社工应该对工作过程进行有效控制，同时必须对资源、信息进行协调、安排和管理。"}, {"ch": "综合·Ch1", "q": "社会工作中'政策影响者'角色的含义？", "a": "在服务过程中发现某些问题具有普遍性时，应该向有关政府部门提出建议，建议制定、修订和完善政策。"}, {"ch": "综合·Ch1", "q": "'合并角色'是什么意思？", "a": "合并角色是指包含了多种功能的综合角色，这种合并角色既包括直接服务也包含间接服务。"}, {"ch": "综合·Ch1", "q": "社会工作者的特征？", "a": "社会工作者是社会工作的基本要素。社会工作者是接受一定的专业教育或培训、从事职业化社会服务的人。"}, {"ch": "综合·Ch2", "q": "社会工作专业伦理的含义？", "a": "社会工作是一门应用的社会科学，包含特定的价值观和信念，成为社工进行专业实践的原则和指南，这就是专业的应用伦理。"}, {"ch": "综合·Ch2", "q": "职业伦理的含义？", "a": "对社会工作专业团体而言，职业伦理就是一整套指导从事该专业的工作人员正确履行责任和义务并预防道德风险的行为规范。"}, {"ch": "综合·Ch2", "q": "社工对服务对象的伦理责任？", "a": "以服务对象的利益为出发点；体现尊重、保密和公平。"}, {"ch": "综合·Ch2", "q": "社工对同事的伦理责任？", "a": "强调合作精神；彼此尊重、互相帮助。包括：信任支持同事、促进共同成长。"}, {"ch": "综合·Ch2", "q": "社工对全社会的伦理责任？", "a": "社会工作的核心目标是促进社会福祉的发展和促进社会进步。各尽其责、尽心尽力。"}, {"ch": "综合·Ch2", "q": "社工作为专业人员的伦理责任？", "a": "强调专业主义精神和为服务对象谋福祉的伦理义务。"}, {"ch": "综合·Ch3", "q": "家庭的功能？", "a": "家庭的功能是指家庭对其成员所起的积极作用。包括情感支持、性爱满足、繁衍后代、社会化和经济功能等。"}, {"ch": "综合·Ch3", "q": "娇纵型教养模式的特点？", "a": "父母盲目的溺爱和疏于管束，孩子自我中心、骄横跋扈、疏懒散漫、贪婪无度（发展为反社会人格）。"}, {"ch": "综合·Ch3", "q": "支配型教养模式的特点？", "a": "家长过分溺爱与严加管束结合，孩子怯懦胆小、意志薄弱、既妒且娇、清高孤傲。"}, {"ch": "综合·Ch3", "q": "学校的含义和对学生的影响？", "a": "学校是指教育者有计划、有组织地对受教育者进行系统的教育活动的组织机构。学生行为受到校园文化、班级规模、教学模式以及师生关系的影响。"}, {"ch": "综合·Ch3", "q": "工作单位的类型和影响？", "a": "类型：国家机关、事业单位、企业单位和社会组织。影响：促使个人学习和实践专门的职业知识、技能和道德规范；指导个人建立各种社会关系。"}, {"ch": "综合·Ch3", "q": "大众传媒的含义和功能？", "a": "在信息传播过程中处于传播者和大众之间的媒介体。特点：传播速度快、范围广、影响大。功能：宣传功能、新闻传播功能、舆论监督功能、实用功能和文化积累功能。"}, {"ch": "综合·Ch3", "q": "婴幼儿阶段的主要问题？", "a": "①哺乳问题②母爱剥夺③弃婴问题"}, {"ch": "综合·Ch3", "q": "学龄前儿童攻击行为的特点？", "a": "攻击行为是指个体因为欲望得不到满足而采取的有害他人、毁坏物品的行为。一般在3-6岁出现第一个高峰，10-11岁出现第二个高峰。男孩以暴力攻击居多，女孩以语言攻击居多。"}, {"ch": "综合·Ch3", "q": "青少年社会化的核心任务？", "a": "自我意识、道德观和社会交往的进一步发展。核心任务是自我同一性的建立。"}, {"ch": "综合·Ch3", "q": "中年阶段的三个社会性发展特点？", "a": "①情感趋于深沉稳定，性格完全定型②婚姻中责任感已超越情感③处于事业成败的关键期"}, {"ch": "综合·Ch3", "q": "青年期的主要问题？", "a": "①婚恋问题②性别歧视问题③就业问题"}, {"ch": "综合·Ch3", "q": "中年阶段的主要问题？", "a": "①早衰综合征②更年期综合征③婚外恋④家庭暴力"}, {"ch": "综合·Ch3", "q": "老年阶段的主要问题？", "a": "①失智和失能②精神健康问题（抑郁症、自杀）③死亡问题④被歧视和被虐待"}, {"ch": "综合·Ch4", "q": "危机的发展阶段？", "a": "危机→解组→恢复和重组"}, {"ch": "综合·Ch4", "q": "人本治疗模式中自我概念的三个部分？", "a": "①服务对象对自己的知觉和评价②对自己与他人关系的知觉和评价③对环境的知觉和评价"}, {"ch": "综合·Ch4", "q": "专业合作关系的维持需要什么条件？", "a": "个案辅导关系需要具备真诚、同感和无条件积极关怀三项充分必要条件。表里如一、不评价、同感和无条件接纳。"}, {"ch": "综合·Ch4", "q": "社会资源的两种类型？", "a": "①非正式社会资源——家人、亲属、朋友、同伴②正式社会资源——正式的社会机构和社会组织"}, {"ch": "综合·Ch4", "q": "服务的协调包含哪些方面？", "a": "①服务面谈内容与服务面谈外的协调②服务对象改变与周围他人改变的协调③服务对象改变与社会工作者改变的协调"}, {"ch": "综合·Ch4", "q": "结案的形式最常见的有哪3种？", "a": "①直接告诉服务对象②延长服务间隔的时间③变化联系的方式"}, {"ch": "综合·Ch4", "q": "跟踪服务的三项内容？", "a": "①根据服务对象状况安排一些结案之后的练习②调动服务对象的周围资源，增强社会支持③持续评估服务工作的效果"}, {"ch": "综合·Ch4", "q": "制订服务计划中'目标清晰而且现实'的三个要求？", "a": "①可观察，即服务目标是可以直接观察到的②可测量，即可以通过某种测量工具直接测量的③积极正向，即服务目标是服务对象的生活朝向积极方向的改变"}, {"ch": "综合·Ch5", "q": "小组工作的定义？", "a": "社会工作者指导，将两个以上且具有共同的需求或相似的社会问题的成员组织在一起而开展互动性活动的团体。"}, {"ch": "综合·Ch5", "q": "自助小组的特点？", "a": "由具有共同经历的成员组成，成员间互相帮助。社工一般不直接参与小组活动，而是作为支持者和顾问。"}, {"ch": "综合·Ch5", "q": "发展模式的两项实施原则？", "a": "①积极参与原则：协调和鼓励组员积极分享和学习自我发展的经验②使能者原则：支持和帮助组员通过各种活动相互关心、相互帮助和相互分享"}, {"ch": "综合·Ch5", "q": "小组活动场地的三个注意事项？", "a": "①场地选择（安全、安静、舒适）②座位安排（最好圆形或面对面）③准备其他设施和辅助材料"}, {"ch": "综合·Ch5", "q": "小组规范的功能？", "a": "采用书面或口头承诺的形式，大致涵盖小组程序和组员目标两方面的内容。帮助组员了解互动准则、明确角色和行为期望、澄清信念和基本价值。"}, {"ch": "综合·Ch6", "q": "地区发展模式的五项实施策略？", "a": "①促进居民个人发展②团结邻里③社区教育④提供服务和发展资源⑤社区参与"}, {"ch": "综合·Ch6", "q": "社区照顾模式的三个实施策略？", "a": "①在社区照顾②由社区照顾③对社区照顾"}, {"ch": "综合·Ch6", "q": "社区工作中以招募为目的的居民接触技巧？", "a": "社工通常以居民的需要和问题为介入点，运用探索感受、反映感受、重述、鼓励等沟通技巧了解居民的态度和立场，鼓励居民参与。"}, {"ch": "综合·Ch6", "q": "社区工作各阶段的工作重点？", "a": "①进入社区（准备→认识社区→介入社区事务）②认识社区（基本情况分析→问题分析→需求分析）③制定社区工作计划④培育组织⑤实施社区工作计划⑥社区工作评估（过程评估+结果评估+效益评估）"}, {"ch": "实务·Ch1", "q": "询问方法中直接方法和投射方法？", "a": "直接方法包括口头（会谈）和书面（问卷）两种。投射方法包括角色扮演和填充/完成句子。"}, {"ch": "实务·Ch1", "q": "做接案会谈记录的内容？", "a": "常用记叙性记录。内容包括：面谈目的、面谈过程、对面谈的总体评估、对以后面谈的建议等。"}, {"ch": "实务·Ch1", "q": "接案记录格式中'首页'和'知情同意'的区别？", "a": "首页：在接案时完成，包含个人资料。知情同意：主要解释机构提供的服务、专业责任和伦理守则。"}, {"ch": "实务·Ch1", "q": "构建行动计划中选择介入系统的根据？", "a": "根据对服务对象需要与问题预估的结果，通过分析正式和非正式社会网络与支持系统来选择介入策略。一般分为个人、家庭、小组、社区及宏观社会系统。"}, {"ch": "实务·Ch1", "q": "综合介入的含义？", "a": "从「人与环境」互动的视角出发，将直接实务活动和间接实务活动结合在一起。焦点放在两个环节：一是增强个人的生活适应能力；二是增加社会和物理环境对个人需要的回应。"}, {"ch": "实务·Ch1", "q": "目标实现程度的两种测量方法？", "a": "①目标核对表：罗列与界定目标并记录，再进行核对②个人目标尺度测量：按轻重缓急制定目标，然后使用等级尺度测量和计算实现情况"}, {"ch": "实务·Ch1", "q": "五等级尺度是什么？", "a": "0=没有进展，1=极少实现，2=部分实现，3=大体上实现，4=全部实现。每项任务得分加总后除以最高可能分数，得出成功的百分比。"}, {"ch": "实务·Ch2", "q": "儿童生存的需要包含哪两个层面？", "a": "①生命存在的需要：获得基本生活照料②社会存在的需要：获得社会身份，包括姓名、户籍和国籍"}, {"ch": "实务·Ch2", "q": "儿童社会化需要的四个方面？", "a": "①培养基本生活技能②促使自我观念发展③养成良好的生活习惯④培养良好的道德品质"}, {"ch": "实务·Ch2", "q": "儿童发展问题中'身处困境'的显性和隐性体现？", "a": "显性体现：经济和物质的匮乏。隐性体现：有效成人陪伴、情感回应、健康照料、榜样示范等儿童成长资源的匮乏。"}, {"ch": "实务·Ch2", "q": "机构类家庭养育服务的特点？", "a": "在儿童福利机构内，通过招募自然夫妇充当父母角色，配置3名以上儿童，入住与社区中一样的单元房，形成一个「类似」家庭的照料方式。"}, {"ch": "实务·Ch2", "q": "机构集体养育服务的特点？", "a": "也被称为集体养育或者院舍养育。将家庭监护缺失儿童集中安置在儿童福利机构中，由机构工作人员集体看护的一种照料模式。"}, {"ch": "实务·Ch4", "q": "老年人焦虑症的表现？", "a": "过度忧虑，有非理性的恐惧，并抱怨身体不适。长期焦虑会让老人自闭在家中，越来越加重其与社会的隔离和情感上与他人的隔膜。"}, {"ch": "实务·Ch4", "q": "谵妄与痴呆症的区别？", "a": "谵妄类似痴呆症，但它发病突然，并且有生理方面的原因。这些生理方面的问题往往都可以逆转，谵妄也有可能导致老年人由于身体衰竭或疾病而死亡。"}, {"ch": "实务·Ch4", "q": "老年个案管理的含义？", "a": "社工在为老年人提供服务时常常需要充当个案管理员的角色，除了直接提供服务外，还要为老年人做资源链接工作、多学科工作人员的协调配合工作。必要时充当老人的代言人。"}, {"ch": "实务·Ch4", "q": "老年社区照顾正在发生什么转变？", "a": "社区照顾正在由服务导向型向需求导向型转变，即不是由机构根据自己的观点来决定提供什么样的服务，而是基于服务对象的需求来提供服务。"}, {"ch": "实务·Ch4", "q": "老年评估注意事项（5项）？", "a": "①物理环境应安静、整洁、光线明亮、温度适宜②平衡好老人自立与依赖他人的需要③关注最初提议作评估的人④注意老年人群体的异质性⑤尊重老年人的隐私权"}, {"ch": "实务·Ch12", "q": "社区分析中'社区问题分析'包含哪两类？", "a": "①社区内共同性问题的分析②社区内群体性问题的分析"}, {"ch": "实务·Ch12", "q": "社区服务方案策划前的分析工作？", "a": "①服务对象分析②问题分析③逻辑推进步骤分析（界定和确认问题→确认要达到的目标→选定评估的指标→寻找各种可行的方案→计算每个方案的成本→列举方案并进行比较分析）"}, {"ch": "实务·Ch12", "q": "方案执行中'服务或活动阶段'的四项管理？", "a": "①预算管理②时间进度管理③服务品质管理④士气激励和提升"}, {"ch": "实务·Ch12", "q": "方案'结束阶段'的四项工作？", "a": "①经费报销②服务资料及时归档③对专业社工和志愿者进行表彰④对服务（活动）成效进行评估"}, {"ch": "实务·Ch12", "q": "多方联动机制建设的两个方面？", "a": "①完善社会力量参与基层治理激励政策，创新社区与社会组织、社工、志愿者、慈善资源的联动机制②完善基层志愿服务制度，大力开展邻里互助服务和互动交流活动"}];

function sn(){sel=new Set();R()}
function nx(){fl=false;aw=null;msel=new Set();if(ix<cd.length-1)ix++;else if(md==="quiz")md="result";else ix=0;R()}
function pv(){if(ix>0){fl=false;ix--;aw=null;msel=new Set()}R()}
function fp(){fl=!fl;R()}
function mm(){let q=cd[ix].q;if(mt.has(q))mt.delete(q);else mt.add(q);R()}
function gm(){md="menu";R()}
function ss(n){qs=n;R()}
function sam(m){appMode=m;sel=new Set(CH);R()}

function ha(i){
  let c=cd[ix];
  if(appMode==="exam"&&c.tp==="多选"){
    if(aw!==null)return;
    if(msel.has(i))msel.delete(i);else msel.add(i);R();
  } else {
    if(aw!==null)return;
    aw=i;
    if(appMode==="exam"){if(c.ops[i].ok)sc++}
    else{if(c._ops&&c._ops[i].ok)sc++}
    R();
  }
}

function submitMulti(){
  let c=cd[ix];aw="done";
  let correct=true;
  c.ops.forEach((o,i)=>{if(o.ok&&!msel.has(i))correct=false;if(!o.ok&&msel.has(i))correct=false});
  if(correct)sc++;R();
}

function tg(){let h=document.documentElement;let cur=h.getAttribute("data-theme");h.setAttribute("data-theme",cur==="dark"?"light":"dark");R()}

function R(){
let a=document.getElementById("app"),f=F(),o=cc(),pg=cd.length?((ix+1)/cd.length*100):0,im=cd[ix]&&mt.has(cd[ix].q);
let isDark=document.documentElement.getAttribute("data-theme")==="dark";
let h='<div style="position:fixed;top:12px;right:12px;z-index:99"><span class="nb" data-a="tg" style="font-size:18px;padding:6px 10px;border-radius:50%">'+(isDark?"☀️":"🌙")+'</span></div>';
h+='<div class="hd"><h1>初级社工 刷题机</h1><p>';
if(md==="menu")h+=(appMode==="exam"?"真题":"知识点")+" "+f.length+" 题 | 已掌握 "+mt.size;
else if(md==="flash")h+="翻卡 "+(ix+1)+"/"+cd.length;
else if(md==="quiz")h+="做题 "+(ix+1)+"/"+cd.length+" | 得分 "+sc;
else h+="完成";
h+="</p></div>";
if(md==="flash"||md==="quiz")h+='<div class="bar"><i style="width:'+pg+'%"></i></div>';

if(md==="menu"){
h+='<div class="tags" style="margin-bottom:14px"><span class="tag'+(appMode==="exam"?" on":"")+'" data-a="sam" data-m="exam">📝 真题 ('+EX.length+')</span><span class="tag'+(appMode==="flash"?" on":"")+'" data-a="sam" data-m="flash">📇 知识点 ('+FL.length+')</span></div>';
h+='<div class="lbl">选择章节</div><div class="tags">';
h+='<span class="tag'+(sel.size===CH.length?" on":"")+'" data-a="sa">全选</span><span class="tag" data-a="sn">清空</span>';
CH.forEach((c,i)=>{let n=o[c]||0;if(n>0)h+='<span class="tag'+(sel.has(c)?" on":"")+'" data-a="tc" data-i="'+i+'">'+E(c).replace("·"," ")+" ("+n+")</span>"});
h+='</div>';
if(appMode==="exam"){h+='<div class="szl">每轮题数：';
[10,20,30,50].forEach(n=>{h+='<span class="sz'+(qs===n?" on":"")+'" data-a="ss" data-n="'+n+'">'+n+"</span>"});
h+='</div>'}
h+='<div class="row">';
if(appMode==="flash")h+='<span class="b ba" data-a="sf">📇 翻卡复习</span>';
else h+='<span class="b bb" data-a="sq">✍️ 开始做题</span>';
h+='</div>';
}

if(md==="flash"&&cd[ix]){
let c=cd[ix];
h+='<div class="cd'+(im?" m":"")+'" data-a="fp"><div class="ch">'+E(c.ch)+"</div>";
if(!fl)h+='<div class="ql">问题</div><div class="qt">'+E(c.q)+'</div><div class="ht">点击翻转</div>';
else h+='<div class="al">答案</div><div class="at">'+E(c.a)+"</div>";
h+='</div><div class="nv"><span class="nb" data-a="pv">←</span><span class="nm'+(im?" on":"")+'" data-a="mm">'+(im?"✓ 已掌握":"标记掌握")+'</span><span class="nb" data-a="nx">→</span><span class="ng" data-a="gm">返回</span></div>';
}

if(md==="quiz"&&cd[ix]){
let c=cd[ix];
let isMulti=appMode==="exam"&&c.tp==="多选";
let isExam=appMode==="exam";
h+='<div class="qq"><div class="qc">'+E(c.ch)+(isExam?" · "+c.yr+"年 · "+c.tp:"")+'</div><div class="qx">'+E(c.q)+"</div>";
if(isMulti&&aw===null)h+='<div class="qi">多选题，选完后点"提交"</div>';
h+="</div>";

if(isExam){
  h+='<div class="os">';
  c.ops.forEach((p,i)=>{
    let x="oo";
    if(aw!==null){if(p.ok)x+=" ok";else if((isMulti&&msel.has(i))||(!isMulti&&i===aw))x+=" no";else x+=" dm"}
    else{if(msel.has(i))x+=" sel"}
    h+='<span class="'+x+'" data-a="ha" data-i="'+i+'"><em>'+p.l+'.</em><span class="ot">'+E(p.t)+"</span></span>"});
  h+="</div>";
  if(isMulti&&aw===null&&msel.size>=2)h+='<div class="ct"><span class="b bb" data-a="sm">提交答案</span></div>';
  if(aw!==null){
    let ans=c.ops.filter(p=>p.ok).map(p=>p.l).join("");
    h+='<div class="ans">正确答案：'+ans+'</div>';
    if(c.ex)h+='<div class="ex"><div class="el">💡 解析</div><div class="et">'+E(c.ex)+'</div></div>';
    h+='<div class="ct"><span class="b bb" data-a="nx">'+(ix<cd.length-1?"下一题":"查看成绩")+"</span></div>"
  }
} else {
  let wrong=S(cd.filter(x=>x.a!==c.a)).slice(0,3);
  let ops=S([{t:c.a,ok:true},...wrong.map(x=>({t:x.a,ok:false}))]);
  if(!c._ops)c._ops=ops;
  h+='<div class="os">';
  c._ops.forEach((p,i)=>{
    let x="oo";
    if(aw!==null){if(p.ok)x+=" ok";else if(i===aw)x+=" no";else x+=" dm"}
    let t=p.t.length>100?E(p.t.slice(0,100))+"…":E(p.t);
    h+='<span class="'+x+'" data-a="ha" data-i="'+i+'"><em>'+String.fromCharCode(65+i)+'.</em><span class="ot">'+t+"</span></span>"});
  h+="</div>";
  if(aw!==null)h+='<div class="ct"><span class="b bb" data-a="nx">'+(ix<cd.length-1?"下一题":"查看成绩")+"</span></div>"
}
}

if(md==="result"){
let p=Math.round(sc/cd.length*100),e=p>=80?"🎉":p>=60?"💪":"📖",m=p>=80?" 优秀！":p>=60?" 继续加油！":" 需要再复习";
h+='<div class="rs"><div class="ej">'+e+'</div><div class="sc">'+sc+"/"+cd.length+'</div><div class="pc">正确率 '+p+"%"+m+'</div><div class="row"><span class="b bb" data-a="sq">再来一轮</span><span class="b ba" data-a="gm">返回</span></div></div>';
}
a.innerHTML=h;
}

document.getElementById("app").addEventListener("click",function(e){
let t=e.target;while(t&&t!==this){
let a=t.getAttribute("data-a");
if(a==="sa")sa();
else if(a==="sn")sn();
else if(a==="tc")tc(CH[+t.getAttribute("data-i")]);
else if(a==="ss")ss(+t.getAttribute("data-n"));
else if(a==="sf")sf();
else if(a==="sq")sq();
else if(a==="fp")fp();
else if(a==="pv")pv();
else if(a==="nx")nx();
else if(a==="mm")mm();
else if(a==="gm")gm();
else if(a==="ha")ha(+t.getAttribute("data-i"));
else if(a==="sm")submitMulti();
else if(a==="tg")tg();
else if(a==="sam")sam(t.getAttribute("data-m"));
if(a){e.stopPropagation();return}
t=t.parentElement;
}
});

document.addEventListener("keydown",function(e){
if(md==="flash"){if(e.key===" "||e.key==="Enter"){e.preventDefault();fp()}if(e.key==="ArrowRight")nx();if(e.key==="ArrowLeft")pv()}
});

document.documentElement.setAttribute("data-theme","dark");
R();
</script>
</body>
</html>
